# 방문 급증 감시 — 이 파일은 원본이다. deploy-pages.sh 가 공개 미러 yebuapp/yebuapp.github.io 의
# .github/workflows/traffic-watch.yml 로 복사한다(공개 저장소라 Actions 시간이 무료 — 비공개 저장소들이
# 이미 Actions 를 많이 써서 2026-11-13 실측 30일 1,357회, 매시간 작업을 비공개에 두지 않는다).
# 실패(기준 초과·함수 호출 실패) = GitHub 가 마지막으로 이 파일을 바꾼 사람(운영자 계정)에게 실패 메일.
# 공개 저장소의 예약 작업은 저장소 활동이 60일 없으면 GitHub 가 멈춘다 — 배포가 그 활동이다.
name: traffic-watch
on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분(UTC). 정각 혼잡을 피한다.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: 최근 방문 행 수 대조 (기준 넘으면 실패)
        run: node .github/traffic-watch.mjs
