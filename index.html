육아휴직을 사용할 수 있게 된다.","url":"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=19768","checkedAt":"2026-08-25"},"source":{"name":"고용노동부 보도자료 (2026-08-11 배포)","url":"https://www.moel.go.kr/news/enews/report/enewsView.do?news_seq=19768","checkedAt":"2026-08-25"},"caution":"🚨 시중 요약표에는 대상이 '배우자가 임신 중인 남성 직원'이라고만 적혀 있지만, 원문에는 '유산·조산 등 건강상 위험이 있는 경우'라는 조건이 붙습니다. 배우자가 임신했다는 사실만으로는 대상이 아니라, 이대로 믿고 신청하면 거부될 수 있습니다.","legalRef":"남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률 제19조제1항 (2026-03-17 개정, 2026-09-18 시행) — \"남성 근로자가 고용노동부령으로 정하는 유산, 조산 등 위험이 있는 임신 중인 배우자를 돌보려고 하는 경우\"","unverified":["'유산, 조산 등 위험'은 시행규칙 제14조의2가 '별표 3에 따른 질환을 진단받은 임신 중인 배우자'로 정합니다(2026-09-18 확인). 별표 3의 질환 목록 자체는 원문을 확인하지 못했습니다.","임신 중 사용분과 출산 후 사용분을 합산해 최대 1년인지 — 제19조제2항은 '1년 이내'만 정하고 출산 전후를 나누는 문구가 없습니다(제19조의3에서 분할 '횟수'에는 넣지 않는다는 것만 확인)"]},{"id":"child_benefit_reform_2027","title":"첫만남이용권·부모급여·아동수당 → 아이맞이지원금·아동기본수당 (개편안)","kind":"개편안","effectiveFrom":"2027-07-01","confidence":"발표","who":"2027년 7월 1일 이후 태어날 아이를 둘 가정 (그 전 출생아는 현행 유지)","summary":"지금의 첫만남이용권·부모급여·아동수당 세 가지를 아이맞이지원금과 아동기본수당 두 가지로 합치는 안이 발표됐습니다. 아직 확정된 제도가 아니라 발표된 안이며, 시행에 앞서 「아동수당법」 개정과 예산 확정 절차가 남아 있습니다.","before":"첫만남이용권(출생 시 바우처) + 부모급여(0~1세 매월) + 아동수당(매월) 세 가지를 각각 받습니다. 2027년 6월 30일까지 태어난 아이는 이 현행 제도가 그대로 적용됩니다.","after":"아이맞이지원금 — 첫째 1,000만 원, 둘째 1,200만 원, 셋째 이상 1,500만 원을 출생 후 1년간 분기별 4회로 나눠 현금으로 받습니다. 정부가 정하는 우대지역에 살면 각각 500만 원이 더해집니다. 아동기본수당 — 매월 20만 원(현금 10만 원 + 지역사랑상품권 10만 원), 우대지역은 매월 30만 원(현금 15만 원 + 상품권 15만 원)을 받습니다. 0~1세 중 어린이집을 이용하지 않고 가정에서 돌보면 매월 30만 원이 더해집니다.","legalBasis":"아동수당법 (개정 예정)","evidence":{"quote":"2027년 7월 1일 이후 출생아부터 적용될 예정이며, 2027년 6월 30일 출생아까지는 현행 첫만남이용권, 부모급여, 아동수당이 그대로 지급됩니다.","url":"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1491722","checkedAt":"2026-08-31"},"source":{"name":"보건복지부 보도자료 — 2027년 핵심 청년 예산 발표(2026. 8. 28.)","url":"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1491722","checkedAt":"2026-08-31"},"caution":"아직 확정된 제도가 아닙니다. 보건복지부 원문은 시행에 앞서 「아동수당법」 개정과 관련 시스템 정비를 \"추진할 계획\"이라고 적고 있고, 2027년도 예산도 국회 심의를 거쳐야 합니다. 시중에 도는 요약 이미지는 금액을 확정된 것처럼 옮기고 있지만, 금액과 지급 방식은 바뀔 수 있습니다. 지금 받고 계신 첫만남이용권·부모급여·아동수당은 그대로입니다.","unverified":["500만 원이 더해지는 \"우대지역\"의 지정 기준과 지역 목록은 보도자료에 없습니다. 우리 동네가 해당하는지는 아직 알 수 없습니다.","「아동수당법」 개정안의 발의·통과 시점은 확인하지 못했습니다.","첫만남이용권·부모급여·아동수당이 어떤 방식으로 정리되는지(폐지인지 존치 후 신설인지) 개정 조문의 형태는 보도자료 수준에서는 확인하지 못했습니다."]},{"id":"benefit_auto_payment_plan","title":"아동수당·부모급여·첫만남이용권 자동 지급 (추진)","kind":"추진","effectiveFrom":null,"confidence":"발표","who":"아이가 태어날 가정 (아동수당·부모급여·첫만남이용권을 받는 가정)","summary":"정부가 아동수당·부모급여·첫만남이용권을 출생 신고만 하면 자동으로 지급하도록 바꾸겠다고 국무회의에 보고했습니다(2026년 5월 12일). 이를 위해 아동수당법 등 법률 여섯 개의 개정을 추진하는 단계이며, 언제부터 바뀌는지는 정해지지 않았습니다.","before":"출생 신고와 별개로 급여마다 신청해야 받을 수 있습니다.","after":"출생 신고만 하면 아동수당·부모급여·첫만남이용권이 자동으로 지급되도록 바꾼다는 계획입니다.","legalBasis":"사회보장기본법·사회보장급여법·아동수당법·저출산·고령사회기본법·기초연금법·장애인연금법 (개정 추진)","evidence":{"quote":"보편급여인 아동수당, 부모급여, 첫만남이용권은 연령 등 자격 확인이 가능하므로 자동지급으로 전환한다. 기존에는 출생 신고와 별개로 급여를 신청해야 받을 수 있었지만, 앞으로는 출생 신고만 하면 급여가 자동으로 지급되도록 개선한다.","url":"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1490486","checkedAt":"2026-09-29"},"source":{"name":"보건복지부 보도자료 — 「신청하지 않아도 필요한 복지 연결한다」 정부 '적극적 복지' 전환 첫걸음(2026. 5. 12.)","url":"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1490486","checkedAt":"2026-09-29"},"caution":"아직 바뀐 것이 아닙니다. 법률이 개정되어 시행되기 전까지는 지금처럼 출생 신고와 따로 신청해야 합니다. 부모급여와 아동수당은 출생일을 포함해 60일 안에 신청해야 태어난 달부터 받을 수 있고, 넘기면 신청한 달부터 받습니다.","unverified":["언제부터 자동으로 지급되는지(시행 시기)는 보도자료에 없습니다.","법률 개정안이 국회에 제출되거나 통과됐는지는 확인하지 못했습니다(2026-09-29 기준).","자동으로 지급할 때 급여를 받을 계좌를 어떻게 정하는지는 보도자료에 없습니다.","2027년 7월 1일 이후 출생아부터 추진되는 급여 개편안(아이맞이지원금·아동기본수당)과 어떻게 맞물리는지는 보도자료에 없습니다."]}]};
var TIMELINE   = [{"id":"prenatal_visit_schedule","name":"산전 진찰(정기검진) 주기","category":"검사","confidence":"확인","weekFrom":5,"weekTo":40,"timingText":"28주까지 4주 간격 / 29~36주 2주 간격 / 37주 이후 매주","detail":"저위험 임신부 기준. 고위험 임신은 담당의 판단에 따라 더 자주 시행합니다.","source":{"name":"국가건강정보포털(질병관리청)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-10-29"},"whatIsIt":"산전 진찰(정기검진)은 임신한 뒤 출산할 때까지 정해진 간격으로 산부인과를 찾아, 임신부와 배 속 아기가 잘 지내고 있는지 확인하는 진료입니다. 한 번 받고 끝나는 검사가 아니라 임신 기간 내내 반복하는 일정이라고 생각하시면 됩니다. 질병관리청은 산전 관리의 목적을 임산부의 건강과 태아의 성장을 포함한 이상 소견이 있는지 평가하고, 필요하면 입원이나 분만 계획을 정하는 것이라고 설명합니다. 매번 큰 검사를 하는 것이 아니라 혈압·몸무게·태아 심박동처럼 짧게 확인하는 항목이 대부분이고, 특정 주차에만 별도의 검사가 추가됩니다.","disease":"산전 진찰은 특정 질병 하나를 찾는 검사가 아니라, 임신 기간에 생길 수 있는 여러 문제를 두루 살피는 진료입니다. 임신 후기에 특히 주의해서 보는 것 중 하나가 임신중독증(자간전증, 임신 때 혈압이 오르고 소변에 단백질이 나오는 상태)입니다. 아이사랑 포털은 아침부터 부종이 생기면서 호전되지 않고 심해지면 자간전증 가능성이 있다고 안내하며, 체중이 갑자기 늘거나 두통·상복부 통증·시야 흐림이 나타나면 빨리 병원에 가야 한다고 설명합니다. 이런 변화는 정기검진에서 재는 혈압과 몸무게, 소변검사로 먼저 드러나는 경우가 많습니다.","whyNeeded":"임신이 진행될수록 임신중독증이나 태아 성장 문제처럼 갑자기 나타날 수 있는 상황이 늘어나기 때문에, 확인하는 간격을 좁혀서 이상을 빨리 잡아내려는 것입니다. 아이사랑 포털은 임신 후기에 산전검사를 더 자주 받게 되며, 임신부와 태아의 건강을 포함해 모든 상황이 순조롭게 진행되고 있는지 주기적인 확인이 필요하다고 설명합니다. 질병관리청도 이상 소견을 평가하고 필요하면 입원이나 분만 계획을 정하는 것이 산전 관리의 목적이라고 밝히고 있습니다.","howDone":"질병관리청 기준으로 합병증이나 특별한 위험요소가 없는 저위험군 임산부는 28주까지 4주에 한 번, 36주까지 2주에 한 번, 그 이후에는 매주 병원을 방문합니다(아이사랑 포털은 비슷하되 마지막 구간을 다르게 적어, 37주 이후부터 매주로 표기합니다). 매 방문 때는 혈압과 몸무게를 재고 태아 심박동을 확인하며 소변검사를 하고, 임신 후반기에는 내진으로 태아 선진부(아기가 먼저 나올 부분)와 자궁경부 상태를 봅니다. 병원 방문 주기는 임신부와 태아의 상태에 따라 달라질 수 있습니다.","resultMeaning":"매번의 진찰은 합격·불합격을 가리는 것이 아니라, 지난번과 달라진 점이 있는지 확인하는 과정입니다. 혈압이 오르거나 몸무게가 갑자기 늘거나 소변검사에서 이상이 나오면 검사 간격을 좁히거나 추가 검사를 하게 되고, 필요하면 입원이나 분만 계획을 정합니다. 정해진 방문일 사이라도 부종이 심해지거나 두통·상복부 통증·시야 흐림이 있으면 기다리지 말고 병원에 가야 합니다.","cost":"임신한 건강보험 가입자 또는 피부양자는 국민행복카드(임신·출산 진료비 지원 이용권)로 출산비용을 포함한 임신 기간 진료비를 지원받습니다. 지원 금액은 임신 1회당 단태아 100만원이고, 다태아는 기본 140만원을 받은 뒤 태아 한 명당 100만원이 되도록 추가로 신청할 수 있어 쌍둥이는 200만원까지 받을 수 있습니다. 분만취약지에 살면 20만원이 더해집니다. 사용 기한은 출산 전 신청 시 분만예정일로부터 2년, 출산 후 신청 시 출산일로부터 2년이고, 남은 금액은 기간이 끝나면 소멸합니다. 근거 법령은 국민건강보험법 제50조와 같은 법 시행령 제23조 등입니다.","quotes":[{"text":"합병증이나 특별한 위험요소가 없는 저위험군 임산부는 28주까지 4주에 한 번, 36주까지 2주에 한 번, 그 이후에는 매주 정기적으로 병원을 방문합니다.","source":"질병관리청 국가건강정보포털 — 정상임신관리(임신의 진단과 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301"},{"text":"정기적인 산전 관리의 목적은 임산부의 건강과 태아의 성장을 포함한 이상소견 유무를 평가하고, 필요한 경우 입원을 하거나 분만에 대한 계획을 정하는 것입니다.","source":"질병관리청 국가건강정보포털 — 정상임신관리(임신의 진단과 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301"},{"text":"임신 28주까지 : 월 1회 / 임신 36주까지 : 2주에 1회 / 임신 37주 이후 : 1주에 1회","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(임신초기)","url":"https://www.childcare.go.kr/?menuno=361"},{"text":"이 기간에 산전검사를 더 자주 받게 됩니다. 임신부와 태아의 건강 등을 포함하여 모든 상황이 순조롭게 진행이 되고 있는지 주기적인 확인이 필요합니다.","source":"보건복지부 임신육아종합포털 아이사랑 — 임신 후기 이해","url":"https://www.childcare.go.kr/?menuno=256"},{"text":"체중이 갑자기 늘거나 두통, 상복부 통증, 시야 흐림 등 증상이 나타나면 임신중독증 악화 증상일 수 있으므로 빨리 병원에 방문해야 합니다.","source":"보건복지부 임신육아종합포털 아이사랑 — 임신 후기 이해","url":"https://www.childcare.go.kr/?menuno=256"},{"text":"혈압 & 몸무게, 태아심박동","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(임신후기), 전 기간 매 진찰 시 시행 항목","url":"https://www.childcare.go.kr/?menuno=374"},{"text":"임신한 건강보험 가입자 또는 피부양자는 출산비용을 포함해서 임신기간 동안 받는 진료에 드는 비용을 지원받습니다.","source":"법제처 찾기쉬운 생활법령정보 — 임산부 진료비 지원받기(건강보험 진료비 지원)","url":"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=735&ccfNo=2&cciNo=2&cnpClsNo=1"},{"text":"국민행복카드는 임산부에게 건강한 태아의 분만과 산모의 건강관리를 위하여 진료비 일부를 지원","source":"법제처 찾기쉬운 생활법령정보 — 임산부 진료비 지원받기(건강보험 진료비 지원)","url":"https://www.easylaw.go.kr/CSP/CnpClsMain.laf?csmSeq=735&ccfNo=2&cciNo=2&cnpClsNo=1"}],"unverified":["마지막 구간의 시작 주차 표기가 출처마다 다릅니다. 질병관리청은 '36주까지 2주에 한 번, 그 이후에는 매주'라고 하고, 아이사랑 포털은 '임신 37주 이후 1주에 1회'라고 표기합니다. 하나로 합치지 않고 양쪽을 그대로 적었습니다.","항목 id가 임신 5~40주로 되어 있으나, 확인한 공공 출처는 '첫 방문'이라고만 표현하고 정기검진을 임신 5주부터 시작한다고 명시한 문장은 찾지 못했습니다.","매 방문 때 초음파를 항상 하는지는 확인하지 못했습니다. 아이사랑 포털이 전 기간 반복 항목으로 제시한 것은 혈압·몸무게·태아심박동이고, 초음파는 첫 방문과 11~14주, 20~24주, 32주 이후 등 특정 시기 항목으로 표기되어 있습니다.","소변검사를 매번 하는지도 출처마다 표현이 다릅니다. 질병관리청은 정기 진찰 시 소변검사를 시행한다고 하고, 아이사랑 포털의 반복 항목 표에는 혈압·몸무게·태아심박동만 있습니다.","진찰 1회당 실제로 내는 본인부담금이 얼마인지, 국민행복카드로 산전 진찰비가 전액 해결되는지는 확인하지 못했습니다.","국민행복카드로 진료비를 쓸 수 있는 영유아 연령이 출처마다 다르게 나타났습니다. 법제처 생활법령정보에는 '1세 미만 영유아'로, 다른 안내에는 '2세 미만 영유아'로 되어 있어 어느 쪽이 현행인지 확정하지 못했습니다."],"summaryLine":"산전 진찰(정기검진)은 임신한 뒤 출산할 때까지 정해진 간격으로 산부인과를 찾아, 임신부와 배 속 아기가 잘 지내고 있는지 확인하는 진료입니다."},{"id":"first_visit_labs","name":"초진 기본 검사군","category":"검사","confidence":"확인","weekFrom":5,"weekTo":8,"timingText":"임신 확인 직후(통상 5~8주)","detail":"전체혈구계산(CBC), 소변검사·배양, 혈액형, B형간염 항원·항체, 매독, 풍진 항체, HIV. 내진 시 자궁경부암 세포검사 포함.","source":{"name":"국가건강정보포털(질병관리청)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-10-29"},"whatIsIt":"임신을 확인하고 처음 산부인과에 갔을 때 한꺼번에 받는 기본 검사 묶음입니다. 팔에서 피를 뽑는 혈액검사와 소변검사, 초음파, 자궁경부암 검사가 함께 이루어집니다. 아이사랑 포털은 첫 방문 검사로 산모 혈액검사(혈색소, 혈액형, 혈액형 항체), 소변검사, 풍진 항체검사, B형간염 검사, 매독반응 검사, 자궁경부암 검사, 초음파 검사를 제시합니다. 질병관리청은 여기에 전체혈구계산(CBC, 혈액 속 세포 수를 한 번에 세는 검사), 소변배양검사, HIV 검사를 함께 초기 검사로 안내합니다.","disease":"이 검사군은 하나의 병이 아니라 여러 가지를 한꺼번에 확인합니다. 매독은 태아 사망과 선천성 매독을 일으킬 수 있어 검사하고, 풍진은 태아에게 감염되면 백내장·선천성 심장병 같은 기형을 유발할 수 있어 항체가 있는지 봅니다. 혈액형과 Rh인자·불규칙 항체 검사는 엄마와 아기의 혈액형이 맞지 않아 생기는 용혈현상(아기의 적혈구가 파괴되는 현상)으로 인한 유산·조산·사산 위험을 줄이기 위한 것이고, B형간염은 엄마의 보균 상태를 알아야 태어난 아기의 간염 관리를 할 수 있어서 검사합니다. 소변검사는 임신중독증과 당뇨병, 요도염·신우신염·신장병 등을 찾아 임신부의 위험과 유산·조산 위험을 줄이는 데 쓰입니다.","whyNeeded":"임신 초기에 미리 알아 두어야 임신 기간 내내 대비할 수 있는 항목들이기 때문입니다. 예를 들어 빈혈이나 혈소판 감소증은 미리 알면 임신 합병증을 예방할 수 있고, 감염이 있으면 태아에게 옮기지 않도록 관리할 수 있습니다. 혈액형과 항체는 임신 28주에 Rh 음성인 경우 면역 글로불린 주사를 맞을지 결정하는 데도 쓰입니다.","howDone":"팔에서 피를 뽑는 채혈과 소변을 받는 검사, 그리고 초음파와 자궁경부암 검사가 같은 날 함께 이루어집니다. 여러 항목을 검사하지만 채혈은 보통 한 번에 이루어지고, 결과는 항목에 따라 나오는 시점이 다릅니다.","resultMeaning":"풍진 항체가 음성으로 나오면 임신 중에는 풍진 백신을 맞을 수 없습니다. 질병관리청 예방접종도우미는 임신을 MMR 백신(홍역·유행성이하선염·풍진 혼합백신)의 금기로 명시하고 있고, 아이사랑 포털은 풍진 검사에서 항체가 음성이면 출산 후 예방접종을 한다고 안내합니다. 즉 임신 기간에는 풍진에 걸린 사람과의 접촉을 피하며 지내고, 접종은 아기를 낳은 뒤로 미루게 됩니다.","cost":"국민행복카드(임신·출산 진료비 지원 이용권)로 임신·출산 관련 진료비와 처방된 약제·치료재료 구입비를 지원받을 수 있으며, 지원 금액은 임신 1회당 단태아 100만원이고, 다태아는 기본 140만원을 받은 뒤 태아 한 명당 100만원이 되도록 추가로 신청할 수 있어 쌍둥이는 200만원까지 받습니다(분만취약지 20만원 추가). 다만 초진 검사군의 개별 항목이 건강보험 급여인지, 얼마를 본인이 내는지는 확인하지 못했습니다.","quotes":[{"text":"산모 혈액검사(혈색소, 혈액형, 혈액형 항체), 소변검사, 풍진 항체검사, B형간염 검사, 매독반응 검사, 자궁경부암 검사, 초음파 검사","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(첫 방문 검사)","url":"https://www.childcare.go.kr/?menuno=361"},{"text":"혈액형 Rh인자 및 불규칙 항체를 검사해 용혈현상 등으로 인한 유산, 조산, 사산의 위험을 줄일 수 있는 검사이다.","source":"국민건강보험공단 건강보험 매거진 — 산전검사 체크리스트(첫 내원 시)","url":"https://www.nhis.or.kr/magazin/mobile/201510/c02.html"},{"text":"빈혈 및 혈소판 감소증 등을 검사해 임신 합병증을 예방할 수 있다.","source":"국민건강보험공단 건강보험 매거진 — 산전검사 체크리스트(첫 내원 시)","url":"https://www.nhis.or.kr/magazin/mobile/201510/c02.html"},{"text":"임신부의 간염 보균 상태는 신생아 간염 관리에 필요하고, 간염항체 검사도 여성의 일생 건강관리에 기본적인 검사이다.","source":"국민건강보험공단 건강보험 매거진 — 산전검사 체크리스트(첫 내원 시)","url":"https://www.nhis.or.kr/magazin/mobile/201510/c02.html"},{"text":"태아 사망 및 선천성 매독을 일으키는 매독을 검사한다.","source":"국민건강보험공단 건강보험 매거진 — 산전검사 체크리스트(첫 내원 시)","url":"https://www.nhis.or.kr/magazin/mobile/201510/c02.html"},{"text":"풍진은 태아 감염을 일으켜 백내장, 선천성 심장병 등 여러 기형을 유발한다.","source":"국민건강보험공단 건강보험 매거진 — 산전검사 체크리스트(첫 내원 시)","url":"https://www.nhis.or.kr/magazin/mobile/201510/c02.html"},{"text":"임신 중독증 및 당뇨병, 요도염, 신우신염, 신장병 등을 진단해 임신부 위험 및 유산, 조산의 위험을 줄일 수 있다.","source":"국민건강보험공단 건강보험 매거진 — 산전검사 체크리스트(첫 내원 시, 소변 검사)","url":"https://www.nhis.or.kr/magazin/mobile/201510/c02.html"},{"text":"풍진 검사에서 항체가 음성이면 출산 후 예방접종을 합니다.","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(임신초기)","url":"https://www.childcare.go.kr/?menuno=361"},{"text":"태아사망, 자궁 내 발육부전, 백내장, 난청, 선천성 심장질환, 소두증","source":"질병관리청 예방접종도우미 — 풍진(임신부 감염 시 태아에게 나타날 수 있는 문제)","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1122"},{"text":"임신을 하지 않은 가임기 여성이 풍진에 대한 면역이 없다면 특히 예방접종이 필요","source":"질병관리청 예방접종도우미 — 풍진","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1122"},{"text":"28주 : Rh 음성인 경우 면역 글로불린 주사","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(임신중기)","url":"https://www.childcare.go.kr/?menuno=368"}],"unverified":["항목 id가 임신 5~8주로 되어 있으나, 확인한 공공 출처는 모두 '첫 방문'이라고만 표현하고 5~8주라는 주차를 명시하지 않았습니다.","채혈량, 검사 소요 시간, 결과가 며칠 뒤에 나오는지, 공복이 필요한지는 확인하지 못했습니다.","풍진 항체가 음성인 임신부가 임신 기간에 구체적으로 어떤 생활 수칙을 지켜야 하는지(접촉 회피 방법 등)에 대한 공공 출처의 구체적 문장은 찾지 못했습니다.","초진 검사군 각 항목의 건강보험 급여 여부와 본인부담금 액수는 확인하지 못했습니다."],"summaryLine":"임신을 확인하고 처음 산부인과에 갔을 때 한꺼번에 받는 기본 검사 묶음입니다."},{"id":"nt_scan","name":"1차 기형아 검사 (목덜미투명대, NT)","category":"검사","confidence":"확인","weekFrom":11,"weekTo":13,"timingText":"임신 11주 ~ 13주 6일","detail":"태아 목덜미 투명대 두께를 초음파로 측정합니다. 혈액검사(PAPP-A, free β-hCG)를 병행하는 경우가 많습니다.","source":{"name":"서울아산병원 건강정보","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58","checkedAt":"2026-10-29"},"whatIsIt":"목덜미투명대(NT)는 태아의 목 뒤쪽 피부 아래에 잠깐 고이는 액체층을 말하며, 초음파 화면에서 검고 투명한 띠처럼 보입니다. 1차 기형아 검사는 이 띠의 두께를 초음파로 재고, 여기에 엄마의 피를 뽑아 하는 혈액검사를 더해 태아에게 염색체 이상이 있을 '가능성'을 숫자로 계산하는 검사입니다. 질병관리청은 이 검사를 임신 11~14주 사이에 하는 임신 1분기 선별검사로 안내합니다. 서울아산병원 안내에서는 정상 범위를 임신 11주경 2mm 이하, 13주 6일에는 3mm 이하로 설명합니다.","disease":"두께가 두꺼우면 먼저 염색체 이상을 의심합니다. 대표적인 것이 21번 염색체가 하나 더 있는 다운증후군이고, 에드워드증후군 같은 다른 염색체 이상도 여기에 들어갑니다. 염색체가 정상이어도 태아의 심장이 제대로 만들어지지 않은 선천성 심장기형이 있을 때 투명대가 두꺼워질 수 있습니다. 이런 질환은 태어난 뒤 아기의 발달과 심장 기능에 영향을 줄 수 있어, 미리 알면 출산 전후 진료 계획을 세울 수 있습니다.","whyNeeded":"이 시기에만 잴 수 있기 때문입니다. 서울아산병원 안내에 따르면 11주 이전에는 태아가 너무 작아 측정이 어렵고, 14주가 지나면 태아의 림프계가 발달하면서 목 뒤의 액체가 흡수되어 측정 자체가 불가능해집니다.","howDone":"바늘을 찌르지 않고 초음파로 태아의 목 뒤 두께를 재는 것이 검사의 핵심입니다. 여기에 엄마 팔에서 피를 뽑는 혈액검사를 같이 하는데, 질병관리청은 초음파와 혈액검사를 함께 하면 태아 염색체 이상을 더 정확하게 찾을 수 있어 통합 선별검사에서 같이 쓴다고 설명합니다. 전체 소요 시간이나 통증 정도를 공공 출처에서 확인하지는 못했습니다.","resultMeaning":"이 검사는 '선별검사'이지 '확진검사'가 아닙니다. 질병관리청은 목덜미 투명대 측정이 확진 검사가 아니라 선별 검사이며, 두께 증가만으로는 다운증후군의 약 3분의 2를 발견할 수 있다고 설명합니다. 즉 결과가 고위험으로 나와도 아기에게 이상이 있다는 뜻이 아니라 '확인이 더 필요하다'는 뜻이고, 확진하려면 융모막 융모 검사나 양수검사 같은 검사를 따로 고려하게 됩니다.","cost":"건강보험심사평가원이 안내한 산전 진찰 초음파 급여기준(보건복지부 고시 제2023-105호, 단태아 기준)에 따르면 제1삼분기에는 일반 초음파가 임신 13주 이하 2회, 정밀 초음파가 임신 11~13주 1회 건강보험으로 인정되고, 인정 횟수를 넘는 검사는 비급여입니다. 국민건강보험공단의 임신·출산 진료비 지원은 임신·출산 관련 진료의 본인부담금에 비급여를 포함해 쓸 수 있습니다. 함께 하는 혈액검사의 건강보험 적용 여부와 실제 부담 금액은 확인하지 못했습니다.","quotes":[{"text":"태아 목 뒷부분, 피부 아래 투명대의 두께를 측정하는 검사입니다.","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"},{"text":"이 두께가 증가되어 있으면 염색체 이상이 있을 가능성이 있습니다.","source":"질병관리청 국가건강정보포털 - 초음파 태아 목덜미 투명대 측정","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5516"},{"text":"염색체가 정상이더라도 태아의 심장 기형이 있는 경우 태아 목덜미 투명대가 증가되어 있을 수 있습니다.","source":"질병관리청 국가건강정보포털 - 초음파 태아 목덜미 투명대 측정","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5516"},{"text":"태아 목덜미 투명대 측정은 확진 검사가 아니라 선별 검사입니다.","source":"질병관리청 국가건강정보포털 - 초음파 태아 목덜미 투명대 측정","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5516"},{"text":"목덜미 투명대 두께의 증가만으로 다운증후군의 2/3를 발견할 수 있는 것으로 알려져 있습니다.","source":"질병관리청 국가건강정보포털 - 초음파 태아 목덜미 투명대 측정","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5516"},{"text":"목덜미 투명대 측정 검사와 함께 혈액 검사를 같이 진행하면 태아 염색체 이상을 더 정확하게 찾을 수 있는 것으로 알려져","source":"질병관리청 국가건강정보포털 - 초음파 태아 목덜미 투명대 측정","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5516"},{"text":"이 경우 태아의 염색체 이상을 확인하기 위해 융모막 융모 검사 또는 양수 검사를 고려하게 됩니다.","source":"질병관리청 국가건강정보포털 - 초음파 태아 목덜미 투명대 측정","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5516"},{"text":"선별 검사로는 혈액 검사, 초음파 검사 등이 있으며, 진단을 확진하는 검사로는 양수검사, 융모막 융모 검사 등이 있습니다","source":"질병관리청 국가건강정보포털 - 산전 기형아 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5410"},{"text":"태아 목덜미투명대 두께는 임신 11~13주에 초음파로 측정하며 태아염색체이상(예, 다운증후군) 및 태아구조적기형(예, 선천성심장기형)의 선별검사로 활용됩니다.","source":"보건복지부 임신육아종합포털 아이사랑 - 임신초기 산전검사","url":"https://www.childcare.go.kr/?menuno=361"},{"text":"11주 이전에는 태아가 너무 작아 검사가 어렵고 14주 이후에는 태아의 림프계가 발달하면서 목 뒷부분 액체가 흡수되어 검사가 불가능합니다.","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"},{"text":"임신 11주경에는 2mm 이하가 정상이고 13주 6일에는3mm 이하가 정상범위에 해당됩니다.","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"},{"text":"11~14주에 시행 가능한 검사로는 초음파검사로 태아목덜미 투명대 (nuchal translucency) 측정하고","source":"서울대학교병원 건강정보 - 기형아 검사","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=TEST&medid=BA000064"}],"unverified":["검사 소요 시간과 통증 정도(초음파 자체의 불편감, 채혈 시 아픔)를 설명한 공공 출처 문장을 찾지 못했습니다.","시행 주수 표기가 출처마다 조금 다릅니다. 질병관리청과 서울대학교병원은 '임신 11~14주', 서울아산병원과 아이사랑은 '임신 11주~13주 6일' 또는 '11~13주'로 안내합니다. 하나로 합치지 않고 그대로 둡니다.","목덜미투명대 정상 기준치는 서울아산병원 한 곳에서만 확인했고, 다른 공공 출처의 기준치와 같은지는 확인하지 못했습니다. 기관마다 판정 기준이 다를 수 있습니다.","1차 기형아 검사에 포함되는 혈액검사의 건강보험 적용 여부와 실제 본인부담 금액은 확인하지 못했습니다.","건강보험 초음파 급여 인정 횟수는 보건복지부 고시에 따라 바뀔 수 있어, 검사 시점의 최신 고시를 다시 확인해야 합니다."],"summaryLine":"목덜미투명대(NT)는 태아의 목 뒤쪽 피부 아래에 잠깐 고이는 액체층을 말하며, 초음파 화면에서 검고 투명한 띠처럼 보입니다."},{"id":"fetal_insurance_window","name":"태아보험 가입 실무 권장선","category":"준비","confidence":"추정","weekFrom":4,"weekTo":22,"timingText":"가입 마감 통상 22주 이전, 실무 권장은 12주 이전","detail":"1차 기형아 검사 결과가 나오기 전 가입을 권장하는 업계 관행입니다. 정부·학회 기준이 아니며 보험사 1곳의 공식 자료만 확인했습니다. 보험사·상품별로 기준이 다를 수 있습니다.","source":{"name":"KB손해보험 보험가이드 (단일 보험사 기준, 업계 표준 아님)","url":"https://kbthink.com/insurance-guide/prenatal.html","checkedAt":"2026-10-29"}},{"id":"quad_test","name":"2차 기형아 검사 (쿼드/통합검사)","category":"검사","confidence":"확인","weekFrom":15,"weekTo":20,"timingText":"임신 15~20주","detail":"임신부 혈액의 호르몬 농도를 측정해 다운증후군·에드워드증후군·신경관결손 위험도를 계산합니다.","source":{"name":"서울아산병원 건강정보","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=53","checkedAt":"2026-10-29"},"whatIsIt":"2차 기형아 검사는 임신 중기에 엄마의 피를 뽑아 그 안에 든 특정 물질의 양을 재는 검사입니다. 질병관리청 설명에 따르면 사중(쿼드) 표지자 검사는 혈액 속 네 가지 물질인 알파태아단백, 사람 융모 생식샘 자극호르몬, 비결합 에스트리올, 인히빈을 측정합니다. 이 수치들을 조합해 태아에게 특정 질환이 있을 위험도를 계산합니다. 1차 때 잰 목덜미투명대와 PAPP-A 결과를 함께 묶어 계산하면 통합선별검사가 됩니다.","disease":"다운증후군, 에드워드증후군, 파타우증후군 같은 염색체 이상과, 신경관결손 및 복벽결손의 위험도를 봅니다. 신경관결손은 아기의 뇌와 척수가 될 부분이 임신 초기에 제대로 닫히지 않아 생기는 이상으로, 척추갈림증이나 무뇌증이 여기에 해당합니다. 복벽결손은 배 앞쪽 벽이 다 닫히지 않아 장기 일부가 밖으로 나오는 상태를 말합니다. 이런 질환은 태어난 뒤 아기의 운동·신경 기능이나 수술 필요성에 영향을 줄 수 있습니다.","whyNeeded":"이 물질들의 농도가 임신 주수에 따라 달라지기 때문에 정해진 시기에 재야 위험도를 제대로 계산할 수 있습니다. 아이사랑은 임신 중기 15~20주에, 질병관리청은 임신 15~22주에 시행한다고 안내합니다.","howDone":"엄마의 팔에서 피를 뽑는 혈액검사 한 번으로 끝납니다. 태아에게 바늘을 대거나 배를 찌르는 절차가 없어 태아에게 직접적인 위험이 없는 검사입니다. 채혈에 걸리는 시간과 통증 정도를 설명한 공공 출처 문장은 확인하지 못했습니다.","resultMeaning":"결과는 '이상 있음/없음'이 아니라 '고위험군/저위험군'으로 나옵니다. 아이사랑은 고위험군(양성)으로 판정되면 양수천자를 고려하지만 이것이 태아기형을 의미하는 것은 아니라고 분명히 적고 있습니다. 질병관리청도 다운증후군 고위험군으로 확인되면 염색체 이상 여부를 확인하기 위해 양수검사를 시행한다고 안내하며, 삼중 표지자는 약 60%, 사중 표지자는 약 70~80%, 통합선별검사는 약 90~95%의 검출률이라고 설명해 선별검사에 한계가 있음을 밝힙니다.","cost":"국민건강보험공단의 임신·출산 진료비 지원(국민행복카드)은 임신·출산 관련 진료와 처방된 약제·치료재료 구입의 본인부담금에 비급여를 포함해 쓸 수 있습니다. 쿼드 검사 자체의 건강보험 급여 여부와 금액은 확인하지 못했습니다.","quotes":[{"text":"혈액 내 4가지 호르몬인 알파태아단백, 사람 융모 생식샘 자극호르몬, 비결합 에스트리올, 인히빈을 측정","source":"질병관리청 국가건강정보포털 - 삼중 또는 사중 표지자 검사와 통합선별검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5515"},{"text":"다운증후군, 에드워드 증후군, 파타우 증후군 등의 염색체 이상","source":"질병관리청 국가건강정보포털 - 삼중 또는 사중 표지자 검사와 통합선별검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5515"},{"text":"다운증후군 고위험군으로 확인된다면 태아에게 염색체 이상이 있는지를 확인하기 위해 양수검사를 시행합니다.","source":"질병관리청 국가건강정보포털 - 삼중 또는 사중 표지자 검사와 통합선별검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5515"},{"text":"다만 확진 검사가 아닌 선별 검사인 만큼 검사의 정확도에 한계가 있습니다.","source":"질병관리청 국가건강정보포털 - 삼중 또는 사중 표지자 검사와 통합선별검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5515"},{"text":"임신 중기(15~20주)에 산모의 혈액검사인 쿼드검사를 하여 태아의 다운 증후군, 에드워드증후군 및 신경관결손증 위험도를 확인합니다.","source":"보건복지부 임신육아종합포털 아이사랑 - 임신중기 산전검사","url":"https://www.childcare.go.kr/?menuno=368"},{"text":"이 검사는 기형아를 진단하는 것은 아니며, 태아염색체이상의 위험도를 판정하여 양수천자 필요성을 확인하는 검사입니다.","source":"보건복지부 임신육아종합포털 아이사랑 - 임신중기 산전검사","url":"https://www.childcare.go.kr/?menuno=368"},{"text":"고위험군(양성)으로 판정되면 태아염색체이상을 진단하기 위해 양수천자를 고려하나 이것이 태아기형을 의미하는 것은 아닙니다.","source":"보건복지부 임신육아종합포털 아이사랑 - 임신중기 산전검사","url":"https://www.childcare.go.kr/?menuno=368"},{"text":"알파태아단백질, 사람융모생식샘자극호르몬, 비결합에스트리올 수치만 측정할 경우 삼중 표지자 검사라고 하며, 여기에 인히빈을 추가하면 사중 표지자 검사","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"}],"unverified":["시행 주수가 출처마다 다릅니다. 질병관리청은 삼중·사중 표지자 검사를 '임신 15~22주'로, 아이사랑과 서울아산병원은 '임신 15~20주'로 안내합니다. 하나로 합치지 않고 양쪽을 그대로 둡니다.","채혈에 걸리는 시간, 금식 필요 여부, 결과가 나오기까지 걸리는 기간을 명시한 공공 출처 문장을 찾지 못했습니다.","고위험 판정 시 양수검사 외에 태아 DNA 선별검사(NIPT)를 먼저 하는 경로가 있는지, 그 순서를 규정한 공공 출처 문장은 확인하지 못했습니다.","쿼드 검사와 통합선별검사의 건강보험 급여 여부, 실제 본인부담 금액은 확인하지 못했습니다.","질병관리청이 제시한 검출률은 삼중 약 60%, 사중 약 70~80%, 통합 약 90~95%입니다. 다른 공공 출처와 같은 수치인지는 확인하지 못했습니다.","질병관리청 같은 페이지 안에서도 시행 주수가 15~20주와 15~22주로 함께 쓰입니다."],"summaryLine":"2차 기형아 검사는 임신 중기에 엄마의 피를 뽑아 그 안에 든 특정 물질의 양을 재는 검사입니다."},{"id":"amniocentesis","name":"양수검사","category":"검사","confidence":"확인","weekFrom":15,"weekTo":20,"timingText":"임신 15~20주","detail":"고령임신, 선별검사 고위험군, 초음파 이상 소견자 등이 대상입니다. 정확도 99% 이상.","conditional":true,"source":{"name":"서울아산병원 건강정보","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=59","checkedAt":"2026-10-29"},"whatIsIt":"양수검사는 아기를 둘러싸고 있는 물인 양수를 조금 뽑아, 그 안에 떠 있는 태아의 세포를 배양해 염색체를 직접 들여다보는 검사입니다. 앞서 한 혈액검사나 초음파가 '위험도'를 계산하는 선별검사였다면, 양수검사는 염색체 이상을 확인하는 확진검사에 해당합니다. 질병관리청은 태아 세포 유전학 검사의 정확도를 99% 이상으로 안내합니다. 선천성 감염이 의심될 때는 바이러스 감염 여부도 함께 확인할 수 있습니다.","disease":"다운증후군, 에드워드증후군처럼 염색체의 수가 하나 더 많거나 적은 질환, 그리고 염색체 구조가 바뀐 질환을 확인합니다. 이런 염색체 이상은 아기의 성장과 발달, 심장 등 장기의 형성에 영향을 줄 수 있습니다. 다만 서울아산병원 의학유전학센터는 매우 미세한 염색체 이상이나 멘델성 질환, 다인자성 질환 등 상당수의 태아기형은 염색체 분석만으로는 알 수 없다고 설명합니다.","whyNeeded":"질병관리청은 임신 15~20주 사이에 시행한다고 안내하고, 서울아산병원 의학유전학센터는 임신 15주부터 24주까지 가능하지만 보통 16~18주 사이가 가장 이상적이라고 설명합니다. 선별검사에서 고위험이 나왔거나 초음파에서 이상 소견이 보였을 때, 결과를 확인하고 이후 진료 계획을 세우기 위해 이 시기에 하게 됩니다.","howDone":"초음파로 화면을 보면서 엄마의 배(복벽)를 통해 가느다란 바늘을 넣어 양수를 뽑습니다. 서울아산병원 의학유전학센터는 부분 마취를 한 뒤 20ml 정도의 양수를 흡입하며 소요 시간은 30분에서 1시간 정도라고 설명합니다. 질병관리청은 초음파를 보면서 태아·탯줄·태반을 피해 바늘을 찌르기 때문에 태아를 찌를 가능성은 거의 없고, 복부를 소독한 뒤 멸균 바늘을 쓰기 때문에 감염 위험은 매우 드물다고 안내합니다.","resultMeaning":"결과는 서울아산병원 의학유전학센터 기준 약 14일 후, 질병관리청 기준 보통 2~3주 후에 나옵니다. 염색체 이상이 확인되면 담당 의료진과 상담해 이후 임신 관리와 출산 후 치료 계획을 세우게 됩니다. 다만 이 검사로 모든 태아기형을 알 수 있는 것은 아니어서, 구조적 기형은 정밀초음파로 따로 확인합니다.","cost":"국민건강보험공단의 임신·출산 진료비 지원(국민행복카드)은 임신·출산 관련 진료의 본인부담금에 비급여를 포함해 쓸 수 있습니다. 양수검사 자체의 건강보험 급여 여부와 금액은 확인하지 못했습니다.","quotes":[{"text":"임신 15~20주 사이에 임신부의 복부를 통해 바늘을 넣어 양수를 채취하는 검사","source":"질병관리청 국가건강정보포털 - 양수 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5517"},{"text":"초음파를 보면서 태아, 탯줄, 태반을 피해서 바늘을 찌르기 때문에 태아를 찌를 가능성은 거의 없","source":"질병관리청 국가건강정보포털 - 양수 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5517"},{"text":"시술로 인한 유산은 0.1~0.3% 정도의 가능성이 있","source":"질병관리청 국가건강정보포털 - 양수 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5517"},{"text":"태아의 세포 유전학 검사의 정확도는 99% 이상","source":"질병관리청 국가건강정보포털 - 양수 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5517"},{"text":"태아가 유산, 조산이 될 위험성이 존재하며 약 0.5%로 추정하고 있습니다","source":"보건복지부 임신육아종합포털 아이사랑 - 임신중기 산전검사","url":"https://www.childcare.go.kr/?menuno=368"},{"text":"유산, 사산, 태아손상 등이 있으나 이는 통계적으로 0.05% 미만","source":"서울아산병원 의학유전학센터 - 양수검사","url":"https://amcmg.amc.seoul.kr/asan/depts/amcmg/K/bbsDetail.do?menuId=622&contentId=3043"},{"text":"초음파로 태아를 관찰하면서 부분 마취하에 산모의 복벽을 통해 가느다란 바늘을 주입하여 20ml정도의 양수를 흡입","source":"서울아산병원 의학유전학센터 - 양수검사","url":"https://amcmg.amc.seoul.kr/asan/depts/amcmg/K/bbsDetail.do?menuId=622&contentId=3043"},{"text":"소요시간은 30분에서 1시간 정도","source":"서울아산병원 의학유전학센터 - 양수검사","url":"https://amcmg.amc.seoul.kr/asan/depts/amcmg/K/bbsDetail.do?menuId=622&contentId=3043"},{"text":"약 14일 후에 결과가 보고","source":"서울아산병원 의학유전학센터 - 양수검사","url":"https://amcmg.amc.seoul.kr/asan/depts/amcmg/K/bbsDetail.do?menuId=622&contentId=3043"},{"text":"일반적으로 임신중기인 15주부터 24주까지 시행할 수 있지만, 보통 임신 16 -18주 사이에 시행하는 것이 가장 이상적입니다.","source":"서울아산병원 의학유전학센터 - 양수검사","url":"https://amcmg.amc.seoul.kr/asan/depts/amcmg/K/bbsDetail.do?menuId=622&contentId=3043"},{"text":"매우 미세한 염색체의 이상과 멘델성 질환이나 다인자성 질환 등 그 외 상당수의 태아기형은 염색체 분석만으로는 알 수 없습니다.","source":"서울아산병원 의학유전학센터 - 양수검사","url":"https://amcmg.amc.seoul.kr/asan/depts/amcmg/K/bbsDetail.do?menuId=622&contentId=3043"},{"text":"산전 모체 혈청 선별 검사, 태아 DNA 선별 검사 결과가 고위험인 경우","source":"질병관리청 국가건강정보포털 - 양수 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5517"},{"text":"초음파 검사에서 태아의 구조적 이상 소견이 있는 경우","source":"질병관리청 국가건강정보포털 - 양수 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5517"},{"text":"검사 전 주치의와 충분한 상담 후 검사를 결정","source":"질병관리청 국가건강정보포털 - 양수 검사","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5517"}],"unverified":["유산 위험 수치가 공공·상급종합병원 출처 세 곳에서 서로 다릅니다. 질병관리청 국가건강정보포털은 '0.1~0.3%', 보건복지부 아이사랑은 '약 0.5%', 서울아산병원 의학유전학센터는 '0.05% 미만'이라고 적습니다. 하나로 합치지 않고 세 수치를 모두 그대로 남깁니다. 어느 것이 최신 기준인지는 확인하지 못했습니다.","검사 대상(권고 대상) 목록이 출처마다 조금씩 다릅니다. 질병관리청은 고령 임신부, 염색체 구조적 이상 가족력, 선천기형·염색체 이상 출산 경험, 선별검사 고위험군, 초음파상 태아 구조 이상, 유전 질환 가족력을 듭니다. '고령'의 구체적인 나이 기준을 양수검사 항목에서 명시한 문장은 찾지 못했습니다(별도 항목인 산전 기형아 검사에는 '분만 시 산모의 나이가 만 35세 이상' 표현이 있습니다).","양수검사의 건강보험 급여 여부와 실제 본인부담 금액은 확인하지 못했습니다.","합병증 발생률은 질 출혈 약 1%, 양막 파수 약 1%, 융모막 염증 0.1% 미만입니다(질병관리청 기준). 다른 공공 출처와 같은 수치인지는 확인하지 못했습니다."],"summaryLine":"양수검사는 아기를 둘러싸고 있는 물인 양수를 조금 뽑아, 그 안에 떠 있는 태아의 세포를 배양해 염색체를 직접 들여다보는 검사입니다."},{"id":"detailed_ultrasound","name":"정밀초음파","category":"검사","confidence":"확인","weekFrom":20,"weekTo":24,"timingText":"임신 20~24주","detail":"태아의 장기·구조를 세밀히 관찰해 구조적 기형 여부를 확인합니다.","conflictNote":"서울아산병원은 20~24주, 국가건강정보포털은 20~22주로 공식 출처끼리 표기가 다르다. 범위로 안내한다.","source":{"name":"서울아산병원 건강정보 / 국가건강정보포털","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58","checkedAt":"2026-10-29"},"whatIsIt":"정밀초음파는 태아의 몸을 머리부터 발끝까지 부위별로 나누어 살펴보면서, 있어야 할 장기와 구조가 제대로 만들어져 있는지 확인하는 초음파 검사입니다. 질병관리청은 이 시기의 정밀초음파를 '해부학적 구조의 이상을 확인하는 영상검사'라고 설명합니다. 앞서 한 혈액검사나 양수검사가 염색체를 보는 검사였다면, 정밀초음파는 눈으로 모양을 확인하는 검사라는 점이 다릅니다.","disease":"특정 질병 하나를 겨냥하는 검사가 아니라, 태아의 구조적 기형 전반을 찾는 검사입니다. 서울아산병원은 태아가 정상적으로 발달하고 있는지, 구조적인 기형이 있는지, 태반의 위치는 어떤지를 파악하는 검사라고 설명합니다. 심장이나 뇌, 척추, 콩팥 같은 장기가 제대로 만들어지지 않으면 태어난 뒤 수술이나 특수 치료가 필요할 수 있어, 미리 알면 분만할 병원과 출생 직후 치료 계획을 준비할 수 있습니다.","whyNeeded":"태아의 장기가 어느 정도 자라서 초음파로 구분해 볼 수 있게 되는 시기이기 때문입니다. 질병관리청은 임신 20~22주 정도에 정밀초음파를 시행한다고 안내하고, 서울아산병원과 아이사랑은 임신 20~24주 사이에 시행한다고 안내합니다.","howDone":"배에 젤을 바르고 초음파 탐촉자를 대어 화면을 보며 확인하는 방식으로, 바늘을 찌르지 않습니다. 일반 초음파보다 훨씬 많은 구조를 하나씩 확인하기 때문에 시간이 더 걸리고, 정확한 소요 시간을 명시한 공공 출처 문장은 확인하지 못했습니다.","resultMeaning":"검사 후 판독을 마치면 의료진에게서 결과 설명을 듣게 됩니다. 이상이 발견되면 추가 초음파나 태아 심초음파, 필요에 따라 염색체 검사를 상의하게 됩니다. 다만 질병관리청은 자궁 안에서 움직이는 태아를 관찰하는 검사이기 때문에 모든 기형을 확인할 수 없다는 한계가 있다고 분명히 밝히고 있어, 정상으로 나왔다고 해서 기형이 전혀 없다는 뜻은 아닙니다.","cost":"건강보험심사평가원이 안내한 산전 진찰 초음파 급여기준(보건복지부 고시 제2023-105호, 단태아 기준)에 따르면 제2·3삼분기에는 일반 초음파가 임신 14~19주, 20~35주, 36주 이후 각 1회, 정밀 초음파가 임신 16주 이후 1회 건강보험으로 인정되며, 인정 횟수를 넘는 검사는 비급여로 규정되어 있습니다. 국민건강보험공단의 임신·출산 진료비 지원(국민행복카드)은 비급여를 포함한 본인부담금에 쓸 수 있습니다.","quotes":[{"text":"임신 20~22주 정도에 정밀초음파 검사를 시행합니다.","source":"질병관리청 국가건강정보포털 - 정상임신관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301"},{"text":"이 시기의 정밀초음파는 해부학적 구조의 이상을 확인하는 영상검사입니다.","source":"질병관리청 국가건강정보포털 - 정상임신관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301"},{"text":"자궁 안에서 움직이는 태아를 관찰하는 검사이기 때문에 모든 기형을 확인할 수 없다는 한계점이 있습니다.","source":"질병관리청 국가건강정보포털 - 정상임신관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301"},{"text":"임신 중기인 20~24주 사이에 시행하게 됩니다.","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"},{"text":"초음파 기계를 이용하여 태아가 정상적으로 발달하고 있는지, 구조적인 기형이 있는지, 태반의 위치 등을 파악하는 검사입니다.","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"},{"text":"정확한 판독이 이루어진 후 의료진을 통해 검사결과에 대한 설명을 들을 수 있습니다.","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"},{"text":"임신 중 시행하는 검사는 단적인 검사 결과 하나만으로 태아의 기형을 진단할 수는 없습니다.","source":"서울아산병원 건강정보 - 산전 검사","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58"},{"text":"일반 초음파: 임신 14-19주, 20-35주, 36주 이후 각 1회 / 정밀 초음파: 임신 16주 이후 1회","source":"건강보험심사평가원 - 임산부 초음파 주수별 급여 인정 횟수","url":"https://www.hira.or.kr/bbsDummy.do?pgmid=HIRAA010006011000&brdScnBltNo=4&brdBltNo=47499&pageIndex=1&pageIndex2=1"}],"unverified":["시행 주수가 출처마다 다릅니다. 질병관리청 국가건강정보포털은 '임신 20~22주 정도', 서울아산병원과 보건복지부 아이사랑은 '임신 20~24주'로 안내합니다. 하나로 합치지 않고 양쪽을 그대로 남깁니다. 건강보험 급여기준은 이와 별개로 '임신 16주 이후 1회'입니다.","일반 초음파와 정밀 초음파의 차이를 항목별로 비교해 설명한 공공 출처 문장은 찾지 못했습니다. 두 검사의 차이는 급여 인정 시기·횟수(건강보험심사평가원)와 각 검사의 목적 설명(질병관리청·서울아산병원)을 대조해 정리한 것이며, 하나의 출처가 직접 비교한 문장은 아닙니다.","정밀초음파에 걸리는 시간, 태아 자세 때문에 재검사가 필요한 경우의 처리 방식을 설명한 공공 출처 문장은 확인하지 못했습니다.","정밀초음파에서 확인하는 신체 부위·장기의 구체적인 목록을 제시한 공공 출처 문장은 확인하지 못했습니다.","정밀초음파의 실제 본인부담 금액과 본인부담률은 확인하지 못했습니다. 건강보험심사평가원 자료에는 인정 횟수만 나와 있고 본인부담률은 별도로 기재되어 있지 않았습니다.","건강보험 초음파 급여 인정 횟수는 보건복지부 고시 개정에 따라 바뀔 수 있어, 검사 시점의 최신 고시를 다시 확인해야 합니다.","다태아의 경우 급여 인정 횟수가 달라지는지는 확인하지 못했습니다(확인한 기준은 단태아 기준입니다)."],"summaryLine":"정밀초음파는 태아의 몸을 머리부터 발끝까지 부위별로 나누어 살펴보면서, 있어야 할 장기와 구조가 제대로 만들어져 있는지 확인하는 초음파 검사입니다."},{"id":"gdm_screening","name":"임신성 당뇨병 선별검사","category":"검사","confidence":"확인","weekFrom":24,"weekTo":28,"timingText":"임신 24~28주","detail":"경구 포도당부하검사. 고위험군은 임신 초기에 조기 검사가 권고되는 경우가 있습니다.","source":{"name":"서울아산병원 건강정보","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=58","checkedAt":"2026-10-29"},"whatIsIt":"임신성 당뇨병 선별검사는 임신 중에 혈당이 높아지지 않았는지 확인하는 검사입니다. 단 음료(포도당 용액)를 마시고 정해진 시간 뒤에 피를 뽑아 혈당을 재는 방식입니다. 서울아산병원은 임신 24~28주에 모든 임산부에게서 시행한다고 설명합니다. 이 검사는 '선별검사'라서, 여기서 수치가 높게 나왔다고 바로 당뇨병이 있다는 뜻은 아니고 확인용 2차 검사로 넘어가게 됩니다.","disease":"임신성 당뇨병은 원래 당뇨병이 없던 사람이 임신 중에 혈당이 높아진 상태로 처음 발견되는 병입니다. 서울아산병원은 임신 20주 이후에 당뇨병이 발생하는 경우라고 설명하고, 서울대학교병원은 임신 중기 이후 진단된 당뇨병으로 임신 전에는 당뇨병이 분명하지 않았던 경우라고 설명합니다. 대한당뇨병학회는 임신 중에 발생하는 호르몬 변화 등 생리학적 변화와 연관이 있다고 밝히고 있으며, 서울대학교병원은 임신 중 인슐린 저항성(혈당을 낮추는 인슐린이 잘 듣지 않는 상태)이 생기는데 임신성 당뇨병에서는 이를 극복할 만큼 인슐린 분비가 충분하지 않다고 설명합니다. 아기 쪽 위험으로는 혈당이 조절되지 않을 때 거대아(몸무게가 지나치게 큰 아기)가 되어 분만 중 산모와 신생아의 합병증 위험이 높아지는 것이 대표적이고, 대한당뇨병학회 자료는 신생아 합병증으로 저혈당·저칼슘혈증·신생아 호흡곤란 증후군을 듭니다. 엄마 쪽으로는 임신성 고혈압, 조산, 그리고 출산 후 시간이 지나 제2형 당뇨병이 생기는 경우가 상당수라고 안내됩니다.","whyNeeded":"임신성 당뇨병은 증상이 뚜렷하지 않아 검사하지 않으면 모르고 지나가기 쉽고, 혈당이 조절되지 않으면 아기와 엄마 모두에게 영향을 주기 때문입니다. 서울아산병원은 임신 24~28주에 모든 임산부에게 이 검사를 시행한다고 안내하며, 대한산부인과학회도 임신 24~28주 사이에 50g 경구당부하검사로 선별한다고 설명합니다. 미리 찾아내면 식사와 혈당 관리로 대응할 수 있습니다.","howDone":"1차 선별검사는 포도당 50g이 든 용액을 마시고 1시간 뒤에 피를 뽑아 혈당을 재는 방식이며, 아이사랑 포털은 공복 여부와 무관하게 시행한다고 안내합니다. 서울아산병원도 50g 경구당부하검사는 특별한 준비사항이 없다고 설명합니다. 즉 밥을 먹고 가도 되고, 마신 뒤 1시간을 병원에서 기다렸다가 채혈하는 것이 전부입니다.","resultMeaning":"1차 검사에서 1시간 뒤 혈당이 140mg/dL(고위험 산모의 경우 130mg/dL) 이상이면 2차로 100g 경구당부하검사를 받습니다. 2차 검사는 8시간 이상 금식한 뒤에 시행하며, 서울대학교병원 기준으로 공복 95mg/dL 이상, 1시간 180mg/dL 이상, 2시간 155mg/dL 이상, 3시간 140mg/dL 이상 중 두 가지를 만족하면 임신성 당뇨병으로 진단합니다. 진단되면 매일 혈당을 재고 영양 상담을 받으며 식사를 조절하는 관리로 이어집니다.","cost":"국민행복카드(임신·출산 진료비 지원 이용권)의 사용 범위에 임신·출산 관련 진료비가 포함되어 있어 임신 중 진료비에 쓸 수 있습니다(임신 1회당 단태아 100만원, 다태아는 기본 140만원에 더해 태아 한 명당 100만원이 되도록 추가 신청할 수 있어 쌍둥이는 200만원). 다만 임신성 당뇨병 선별검사 자체가 건강보험 급여인지, 본인부담금이 얼마인지는 확인하지 못했습니다.","quotes":[{"text":"임신 24~28주에 모든 임산부에게서 시행하게 됩니다.","source":"서울아산병원 건강정보 — 임신성 당뇨검사","url":"https://m.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=61"},{"text":"임신성 당뇨는 원래 당뇨가 없던 사람이 임신 20주 이후에 당뇨병이 발생하는 경우를 말합니다.","source":"서울아산병원 건강정보 — 임신성 당뇨검사","url":"https://m.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=61"},{"text":"공복 여부와 무관하게 포도당 50g을 마신 후 1시간 후 혈당검사","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(임신중기)","url":"https://www.childcare.go.kr/?menuno=368"},{"text":"140mg/dL(고위험 산모의 경우 130mg/dL) 이상인 경우 다시 100g 경구당부하 검사를 시행","source":"서울아산병원 건강정보 — 임신성 당뇨검사","url":"https://m.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=61"},{"text":"50g 경구당부하검사는 특별한 준비사항은 없습니다.","source":"서울아산병원 건강정보 — 임신성 당뇨검사","url":"https://m.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=61"},{"text":"100g이나 75g 경구당부하검사는 8시간 이상 금식한 후 검사를 시행합니다.","source":"서울아산병원 건강정보 — 임신성 당뇨검사","url":"https://m.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=61"},{"text":"임신 24~28주 사이에 50g 경구당부하검사를 통해 선별","source":"대한산부인과학회 — 임신성 당뇨","url":"https://www.ksog.org/public/index.php?sub=1&third=8"},{"text":"임신 중 혈당이 조절되지 않으면 태아에게 좋지 않은 영향을 끼쳐 거대아가 될 수 있으며, 이는 분만 중 산모의 합병증 및 신생아의 합병증이 생길 위험이 높아진다.","source":"서울대학교병원 의학정보 — 임신성 당뇨병","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000265"},{"text":"임신성 당뇨병이 있었던 여성의 상당수에서 분만 후 시간이 지나면 당뇨병이 발생한다.","source":"서울대학교병원 의학정보 — 임신성 당뇨병","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000265"},{"text":"인슐린 저항성을 극복할 만한 인슐린 분비가 충분하지 않다","source":"서울대학교병원 의학정보 — 임신성 당뇨병","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000265"},{"text":"임신 중에 발생하는 호르몬 변화 등 생리학적 변화와 연관","source":"대한당뇨병학회 — 임신성 당뇨병","url":"https://www.diabetes.or.kr/general/info/info_05.php"},{"text":"임신 중기 이후 진단된 당뇨병으로, 임신 전에는 당뇨병이 분명하지 않았던 경우","source":"서울대학교병원 의학정보 — 임신성 당뇨병","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000265"}],"unverified":["임신성 당뇨병의 정의에서 시작 시점 표현이 출처마다 다릅니다. 서울아산병원과 대한당뇨병학회는 '임신 20주 이후', 서울대학교병원은 '임신 중기 이후'라고 설명합니다. 하나로 합치지 않고 양쪽을 그대로 적었습니다.","검사 방식이 한 가지가 아닙니다. 서울대학교병원과 서울아산병원은 50g으로 선별한 뒤 100g으로 확진하는 2단계 접근법 외에, 75g 경구포도당부하검사 한 번으로 진단하는 방법(공복 92mg/dL 이상, 1시간 180mg/dL 이상, 2시간 153mg/dL 이상 중 하나 만족)도 함께 소개합니다. 국내에서 어느 방식이 표준인지는 확정하지 못했습니다.","대한산부인과학회 페이지에서 확인된 A1/A2 분류(공복 105mg/dL, 2시간 120mg/dL 기준)가 무엇을 나누는 기준인지, 다른 출처의 진단 기준과 어떻게 연결되는지는 확인하지 못했습니다.","임신성 당뇨병의 원인을 '태반에서 나오는 호르몬' 때문이라고 명시한 문장은 확인한 공공·학회 출처에서 그대로 찾지 못했습니다. 대한당뇨병학회는 '호르몬 변화 등 생리학적 변화와 연관'이라고만 설명합니다.","검사에 걸리는 총 시간(대기 포함), 포도당 용액을 마신 뒤 속이 불편한 경우가 흔한지 여부는 확인하지 못했습니다.","임신성 당뇨병 선별검사의 건강보험 급여 여부와 본인부담금은 확인하지 못했습니다."],"summaryLine":"임신성 당뇨병 선별검사는 임신 중에 혈당이 높아지지 않았는지 확인하는 검사입니다."},{"id":"tdap_vaccine","name":"Tdap(백일해·디프테리아·파상풍) 예방접종","category":"접종","confidence":"확인","weekFrom":27,"weekTo":36,"timingText":"임신 27~36주","detail":"신생아 백일해 예방을 위해 1회 접종합니다. 신생아 백일해 예방효과 69~91%로 보고됩니다. 이 시기를 놓치면 출산 직후 접종합니다.","source":{"name":"서울대학교병원 건강정보","url":"https://www.snuh.org/health/nMedInfo/nView.do?medid=BB000354","checkedAt":"2026-10-29"},"whatIsIt":"Tdap 은 파상풍, 디프테리아, 백일해 이 세 가지 감염병을 한 번에 예방하는 백신입니다. 임신부가 임신 후기에 이 백신을 맞으면, 아기가 백일해를 막아 주는 면역을 가진 채로 태어날 수 있습니다. 아기 자신의 첫 백일해 접종은 생후 2개월에야 시작되기 때문에, 그 전까지 비어 있는 기간을 엄마의 접종으로 메우는 것입니다. 질병관리청은 임신 27~36주 사이에 접종할 것을 권장하고, 임신할 때마다 매번 맞는 것이 가장 효과적이라고 안내합니다.","disease":"백일해는 백일해균에 감염되어 생기는 급성 호흡기 질환으로, 사람에게만 발생하고 전염력이 매우 강합니다. 처음에는 콧물과 가벼운 기침 등 감기처럼 시작하지만 이후 4주 이상 발작적인 기침이 계속되고, 기침 끝에 '흡' 하는 소리가 나거나 구토가 동반되기도 합니다. 아기는 나이가 어릴수록 위험해서, 12개월 미만 아기 가운데 약 3명 중 1명은 무호흡이나 폐렴 때문에 병원 치료가 필요할 수 있습니다. 2003년 세계보건기구 보고에 따르면 신생아는 집중 치료를 받아도 치명률이 약 4%에 이릅니다. 2024년 한 해에만 국내에서 48,048명의 환자가 발생했고, 아직 1차 접종을 하지 못한 생후 2개월 미만 영아가 국내 첫 사망자로 보고되었습니다.","whyNeeded":"생후 2개월 첫 접종 이전의 아기가 백일해에 대한 면역을 갖고 태어날 수 있도록, 질병관리청은 임신 3기인 27~36주 임신부는 반드시 예방접종을 해야 한다고 안내합니다. 이 시기에 접종하면 아기의 백일해 입원 위험을 줄일 수 있고, 매 임신마다 접종하는 것이 가장 효과적인 방법입니다. 임신 중에 맞지 못했다면 분만 후 신속하게 접종할 것을 권합니다. 일부 지자체 안내에는 출산 2주 이내로 적혀 있기도 합니다.","howDone":"채혈이 아니라 백신을 맞는 접종이며, 가까운 보건소나 의료기관에 가서 의료진과 상담한 뒤 접종합니다. 아기와 가까이 지낼 남편과 양가 부모님도 함께 맞는 것이 좋습니다. 다만 보건소에서 무료로 맞을 수 있는지, 배우자까지 지원되는지는 지역마다 달라 사시는 곳 보건소에 확인해야 합니다. 질병관리청은 영유아를 돌보는 부모, 조부모, 보육교사, 의료인의 접종이 특히 중요하다고 안내합니다.","resultMeaning":"예방접종이라 검사처럼 나오는 결과 수치는 없습니다. 다만 엄마가 접종을 했더라도 모든 영아는 적기에, 즉 아기 자신의 백일해 예방접종을 따로 받아야 합니다. DTaP 백신을 생후 2개월·4개월·6개월과 15~18개월, 4~6세에 맞고 11~12세에 Tdap 으로 추가 접종합니다.","cost":"유행과 관련된 백일해 예방접종 비용 지원은 만 12세 이하 국가예방접종사업 대상자와 임시예방접종 대상자에게 적용되고, 그 밖의 대상은 비용 지원이 되지 않습니다. 다만 서울 성동구나 경남 창녕군처럼 임신부와 배우자에게 백일해 접종비를 지원하는 지방자치단체가 여럿 있으므로, 사시는 곳 보건소에 지원 여부를 확인해 보시는 것이 좋습니다.","quotes":[{"text":"백일해는 사람에게만 발생하며 전염력이 매우 강한 호흡기 감염병입니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"이후에는 보통 4주 이상 발작적인 기침이 계속되며, 기침 후 구토가 동반되기도 합니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"12개월 미만 아기 가운데 약 3명 중 1명은 무호흡이나 폐렴 등으로 인해 병원 치료가 필요할 수 있습니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"특히 신생아는 집중 치료를 받아도 치명률이 약 4%에 이릅니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"2024년 한 해에만 48,048명의 환자가 발생했습니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"특히 임신 27~36주 사이에 접종하면 아기의 백일해 입원 위험을 줄일 수 있습니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"매 임신마다 Tdap 백신을 접종하는 것이 가장 효과적인 방법입니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"특히 영유아를 돌보는 부모, 조부모, 보육교사, 의료인은 백일해 전파를 막기 위해 접종이 더욱 중요합니다.","source":"질병관리청 국가건강정보포털 - 백일해","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6676"},{"text":"생후 첫 접종(2개월) 이전 영아가 백일해에 대한 면역을 갖고 태어날 수 있도록 임신 3기(27~36주) 임신부는 반드시 예방접종을 해야 한다.","source":"대한민국 정책브리핑 - 국내 첫 백일해 사망자 나와, 예방접종 적극 당부","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148936203"},{"text":"이번에 발생한 백일해 첫 사망자는 생후 2개월 미만 영아로 백일해 1차 예방접종 이전이며","source":"대한민국 정책브리핑 - 국내 첫 백일해 사망자 나와, 예방접종 적극 당부","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148936203"},{"text":"영유아의 부모 등 돌보미, 의료종사자 및 산후조리원 근무자 등 성인들도 백신을 접종할 것을 당부했다.","source":"대한민국 정책브리핑 - 국내 첫 백일해 사망자 나와, 예방접종 적극 당부","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148936203"},{"text":"임신 27∼36주 사이의 접종이 권장되며, 임신 중에 접종하지 못한 경우는 분만 후 신속하게 접종할 것을 권장한다.","source":"대한민국 정책브리핑 - Q&A로 알아보는 백일해","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148923417"},{"text":"12개월 미만 연령의 영유아를 돌보는 가족 및 의료 종사자도 과거에 Tdap 백신 접종을 받지 않았다면 Tdap 백신 접종을 권장한다.","source":"대한민국 정책브리핑 - Q&A로 알아보는 백일해","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148923417"},{"text":"유행과 관련된 예방접종 비용 지원은 임시예방접종 대상자, 국가예방접종사업 대상자(만 12세 이하)이다. 이 외 대상은 비용 지원이 되지 않는다.","source":"대한민국 정책브리핑 - Q&A로 알아보는 백일해","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148923417"},{"text":"기침이 점차 심해지면서 기침 끝에 '흡'하는 소리가 들립니다.","source":"서울아산병원 건강정보 - 백일해","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31666"},{"text":"연령이 어릴수록 사망률이 높아지며, 1세 미만의 사망률이 가장 높습니다.","source":"서울아산병원 건강정보 - 백일해","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31666"},{"text":"신생아는 심한 발작적인 기침으로 인해 사망에 이를 수 있습니다.","source":"서울아산병원 건강정보 - 백일해","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31666"},{"text":"무호흡, 이차감염에 의한 세균성 폐렴, 경련이나 뇌증 등의 신경계 합병증, 중이염","source":"질병관리청 예방접종도우미 - 백일해","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1120"},{"text":"임신부, 남편, 양가 부모님까지 보건소에서 백일해 접종 가능합니다.","source":"경상남도 창녕군 보건정책과 - 임신부 대상 백일해 예방접종 안내","url":"https://www.cng.go.kr/03516/01549.web?amode=view&idx=562192&gcode=1001&cpage=10"},{"text":"임신 중 미접종 시 출산2주 이내에 접종하는 것을 권장해요.","source":"경상남도 창녕군 보건정책과 - 임신부 대상 백일해 예방접종 안내","url":"https://www.cng.go.kr/03516/01549.web?amode=view&idx=562192&gcode=1001&cpage=10"},{"text":"생후 3개월 미만 영아의 백일해 입원의 최대 90.5%와 백일해 관련 사망의 95%를 예방","source":"경상남도 창녕군 보건정책과 - 임신부 대상 백일해 예방접종 안내","url":"https://www.cng.go.kr/03516/01549.web?amode=view&idx=562192&gcode=1001&cpage=10"},{"text":"성동구에 주민등록을 두고 거주하고 있는 27~36주 임신부","source":"서울특별시 성동구 - 임신부 및 배우자 백일해 예방접종 지원","url":"https://www.sd.go.kr/booking/contents.do?key=5155"},{"text":"매 임신 시마다 백일해 예방접종 지원","source":"서울특별시 성동구 - 임신부 및 배우자 백일해 예방접종 지원","url":"https://www.sd.go.kr/booking/contents.do?key=5155"}],"unverified":["항체가 태반을 통해 아기에게 전달된다는 기전을 직접 설명한 공공 출처 문장은 찾지 못했습니다. 질병관리청은 '영아가 백일해에 대한 면역을 갖고 태어날 수 있도록'이라고만 표현하며, 태반이나 항체 전달을 설명한 문장은 국가건강정보포털 백일해 페이지 원문에 없었습니다.","왜 하필 27주 이전이나 36주 이후가 아닌지, 즉 항체가 만들어지고 아기에게 전달되는 데 필요한 기간을 설명한 공공 출처 문장은 확인하지 못했습니다. 확인한 것은 '27~36주에 접종하면 입원 위험을 줄일 수 있다'는 결과 문장뿐입니다.","접종 방법의 세부 사항(주사 부위, 근육주사 여부, 1회 접종인지, 소요 시간, 통증)을 명시한 공공 출처 문장은 확인하지 못했습니다.","자비로 접종할 때의 실제 비용 금액은 공공 출처에서 확인하지 못했습니다. 검색에서 나온 금액대는 모두 상업 사이트 출처라 사용하지 않았습니다.","지방자치단체 지원은 지역마다 조건과 금액이 다릅니다. 성동구와 창녕군 사례만 원문으로 확인했으며, 전국 지자체 현황은 확인하지 못했습니다.","'코쿠닝'이라는 용어를 직접 사용한 공공 출처는 확인하지 못했습니다. 확인된 것은 가족·돌보미 접종을 권고하는 문장들입니다.","가족이 아기와 접촉하기 며칠 전에 접종해야 하는지는 공식 자료에서 확인하지 못했습니다. 최소 2주 전이라는 안내도 있으니 접종기관에 확인해 주세요.","임신·출산 진료비 지원사업(국민행복카드)으로 임신부 Tdap 접종비를 결제할 수 있는지는 확인하지 못했습니다.","백일해 첫 사망자 보도자료의 발표 연도는 2024년 11월로 보이나, 질병관리청 보도자료 원문 페이지는 접속되지 않아 정책브리핑 기사로만 확인했습니다.","출산 후 접종 시기를 국가 자료는 \"분만 후 신속하게\"로만 적고, 일부 지자체 안내는 \"출산 2주 이내\"로 적습니다. 두 표현이 다릅니다."],"summaryLine":"Tdap 은 파상풍, 디프테리아, 백일해 이 세 가지 감염병을 한 번에 예방하는 백신입니다."},{"id":"rhogam","name":"Rh(−) 산모 면역글로불린 투여","category":"검사","confidence":"확인","weekFrom":28,"weekTo":28,"timingText":"임신 28주 (1차) + 분만 후 72시간 이내 (2차)","detail":"Rh(−) 산모에서 태아와의 혈액형 부적합으로 인한 용혈성 질환을 예방합니다.","conditional":true,"conditionField":"isRhNegative","source":{"name":"서울아산병원 건강정보","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=33769","checkedAt":"2026-10-29"},"whatIsIt":"혈액형에는 A형·B형·O형 같은 구분 외에 Rh 라는 구분이 하나 더 있습니다. 적혈구에 D 항원이라는 표시가 있으면 Rh 양성, 없으면 Rh 음성입니다. 우리나라에서 Rh 음성은 약 0.1~0.3%로 매우 드뭅니다. Rh 음성인 임신부가 Rh 양성인 아기를 가진 경우 엄마 몸이 아기의 적혈구를 낯선 것으로 인식해 항체를 만들 수 있는데, 그 항체가 생기는 것을 미리 막아 주는 주사가 Rh 면역글로불린입니다.","disease":"엄마 몸에 만들어진 항-D 항체가 태반을 건너 아기에게 전달되면 아기의 적혈구를 파괴합니다. 이것을 태아신생아용혈성질환, 또는 Rh 신생아 용혈성 질환이라고 부릅니다. 적혈구가 많이 깨지면 아기에게 황달과 빈혈이 생기고, 심한 경우 온몸이 붓는 태아수종으로 이어질 수 있습니다.","whyNeeded":"임신 중에는 엄마와 아기의 혈액 순환이 분리되어 있어 서로 섞이지 않지만, 출산할 때나 유산이 될 때 아기의 적혈구가 엄마 혈액으로 들어갈 수 있습니다. 산모가 항체를 만드는 데에는 얼마간의 시간이 걸리기 때문에, 유산 경험이 없다면 첫아이는 대개 영향을 받지 않습니다. 문제는 그다음 임신부터로, 이미 만들어져 있던 항체가 다음 아기의 적혈구를 공격하게 됩니다.","howDone":"혈액형과 항체 여부는 채혈로 확인하고, 면역글로불린 자체는 주사로 맞습니다. 서울아산병원 자료는 임신 28주에 한 번, 분만 후 72시간 이내에 한 번 맞도록 안내합니다. 서울대학교병원 자료는 임신 26~32주에 투여하고 분만 후 72시간 이전에 투여한다고 설명해, 임신 중 투여 시기의 표현이 두 출처에서 다릅니다.","resultMeaning":"혈액형 검사에서 Rh 음성으로 확인되면 항-D 항체가 이미 만들어져 있는지를 확인합니다. 항체를 아직 가지고 있지 않은 Rh 음성 산모가 면역글로불린 투여 대상입니다. 아기가 이미 심한 용혈성 질환을 앓는 경우에는 탯줄을 통해 직접 피를 넣어 주는 태아 수혈이 필요할 수 있습니다.","quotes":[{"text":"Rh가 양성인 경우는 D 항원을 가지고 있는 경우이고 Rh가 음성인 경우는 D 항원을 가지고 있지 않은 경우입니다.","source":"서울아산병원 건강정보 - Rh 혈액형 검사","url":"https://www.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=71"},{"text":"우리나라에서는 약 0.1-0.3%로 매우 드뭅니다.","source":"서울아산병원 건강정보 - Rh 혈액형 검사","url":"https://www.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=71"},{"text":"이 항체들이 태반을 건너가 태아에게 전달이 되면 태아의 적혈구를 파괴시키는 태아신생아용혈성질환을 일으킬 수 있습니다.","source":"서울아산병원 건강정보 - Rh 혈액형 검사","url":"https://www.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=71"},{"text":"RhD 음성인 산모가 RhD 양성인 아이를 가지게 되어 RhD 항원에 노출이 되면 anti-D를 생성하게 될 가능성이 높습니다.","source":"서울아산병원 건강정보 - Rh 혈액형 검사","url":"https://www.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=71"},{"text":"적절한 시기에 Rh면역글로불린 주사를 맞아 태아신생아용혈성질환을 예방하는 것이 매우 중요합니다.","source":"서울아산병원 건강정보 - Rh 혈액형 검사","url":"https://www.amc.seoul.kr/asan/mobile/healthinfo/management/managementDetail.do?managementId=71"},{"text":"임신 중에는 모체와 태아의 혈액 순환은 분리되어 있어 서로 섞일 수 없습니다.","source":"서울아산병원 건강정보 - Rh 부적합 임신","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=33769"},{"text":"출산 중이나 유산이 되면 태아의 적혈구가 모체의 혈액으로 들어갈 수 있습니다.","source":"서울아산병원 건강정보 - Rh 부적합 임신","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=33769"},{"text":"산모가 태아 혈액에 대한 항체를 만드는 데에 얼마 간의 시간을 필요로 하기 때문에","source":"서울아산병원 건강정보 - Rh 부적합 임신","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=33769"},{"text":"산모가 유산의 경험이 없다면 첫아이는 영향을 받지 않습니다.","source":"서울아산병원 건강정보 - Rh 부적합 임신","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=33769"},{"text":"임신 28주 차에 한 번, 분만 후 72시간 이내에 한 번","source":"서울아산병원 건강정보 - Rh 부적합 임신","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=33769"},{"text":"탯줄을 통하여 직접 주입하는 방법","source":"서울아산병원 건강정보 - Rh 부적합 임신 (태아 수혈)","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=33769"},{"text":"항-D 항체를 가지고 있지 않은 Rh 음성 산모에게 임신 26~32주에 Rh 면역글로불린을 투여하고","source":"서울대학교병원 건강정보 - Rh 신생아 용혈성 질환","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000573"},{"text":"분만 후 72시간 이전에 투여하여 Rh 신생아 용혈성 질환을 예방할 수 있다.","source":"서울대학교병원 건강정보 - Rh 신생아 용혈성 질환","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000573"},{"text":"이미 생성되어 있던 엄마의 항-D가 태반을 넘어가서 아기의 Rh 양성 적혈구를 파괴","source":"서울대학교병원 건강정보 - Rh 신생아 용혈성 질환","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000573"},{"text":"Rh 음성산모 항체 검사 및 면역글로불린 투여","source":"대한산부인과학회 - 일반인 건강정보, 임신 중 검사","url":"https://www.ksog.org/public/index.php?sub=1&third=2"}],"unverified":["'태아적아구증'이라는 용어는 확인한 상급종합병원 페이지 원문에 나오지 않았습니다. 서울대학교병원은 'Rh 신생아 용혈성 질환', 서울아산병원은 '태아신생아용혈성질환'이라는 이름을 씁니다. 항목 설명에 태아적아구증을 쓰려면 그 용어를 실제로 쓰는 공공 출처를 따로 확인해야 합니다.","임신 중 투여 시기가 출처마다 다릅니다. 서울아산병원은 '임신 28주 차에 한 번', 서울대학교병원은 '임신 26~32주'라고 안내합니다. 어느 쪽이 국내 표준 권고인지는 확인하지 못했습니다. 담당 의료진에게 확인해 주세요.","유산, 자궁외임신, 양수검사, 융모막융모생검 등 다른 상황에서 추가 투여가 필요한지는 확인하지 못했습니다. 담당 의료진에게 확인해 주세요.","Rh 면역글로불린 주사의 비용과 건강보험 급여 적용 여부는 공공 출처에서 확인하지 못했습니다. 그래서 비용 항목을 비워 두었습니다.","주사를 맞는 부위, 소요 시간, 통증 정도, 부작용은 확인하지 못했습니다.","아기가 Rh 양성인지 미리 확인하는 절차(아빠 혈액형 확인 등)에 관한 국내 표준 절차는 확인하지 못했습니다.","항-D 항체가 이미 생긴 산모를 어떻게 추적 관찰하는지(항체 역가 검사 주기 등)는 확인하지 못했습니다. 담당 의료진에게 확인해 주세요.","산전 진찰에서 Rh 혈액형 검사를 몇 주에 하는지, 국가 지원 산전검사 항목에 포함되는지는 확인하지 못했습니다.","적혈구가 깨져 생기는 황달·빈혈·태아수종을 설명한 원문 문장은 확보하지 못했습니다. 관련 증상은 담당의에게 확인하세요."],"summaryLine":"혈액형에는 A형·B형·O형 같은 구분 외에 Rh 라는 구분이 하나 더 있습니다."},{"id":"nst","name":"태동검사(NST) 시작","category":"검사","confidence":"확인","weekFrom":32,"weekTo":40,"timingText":"임신 32주 이후(저위험군 기준)","detail":"태아 움직임에 따른 심박수 변화를 관찰합니다. 고위험 임신부는 32주 이전부터 주 1~2회 시행할 수 있습니다.","source":{"name":"서울아산병원 건강정보","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222","checkedAt":"2026-10-29"},"whatIsIt":"태동검사는 비수축검사(Nonstress Test, NST)라고도 부르며, 진통이 없는 상태에서 배 위에 센서를 붙여 아기가 잘 지내고 있는지 확인하는 검사입니다. 서울대학교병원은 자궁 수축이 없는 상태에서 태동에 대한 반응으로 태아 심박동수가 증가하는 것으로 태아 안녕을 평가하는 검사법이라고 설명합니다. 아기가 움직일 때 심장 박동이 잘 빨라지는지를 보는 것이 핵심입니다. 아이사랑 포털은 임신 32주 이후 태아성장 및 태아안녕평가 항목으로 초음파와 함께 태동검사를 제시합니다.","disease":"이 검사는 특정한 병 하나를 진단하는 검사가 아니라, 배 속 아기의 상태가 괜찮은지를 간접적으로 확인하는 검사입니다. 서울아산병원은 태아가 움직일 때 심박동이 증가하는 것을 이용해 태아 건강 상태를 간접적으로 평가하는 방법이라고 설명합니다. 당뇨병이나 고혈압이 있는 경우, 태아 성장이 더딘 경우, 양수가 적은 경우, 예정일이 지난 경우, 태동이 줄어든 경우 등에 시행하게 됩니다. 결과가 좋지 않으면 아기가 자궁 안에서 편안하지 않다는 신호일 수 있어 추가 검사로 확인합니다.","whyNeeded":"임신 후기에는 태반 기능이나 태아 상태를 눈으로 볼 수 없기 때문에, 아기의 심박동 반응을 통해 간접적으로 확인할 필요가 있습니다. 아이사랑 포털은 임신 32주 이후 항목으로 태아성장 및 태아안녕평가를 제시하고 있습니다. 서울아산병원은 임신 32주 이후부터 검사를 시행한다고 안내하며, 32주 이전에 하면 건강한 태아에게서도 무반응성으로 나오는 경우가 많다고 설명합니다.","howDone":"침대에 눕되 상체를 약간 높이고 옆으로 기울인 자세를 취합니다. 배에 태아 심박수를 보는 초음파 탐촉자와 자궁 수축을 보는 자궁수축변환기, 두 개의 센서를 붙이고, 손에는 누름 단추가 있는 장치를 들고 태동이 느껴질 때마다 누릅니다. 검사 소요 시간은 약 20분 정도이며, 바늘을 찌르거나 약을 쓰지 않고 배 위에 센서를 붙여 기록하는 방식입니다.","resultMeaning":"'반응성'은 정상이라는 뜻으로, 서울아산병원 기준으로는 산모가 태동을 느꼈을 때 태아 심음이 기준선보다 15bpm 이상 상승해 15초 이상 지속되는 것이 20분 동안 2회 이상 나타나는 경우입니다(서울대학교병원은 20분 이내 상승곡선이 2회 이상 그려지고 심박수가 정상범위 내 변동성을 보일 때로 설명합니다). '무반응성(비반응성)'은 40분 이상 충분한 태아심박수의 증가가 없는 경우를 말하며, 아기에게 문제가 있다는 확정이 아니라 아기가 자고 있었을 수도 있어 검사 시간을 늘려 다시 봅니다. 그래도 정상이 아니면 초음파 검사 등의 추가 검사를 시행해 더 정밀하게 태아 건강상태를 평가합니다.","cost":"국민행복카드(임신·출산 진료비 지원 이용권)의 사용 범위에 임신·출산 관련 진료비가 포함되어 있어 임신 중 진료비에 쓸 수 있습니다(임신 1회당 단태아 100만원, 다태아는 기본 140만원에 더해 태아 한 명당 100만원이 되도록 추가 신청할 수 있어 쌍둥이는 200만원). 다만 태동검사(비수축검사) 자체의 건강보험 급여 여부와 1회 비용은 확인하지 못했습니다.","quotes":[{"text":"자궁 수축이 없는 상태에서 태동에 대한 반응으로 태아 심박동수가 증가하는 것으로 태아 안녕을 평가하는 검사법","source":"서울대학교병원 의학정보 — 태동 검사(non-stress test)","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=TEST&medid=BA000112"},{"text":"태아가 움직일 때 심박동이 증가하는 것을 이용하여 태아 건강 상태를 간접적으로 평가하는 검사방법","source":"서울아산병원 건강정보 — 비수축검사(Nonstress test)","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222"},{"text":"진통이 없는 산모에서 전자태아심박동감시 장치를 부착하고 태아의 심박동을 확인하여 태아의 건강상태를 평가","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(임신후기)","url":"https://www.childcare.go.kr/?menuno=374"},{"text":"임신 32주 이후부터 검사를 시행합니다","source":"서울아산병원 건강정보 — 비수축검사(Nonstress test)","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222"},{"text":"복부에 태아심박수와 자궁 수축을 관찰할 수 있는 자궁수축변환기, 체외 초음파 탐촉자를 부착","source":"서울아산병원 건강정보 — 비수축검사(Nonstress test)","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222"},{"text":"누름 단추가 있는 장치를 손에 들고 태동이 있을 때마다 누르도록","source":"서울대학교병원 의학정보 — 태동 검사(non-stress test)","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=TEST&medid=BA000112"},{"text":"검사 소요 시간은 약 20분 정도","source":"서울아산병원 건강정보 — 비수축검사(Nonstress test)","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222"},{"text":"산모가 태동을 느꼈을때 태아 심음이 기준선보다 15bpm 이상으로 상승하여 15초 이상 지속하는 것이 20분 동안 2회 이상 나타나는 경우","source":"서울아산병원 건강정보 — 비수축검사(반응성 판정)","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222"},{"text":"40분이상 충분한 태아심박수의 증가가 없는 경우","source":"서울아산병원 건강정보 — 비수축검사(비반응성 판정)","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222"},{"text":"초음파 검사 등의 추가 검사를 시행하여 더욱 정밀하게 태아 건강상태를 평가해야 합니다.","source":"서울대학교병원 의학정보 — 태동 검사(non-stress test)","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=TEST&medid=BA000112"},{"text":"32주 이전에 시행할 경우 건강한 태아에게서도 결과가 무반응성으로 나오는 경우가 많습니다","source":"서울아산병원 건강정보 — 비수축검사(Nonstress test)","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=222"},{"text":"보통 20분이며, 정상이 아닌 경우 40분 이상 관찰","source":"서울대학교병원 의학정보 — 태동 검사(non-stress test)","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=TEST&medid=BA000112"},{"text":"32주 이후 : 태아성장 및 태아안녕평가","source":"보건복지부 임신육아종합포털 아이사랑 — 산전검사와 예방접종(임신중기)","url":"https://www.childcare.go.kr/?menuno=368"}],"unverified":["시작 주차가 출처마다 다를 수 있습니다. 서울아산병원 검사정보 페이지는 '임신 32주 이후부터'라고 안내합니다. '임신 28주 이후 산모에게 시행'이라는 설명도 있으나, 확인하지 못했습니다. 담당 의료진에게 확인해 주세요.","반응성 판정 기준의 표현이 두 병원에서 다릅니다. 서울아산병원은 '15bpm 이상 상승·15초 이상 지속·20분 동안 2회 이상'으로 구체적으로 밝히고, 서울대학교병원은 '20분 이내 상승곡선 2회 이상, 심박수가 정상범위 내 변동성'으로 설명합니다. 양쪽을 모두 적었습니다.","임신 32~40주 사이에 태동검사를 몇 번, 어떤 간격으로 받는지는 확인하지 못했습니다. 서울아산병원은 시기와 횟수가 산모와 태아의 상태에 따라 크게 다르다는 취지로 안내합니다.","검사 중 통증 여부를 명시한 문장은 찾지 못했습니다. 다만 배 위에 센서를 붙여 기록하는 방식이라는 점은 확인했습니다.","태동검사의 건강보험 급여 여부와 1회 비용은 확인하지 못했습니다."],"summaryLine":"태동검사는 비수축검사(Nonstress Test, NST)라고도 부르며, 진통이 없는 상태에서 배 위에 센서를 붙여 아기가 잘 지내고 있는지 확인하는 검사입니다."},{"id":"gbs_screening","name":"GBS(B군 연쇄상구균) 선별검사","category":"검사","confidence":"확인","weekFrom":35,"weekTo":38,"timingText":"임신 35~38주","detail":"분만 시 신생아 감염을 예방하기 위해 질·직장 배양검사를 시행합니다.","conflictNote":"국내 실무는 35~37주, ACOG 2020 개정은 36~38주로 혼재한다. 앱에서는 35~38주 범위로 안내한다.","source":{"name":"KoreaMed Synapse (서울대학교 의과대학 논문, ACOG 2020 개정 인용)","url":"https://synapse.koreamed.org/articles/1158764","checkedAt":"2026-10-29"},"whatIsIt":"GBS 는 B군 연쇄상구균, 우리말로는 B군 사슬알균이라고 부르는 세균입니다. 장과 생식기에 흔히 사는 균이라 건강한 성인에게는 거의 문제를 일으키지 않고, 임신부가 몸에 지니고 있어도 보통 아무런 증상이 없습니다. 문제는 분만 과정에서 이 균이 아기에게 옮겨질 때 생깁니다. 산전 GBS 선별검사는 분만 전에 엄마 몸에 이 균이 있는지 미리 확인해 두는 검사입니다.","disease":"아기가 분만 전후에 이 균에 감염되면 폐렴, 패혈증(균이 혈액 전체로 퍼지는 상태), 뇌막염 같은 위중한 감염이 생길 수 있습니다. 생후 7일 이내에 나타나는 것을 조기 발병형이라고 부르며, 진통이 시작되거나 양막이 터진 뒤 균이 질에서 양수로 올라와 태아의 폐로 들어가면서 생깁니다. 균을 지닌 산모에게서 태어난 아기는 그렇지 않은 아기보다 조기 발병 감염 위험이 25배 높지만, 실제로 발병하는 아기는 그 가운데 1~2% 입니다. 2005년 국내 연구에서 조기 발병 신생아 GBS 감염은 1,000명당 0.09명으로 보고되었습니다.","whyNeeded":"균이 있는 상태는 임신 기간 중에 변할 수 있고 분만 시점에 가까운 상태가 아기에게 생길 감염을 가장 잘 반영하기 때문에, 임신 초기가 아니라 임신 35~37주에 검사합니다. 다만 이 검사를 모든 임신부에게 할지에 대해서는 출처마다 입장이 다릅니다. 미국 학회들은 모든 임신부에게 검사를 권장하지만, 대한산부인과학회는 국내 역학 자료가 충분하지 않고 비용편익을 고려할 때 모든 산모에게 실시하는 선별검사는 권고하지 않는다고 밝히고 있습니다.","howDone":"채혈이 아니라, 면봉으로 질과 항문(직장)에서 분비물을 묻혀 오는 방식입니다. 채취한 검체를 배양해서 균이 자라는지 확인합니다. 분만 5주 안에 시행한 검사의 음성 예측률은 95~98%에 이르지만 그보다 이전에 한 결과는 신뢰도가 떨어지기 때문에, 검사 시기가 중요합니다.","resultMeaning":"양성이면 분만이 시작된 뒤 정맥으로 항생제를 맞습니다. 아기에게 균이 옮겨가는 것을 막으려면 늦어도 분만 4시간 전에는 적절한 항생제가 들어가야 합니다. 진통이 시작되기 전에, 양막이 터지지 않은 상태에서 제왕절개를 하는 경우에는 GBS 상태와 관계없이 분만 중 항생제 예방요법이 필요하지 않습니다.","cost":"대한산부인과학회 자료에 실린 고시에 따르면, 이 배양검사(너 301 기타 미생물배양검사)는 임신 제2분기 이상에서 조기 양막파수나 조기 진통 등 조산 위험 증상이 있는 경우 등에 건강보험 급여로 인정되고, 그 밖의 경우에는 환자가 전액 본인부담합니다. 다만 문서에 적힌 수가 금액은 2013년 1월 1일 기준이어서 현재 금액과는 다를 수 있습니다.","quotes":[{"text":"위장관과 생식기에 상재하는 흔한 세균","source":"대한진단검사의학회 - 산전 B군사슬알균(GBS) 선별검사","url":"https://www.labtestsonline.co.kr/tests/gbs.html"},{"text":"산모에서 아이로 분만 전 또는 분만 시 전달되어","source":"대한진단검사의학회 - 산전 B군사슬알균(GBS) 선별검사","url":"https://www.labtestsonline.co.kr/tests/gbs.html"},{"text":"질과 직장에서 면봉으로 검체를 채취","source":"대한진단검사의학회 - 산전 B군사슬알균(GBS) 선별검사","url":"https://www.labtestsonline.co.kr/tests/gbs.html"},{"text":"GBS colonization을 가진 산모에서 태어난 신생아가 그렇지 않은 산모에서 태어난 신생아보다 early-onset GBS disease를 가질 위험이 25배 증가합니다.","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"이러한 colonized 산모에서 태어난 신생아의 1-2%에서 early-onset GBS infection 발생합니다.","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"국내 보고는 제한적이긴 하지만 2.6-10%에서 colonization을 가지고 있는 것으로 보고 된 바 있으며","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"한국: 조발형 1000명당 0.09명, 지발형은 1000명당 0.7명(성도경 등 2005)","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"신생아 감염은 진통이 시작된 후나 양막 파열이 된 후 GBS가 질로부터 양수로 올라오고 이후 GBS는 태아의 폐로 들어가 균혈증을 일으킵니다.","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"Early-onset GBS와 vertical transmission을 막기 위해서는 최소 분만 4시간 전에 적절한 항생제를 투여해야 합니다.","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"분만시점에서 5주안에 시행된 GBS 배양검사의 음성 예측률은 95-98%에 이르지만","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"Colonization은 일시적이므로 임신 초기의 colonization으로는 신생아에게 생길 GBS disease를 예측할 수 없고","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"ACOG와 CDC에서는 모두 임산부에 있어서 검사를 할 것을 권장합니다.","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"비용편익을 볼 때 현재 시점에서 모든 산모에게 실시하는 선별검사는 권고하지 않습니다.","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"Cesarean delivery performed before onset of labor on a woman with intact amniotic membranes","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항 (분만 중 예방요법이 필요하지 않은 경우)","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"임신 제 2 분기 이상에서 조산의 위험 증상 (조기 양막파수, 조기 진통 등)이 있는 경우","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항 (급여 인정 기준 고시 인용)","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"그 외에는 환자가 전액본인부담토록 함","source":"대한산부인과학회 - Group B streptococcus 선별검사 권고사항 (급여 인정 기준 고시 인용)","url":"https://www.ksog.org/bbs/skin/notice_popup/download.php?code=notice&number=1167"},{"text":"임신 35~37주 때 질후방으로 배양 검사를 모든 임산부에게 선별 검사로 시행","source":"서울대학교병원 건강정보 - 신생아 패혈증","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000589"},{"text":"조기 발현 신생아 감염의 경우 1,000명당 1~4명 정도로 발생하는 것으로 보고되고 있으며","source":"서울대학교병원 건강정보 - 신생아 패혈증","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000589"},{"text":"분만 중에 항생제를 투여하면 신생아의 사슬알균 B군 집락 형성 및 사슬알균 B군에 의한 조기 발현 신생아 패혈증을 줄일 수 있다.","source":"서울대학교병원 건강정보 - 신생아 패혈증","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000589"},{"text":"세균 중에서는 특히 사슬알균 B군(group B streptococcus), 대장균(E.coli), 그리고 리스테리아균이 주된 원인균","source":"서울대학교병원 건강정보 - 신생아 패혈증","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=DIS&medid=AA000589"}],"unverified":["항목에 적힌 검사 시기는 35~38주이지만, 확인한 모든 공공·학회·병원 출처는 예외 없이 35~37주로 안내합니다. 38주까지로 넓혀 안내한 출처는 찾지 못했습니다.","출처 간 권고가 어긋납니다. 미국 ACOG·CDC 는 모든 임신부에게 선별검사를 권장하는 반면, 대한산부인과학회는 모든 산모에게 실시하는 선별검사를 권고하지 않는다고 명시합니다. 두 입장을 합치지 않고 그대로 두었습니다.","대한산부인과학회 권고사항 문서에 작성일이나 개정일이 표기되어 있지 않아, 이것이 현재도 유효한 최신 권고인지 확인하지 못했습니다. 문서 안에 인용된 고시는 2009년, 수가 금액은 2013년 기준입니다.","국내 산부인과에서 실제로 GBS 검사를 얼마나 시행하고 있는지, 학회 권고와 실제 진료 관행이 어떻게 다른지는 확인하지 못했습니다.","분만 중 사용하는 항생제의 구체적인 종류(페니실린, 앰피실린 등)와 용법을 명시한 공공·학회 출처 원문은 확인하지 못했습니다. 담당 의료진에게 확인해 주세요.","검체 채취가 아픈지, 검사에 시간이 얼마나 걸리는지, 결과가 며칠 만에 나오는지는 확인하지 못했습니다.","급여로 인정되는 검사코드의 현재(2026년) 수가 금액과 실제 본인부담 금액은 확인하지 못했습니다.","이 검사를 임신부 본인이 요청할 수 있는지, 어떤 조건에서 병원이 권하는지에 대한 국내 안내는 확인하지 못했습니다.","국내에서도 안내가 갈립니다. 대한산부인과학회는 모든 산모 대상 선별검사를 권고하지 않는다고 밝히지만, 상급종합병원 자료는 모든 임산부에게 시행한다고 안내합니다."],"summaryLine":"GBS 는 B군 연쇄상구균, 우리말로는 B군 사슬알균이라고 부르는 세균입니다."},{"id":"postpartum_care_reservation","name":"산후조리원 예약","category":"준비","confidence":"불명","weekFrom":null,"weekTo":null,"timingText":"공식 권장 시점 없음","detail":"정부·병원·협회 어디에서도 권장 예약 시점에 대한 공식 기준을 찾지 못했습니다. 검색으로 나오는 시점 정보는 모두 개인 블로그·후기성 콘텐츠라 근거로 채택하지 않았습니다. 확정 일정으로 표시하지 않습니다.","source":{"name":"확인 실패 — 공식 출처 없음","url":null,"checkedAt":"2026-10-29"},"whatIsIt":"산후조리원은 아기를 낳은 직후의 산모와 갓 태어난 아기에게 식사와 요양, 일상생활에 필요한 편의를 제공하는 시설입니다. 모자보건법은 이를 '산후조리업'으로 정의하고, 간호사 또는 간호조무사 등의 인력과 시설을 갖추고 책임보험에 가입해 지방자치단체에 신고하도록 정하고 있습니다. 공공산후조리원 제도도 법에 근거가 있습니다. 모자보건법 제15조의17은 시·도지사 또는 시장·군수·구청장이 관할 구역 내 산후조리원의 수요와 공급실태 등을 고려해 산후조리원을 설치·운영할 수 있다고 정합니다.","whyNeeded":"예약을 임신 몇 주에 해야 한다는 공식 기준은 확인하지 못했습니다. 모자보건법에는 산후조리원 예약이나 계약 시점을 정한 조항이 없습니다. 다만 법은 지방자치단체가 공공산후조리원을 설치할 때 관할 구역 내 산후조리원의 수요와 공급실태 등을 고려하도록 하고 있어, 지역에 따라 공급 사정이 다를 수 있다는 점만 법 문언에서 읽을 수 있습니다.","howDone":"각 산후조리원과 직접 계약하는 방식입니다. 모자보건법에 따라 산후조리원은 제공하는 서비스의 내용, 요금체계, 중도에 해약할 때의 환불 기준을 시설과 인터넷 홈페이지 등에 게시해야 하므로, 계약 전에 이 세 가지를 확인할 수 있습니다. 전국 산후조리원 목록은 보건복지부가 현황 자료로 공개하고 있고 임신육아종합포털에서도 조회할 수 있습니다.","cost":"이용요금은 산후조리원마다 다릅니다. 법은 각 산후조리원이 요금체계와 중도해약 환불기준을 시설과 인터넷 홈페이지에 게시하도록 정하고 있고, 보건복지부는 전국 산후조리원 현황 자료를 공개합니다. 지방자치단체의 산후조리비 지원은 실제로 존재합니다. 서울시는 서울형 산후조리경비로 첫째 100만 원, 둘째 120만 원, 셋째 이상 150만 원을 지원하며 출산일부터 180일 이내에 신청해야 합니다. 건강보험 적용 여부는 확인하지 못했습니다.","quotes":[{"text":"분만 직후의 임산부나 출생 직후의 영유아에게 급식ㆍ요양과 그 밖에 일상생활에 필요한 편의를 제공하는 업","source":"국가법령정보센터 – 모자보건법 제2조제10호","url":"https://www.law.go.kr/lsInfoP.do?lsiSeq=177658"},{"text":"감염이나 질병을 예방하기 위하여 소독 등의 환경관리 … 보건복지부령으로 정하는 조치를 할 것","source":"국가법령정보센터 – 모자보건법 제15조의4제2호(산후조리업자의 준수사항)","url":"https://www.law.go.kr/lsInfoP.do?lsiSeq=177658"},{"text":"감염 또는 질병이 의심되거나 발생한 경우 … 즉시 의료기관으로 이송하는 등 필요한 조치를 할 것","source":"국가법령정보센터 – 모자보건법 제15조의4제3호","url":"https://www.law.go.kr/lsInfoP.do?lsiSeq=177658"},{"text":"서비스의 내용과 요금체계 및 중도해약 시 환불기준을 그 산후조리원 및 인터넷홈페이지 등에 게시하여야 한다","source":"국가법령정보센터 – 모자보건법 제15조의16제1항(이용요금 등의 공개)","url":"https://www.law.go.kr/lsInfoP.do?lsiSeq=177658"},{"text":"시ㆍ도지사 또는 시장ㆍ군수ㆍ구청장은 관할 구역 내 산후조리원의 수요와 공급실태 등을 고려하여 임산부의 산후조리를 위한 산후조리원을 설치ㆍ운영할 수 있다","source":"국가법령정보센터 – 모자보건법 제15조의17제1항(지방자치단체의 산후조리원 설치)","url":"https://www.law.go.kr/lsInfoP.do?lsiSeq=177658"},{"text":"전국 산후조리원 현황을 붙임과 같이 안내드립니다","source":"보건복지부 – 전국 산후조리원 현황(2024.6월 기준)","url":"https://www.mohw.go.kr/board.es?mid=a10412000000&bid=0020&tag=&act=view&list_no=1483453"},{"text":"출산일로부터 180일(6개월) 이내","source":"서울특별시 – 서울형 산후조리경비 지원","url":"https://seoul-agi.seoul.go.kr/postpartum-care"}],"unverified":["예약 시점에 대한 공식 기준: 없습니다. 모자보건법 조문을 확인한 결과 산후조리원 예약·계약 시기를 정한 규정이 없었고, 보건복지부나 임신육아종합포털에서도 '임신 몇 주에 예약하라'는 공적 안내를 찾지 못했습니다.","전국 산후조리원 수와 공공산후조리원 수는 공식 안내에서 확인하지 못했습니다. '전국 456개소, 공공 20개소'라는 수치도 있으나 확인하지 못했습니다. 보건복지부에 확인해 주세요.","산후조리원 이용료에 건강보험이 적용되는지 여부를 국민건강보험공단·건강보험심사평가원 출처로 확인하지 못했습니다.","지방자치단체 산후조리비 지원은 서울시와 경기도 두 곳만 공적 출처로 확인했습니다. 전국 모든 지자체에 있는지, 금액과 요건이 어떻게 다른지는 확인하지 못했습니다. 경기도 지원 금액은 경기도 공식 뉴스포털 검색 결과에만 나와 원문 대조를 하지 못했습니다.","예약금과 계약 해지 시 환불 비율에 관한 구체적 기준(소비자분쟁해결기준 등)은 확인하지 못했습니다. 확인한 것은 '환불기준을 게시해야 한다'는 의무까지입니다.","보건복지부의 산후조리원 감염·안전 관리 매뉴얼과 감염 예방 교육지침이 있습니다. 다만 문서 내용은 확인하지 못했습니다. 보건복지부에 확인해 주세요.","공공산후조리원의 세부 설치기준 고시를 열람하려 했으나 보건복지부 해당 페이지가 404로 접속되지 않았습니다."],"summaryLine":"산후조리원은 아기를 낳은 직후의 산모와 갓 태어난 아기에게 식사와 요양, 일상생활에 필요한 편의를 제공하는 시설입니다."}];
