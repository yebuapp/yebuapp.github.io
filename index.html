e":"확인","source":{"name":"정부24 — 행복출산 원스톱 서비스","url":"https://www.gov.kr/portal/service/serviceInfo/174000000029","checkedAt":"2026-08-25"}}]},{"id":"health_insurance_dependent","name":"아기 건강보험 피부양자 등록","category":"행정","confidence":"확인","who":"both","stages":["postpartum"],"whatToDo":"국민건강보험공단에 피부양자 자격 취득 신고서를 내어 아기를 부모의 피부양자로 올립니다.","why":"90일을 넘기면 신고한 날부터만 자격이 인정되어, 그 전 기간은 건강보험이 적용되지 않습니다.","when":{"anchor":"birth","daysFromBirth":90,"text":"출생일로부터 90일 이내"},"isLegalDeadline":true,"penalty":"90일을 넘겨 신고하면 원칙적으로 신고서를 제출한 날부터만 자격이 인정됩니다. 천재지변·질병·사고처럼 본인 책임이 없는 사유를 공단이 인정할 때만 출생일로 소급됩니다.","where":"국민건강보험공단 지사·홈페이지·모바일앱, 팩스·우편, 전화 1577-1000","legalBasis":"국민건강보험법 시행규칙 제2조 제2항","evidence":{"quote":"직장가입자의 자격 취득일 또는 가입자의 자격 변동일부터 90일을 넘겨 피부양자 자격취득 신고를 한 경우: 공단에 별지 제1호서식의 피부양자 자격(취득·상실) 신고서를 제출한 날","url":"https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=29&SEQ_HISTORY=45345","checkedAt":"2026-08-25"},"source":{"name":"국민건강보험공단 법령 — 국민건강보험법 시행규칙 제2조","url":"https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=29&SEQ_HISTORY=45345","checkedAt":"2026-08-25"},"note":"90일이 지났더라도 천재지변이나 질병 등 본인 책임이 없는 부득이한 사유를 공단이 인정하면 소급 적용될 수 있습니다. 정확한 근거 조항은 확인하지 못했습니다. 공단에 확인해 주세요.","unverified":["지연 신고에 대한 과태료 규정이 있는지는 확인하지 못했습니다.","피부양자 등록 전에 아기가 진료를 받으면 진료비가 실제로 어떻게 처리되는지(전액 본인부담 후 나중에 환급받는지, 병원에서 자격 확인이 되는지)에 관한 공식 안내 문장은 찾지 못했습니다. 위 '왜 해야 하는지'는 자격취득일 규정에서 따라오는 결과를 설명한 것이며, 진료비 처리 방식 자체를 공식 출처로 확인한 것은 아닙니다.","부모가 지역가입자인 경우 아기를 세대원으로 올리는 절차와 시한은 공식 안내에서 확인하지 못했습니다. 공단에 확인해 주세요.","출생신고를 하면 건강보험 피부양자 등록이 자동으로 연계되는지 여부는 확인하지 못했습니다.","신고가 90일을 넘겼을 때 신생아에게 실제로 어떤 불이익이 있는지는 공단 안내에서 확인하지 못했습니다. 신생아의 자격취득일은 출생한 날로 따로 정해져 있습니다."],"steps":[{"id":"form","text":"피부양자 자격취득 신고서","where":"국민건강보험공단","confidence":"확인","source":{"name":"정부24 — 건강보험 피부양자 자격 취득 신고","url":"https://www.gov.kr/mw/AA020InfoCappView.do?CappBizCD=14600000233","checkedAt":"2026-08-25"}},{"id":"proof","text":"가족관계를 확인할 서류 한 가지","note":"기본증명서·가족관계증명서·혼인관계증명서·입양관계증명서 중 해당하는 것","confidence":"확인","source":{"name":"정부24 — 건강보험 피부양자 자격 취득 신고","url":"https://www.gov.kr/mw/AA020InfoCappView.do?CappBizCD=14600000233","checkedAt":"2026-08-25"}},{"id":"how","text":"어떻게 낼지 정하기","note":"인터넷·방문·팩스·우편 모두 됩니다","confidence":"확인","source":{"name":"정부24 — 건강보험 피부양자 자격 취득 신고","url":"https://www.gov.kr/mw/AA020InfoCappView.do?CappBizCD=14600000233","checkedAt":"2026-08-25"}}],"whatIsIt":"아기를 부모의 건강보험 피부양자로 올리는 절차입니다. 피부양자는 직장가입자에게 주로 생계를 의존하면서 따로 보험료를 내지 않고 건강보험 혜택을 받는 사람을 말하며, 직장가입자의 직계비속인 아기가 여기에 해당합니다. 신고 의무자는 직장가입자 본인이고, 공단 지사 방문·팩스·우편·고객센터·홈페이지·모바일앱·4대사회보험정보연계센터로 신고할 수 있습니다.","detailWhy":"아기의 피부양자 자격취득일은 '출생한 날'입니다. 신생아기에는 진료가 잦으니 등록을 미루지 않는 편이 좋습니다.","detailHow":"직장가입자가 피부양자 자격(취득·상실) 신고서와 함께, 아기 기준으로 발급한 가족관계증명서를 제출합니다(주민등록등본으로 관계가 확인되는 경우에는 제외됩니다). 원칙적인 신고기간은 자격취득일로부터 14일 이내입니다. 다만 직장가입자의 자격취득신고나 변동신고를 한 뒤 별도로 피부양자 자격취득 신고를 하는 경우에는 변동일로부터 90일 이내에 신고하면 피부양자가 될 수 있었던 날로 소급 인정됩니다. 홈페이지나 모바일앱에서 선택할 수 없는 가족 관계는 가까운 지사를 방문하거나 관할 지사로 팩스를 보내야 합니다.","conditions":"직장가입자에 의하여 주로 생계를 유지하는 직계비속이 대상이므로 아기가 여기에 해당합니다. 다만 공식 안내는 부양요건(국민건강보험법 시행규칙 별표1)과 소득 및 재산요건(별표1의2)을 모두 충족해야 한다고 밝히고 있습니다. 제출한 서류로 피부양자 대상임을 확인할 수 없으면 신고가 반려될 수 있고, 이 경우 가입자가 반려 사유를 확인해 다시 신고해야 합니다.","quotes":[{"text":"신생아의 경우에는 출생한 날","source":"국민건강보험공단 '피부양자 취득안내' 피부양자 자격취득일자","url":"https://www.nhis.or.kr/nhis/policy/wbhada07300m01.do"},{"text":"신고기간 : 자격취득일로부터 14일 이내","source":"국민건강보험공단 '피부양자 취득안내'","url":"https://www.nhis.or.kr/nhis/policy/wbhada07300m01.do"},{"text":"변동일로 부터 90일 이내 신고시 피부양자로 될 수 있었던 날로 소급인정","source":"국민건강보험공단 '피부양자 취득안내' 신고기간","url":"https://www.nhis.or.kr/nhis/policy/wbhada07300m01.do"},{"text":"자격변동일부터 90일을 초과하여 피부양자 자격취득신고를 한 경우에는 ... 피부양자자격취득신고서를 제출한 날","source":"국민건강보험공단 '피부양자 취득안내' 피부양자 자격취득일자","url":"https://www.nhis.or.kr/nhis/policy/wbhada07300m01.do"},{"text":"공단이 정하는 본인의 책임이 없는 부득이한 사유로 90일을 초과하여 피부양자 자격취득신고를 한 경우에는 직장가입자의 자격취득일 또는 가입자의 자격변동일","source":"국민건강보험공단 '피부양자 취득안내'","url":"https://www.nhis.or.kr/nhis/policy/wbhada07300m01.do"},{"text":"피부양자 자격(취득·상실) 신고서 1부 / 피부양자가 되려는 자 기준으로 발급한 가족관계증명서","source":"국민건강보험공단 '피부양자 자격취득 및 상실 신고' 구비서류","url":"https://www.nhis.or.kr/nhis/minwon/minwonServiceBoard.do?mode=view&articleNo=10945798"},{"text":"제출한 서류로 피부양자 취득 대상임을 확인할 수 없거나 ... 피부양자 자격 취득 신고가 반려될 수 있으며","source":"국민건강보험공단 '피부양자 자격취득 및 상실 신고' 유의사항","url":"https://www.nhis.or.kr/nhis/minwon/minwonServiceBoard.do?mode=view&articleNo=10945798"},{"text":"직장가입자의 자격 취득일 또는 가입자의 자격 변동일부터 90일 이내에 피부양자의 자격취득 신고를 한 경우: 직장가입자의 자격 취득일 또는 해당 가입자의 자격 변동일","source":"국민건강보험공단(nhis.or.kr) - 국민건강보험법 시행규칙 제2조","url":"https://www.nhis.or.kr/lm/lmxsrv/law/lawFullContent.do?SEQ=29&SEQ_HISTORY=25609"},{"text":"직장가입자 또는 피부양자의 자격변동일(사유발생일)로부터 90일을 초과하여 신고한 경우: 신고일","source":"국민건강보험공단(nhis.or.kr) - 피부양자 자격취득 안내","url":"https://www.nhis.or.kr/nhis/minwon/wbhapa01000m01.do?mode=view&articleNo=10946887"}]},{"id":"reduced_hours_pregnancy","name":"임신기 근로시간 단축 신청","category":"근로","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"회사에 하루 2시간 근로시간 단축을 신청합니다. 단축 시작 3일 전까지 신청서와 의사 진단서를 냅니다.","why":"임금은 깎이지 않습니다. 회사가 거부하면 500만원 이하의 과태료 대상입니다.","when":{"anchor":"week","windows":[{"from":0,"to":12,"label":"임신 12주 이내"},{"from":32,"to":45,"label":"임신 32주 이후"}],"text":"임신 12주 이내 또는 32주 이후 (유산·조산 위험이 있으면 임신 전 기간)"},"isLegalDeadline":true,"penalty":"사용자가 정당한 신청을 허용하지 않으면 500만원 이하의 과태료가 부과됩니다. 단축을 이유로 임금을 깎는 것도 금지됩니다.","where":"재직 중인 회사","legalBasis":"근로기준법 제74조 제7항·제8항, 제116조 제2항 제2호","evidence":{"quote":"사용자는 임신 후 12주 이내 또는 32주 이후에 있는 여성 근로자(고용노동부령으로 정하는 유산, 조산 등 위험이 있는 여성 근로자의 경우 임신 전 기간)가 1일 2시간의 근로시간 단축을 신청하는 경우 이를 허용하여야 한다.","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0","checkedAt":"2026-08-25"},"source":{"name":"국가법령정보센터 — 근로기준법 제74조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0","checkedAt":"2026-08-25"},"note":"2025년 2월 23일 개정으로 후기 구간이 '36주 이후'에서 '32주 이후'로 4주 앞당겨졌습니다. 하루 근로시간이 8시간 미만이면 6시간이 되도록 단축합니다.","unverified":["법령 조문의 원문은 직접 확인하지 못했지만, 여러 공식 경로에서 같은 내용을 확인했습니다.","신청을 거부당했을 때 진정을 접수하는 구체적 절차(온라인 접수 화면, 처리 기간, 제출 서류)는 공식 안내에서 확인하지 못했습니다. 해당 기관에 문의해 주세요.","하루 소정근로시간이 이미 6시간 이하인 근로자에게 단축이 어떻게 적용되는지는 조문에 정해진 내용을 찾지 못했습니다.","단축한 2시간분 임금을 회사가 지급하지 않은 경우 임금체불 규정으로도 다툴 수 있는지는 확인하지 못했습니다.","별표 3의 질환 전체 목록(질병코드 포함)을 이 답변에 모두 옮기지는 않았습니다. 본문에 적은 것은 목록 중 일부 예시입니다.","유산의 기준 주수는 자료마다 다릅니다. 국내 상급종합병원 자료는 임신 20주 이전, 세계보건기구 기준은 22주 이전으로 적어 여기서는 주수를 쓰지 않았습니다."],"whatIsIt":"임신기 근로시간 단축은 임신한 근로자가 하루 근무시간을 2시간 줄여서 일할 수 있게 해 주는 제도입니다. 근로기준법 제74조 제7항에 정해져 있어서 회사가 마음대로 거절할 수 없고, 요건에 맞으면 반드시 허용해야 하는 권리입니다. 시간을 줄여도 임금은 깎이지 않습니다(같은 조 제8항).","disease":"임신 중에 유산(태아가 생존할 수 있는 시기 이전에 임신이 끝나는 것)이나 조산(예정일보다 훨씬 이른 출산) 위험이 있는 질환을 진단받은 경우에는 주수와 상관없이 임신 전 기간 동안 이 단축을 쓸 수 있습니다. 해당 질환은 근로기준법 시행규칙 별표 3에 목록으로 정해져 있는데, 절박유산(유산이 진행될 위험이 있는 상태), 전자간·자간(임신중독증 계열로 혈압이 크게 올라 산모와 태아가 모두 위험해지는 병), 임신 중 당뇨병, 다태 임신 등이 들어 있습니다. 이런 상태에서 장시간 서 있거나 오래 일하면 유산·조산으로 이어질 수 있어 근무시간 자체를 줄이도록 한 것입니다.","detailWhy":"임신 초기와 후기는 유산·조산 위험이 상대적으로 큰 시기여서 법이 이 두 구간을 콕 집어 보호하고 있습니다. 임금이 깎이지 않기 때문에 소득 손실 없이 몸을 보호할 수 있는 몇 안 되는 제도입니다. 회사의 배려가 아니라 법에 적힌 권리라서 요건만 맞으면 요구할 수 있습니다.","detailHow":"근로시간 단축을 시작하려는 날의 3일 전까지 신청해야 합니다. 임신기간, 단축 시작·종료 예정일, 근무 시작·종료 시각을 적은 문서(전자문서도 됩니다)에 의사의 진단서를 첨부해 회사에 냅니다. 같은 임신에 대해 이미 진단서를 내고 다시 신청하는 경우에는 진단서를 또 낼 필요가 없습니다. 하루 2시간을 앞뒤 어느 쪽에서 줄일지는 신청서에 근무 시작·종료 시각으로 적어 협의합니다.","conditions":"임신 후 12주 이내이거나 32주 이후인 근로자가 대상입니다. 2025년 2월 23일 시행된 개정으로 종전 \"36주 이후\"가 \"32주 이후\"로 앞당겨졌고(2024년 10월 22일 공포, 부칙에 따라 공포 후 4개월이 지난 날 시행), 동시에 유산·조산 등 위험 질환을 진단받은 근로자는 임신 전 기간에 쓸 수 있게 되었습니다. 하루 근로시간이 8시간 미만인 근로자에 대해서는 조문이 \"1일 근로시간이 6시간이 되도록\" 단축을 허용할 수 있다고 정하고 있습니다. 즉 하루 7시간 일하는 사람은 1시간이 줄어 6시간이 되는 식이고, 이미 6시간 이하로 일하는 경우에 대해서는 조문에 정해진 바가 없습니다.","ifRefused":"회사가 요건을 갖춘 신청을 허용하지 않으면 근로기준법 제116조 제2항 제2호에 따라 500만원 이하의 과태료 대상입니다(제74조 제7항 위반). 과태료는 고용노동부장관이 부과·징수합니다. 근로자는 근로기준법 제104조에 따라 위반 사실을 고용노동부장관이나 근로감독관에게 통보할 수 있고, 통보를 이유로 해고나 불리한 처우를 하는 것은 금지됩니다. 실무적으로는 사업장을 관할하는 지방고용노동관서에 신고하며, 고용노동부 대표전화는 국번 없이 1350입니다.","cost":"근로자가 부담하는 비용은 없습니다. 근로기준법 제74조 제8항이 근로시간 단축을 이유로 임금을 깎지 못하도록 정하고 있어 하루 2시간을 줄여도 임금은 그대로 받습니다. 다만 진단서 발급 비용은 의료기관에서 발생할 수 있습니다.","quotes":[{"text":"사용자는 임신 후 12주 이내 또는 32주 이후에 있는 여성 근로자","source":"국가법령정보센터 「근로기준법」 제74조제7항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"1일 2시간의 근로시간 단축을 신청하는 경우 이를 허용하여야 한다","source":"국가법령정보센터 「근로기준법」 제74조제7항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"1일 근로시간이 8시간 미만인 근로자에 대하여는 1일 근로시간이 6시간이 되도록 근로시간 단축을 허용할 수 있다","source":"국가법령정보센터 「근로기준법」 제74조제7항 단서","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"사용자는 제7항에 따른 근로시간 단축을 이유로 해당 근로자의 임금을 삭감하여서는 아니 된다","source":"국가법령정보센터 「근로기준법」 제74조제8항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"고용노동부령으로 정하는 유산, 조산 등 위험이 있는 여성 근로자의 경우 임신 전 기간","source":"국가법령정보센터 「근로기준법」 제74조제7항 괄호","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"임신 기간 중에 별표 3에 따른 질환을 진단받은 여성 근로자를 말한다","source":"국가법령정보센터 「근로기준법 시행규칙」 제12조의3","url":"https://www.law.go.kr/법령/근로기준법시행규칙"},{"text":"근로시간 단축 개시 예정일의 3일 전까지 임신기간, 근로시간 단축 개시 예정일 및 종료 예정일","source":"국가법령정보센터 「근로기준법 시행령」 제43조의2","url":"https://www.law.go.kr/법령/근로기준법시행령"},{"text":"제74조제1항 및 제7항의 개정규정: 공포 후 4개월이 경과한 날","source":"국가법령정보센터 「근로기준법」 부칙(법률 제20520호, 2024. 10. 22.) 제1조","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"다음 각 호의 어느 하나에 해당하는 자에게는 500만원 이하의 과태료를 부과한다","source":"국가법령정보센터 「근로기준법」 제116조제2항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"제74조제7항ㆍ제9항, 제76조의3제2항ㆍ제4항ㆍ제5항ㆍ제7항, 제91조","source":"국가법령정보센터 「근로기준법」 제116조제2항제2호","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"이 법 또는 이 법에 따른 대통령령을 위반한 사실이 있으면 근로자는 그 사실을 고용노동부장관이나 근로감독관에게 통보할 수 있다","source":"국가법령정보센터 「근로기준법」 제104조제1항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"대표전화번호: 국번없이 1350","source":"고용노동부 서울지방고용노동청 누리집","url":"https://www.moel.go.kr/local/seoul/info/dataroom/list.do"}],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"id":"prenatal_checkup_hours","name":"태아검진 시간 청구","category":"근로","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"정기검진 때마다 검진에 필요한 시간을 회사에 청구해 근무시간 중에 다녀옵니다.","why":"회사는 허용해야 하고, 이 시간을 이유로 임금을 깎을 수 없습니다.","when":{"anchor":"none","text":"임신 기간 중 정기건강진단을 받을 때마다"},"isLegalDeadline":false,"penalty":null,"where":"재직 중인 회사","legalBasis":"근로기준법 제74조의2","evidence":{"quote":"사용자는 임신한 여성근로자가 「모자보건법」 제10조에 따른 임산부 정기건강진단을 받는데 필요한 시간을 청구하는 경우 이를 허용하여 주어야 한다.","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0%EC%9D%982","checkedAt":"2026-08-25"},"source":{"name":"국가법령정보센터 — 근로기준법 제74조의2","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0%EC%9D%982","checkedAt":"2026-08-25"},"note":"이 조항에는 위반 시 벌칙 규정이 없습니다. 회사가 거부해도 과태료가 부과되지는 않습니다 — 알고 요청하는 것이 좋습니다.","unverified":["'필요한 시간'의 산정 기준(왕복시간 포함 여부, 상한)은 법에 없습니다.","상시 5명 이상 사업장에 적용된다는 점은 요약 자료에서만 확인했습니다.","검진 1회에 몇 시간을 청구할 수 있는지(반차·종일 등)를 정한 규정은 찾지 못했습니다.","신청 시점이나 제출 서류(진료 확인서 등)를 정한 시행령·시행규칙 조문은 확인하지 못했습니다.","임금을 깎았을 때 임금체불 규정으로 구제받을 수 있는지에 대한 공공 출처의 판단은 확인하지 못했습니다.","상시 4명 이하 사업장에서 태아검진 시간을 실제로 어떻게 다루는지(회사가 자율로 주는지)는 확인하지 못했습니다."],"whatIsIt":"태아검진 시간 청구는 임신한 근로자가 정기 산전검사를 받으러 가는 데 필요한 시간을 회사에 요구할 수 있는 권리입니다. 근로기준법 제74조의2에 정해져 있고, 회사는 이를 허용해 주어야 합니다. 검진을 받느라 자리를 비운 시간을 이유로 임금을 깎는 것도 금지되어 있습니다.","detailWhy":"임산부 정기건강진단은 모자보건법 제10조에 따라 국가와 지방자치단체가 실시하도록 정한 검진이고, 검진 주기도 법령(모자보건법 시행규칙 별표 1)에 구간별로 정해져 있습니다. 검진 주기가 촘촘해지는 임신 후기에는 근무시간 중에 병원에 가야 하는 경우가 많아, 법이 그 시간을 청구할 수 있도록 해 둔 것입니다.","detailHow":"근로자가 검진에 필요한 시간을 청구하면 회사가 허용하는 구조입니다. 신청 시점이나 제출 서류를 정한 규정은 근로기준법과 시행령에서 확인되지 않았으므로, 실제로는 회사의 취업규칙이나 관행에 따라 미리 알리고 쓰게 됩니다. 검진 시간에 대해 임금을 깎는 것은 법으로 금지되어 있습니다.","conditions":"이 권리는 상시 5명 이상 근로자를 사용하는 사업장에 적용됩니다. 근로기준법 시행령 별표 1은 상시 4명 이하 사업장에 적용되는 조문 목록에 제74조는 넣었으나 제74조의2(태아검진 시간)는 넣지 않았습니다. 검진 횟수와 관련해, 모자보건법 시행규칙 별표 1의 임산부 정기건강진단 실시기준은 임신 28주까지는 4주마다 1회, 임신 29주에서 36주까지는 2주마다 1회, 임신 37주 이후에는 1주마다 1회로 정하고 있습니다. 장애인인 경우, 만 35세 이상인 경우, 다태아(쌍둥이 이상)를 임신한 경우, 의사가 고위험 임신으로 판단한 경우에는 이 횟수를 넘겨 검진을 받을 수 있습니다. 다만 이 기준은 국가·지방자치단체의 건강진단 실시기준이고, 근로기준법 제74조의2는 횟수를 따로 정하지 않고 \"필요한 시간\"이라고만 적고 있습니다.","ifRefused":"회사가 태아검진 시간을 주지 않거나 그 시간만큼 임금을 깎아도, 근로기준법에는 이에 대한 벌칙이나 과태료가 없습니다. 벌칙 조문인 제109조·제110조·제114조와 과태료 조문인 제116조를 모두 확인했지만 제74조의2는 어디에도 들어 있지 않습니다. 예를 들어 제110조는 제74조 제1항부터 제5항까지의 위반만 처벌 대상으로 열거하고 있습니다. 따라서 처벌로 강제할 수는 없고, 근로기준법 제104조에 따라 위반 사실을 고용노동부장관이나 근로감독관에게 통보해 행정 지도를 요청하는 방법이 남습니다.","cost":"근로자가 부담하는 비용은 없습니다. 근로기준법 제74조의2 제2항이 건강진단 시간을 이유로 임금을 깎지 못하도록 정하고 있습니다.","quotes":[{"text":"사용자는 임신한 여성근로자가 「모자보건법」 제10조에 따른 임산부 정기건강진단을 받는데 필요한 시간을 청구하는 경우 이를 허용하여 주어야 한다","source":"국가법령정보센터 「근로기준법」 제74조의2제1항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"사용자는 제1항에 따른 건강진단 시간을 이유로 그 근로자의 임금을 삭감하여서는 아니 된다","source":"국가법령정보센터 「근로기준법」 제74조의2제2항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"가. 임신 28주까지: 4주마다 1회 나. 임신 29주에서 36주까지: 2주마다 1회 다. 임신 37주 이후: 1주마다 1회","source":"국가법령정보센터 「모자보건법 시행규칙」 별표 1","url":"https://www.law.go.kr/법령/모자보건법시행규칙"},{"text":"장애인인 경우, 만 35세 이상인 경우, 다태아를 임신한 경우 또는 의사가 고위험 임신으로 판단한 경우","source":"국가법령정보센터 「모자보건법 시행규칙」 별표 1","url":"https://www.law.go.kr/법령/모자보건법시행규칙"},{"text":"제74조제1항부터 제5항까지, 제75조, 제78조부터 제80조까지","source":"국가법령정보센터 「근로기준법」 제110조제1호(제74조의2는 열거되어 있지 않음)","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"제14조, 제39조, 제41조, 제42조, 제48조, 제66조, 제74조제7항ㆍ제9항","source":"국가법령정보센터 「근로기준법」 제116조제2항제2호(제74조의2는 열거되어 있지 않음)","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"국가와 지방자치단체는 임산부ㆍ영유아ㆍ미숙아등에 대하여 대통령령으로 정하는 바에 따라 정기적으로 건강진단ㆍ예방접종을 실시하거나","source":"국가법령정보센터 「모자보건법」 제10조제1항","url":"https://www.law.go.kr/법령/모자보건법"}],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"id":"maternity_leave","name":"출산전후휴가 배정","category":"근로","confidence":"확인","who":"mother","stages":["pregnant","postpartum"],"whatToDo":"총 90일(쌍둥이 이상은 120일)의 휴가를 언제부터 쓸지 회사와 정합니다. 출산 후에 45일(쌍둥이 이상 60일) 이상 남도록 배정해야 합니다.","why":"출산 후 구간이 모자라면 법 위반입니다. 최초 60일(쌍둥이 이상 75일)은 유급입니다.","when":{"anchor":"none","text":"출산 전과 출산 후를 통하여 90일(다태아 120일)"},"isLegalDeadline":true,"penalty":"사용자가 휴가를 주지 않거나 출산 후 최소 일수·유급 구간을 지키지 않으면 2년 이하의 징역 또는 2천만원 이하의 벌금 대상입니다.","where":"재직 중인 회사","legalBasis":"근로기준법 제74조 제1항·제4항, 제110조 제1호","evidence":{"quote":"사용자는 임신 중의 여성에게 출산 전과 출산 후를 통하여 90일(한 번에 둘 이상 자녀를 임신한 경우에는 120일)의 출산전후휴가를 주어야 한다. 이 경우 휴가 기간의 배정은 출산 후에 45일(한 번에 둘 이상 자녀를 임신한 경우에는 60일) 이상이 되어야 한다.","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0","checkedAt":"2026-08-25"},"source":{"name":"국가법령정보센터 — 근로기준법 제74조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0","checkedAt":"2026-08-25"},"note":null,"unverified":["유산·사산 경험 등에 따른 분할 사용 조항(제74조 제2항·제3항)은 원문을 직접 인용하지 못했습니다.","우선지원 대상기업의 구체적 기준(업종별 상시 근로자 수)은 공식 안내에서 확인하지 못했습니다. 회사가 어디에 해당하는지에 따라 고용보험이 지급하는 기간이 달라집니다. 해당 기관에 확인해 주세요.","출산전후휴가 급여 신청 시 제출해야 하는 서류 목록과 접수 창구는 확인하지 못했습니다.","2026년 고시의 유효기간은 2026년 12월 31일까지이므로 2027년 상한액은 다시 고시됩니다. 그 금액은 확인할 수 없습니다."],"whatIsIt":"출산전후휴가는 출산을 앞둔 근로자에게 회사가 반드시 주어야 하는 휴가입니다. 근로기준법 제74조 제1항에 따라 출산 전과 출산 후를 합쳐 90일이 원칙이고, 미숙아를 낳으면 100일, 쌍둥이 이상을 임신하면 120일입니다. 휴가 기간 중 일정 부분은 회사가 임금을 지급하고, 요건을 갖추면 고용보험에서 출산전후휴가 급여가 나옵니다.","detailWhy":"출산 직후의 회복 기간을 법으로 보장해 산모의 건강을 지키려는 제도입니다. 그래서 휴가를 앞쪽에 몰아 쓰더라도 출산 후에 반드시 일정 일수가 남도록 법이 배정 방식을 정해 두었습니다. 회사가 거부하면 형사처벌 대상일 만큼 강하게 보호되는 권리입니다.","detailHow":"휴가 기간의 배정은 출산 후에 45일(쌍둥이 이상은 60일) 이상이 되어야 합니다. 임금은 휴가 중 최초 60일(쌍둥이 이상은 75일)이 유급이고, 고용보험에서 출산전후휴가 급여가 지급되면 회사는 그 금액만큼 지급 책임을 면합니다. 우선지원 대상기업이 아닌 회사에 다니면 고용보험은 60일(쌍둥이 이상 75일)을 넘는 일수만 지급하며, 그 한도는 30일(미숙아 40일, 쌍둥이 이상 45일)입니다. 급여는 휴가를 시작한 날 이후 1개월부터 휴가가 끝난 날 이후 12개월 이내에 신청해야 합니다.","conditions":"출산전후휴가 자체는 임신 중인 모든 여성 근로자에게 주어지는 휴가입니다. 고용보험 급여를 받으려면 휴가가 끝난 날 이전에 피보험 단위기간(고용보험에 가입해 일한 기간)이 합쳐서 180일 이상이어야 합니다. 미숙아 100일이 적용되는 범위는 임신 37주 미만으로 태어났거나 태어날 때 몸무게가 2,500그램 미만인 아기로서 출생 후 24시간 이내에 신생아중환자실에 입원한 경우이고, 이 경우 휴가 종료 예정일 7일 전까지 미숙아 출산 사실을 증명하는 서류를 회사에 내야 합니다. 분할 사용은 유산·사산의 경험이 있는 경우, 휴가를 청구할 당시 만 40세 이상인 경우, 유산·사산 위험이 있다는 의료기관 진단서를 낸 경우에 가능하며 출산 후 휴가는 45일(쌍둥이 이상 60일) 이상 연속이어야 합니다.","ifRefused":"회사가 출산전후휴가를 주지 않으면 근로기준법 제110조 제1호에 따라 2년 이하의 징역 또는 2천만원 이하의 벌금 대상입니다. 이 벌칙은 제74조 제1항부터 제5항까지의 위반에 적용되므로, 휴가 미부여뿐 아니라 분할 사용 거부, 유산·사산휴가 미부여, 최초 60일 유급 미지급, 임신 중 시간외근로도 포함됩니다. 근로자는 근로기준법 제104조에 따라 고용노동부장관이나 근로감독관에게 통보할 수 있고, 통보를 이유로 한 해고나 불리한 처우는 금지됩니다. 관할 지방고용노동관서에 신고하며 고용노동부 대표전화는 국번 없이 1350입니다.","cost":"근로자가 내는 비용은 없습니다. 최초 60일(쌍둥이 이상 75일)은 유급이고, 나머지 기간은 고용보험 출산전후휴가 급여로 통상임금에 해당하는 금액이 지급됩니다. 2026년 상한액 고시에 따르면 90일 기준 총 660만원(월 220만원 수준), 미숙아 100일은 7,333,330원, 쌍둥이 이상 120일은 880만원이 상한입니다. 하한액은 휴가 시작일 당시 최저임금을 기준으로 계산한 금액입니다.","quotes":[{"text":"출산 전과 출산 후를 통하여 90일(미숙아를 출산한 경우에는 100일, 한 번에 둘 이상 자녀를 임신한 경우에는 120일)의 출산전후휴가를 주어야 한다","source":"국가법령정보센터 「근로기준법」 제74조제1항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"휴가 기간의 배정은 출산 후에 45일(한 번에 둘 이상 자녀를 임신한 경우에는 60일) 이상이 되어야 하고","source":"국가법령정보센터 「근로기준법」 제74조제1항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"출산 전 어느 때 라도 휴가를 나누어 사용할 수 있도록 하여야 한다","source":"국가법령정보센터 「근로기준법」 제74조제2항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"임신한 근로자에게 유산ㆍ사산의 경험이 있는 경우","source":"국가법령정보센터 「근로기준법 시행령」 제43조제1항제1호","url":"https://www.law.go.kr/법령/근로기준법시행령"},{"text":"출산전후휴가를 청구할 당시 연령이 만 40세 이상인 경우","source":"국가법령정보센터 「근로기준법 시행령」 제43조제1항제2호","url":"https://www.law.go.kr/법령/근로기준법시행령"},{"text":"최초 60일(한 번에 둘 이상 자녀를 임신한 경우에는 75일)은 유급으로 한다","source":"국가법령정보센터 「근로기준법」 제74조제4항","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"우선지원 대상기업이 아닌 경우에는 휴가 기간 중 60일(한 번에 둘 이상의 자녀를 임신한 경우에는 75일)을 초과한 일수","source":"국가법령정보센터 「고용보험법」 제76조제1항제1호","url":"https://www.law.go.kr/법령/고용보험법"},{"text":"휴가가 끝난 날 이전에 제41조에 따른 피보험 단위기간이 합산하여 180일 이상일 것","source":"국가법령정보센터 「고용보험법」 제75조제1호","url":"https://www.law.go.kr/법령/고용보험법"},{"text":"출산전후휴가기간 또는 유산ㆍ사산휴가기간 90일에 대한 통상임금에 상당하는 금액이 660만원을 초과하는 경우: 660만원","source":"국가법령정보센터 「출산전후휴가 급여등 상한액 고시」(고용노동부고시 제2025-124호, 2026년 1월 1일 시행)","url":"https://www.law.go.kr/행정규칙/출산전후휴가급여등상한액고시"},{"text":"미숙아를 출산한 경우의 출산전후휴가기간 100일에 대한 통상임금에 상당하는 금액이 7,333,330원을 초과하는 경우","source":"국가법령정보센터 「출산전후휴가 급여등 상한액 고시」","url":"https://www.law.go.kr/행정규칙/출산전후휴가급여등상한액고시"},{"text":"2026년 급여별 상한액을 월 기준 220만원으로 인상하여 고시하려는 것임","source":"국가법령정보센터 「출산전후휴가 급여등 상한액 고시」 개정 이유","url":"https://www.law.go.kr/행정규칙/출산전후휴가급여등상한액고시"},{"text":"임신 37주 미만의 출생아 또는 출생 시 체중이 2천500그램 미만인 영유아","source":"국가법령정보센터 「근로기준법 시행규칙」 제12조의2제1항","url":"https://www.law.go.kr/법령/근로기준법시행규칙"},{"text":"다음 각 호의 어느 하나에 해당하는 자는 2년 이하의 징역 또는 2천만원 이하의 벌금에 처한다","source":"국가법령정보센터 「근로기준법」 제110조","url":"https://www.law.go.kr/법령/근로기준법"},{"text":"제74조제1항부터 제5항까지, 제75조, 제78조부터 제80조까지","source":"국가법령정보센터 「근로기준법」 제110조제1호","url":"https://www.law.go.kr/법령/근로기준법"}],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"id":"mom_easy_pregnancy","name":"맘편한 임신 한 번에 신청","category":"행정","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"정부24나 주민센터·보건소에서 임신 지원 서비스를 한 번에 신청합니다.","why":"엽산제·철분제·표준모자보건수첩·진료비 지원 등이 묶여 있어 따로 찾아다니지 않아도 됩니다.","when":{"anchor":"pregnancyStart","text":"임신 확인 이후부터 분만 예정일까지"},"isLegalDeadline":false,"penalty":null,"where":"정부24(gov.kr) 또는 주민등록 주소지 관할 읍·면·동 주민센터·보건소","applyUrl":"https://www.gov.kr/portal/onestopSvc/fertility","legalBasis":null,"evidence":{"quote":"각종 임신 지원 서비스를 한 번에 안내하고 통합신청하는 서비스","url":"https://www.gov.kr/portal/service/serviceInfo/174100000015","checkedAt":"2026-08-25"},"source":{"name":"정부24 — 임신 관련 서비스 통합처리 신청(맘편한임신)","url":"https://www.gov.kr/portal/service/serviceInfo/174100000015","checkedAt":"2026-08-25"},"note":"묶인 항목마다 신청 가능 시기가 다릅니다. 산모·신생아 건강관리 지원은 출산예정일 40일 전부터 출산 후 30일까지입니다.","unverified":["대리 신청(위임장·가족관계증명서) 규정의 근거 조문은 확인하지 못했습니다."],"steps":[{"id":"auth","text":"간편인증이나 공동인증서 준비","note":"온라인으로 신청할 때","confidence":"확인","source":{"name":"정부24 — 맘편한 임신 원스톱 서비스","url":"https://www.gov.kr/portal/service/serviceInfo/174100000015","checkedAt":"2026-08-25"}},{"id":"id","text":"신분증","note":"주민센터나 보건소에 방문할 때","confidence":"확인","source":{"name":"정부24 — 맘편한 임신 원스톱 서비스","url":"https://www.gov.kr/portal/service/serviceInfo/174100000015","checkedAt":"2026-08-25"}},{"id":"where","text":"어디로 갈지 확인","note":"임산부 주민등록 주소지의 읍·면·동 주민센터 또는 보건소","confidence":"확인","source":{"name":"정부24 — 맘편한 임신 원스톱 서비스","url":"https://www.gov.kr/portal/service/serviceInfo/174100000015","checkedAt":"2026-08-25"}}]},{"id":"newborn_screening","name":"신생아 선천성대사이상 검사","category":"검사","confidence":"확인","who":"both","stages":["postpartum"],"whatToDo":"분만병원에 있는 동안 발뒤꿈치 채혈 검사를 받게 합니다. 확진검사까지 받았다면 검사비 지원을 따로 신청합니다.","why":"일찍 찾아내면 치료할 수 있는 병들입니다. 보통 병원에서 알아서 해 주지만 지원 신청은 부모가 합니다.","when":{"anchor":"birth","daysFromBirth":7,"text":"생후 48시간~7일 사이 채혈 (미숙아는 생후 7일 이후)"},"isLegalDeadline":false,"penalty":null,"where":"검사는 분만병원 또는 소아과 외래 / 지원 신청은 관할 보건소, e보건소 공공보건포털","legalBasis":"모자보건법 제10조","evidence":{"quote":"확진검사 결과 선천성대사이상 환아로 판정된 경우에만 지원(7만원 한도)","url":"https://www.gov.kr/portal/rcvfvrSvc/dtlEx/SD0000007043","checkedAt":"2026-08-25"},"source":{"name":"정부24 — 선천성대사이상 검사 및 환아관리 지원","url":"https://www.gov.kr/portal/rcvfvrSvc/dtlEx/SD0000007043","checkedAt":"2026-08-25"},"note":"검사비 지원 신청 기한은 출생일로부터 1년입니다. 2024년부터 가구 소득과 관계없이 지원합니다.","unverified":["'출생 후 28일 이내 시행한 선별검사'라는 지원 기준은 다른 공식 자료(법제처 생활법령)에 있고 정부24 페이지에는 없습니다.","모자보건법 제10조 원문에 '선천성대사이상검사'라는 문구가 직접 나오지는 않습니다.","국가가 지원하는 선별검사가 정확히 몇 종의 질환을 보는지(흔히 인용되는 '50여 종' 등)를 공공 출처에서 확인하지 못했습니다. 참고로 서울아산병원은 자체적으로 '총 82종의 선천성 대사 이상 질환을 검사'한다고 안내하고 있어, 검사기관마다 항목 수가 다를 수 있습니다.","채혈 시기가 기관마다 다르게 안내됩니다. 서울아산병원은 '생후 48시간 이후 7일 이내', 서울대학교병원은 정상아 생후 3~7일·미숙아 5~7일로 안내합니다. 단일한 국가 기준 시점은 확인하지 못했습니다.","건강보험 적용 후 실제로 보호자가 내는 금액이 얼마인지, 국가 지원을 받은 뒤 최종 부담이 0원인지는 확인하지 못했습니다.","질병관리청 국가건강정보포털의 선천성대사이상 관련 문서는 사이트가 직접 접근을 막고 있어 원문을 확인하지 못했습니다."],"whatIsIt":"신생아 선천성대사이상 선별검사는 갓 태어난 모든 아기를 대상으로 겉으로는 멀쩡해 보여도 몸속에 숨어 있을 수 있는 대사 질환(영양분을 분해하고 에너지로 바꾸는 과정에 생기는 이상)을 걸러내는 검사입니다. 서울대학교병원 의학정보는 이 검사를 \"모든 신생아를 대상으로 주요 대사이상 질환을 선별하는 검사\"라고 설명합니다. 아기 발뒤꿈치에서 아주 적은 양의 피를 뽑아 전용 검사지에 묻히는 방식이라 아기 몸에 부담이 크지 않습니다. 검사에서 이상이 나오면 그 자리에서 병이 확정되는 것이 아니라, 확진검사(병이 맞는지 최종적으로 가리는 검사)를 한 번 더 받게 됩니다.","disease":"선천성대사이상은 태어날 때부터 물질 대사에 관여하는 효소(몸속 화학반응을 돕는 단백질)가 없거나 부족해서 생기는 병들을 묶어 부르는 이름입니다. 보건복지부가 특수식이나 의료비를 지원하는 질환만 봐도 고전적 페닐케톤뇨증, 타이로신혈증, 단풍시럽뇨병, 메틸말론산혈증·프로피온산혈증, 아이소발레린산혈증, 지방산대사장애, 호모시스틴뇨, 요소회로대사장애, 글루타르산뇨, 갈락토스혈증, 선천성 갑상선기능저하증 등이 있습니다. 이 병들은 처리되지 못한 물질이 몸에 쌓이면서 뇌를 비롯한 장기를 서서히 망가뜨리는데, 정부는 이 사업의 목적을 \"정신지체 등 장애 발생을 사전에 예방\"하는 것이라고 밝히고 있습니다. 즉 태어나서 며칠은 아무 증상이 없다가, 증상이 눈에 보일 무렵에는 이미 손상이 진행된 뒤인 경우가 많습니다.","detailWhy":"서울아산병원은 \"조기에 이를 발견하지 못해 치료시기를 놓치는 경우에는 돌이킬 수 없는 손상을 초래하거나 심각한 건강문제가 생길 수 있습니다\"라고 설명합니다. 반대로 일찍 찾아내면 특수분유나 식이조절, 약물로 손상을 막을 수 있기 때문에, 증상이 없는 신생아 전원에게 검사를 하는 것입니다.","detailHow":"아기 발뒤꿈치를 작은 침으로 찔러 소량의 피를 뽑고, 이를 거름종이 형태의 전용 검사지에 묻혀 말린 뒤 검사기관으로 보냅니다. 서울아산병원은 이 검사를 \"생후 48시간 이후 7일 이내에 필수적으로 시행\"한다고 안내하고, 서울대학교병원은 수유가 잘 되는 정상아는 생후 3~7일, 미숙아나 저체중 출생아는 5~7일에 채혈한다고 안내합니다. 결과가 이상으로 나오면 아미노산 분석, 유기산 분석, 효소 활성도 검사, 유전자 검사 같은 확진검사를 추가로 받게 되고, 서울아산병원은 결과가 양성이면 신생아과·소아청소년과 전문의 상담이 필요하다고 안내합니다. 확진검사에서 실제 환아로 판정되면 보건소에 환아로 등록해 특수조제분유나 의료비를 계속 지원받는 단계로 넘어갑니다.","conditions":"검사 자체는 모든 신생아가 대상입니다. 국가의 선별검사비 지원은 신생아 선천성 대사이상 외래 선별검사를 받은 영아가 대상이고, 확진검사비 지원은 선별검사에서 유소견 판정을 받은 뒤 확진검사를 받아 실제로 환아로 판정된 경우에만 해당합니다. 환아관리(특수식이·의료비)는 신청일 기준 19세 미만 환아가 대상이며, 나이는 출생월 기준으로 계산해 19세가 도래한 달까지만 지원합니다.","cost":"선별검사는 건강보험이 적용되고, 그 위에 남는 본인부담금의 (일부)를 국가가 지원합니다. 지원 대상은 \"출생 후 28일 이내에 실시하여 건강보험이 적용된 선별검사\"이며, 28일 이후에 했더라도 건강보험이 적용된 선별검사라면 지원이 가능합니다. 1회 지원이 원칙이지만 유소견 결과로 재검사한 경우 1회에 한해 추가 지원되어 최대 2회까지 됩니다. 확진검사비는 환아로 판정된 경우에만 7만원 한도로 지원되고, 진찰료 등 검사비 외 항목은 지원에서 빠집니다. 신청은 환아 주민등록 주소지 관할 보건소에 하며, 검사비 지원은 출생일로부터 1년 이내에 신청해야 합니다.","quotes":[{"text":"선천성 대사이상 유무를 조기에 발견·치료하고 특수식이 등을 지속적으로 지원함으로써 정신지체 등 장애 발생을 사전에 예방합니다.","source":"보건복지부·한국사회보장정보원 e보건소 '선천성 대사이상 검사 및 환아관리'(기준연도 2026)","url":"https://www.e-health.go.kr/gh/heSrvc/selectBbsDtlViewInfo.do?menuId=200040&pageIndex=1&bbsId=U00322&bbsSeCd=Z6&bbsNo=381834&schSe=&schText="},{"text":"신생아 선천성 대사이상 외래 선별검사비의 (일부)본인부담금 지원 / 출생 후 28일 이내에 실시하여 건강보험이 적용된 선별검사를 대상으로 함","source":"보건복지부·한국사회보장정보원 e보건소 '선천성 대사이상 검사 및 환아관리'","url":"https://www.e-health.go.kr/gh/heSrvc/selectBbsDtlViewInfo.do?menuId=200040&pageIndex=1&bbsId=U00322&bbsSeCd=Z6&bbsNo=381834&schSe=&schText="},{"text":"확진검사 결과 선천성 대사이상 환아로 판정된 경우에만 지원(7만원 한도)","source":"보건복지부·한국사회보장정보원 e보건소 '선천성 대사이상 검사 및 환아관리'","url":"https://www.e-health.go.kr/gh/heSrvc/selectBbsDtlViewInfo.do?menuId=200040&pageIndex=1&bbsId=U00322&bbsSeCd=Z6&bbsNo=381834&schSe=&schText="},{"text":"선천성 대사이상 검사비 지원 : 출생일로부터 1년 이내 신청","source":"보건복지부·한국사회보장정보원 e보건소 '선천성 대사이상 검사 및 환아관리'","url":"https://www.e-health.go.kr/gh/heSrvc/selectBbsDtlViewInfo.do?menuId=200040&pageIndex=1&bbsId=U00322&bbsSeCd=Z6&bbsNo=381834&schSe=&schText="},{"text":"고전적 페닐케톤뇨증, 타이로신혈증, 단풍시럽뇨병, 메틸말론산혈증/프로피온산혈증, 아이소발레린산혈증, 지방산대사장애, 호모시스틴뇨, 요소회로대사장애, 글루타르산뇨, 갈락토스혈증","source":"보건복지부·한국사회보장정보원 e보건소 '선천성 대사이상 검사 및 환아관리' 환아관리 지원 질환","url":"https://www.e-health.go.kr/gh/heSrvc/selectBbsDtlViewInfo.do?menuId=200040&pageIndex=1&bbsId=U00322&bbsSeCd=Z6&bbsNo=381834&schSe=&schText="},{"text":"모든 신생아를 대상으로 주요 대사이상 질환을 선별하는 검사","source":"서울대학교병원 의학정보 '선천성 대사이상 선별검사'","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=TEST&medid=BA000078"},{"text":"선별검사에 이상이 발견될 경우에는 확진을 위하여 아미노산 분석, 유기산 분석, 효소 활성도 검사, 유전자 검사 등을 추가로 시행하게 된다.","source":"서울대학교병원 의학정보 '선천성 대사이상 선별검사'","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=TEST&medid=BA000078"},{"text":"신생아의 발뒤꿈치에서 소량의 혈액을 채취해서 거름종이에 묻혀서 검사","source":"서울아산병원 뉴스룸 건강정보 '신생아 선별검사'","url":"https://news.amc.seoul.kr/news/con/detail.do?cntId=5431"},{"text":"생후 48시간 이후 7일 이내에 필수적으로 시행","source":"서울아산병원 뉴스룸 건강정보 '신생아 선별검사'","url":"https://news.amc.seoul.kr/news/con/detail.do?cntId=5431"},{"text":"조기에 이를 발견하지 못해 치료시기를 놓치는 경우에는 돌이킬 수 없는 손상을 초래하거나 심각한 건강문제가 생길 수 있습니다.","source":"서울아산병원 뉴스룸 건강정보 '신생아 선별검사'","url":"https://news.amc.seoul.kr/news/con/detail.do?cntId=5431"},{"text":"선별 검사 결과가 양성이면 신생아과, 소아청소년과 혹은 이비인후과 전문의와의 상담이 필요합니다.","source":"서울아산병원 건강정보 '신생아 선별검사(Neonatal Screening Test)'","url":"https://www.amc.seoul.kr/asan/healthinfo/management/managementDetail.do?managementId=27"}]},{"id":"newborn_vaccination","name":"B형간염·BCG 접종","category":"접종","confidence":"확인","who":"both","stages":["postpartum"],"whatToDo":"B형간염 1차는 출생 후 되도록 24시간 안에, BCG(결핵)는 생후 4주 안에 맞힙니다.","why":"국가예방접종이라 비용이 들지 않습니다. BCG는 4주를 넘기면 절차가 번거로워집니다.","when":{"anchor":"birth","daysFromBirth":28,"text":"B형간염 1차 출생 시(가능한 24시간 이내) / BCG 생후 4주 이내"},"isLegalDeadline":false,"penalty":null,"where":"보건소 및 위탁의료기관 (예방접종도우미 nip.kdca.go.kr 에서 검색)","legalBasis":null,"evidence":{"quote":"출생 시(가능한 24시간 이내), 생후 1, 6개월에 단독백신으로 접종","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1102","checkedAt":"2026-08-25"},"source":{"name":"질병관리청 예방접종도우미","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1102","checkedAt":"2026-08-25"},"note":"BCG는 늦어도 생후 3개월 전까지는 피부검사 없이 맞을 수 있습니다. 산모가 B형간염 표면항원 양성이면 출생 직후 면역글로불린을 함께 맞습니다.","unverified":["미숙아의 B형간염 4회 접종 일정은 질병관리청 본문에서 직접 확인하지 못했습니다.","B형간염 1차를 '왜' 24시간 이내에 맞아야 하는지 그 이유를 직접 설명하는 공식 문장은 찾지 못했습니다. 공식 자료에는 '출생 시(가능한 24시간 이내)'라는 시점만 제시되어 있습니다.","BCG 경피용의 실제 비용 금액은 공공 출처에서 확인하지 못했습니다.","피내용과 경피용의 예방 효과 차이를 수치로 비교한 공식 자료는 확인하지 못했습니다. 확인된 것은 국가예방접종이 피내용만 사용하고 WHO도 피내접종을 권장한다는 점, 그리고 경피용은 접종량이 일정하지 않을 수 있다는 설명뿐입니다.","B형간염 보유 산모에게서 태어난 아기에게 모유수유가 가능한지 등 접종 외 관리사항은 공식 안내에서 확인하지 못했습니다. 담당 의료진과 상담해 주세요.","주산기감염 예방사업만을 위한 별도 지정 의료기관이 있는지는 확인하지 못했습니다. 확인된 것은 '보건소와 위탁의료기관'이라는 안내뿐입니다."],"whatIsIt":"태어난 아기가 가장 먼저 맞는 두 가지 예방접종이 B형간염과 BCG(결핵) 접종입니다. B형간염은 출생 시(가능한 24시간 이내)에 1차를 맞고 생후 1개월, 6개월에 나머지를 맞습니다. BCG는 금기사항이 없는 모든 신생아가 대상이며 생후 4주 이내에 1회 맞습니다. 두 백신 모두 국가예방접종 지원 대상이어서 보건소나 지정된 위탁의료기관에서 비용 부담 없이 맞을 수 있습니다.","disease":"B형간염은 B형간염 바이러스에 감염되어 간에 염증이 생기는 병으로, 질병관리청은 \"급성 B형간염 중 5~10%가 만성 B형간염으로 진행되며 만성 B형간염이 지속되면 간경화증이나 간세포암으로 진행할 수 있습니다\"라고 설명합니다. 그런데 신생아는 사정이 훨씬 나쁩니다. 질병관리청은 \"주산기에 감염된 신생아의 90% 이상이 B형간염 바이러스 만성 보유자로 진행\"한다고 밝히고 있습니다. 주산기는 출산 전후 기간(임신 29주부터 생후 1주까지)을 뜻하며, 이 시기 엄마로부터의 감염이 국내 B형간염 감염의 주된 경로입니다. 결핵은 결핵균에 의한 공기매개 감염질환으로 폐뿐 아니라 여러 장기를 침범하는데, 질병관리청은 \"영유아의 경우 결핵균에 노출되면 결핵 뇌수막염, 파종성 결핵 등 중증 결핵이 발생할 가능성이 높으며, 이러한 중증 결핵은 BCG 예방접종을 통해 예방할 수 있습니다\"라고 안내합니다. 결핵 뇌수막염은 결핵균이 뇌를 싸는 막에 퍼지는 병이고, 파종성 결핵은 결핵균이 온몸에 흩뿌려지듯 퍼지는 상태입니다.","detailWhy":"신생아기의 B형간염 감염은 열에 아홉 이상이 평생 가는 만성 보유 상태로 이어지고, 그 끝에 간경변증이나 간암이 놓여 있기 때문에 출생 직후의 접종이 결정적입니다. BCG는 아기가 걸리면 특히 위험한 결핵 뇌수막염과 파종성 결핵 같은 중증 결핵을 막기 위한 접종입니다.","detailHow":"B형간염은 출생 시(가능한 24시간 이내) 1차, 생후 1개월 2차, 생후 6개월 3차로 총 3회를 대퇴부 앞바깥쪽에 근육주사로 맞습니다. BCG는 생후 4주 이내에 1회 맞으며, 국가예방접종에서는 피내용만 사용해 왼팔 삼각근 부위에 피부 안쪽으로 주사합니다. 엄마가 B형간염 표면항원(HBsAg) 양성이거나 e항원(HBeAg) 양성이면 아기는 B형간염 주산기감염 예방사업 대상이 되어, 면역글로불린(항체가 든 주사약)을 맞습니다. 공식 안내는 태어난 뒤 12시간 이내에 면역글로불린과 B형간염 1차 접종을 서로 다른 부위에 하도록 정하고 있습니다. 그 뒤 기초접종 3회를 마친 뒤 생후 9~15개월에 항원·항체 검사를 받습니다. 이 검사에서 항체가 생기지 않았으면 재접종을 최대 3회, 재검사를 최대 2회까지 지원받을 수 있습니다.","conditions":"BCG는 금기사항이 없는 모든 신생아가 대상이고, 접종이 늦어졌더라도 생후 2개월(3개월 미만)까지는 투베르쿨린 피부검사 확인 없이 접종할 수 있습니다. 다만 충분한 치료를 받고 있지 않은 호흡기 결핵 환자와 접촉한 경우에는 접종하지 않습니다. B형간염 주산기감염 예방사업은 B형간염 표면항원(HBsAg) 양성 또는 e항원(HBeAg) 양성인 산모에게서 태어난 영유아가 대상이며, 분만(접종)의료기관에 산모검사결과지와 개인정보제공 동의서를 내야 참여됩니다. 산모검사결과지는 임신 중 또는 분만 후 7일 이내의 항원 검사 결과여야 합니다.","cost":"국가예방접종사업은 지원 백신 19종의 접종비용(백신비 및 예방접종 시행비)을 전액 지원하며, B형간염(HepB)과 결핵(BCG, 피내용)이 모두 여기에 포함됩니다. 전국 보건소와 위탁의료기관에서 접종해야 하고, 위탁의료기관이 아닌 곳에서는 비용을 지원받을 수 없습니다. 반면 BCG 경피용은 국가예방접종 사업에 포함되지 않아 접종비용이 전액 본인 부담입니다. B형간염 주산기감염 예방사업 대상자는 면역글로불린 투여, B형간염 예방접종, 항원·항체 정량검사 비용을 국가가 지원하는데, 접종과 검사는 보건소와 위탁의료기관에서 받아야 하며, 위탁의료기관이 아닌 곳에서는 비용을 지원받을 수 없습니다.","quotes":[{"text":"급성 B형간염 중 5~10%가 만성 B형간염으로 진행되며 만성 B형간염이 지속되면 간경화증이나 간세포암으로 진행할 수 있습니다.","source":"질병관리청 예방접종도우미 'B형간염(Hepatitis B)'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1102"},{"text":"출생 시(가능한 24시간 이내), 생후 1, 6개월에 단독백신으로 접종","source":"질병관리청 예방접종도우미 'B형간염(Hepatitis B)'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1102"},{"text":"주산기감염(B형간염 바이러스에 감염된 모체로부터의 감염)","source":"질병관리청 예방접종도우미 'B형간염(Hepatitis B)' 감염 경로","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1102"},{"text":"주산기에 감염된 신생아의 90% 이상이 B형간염 바이러스 만성 보유자로 진행되므로 신생아의 주산기감염 예방은 매우 중요하며","source":"질병관리청 예방접종도우미 'B형간염 주산기감염 예방사업'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=133"},{"text":"면역글로불린 투여 : 출생 직후 1회 투여","source":"질병관리청 예방접종도우미 'B형간염 주산기감염 예방사업' 예방처치 기본일정","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=133"},{"text":"면역글로불린 투여, B형간염 예방접종 및 항원·항체 정량검사 비용 지원","source":"질병관리청 예방접종도우미 'B형간염 주산기감염 예방사업' 사업내용","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=133"},{"text":"B형간염 기초접종 3회 완료 후, 생후 9개월 이상 15개월에 검사 시행","source":"질병관리청 예방접종도우미 'B형간염 주산기감염 예방사업' 항원·항체 1차 검사","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=133"},{"text":"접종대상 : 금기사항이 없는 모든 신생아 / 접종 시기 : 생후 4주 이내","source":"질병관리청 예방접종도우미 '결핵(BCG)'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1101"},{"text":"피내용 : 왼팔 삼각근 부위에 피내주사 / ※ 국가예방접종에서는 피내용만 사용","source":"질병관리청 예방접종도우미 '결핵(BCG)' 접종 부위 및 방법","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1101"},{"text":"영유아의 경우 결핵균에 노출되면 결핵 뇌수막염, 파종성 결핵 등 중증 결핵이 발생할 가능성이 높으며","source":"질병관리청 예방접종도우미 결핵(BCG) 안내에 연결된 리플렛 '2023년도 결핵(BCG) 예방접종 안내'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1101"},{"text":"이러한 중증 결핵은 BCG 예방접종을 통해 예방할 수 있습니다.","source":"질병관리청 예방접종도우미 결핵(BCG) 안내에 연결된 리플렛 '2023년도 결핵(BCG) 예방접종 안내'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1101"},{"text":"우리나라는 국가예방접종으로 피내접종 방법으로 접종할 것을 권장하고 있으며, 세계보건기구(WHO)에서도 피내접종을 권장하고 있습니다","source":"질병관리청 예방접종도우미 결핵(BCG) 안내에 연결된 리플렛 '2023년도 결핵(BCG) 예방접종 안내'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1101"},{"text":"필수예방접종의 접종비용(백신비 및 예방접종 시행비) 전액 지원","source":"질병관리청 예방접종도우미 '국가예방접종사업'(2026-07-14 기준)","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=131"},{"text":"국가예방접종 사업에 포함되지 않은 백신 접종비용은 전액 본인 부담입니다. (BCG 경피용, 일본뇌염 약독화 생백신, HPV 9가)","source":"질병관리청 예방접종도우미 '국가예방접종사업'","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=131"}]},{"id":"infant_health_checkup","name":"영유아 건강검진 (1차)","category":"검사","confidence":"확인","who":"both","stages":["postpartum"],"whatToDo":"생후 14~35일 사이에 1차 영유아 건강검진을 받습니다. 이후 8차까지 정해진 시기마다 이어집니다.","why":"본인부담이 없습니다. 발달 문제를 일찍 찾는 검진이라 시기를 지키는 것이 중요합니다.","when":{"anchor":"birth","daysFromBirth":35,"text":"1차 생후 14~35일"},"isLegalDeadline":false,"penalty":null,"where":"국민건강보험공단이 지정한 영유아 건강검진기관","legalBasis":"국민건강보험법 시행령 제25조, 행정규칙 '건강검진 실시기준' 별표 3","evidence":{"quote":"비용부담 : 본인부담 없음","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do","checkedAt":"2026-08-25"},"source":{"name":"국민건강보험공단 — 영유아 건강검진","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do","checkedAt":"2026-08-25"},"note":"총 8차입니다. 2차 생후 4~6개월, 3차 9~12개월, 4차 18~24개월(구강검진 포함), 5차 30~36개월, 6차 42~48개월, 7차 54~60개월, 8차 66~71개월.","unverified":["검진을 받지 않았을 때의 불이익(과태료 등)이 있는지, 정해진 시기가 지난 뒤에도 해당 차수를 받을 수 있는지에 관한 공식 안내를 찾지 못했습니다. 사업장 대상 일반건강검진과 달리 영유아 건강검진에 미수검 제재가 있다는 근거는 확인되지 않았습니다.","1차 검진에서 실제로 어떤 진찰을 하는지(청진, 눈·입 진찰 등) 세부 내용은 공식 페이지에 항목명 수준으로만 안내되어 있어 확인하지 못했습니다.","검진기관을 어떻게 고르는지, 예약이 필요한지 등 실제 이용 절차는 확인하지 않았습니다."],"whatIsIt":"국가 영유아 건강검진은 국민건강보험공단이 시행하는 검진으로, 생후 14일부터 71개월까지의 영유아를 검진시기별로 나누어 총 8차에 걸쳐 받게 됩니다. 이와 별도로 4차 시기부터는 구강검진이 4회 추가로 운영됩니다. 검진표는 공단이 직장가입자 또는 세대주에게 전자문서로 보내고, 전자문서를 열어보지 않은 경우에는 우편으로 다시 보냅니다. 전국의 영유아 검진기관에서 받을 수 있습니다.","detailWhy":"검진은 항목마다 찾아내려는 목표질환이 정해져 있습니다. 신체계측은 발육지연, 과체중, 비만, 소두증, 대두증 등을, 발달검사는 지적장애·자폐스펙트럼장애·뇌성마비·언어장애·행동장애 등을, 시각 및 시력검사는 약시·사시·근시 등을 겨냥합니다. 1차 검진 시기에 이루어지는 수면 관련 건강교육은 영아돌연사증후군(자던 아기가 원인 없이 갑자기 사망하는 것)을 목표질환으로 삼고 있습니다.","detailHow":"1차 검진은 생후 14~35일 사이에 받으며, 항목은 문진 및 진찰, 신체계측, 건강교육입니다. 신체계측에서는 키, 몸무게(체질량지수), 머리둘레를 잽니다. 건강교육 주제로는 안전사고예방, 영양, 영아돌연사증후군 예방, 구강, 수면 등이 안내되어 있습니다. 검진 결과는 검진이 끝난 뒤 검진기관이 보호자에게 직접 알려줍니다. 발달선별검사는 1차에는 들어 있지 않고, 3차(생후 9~12개월)부터 '발달선별검사 및 상담'으로 포함되어 한국 영유아 발달선별검사(K-DST)를 통한 평가와 상담으로 진행됩니다.","conditions":"생후 14일부터 71개월까지의 영유아가 대상이며, 차수별로 받을 수 있는 시기가 정해져 있습니다. 1차는 생후 14~35일, 2차는 생후 4~6개월, 3차는 생후 9~12개월, 4차는 생후 18~24개월, 5차는 생후 30~36개월, 6차는 생후 42~48개월, 7차는 생후 54~60개월, 8차는 생후 66~71개월입니다. 구강검진은 생후 18~29개월, 30~41개월, 42~53개월, 54~65개월에 각각 받습니다.","cost":"본인부담이 없습니다. 건강보험가입자는 공단이 전액 부담하고, 의료급여수급권자는 국가 및 지자체가 부담합니다.","quotes":[{"text":"생후 14일부터 71개월까지의 영유아를 대상으로 검진시기별로 선정","source":"국민건강보험공단 '영유아 건강검진 안내'","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"1차 건강검진 생후 14~35일 문진 및 진찰, 신체계측, 건강교육","source":"국민건강보험공단 '영유아 건강검진 안내' 검진항목 표","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"3차 건강검진 생후 9~12개월 문진 및 진찰, 신체계측, 발달선별검사 및 상담, 건강교육","source":"국민건강보험공단 '영유아 건강검진 안내' 검진항목 표","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"신체계측 : 키, 몸무게(체질량지수), 머리둘레","source":"국민건강보험공단 '영유아 건강검진 안내' 항목별 검진방법","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"발달평가 : 한국 영유아 발달선별검사(K-DST)를 통한 평가 및 상담","source":"국민건강보험공단 '영유아 건강검진 안내' 항목별 검진방법","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"비용부담 : 본인부담 없음 / 건강보험가입자 : 공단 전액 부담 / 의료급여수급권자 : 국가 및 지자체에서 부담","source":"국민건강보험공단 '영유아 건강검진 안내' 필수 확인사항","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"영유아 건강검진 결과는 검진완료 후 수검자의 보호자에게 직접 통보해 드립니다.","source":"국민건강보험공단 '영유아 건강검진 안내'","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"신체계측 : 발육지연, 과체중, 비만, 소두증, 대두증 등 / 수면교육 : 영아돌연사 증후군 등","source":"국민건강보험공단 '영유아 건강검진 안내' 건강검진 목표질환","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca04800m01.do"},{"text":"생후 9개월(3차 검진) 이후 건강검진을 받는 영유아","source":"국민건강보험공단 '발달선별검사지 안내' 검사 대상","url":"https://www.nhis.or.kr/nhis/healthin/wbhaca05000m01.do"}]},{"id":"spouse_maternity_leave_apply","name":"배우자 출산휴가 쓰기","category":"근로","confidence":"확인","who":"partner","stages":["pregnant","postpartum"],"whatToDo":"회사에 배우자 출산휴가 20일을 신청합니다. 한 번에 다 쓰지 않고 3회까지 나눠 쓸 수 있습니다.","why":"유급입니다. 출산예정일 50일 전부터 쓸 수 있고, 배우자가 출산한 날부터 120일이 지나면 못 씁니다.","when":{"anchor":"birth","daysFromBirth":120,"text":"출산예정일 50일 전부터 출산 후 120일까지"},"isLegalDeadline":true,"penalty":"120일이 지나면 사용할 수 없습니다.","where":"회사 인사부서에 신청 / 급여는 고용24(work24.go.kr)","legalBasis":"남녀고용평등과 일·가정 양립 지원에 관한 법률 제18조의2","evidence":{"quote":"사업주는 근로자가 배우자의 출산을 이유로 휴가를 고지하는 경우에 20일의 유급 휴가를 주어야 합니다.","url":"https://m.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systClId=SC00000247&systId=SI00000396","checkedAt":"2026-08-25"},"source":{"name":"고용24 — 배우자 출산휴가","url":"https://m.work24.go.kr/cm/c/f/1100/selecSystInfo.do?systClId=SC00000247&systId=SI00000396","checkedAt":"2026-08-25"},"note":"3회에 한정해 분할할 수 있습니다(4개 구간). 우선지원 대상기업 소속이면 고용보험에서 급여가 나오고, 상한 1,684,210원입니다. 급여 신청은 휴가 시작 후 1개월부터 휴가가 끝난 날 이후 12개월 이내입니다. 2026년 9월 18일부터 출산 전(예정일 50일 전)에도 쓸 수 있습니다.","unverified":[],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"category":"근로","confidence":"확인","isLegalDeadline":true,"where":"고용24(work24.go.kr) 온라인 신청 또는 관할 고용센터","unverified":["급여 신청 서식·첨부서류(고용노동부령)는 원문을 확인하지 않았습니다."],"requires":[{"field":"subjectEmployment","eq":"employee"}],"id":"maternity_leave_pay_apply","name":"출산전후휴가급여 신청하기","who":"mother","stages":["postpartum"],"whatToDo":"고용보험에 출산전후휴가급여를 신청합니다. 휴가를 시작한 날 이후 1개월부터 신청할 수 있고, 휴가가 끝난 날 이후 12개월이 지나면 신청할 수 없습니다.","why":"휴가 기간의 급여를 고용보험이 지급합니다. 기한을 넘기면 받을 수 없습니다.","when":{"anchor":"profileDate","field":"maternityLeaveEnd","monthsAfter":12,"text":"휴가를 시작한 날 이후 1개월부터, 휴가가 끝난 날 이후 12개월 이내"},"penalty":"휴가가 끝난 날 이후 12개월이 지나면 신청할 수 없습니다.","legalBasis":"고용보험법 제75조","evidence":{"quote":"휴가를 시작한 날 이후 1개월부터 휴가가 끝난 날 이후 12개월 이내에 신청할 것","url":"https://www.law.go.kr/법령/고용보험법/제75조","checkedAt":"2026-09-02"},"source":{"name":"국가법령정보센터 — 고용보험법 제75조","url":"https://www.law.go.kr/법령/고용보험법/제75조","checkedAt":"2026-09-02"},"note":"출산전후휴가가 끝나는 날을 입력하면 마지막 날짜를 계산해 보여드립니다. 기한은 민법 제157조·제160조에 따라 끝난 날의 다음 날부터 역(曆)으로 12개월을 셉니다 — 끝난 날이 3월 31일이면 다음 해 3월 31일까지, 1월 31일이면 다음 해 1월 31일까지입니다. 이 앱은 그렇게 계산합니다. 대통령령으로 정하는 사유로 그 기간에 신청하지 못한 사람은 사유가 끝난 후 30일 이내 신청 특례가 있습니다."},{"category":"근로","confidence":"확인","isLegalDeadline":true,"where":"고용24(work24.go.kr) 온라인 신청 또는 관할 고용센터","unverified":[],"requires":[{"field":"subjectEmployment","eq":"employee"}],"id":"parental_leave_pay_apply","name":"육아휴직 급여 신청하기","who":"both","perPerson":true,"stages":["postpartum"],"whatToDo":"고용보험에 육아휴직 급여를 신청합니다. 휴직을 시작한 날 이후 1개월부터 신청할 수 있고, 휴직이 끝난 날 이후 380&ccfNo=2&cciNo=1&cnpClsNo=2","checkedAt":"2026-08-25"},"source":{"name":"법제처 찾기쉬운 생활법령정보 — 육아휴직 급여 특례","url":"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=1380&ccfNo=2&cciNo=1&cnpClsNo=2","checkedAt":"2026-08-25"},"note":"첫 6개월은 월별로 상한이 올라갑니다(1개월 250만원 → 6개월 450만원, 부모 각각). 7개월째부터는 통상임금의 80%이며 상한 160만원·하한 70만원입니다. 동시에 쓰지 않아도 되고, 각자 다른 시기에 써도 특례가 적용됩니다.","unverified":["2개월차 상한액은 원문 인용에서 확인하지 못했습니다(1·3·4·5·6개월차만 확인).","부모 중 두 번째 사람이 육아휴직을 시작했을 때 먼저 쓴 사람의 급여를 소급해 다시 계산해 주는지(정산 방식과 절차)는 공공 출처로 확인하지 못했습니다.","\"6+6 부모육아휴직제\"라는 명칭은 법령 조문에 나오는 용어가 아닙니다. 법령상 명칭은 \"출생 후 18개월 이내의 자녀에 대한 육아휴직 급여 등의 특례\"입니다.","급여 신청 서류 목록과 접수 창구는 확인하지 못했습니다. 신청처에 확인해 주세요.","한부모가족 근로자에게 적용되는 별도 급여 기준(첫 3개월 상한 300만원)은 이 특례와 다른 항이므로 함께 적용되는지 여부는 확인하지 못했습니다."],"whatIsIt":"법령상 정식 명칭은 \"출생 후 18개월 이내의 자녀에 대한 육아휴직 급여 등의 특례\"이고, 고용보험법 시행령 제95조의3에 규정되어 있습니다. 같은 자녀에 대해 부모가 모두 육아휴직을 쓰면, 각자의 육아휴직 첫 6개월 급여를 통상임금 전액(100%)으로 계산해 주는 제도입니다. 부모 각각에게 적용되므로 두 사람 모두 급여가 올라갑니다.","detailWhy":"한 사람만 육아휴직을 쓰면 일반 급여 기준(첫 3개월 상한 250만원, 4~6개월 상한 200만원, 7개월 이후 통상임금의 80%·상한 160만원)이 적용됩니다. 부모가 모두 쓰면 첫 6개월에 대해 통상임금 100%와 더 높은 상한이 적용되어 가구 소득 감소를 줄일 수 있습니다. 즉 이 제도는 부모 두 사람이 함께 육아휴직을 쓰도록 설계된 급여 특례입니다.","detailHow":"급여 상한은 부모가 각각 사용한 개월 수에 따라 달라집니다. 각각 1개월씩 쓰면 부모 각자 월 250만원, 2개월씩이면 두 달 모두 각자 250만원, 3개월씩이면 첫 두 달 250만원·셋째 달 300만원입니다. 6개월씩 쓰면 첫 두 달 250만원, 셋째 달 300만원, 넷째 달 350만원, 다섯째 달 400만원, 여섯째 달 450만원입니다. 하한액은 부모 각각 70만원이고, 7개월째부터는 통상임금의 80%(상한 160만원, 하한 70만원)로 돌아갑니다.","conditions":"같은 자녀에 대해 자녀의 출생 후 18개월이 될 때까지 부모가 모두 육아휴직을 해야 합니다. 두 사람이 같은 기간에 동시에 쉬어야 하는 것은 아닙니다. 조문이 \"부모의 육아휴직기간이 전부 또는 일부 겹치지 않은 경우를 포함한다\"고 명시하고 있어 순차로 써도 됩니다. 임신 중인 여성 근로자가 임신을 이유로 육아휴직을 하는 경우에는 뱃속의 아기를 자녀로 보고, 그 근로자와 배우자를 부모로 봅니다. 급여를 받으려면 육아휴직을 30일 이상 부여받고 육아휴직 시작일 이전 피보험 단위기간이 합쳐서 180일 이상이어야 하며, 신청은 육아휴직 시작 후 1개월부터 끝난 날 이후 12개월 이내에 해야 합니다.","ifRefused":"회사가 육아휴직 신청을 받고도 허용하지 않으면 남녀고용평등과 일·가정 양립 지원에 관한 법률 제37조 제4항 제4호에 따라 500만원 이하의 벌금 대상입니다. 육아휴직을 이유로 해고하거나 불리한 처우를 하면 같은 조 제2항 제3호에 따라 3년 이하의 징역 또는 3천만원 이하의 벌금으로 더 무겁게 처벌합니다. 급여 자체는 회사가 아니라 고용노동부장관이 고용보험에서 지급하므로, 휴가는 회사에 신청하고 급여는 별도로 신청합니다. 관할 지방고용노동관서에 신고할 수 있고 고용노동부 대표전화는 국번 없이 1350입니다.","cost":"근로자가 부담하는 비용은 없습니다. 급여는 고용보험에서 지급되며, 첫 6개월은 통상임금 100%를 기준으로 위의 월별 상한 안에서 부모 각각에게 지급됩니다.","quotes":[{"text":"자녀의 출생 후 18개월이 될 때까지 피보험자인 부모가 모두 육아휴직을 하는 경우","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"부모의 육아휴직기간이 전부 또는 일부 겹치지 않은 경우를 포함한다","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"육아휴직 시작일부터 6개월까지: 육아휴직 시작일을 기준으로 한 각 피보험자의 월 통상임금에 해당하는 금액","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항제1호","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"부모가 육아휴직을 사용한 기간이 각각 1개월인 경우: 부모 각각에 대하여 월 250만원","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항제1호 가목","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"첫 번째 달과 두 번째 달은 월 250만원, 세 번째 달은 월 300만원","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항제1호 다목","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"네 번째 달은 월 350만원, 다섯 번째 달은 월 400만원, 여섯 번째 달은 월 450만원","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항제1호 바목","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"그 월별 지급액의 하한액은 부모 각각에 대하여 70만원으로 한다","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항제1호","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"임신 중인 태아를 자녀로 보고, 임신 중인 여성 근로자와 그 배우자를 부모로 본다","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제2항","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"육아휴직 7개월째부터 육아휴직 종료일까지: 육아휴직 시작일을 기준으로 한 각 피보험자의 월 통상임금의 100분의 80에 해당하는 금액","source":"국가법령정보센터 「고용보험법 시행령」 제95조의3제1항제2호","url":"https://www.law.go.kr/법령/고용보험법시행령"},{"text":"피보험 단위기간이 합산하여 180일 이상인 피보험자에게 육아휴직 급여를 지급한다","source":"국가법령정보센터 「고용보험법」 제70조제1항","url":"https://www.law.go.kr/법령/고용보험법"},{"text":"육아휴직을 시작한 날 이후 1개월부터 육아휴직이 끝난 날 이후 12개월 이내에 신청하여야 한다","source":"국가법령정보센터 「고용보험법」 제70조제2항","url":"https://www.law.go.kr/법령/고용보험법"},{"text":"근로자의 육아휴직 신청을 받고 육아휴직을 허용하지 아니하거나","source":"국가법령정보센터 「남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률」 제37조제4항제4호","url":"https://www.law.go.kr/법령/남녀고용평등과일·가정양립지원에관한법률"},{"text":"사업주가 다음 각 호의 어느 하나에 해당하는 위반행위를 한 경우에는 500만원 이하의 벌금에 처한다","source":"국가법령정보센터 「남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률」 제37조제4항","url":"https://www.law.go.kr/법령/남녀고용평등과일·가정양립지원에관한법률"},{"text":"제19조제3항을 위반하여 육아휴직을 이유로 해고나 그 밖의 불리한 처우를 하거나","source":"국가법령정보센터 「남녀고용평등과 일ㆍ가정 양립 지원에 관한 법률」 제37조제2항제3호","url":"https://www.law.go.kr/법령/남녀고용평등과일·가정양립지원에관한법률"}],"requires":[{"field":"employment","eq":"employee"},{"field":"spouseEmployment","eq":"employee"}]},{"id":"warning_signs_learn","name":"병원에 가야 하는 신호 외워 두기","category":"의료","confidence":"확인","who":"both","stages":["pregnant"],"whatToDo":"갑자기 붓거나, 심한 두통과 눈이 침침한 증상이 함께 오거나, 출혈·물 같은 분비물·규칙적인 배 뭉침이 있으면 바로 병원에 갑니다. 두 사람이 함께 알아 두세요.","why":"전자간증과 조산은 갑자기 옵니다. 산모 본인은 그 순간 판단이 어려울 수 있어서, 옆 사람이 신호를 알고 있으면 병원에 가는 시점이 빨라집니다.","when":{"anchor":"pregnancyStart","text":"임신을 확인한 뒤 바로 — 출산 때까지 계속"},"isLegalDeadline":false,"penalty":null,"where":"분만 예정 병원 또는 가까운 산부인과 응급실","legalBasis":null,"evidence":{"quote":"산모 스스로 조기진통의 구별이 어려울 수 있으므로 이상 징후가 느껴지면 즉시 병원을 찾아야 합니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6583","checkedAt":"2026-08-25"},"source":{"name":"국가건강정보포털(질병관리청) — 조산 / 임신고혈압과 전자간증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6583","checkedAt":"2026-08-25"},"note":"중증 전자간증은 두통·시력장애·오른쪽 윗배 통증·소변량 감소로 나타납니다. 혈압 140/90 이상에 단백뇨가 함께 있으면 전자간증으로 진단합니다.","unverified":["태동이 며칠 만에 몇 회 미만이면 위험한지는 국내 공식 기준이 없습니다. 서울대학교병원이 \"바람직한 태동의 횟수나 기간에 대해 정확히 정해져 있는 것은 없는 상태\"라고 밝히고 있어, 흔히 도는 \"2시간에 10회\" 같은 숫자는 싣지 않았습니다."]},{"id":"spouse_leave_notify","name":"배우자 출산휴가를 회사에 미리 알리기","category":"근로","confidence":"확인","who":"partner","stages":["pregnant"],"whatToDo":"20일을 언제 쓸지 정해 회사에 미리 말해 둡니다. 한 번에 다 쓰지 않고 3회까지 나눠 쓸 수 있습니다.","why":"출산예정일 50일 전부터 출산 후 120일 안에 다 써야 합니다. 출산 직후에 급히 말하면 업무 인수인계가 안 돼 실제로는 며칠밖에 못 쓰는 일이 생깁니다.","when":{"anchor":"week","windows":[{"from":20,"to":45,"label":"임신 20주 이후"}],"text":"출산 전에 미리 — 실제 사용은 출산예정일 50일 전부터 출산 후 120일까지"},"isLegal 에 신청할 수 있습니다. 진단서를 준비해 인사 담당 부서와 시기를 정합니다.","why":"2026년 9월 18일부터 배우자에게 유산·조산 등 위험이 있으면 아이가 태어나기 전에도 육아휴직을 쓸 수 있습니다. 배우자가 임신했다는 사실만으로는 대상이 아니라 진단이 있어야 합니다.","when":{"anchor":"week","windows":[{"from":0,"to":45,"label":"임신 중 (진단 이후)"}],"text":"임신 중 진단이 있을 때 — 출산 전 언제든"},"isLegalDeadline":false,"penalty":null,"where":"회사 인사부서에 신청","legalBasis":"남녀고용평등과 일·가정 양립 지원에 관한 법률 제19조제1항·같은 법 시행규칙 제14조의2","evidence":{"quote":"법 제19조제1항 본문에서 \"고용노동부령으로 정하는 유산, 조산 등 위험이 있는 임신 중인 배우자\"란 별표 3에 따른 질환을 진단받은 임신 중인 배우자를 말한다.","url":"https://www.law.go.kr/법령/남녀고용평등과일ㆍ가정양립지원에관한법률시행규칙","checkedAt":"2026-09-18"},"source":{"name":"법제처 국가법령정보센터 — 남녀고용평등과 일·가정 양립 지원에 관한 법률 시행규칙 제14조의2","url":"https://www.law.go.kr/법령/남녀고용평등과일ㆍ가정양립지원에관한법률시행규칙","checkedAt":"2026-09-18"},"conditions":"법 제19조제1항(2026-09-18 시행): \"남성 근로자가 고용노동부령으로 정하는 유산, 조산 등 위험이 있는 임신 중인 배우자를 돌보려고 하는 경우\". 시행규칙 제14조의2는 이를 \"별표 3에 따른 질환을 진단받은 임신 중인 배우자\"로 정합니다. 이 앱의 '고위험 임신' 답은 입원 치료 여부를 묻는 것이라 별표 3 진단과 같지 않습니다 — 진단명이 별표 3에 있는지는 회사나 고용노동부에 확인해 주세요.","note":"임신 중 사용분과 출산 후 사용분을 합쳐 1년 이내인지는 조문에서 확인하지 못했습니다(제19조제2항은 '1년 이내'만 정합니다).","unverified":["시행규칙 별표 3의 질환 목록(원문 미확인)","임신 중 사용분과 출산 후 사용분의 합산 상한"],"requires":[{"field":"isHighRiskPregnancy","eq":true},{"field":"subjectEmployment","eq":"employee"}]},{"id":"birth_bag_prepare","name":"입원 가방 함께 챙기기","category":"출산준비","confidence":"확인","who":"both","stages":["pregnant"],"whatToDo":"산모용품, 아기용품, 필요서류 세 묶음으로 나눠 미리 싸 둡니다. 누가 무엇을 챙길지 정해 두면 급할 때 빠집니다.","why":"임신부 10명 중 2~3명은 진통보다 양수가 먼저 터집니다. 그때는 바로 병원에 가야 해서 가방을 쌀 시간이 없습니다.","when":{"anchor":"week","windows":[{"from":28,"to":45,"label":"임신 28주 이후"}],"text":"임신 후기(28주 이후)에 미리"},"isLegalDeadline":false,"penalty":null,"where":"집","legalBasis":null,"evidence":{"quote":"임신부 10명 중 2~3명이 진통이 시작되기 전에 양수가 먼저 터지는 조기양막파수를 경험합니다.","url":"https://www.childcare.go.kr/?menuno=267","checkedAt":"2026-08-25"},"source":{"name":"아이사랑 임신육아종합포털(보건복지부) — 출산 징후 / 출산 준비","url":"https://www.childcare.go.kr/?menuno=266","checkedAt":"2026-08-25"},"note":"아이사랑 포털이 안내하
