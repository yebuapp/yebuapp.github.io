=441"},{"text":"개인용품(속옷, 세면도구, 물컵, 물통, 수유패드, 산모패드 또는 생리대, 유축기 깔대기, 물티슈 등)","source":"포항여성병원 입원 준비물 안내(공식)","url":"https://phw.co.kr/bbs/board.php?bo_table=notice&wr_id=21376"},{"text":"국민행복카드를 이용하여 전국 요양기관에서 본인부담금 결제","source":"국민행복카드 공식 안내(사회보장정보원)","url":"http://www.voucher.go.kr/voucher/pregnancy.do"}]},{"id":"hospital_route_plan","name":"진통이 오면 갈 길 정해 두기","category":"출산준비","confidence":"확인","who":"partner","stages":["pregnant"],"whatToDo":"분만할 병원까지 낮과 밤에 각각 얼마나 걸리는지 확인하고, 차가 없거나 술을 마신 상황이면 무엇을 부를지 정해 둡니다.","why":"37주부터는 언제든 진통이 올 수 있습니다. 규칙적인 진통이 5분 간격이 되면 그때 길을 찾기 시작하기에는 늦습니다.","when":{"anchor":"week","windows":[{"from":32,"to":45,"label":"임신 32주 이후"}],"text":"임신 32주 이후 — 37주부터는 언제든 갈 수 있어야 합니다"},"isLegalDeadline":false,"penalty":null,"where":"분만 예정 병원","legalBasis":null,"evidence":{"quote":"임신 37~42주 사이에는 언제든지 병원으로 갈 준비가 되어있어야 합니다.","url":"https://www.childcare.go.kr/?menuno=267","checkedAt":"2026-08-25"},"source":{"name":"아이사랑 임신육아종합포털(보건복지부) — 출산 징후","url":"https://www.childcare.go.kr/?menuno=267","checkedAt":"2026-08-25"},"note":"아이사랑 포털은 규칙적인 진통이 15분 간격일 때와 5분 간격일 때를 함께 적고 있습니다. 두 수치가 한 페이지에 있어 어느 쪽이 출발 시점인지 분명하지 않으니, 다니는 병원의 기준을 미리 물어 두세요.","unverified":["병원 도착 기준 진통 간격은 출처 한 곳 안에서도 15분과 5분이 함께 제시됩니다. 어느 쪽이 표준인지 공식 자료로 확정하지 못했습니다."]},{"id":"fertility_check_female","name":"여성 가임력 검사","category":"검사","confidence":"확인","who":"mother","stages":["preparing"],"whatToDo":"난소기능검사(AMH)와 부인과 초음파를 받고 검사비를 최대 13만원까지 지원받습니다.","why":"임신을 시도하기 전에 난소 기능과 자궁 상태를 미리 알아 두면, 임신이 잘 되지 않을 때 시간을 덜 낭비하고 대응할 수 있습니다. 질병관리청은 임신 전에 전문가와 상의하고 건강 상태를 평가하는 일이 매우 중요하다고 안내합니다.","when":{"anchor":"preconception","text":"임신 계획 단계 (20~49세는 언제든)"},"isLegalDeadline":false,"penalty":null,"where":"신청은 e보건소 누리집 또는 주소지 관할 보건소, 검사는 지정 의료기관","legalBasis":null,"evidence":{"quote":"모든 20~49세 남녀 중 검사 희망자(결혼, 자녀 여부 불문)","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097","checkedAt":"2026-08-26"},"source":{"name":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097","checkedAt":"2026-08-26"},"note":null,"unverified":["서울시 등 일부 지방자치단체가 별도 사업으로 운영하는지 여부를 확인하지 못했습니다.","지정 의료기관의 지역별 목록은 확인하지 못했습니다."],"whatIsIt":"보건복지부의 '임신 사전건강관리 지원사업'으로 받는 검사입니다. 여성은 난소기능검사(AMH, 난소에 남은 난자의 양을 짐작하게 해 주는 혈액검사)와 부인과 초음파(자궁과 난소를 초음파로 살펴보는 검사)를 받습니다. e보건소 누리집이나 주소지 관할 보건소에 신청한 뒤 지정된 의료기관에서 검사를 받습니다.","detailWhy":"임신을 시도하기 전에 난소 기능과 자궁 상태를 미리 알아 두면, 임신이 잘 되지 않을 때 시간을 덜 낭비하고 대응할 수 있습니다. 질병관리청은 임신 전에 전문가와 상의하고 건강 상태를 평가하는 일이 매우 중요하다고 안내합니다.","detailHow":"e보건소 누리집에서 온라인으로 신청하거나 주소지 관할 보건소에 방문해 신청합니다. 보건소에서 검사의뢰서를 받은 뒤 지정 의료기관에서 검사를 받고, 검사비를 먼저 낸 다음 보건소에 청구해 돌려받는 방식입니다. 지원 횟수는 연령 주기별로 1회씩 최대 3회입니다. 신청일로부터 3개월 이내에 검사를 받고, 검사일로부터 1개월 이내에 보건소에 청구해야 합니다. 청구일로부터 3개월 이내에 지급됩니다.","conditions":"20~49세 남녀 중 검사를 희망하는 사람이면 결혼 여부와 자녀 유무를 따지지 않습니다. 15~19세는 부부(예비부부·사실혼 포함)만 해당합니다. 내국인 배우자가 있는 외국인도 지원받을 수 있습니다.","cost":"검사비를 최대 13만원까지 국가가 지원합니다. 본인이 먼저 내고 보건소를 통해 돌려받습니다.","quotes":[{"text":"모든 20~49세 남녀 중 검사 희망자(결혼, 자녀 여부 불문)","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"난소기능검사(AMH), 부인과 초음파(자궁, 난소 등)","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"여성: 최대 13만원 / 남성: 최대 5만원","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"e보건소 온라인 신청 또는 주소지 관할 보건소 방문 신청","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"주기별 1회(최대 3회 지원) * 29세 이하(제1주기), 30~34세(제2주기), 35~49세(제3주기)","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"임신을 준비하는 과정에서 전문가와 상의하고 건강 상태를 평가하는 것은 성공적인 임신과 추후 출산할 신생아와 여성의 건강을 위하여 매우 중요합니다.","source":"질병관리청 국가건강정보포털 - 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"}]},{"id":"semen_analysis_partner","name":"남성 정액검사","category":"검사","confidence":"확인","who":"partner","stages":["preparing"],"whatToDo":"정액검사(정자정밀형태검사)를 받고 검사비를 최대 5만원까지 지원받습니다.","why":"임신은 두 사람의 일이므로 남성 쪽 상태도 함께 확인해야 원인을 빨리 좁힐 수 있습니다. 임신을 준비하는 단계에서 미리 검사해 두면 결과에 따라 생활 습관을 고치거나 진료를 받을 시간을 벌 수 있습니다.","when":{"anchor":"preconception","text":"임신 계획 단계 (20~49세는 언제든)"},"isLegalDeadline":false,"penalty":null,"where":"신청은 e보건소 누리집 또는 주소지 관할 보건소, 검사는 지정 의료기관","legalBasis":null,"evidence":{"quote":"정액검사(정자정밀형태검사)","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097","checkedAt":"2026-08-26"},"source":{"name":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097","checkedAt":"2026-08-26"},"note":null,"unverified":["남성이 검사받을 수 있는 지정 의료기관(비뇨의학과 등)의 구체적 명단과 지역별 분포는 확인하지 못했습니다.","난임 원인 중 남성 요인이 차지하는 비율은 원문 문구로 확정하지 못했습니다."],"whatIsIt":"보건복지부의 '임신 사전건강관리 지원사업'에서 남성이 받는 검사입니다. 검사 항목은 정액검사(정자정밀형태검사)로, 정자의 수와 모양 등을 살펴봅니다. 여성 검사와 마찬가지로 e보건소 누리집이나 주소지 관할 보건소에 신청한 뒤 지정 의료기관에서 검사를 받습니다.","detailWhy":"임신은 두 사람의 일이므로 남성 쪽 상태도 함께 확인해야 원인을 빨리 좁힐 수 있습니다. 임신을 준비하는 단계에서 미리 검사해 두면 결과에 따라 생활 습관을 고치거나 진료를 받을 시간을 벌 수 있습니다.","detailHow":"e보건소 누리집에서 온라인으로 신청하거나 주소지 관할 보건소에 방문해 신청합니다. 보건소에서 검사의뢰서를 받아 지정 의료기관에서 검사를 받고, 검사비를 먼저 낸 뒤 보건소에 청구해 돌려받습니다. 지원 횟수는 연령 주기별 1회씩 최대 3회입니다. 신청일로부터 3개월 이내에 검사를 받고, 검사일로부터 1개월 이내에 보건소에 청구해야 합니다. 청구일로부터 3개월 이내에 지급됩니다.","conditions":"20~49세 남녀 중 검사를 희망하는 사람이면 결혼 여부와 자녀 유무를 따지지 않습니다. 15~19세는 부부(예비부부·사실혼 포함)만 해당합니다. 내국인 배우자가 있는 외국인도 지원받을 수 있습니다.","cost":"검사비를 최대 5만원까지 국가가 지원합니다. 본인이 먼저 내고 보건소를 통해 돌려받습니다.","quotes":[{"text":"정액검사(정자정밀형태검사)","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"여성: 최대 13만원 / 남성: 최대 5만원","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"모든 20~49세 남녀 중 검사 희망자(결혼, 자녀 여부 불문)","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"},{"text":"e보건소 온라인 신청 또는 주소지 관할 보건소 방문 신청","source":"e보건소 공공보건포털 - 임신 사전건강관리 지원사업","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00003&menuId=200097"}]},{"id":"rubella_antibody_mmr","name":"풍진 항체 검사와 접종","category":"접종","confidence":"확인","who":"mother","stages":["preparing"],"whatToDo":"풍진 항체가 있는지 검사하고, 없으면 MMR 백신을 맞은 뒤 4주간 피임합니다.","why":"MMR 백신은 살아 있는 바이러스를 약하게 만든 생백신이라 임신한 뒤에는 맞기 어렵습니다. 그래서 임신 전에 항체를 확인하고 접종을 끝내 두어야 합니다. 질병관리청은 면역이 없는 가임기 여성에게 특히 예방접종이 필요하다고 안내합니다.","when":{"anchor":"preconception","text":"임신 시도 최소 4주 전 (접종 후 4주간 피임)"},"isLegalDeadline":false,"penalty":null,"where":"항체 검사와 접종은 의료기관, 접종 가능 여부는 관할 보건소에서도 확인할 수 있습니다.","legalBasis":null,"evidence":{"quote":"풍진에 대한 면역력이 없는 가임기 여성은 백신을 접종받고, 접종 후 4주간 피임을 해야 합니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5283","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털 - 홍역, 볼거리, 풍진","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5283","checkedAt":"2026-08-26"},"note":null,"unverified":["성인 풍진 항체 검사비와 MMR 접종비를 국가가 지원하는지, 무료 대상이 있는지는 확인하지 못했습니다.","임신 중 MMR 접종이 금기라는 문구를 질병관리청 문서에서 그대로 찾지는 못했습니다. 확인한 것은 '접종 후 4주간 피임' 문구입니다.","이미 임신한 뒤 항체가 없다고 확인된 경우의 처치(출산 후 접종 등)는 원문 문구로 확정하지 못했습니다."],"whatIsIt":"풍진에 대한 면역(항체)이 있는지 혈액으로 확인하는 검사입니다. 항체가 없으면 MMR 백신(홍역·유행성이하선염·풍진을 한 번에 예방하는 백신)을 맞습니다. 질병관리청은 MMR 접종으로 세 가지 병을 한꺼번에 예방할 수 있다고 안내합니다.","disease":"풍진은 발진과 림프절이 붓는 증상을 일으키는 바이러스 감염병입니다. 임신부가 걸리면 태아에게 선천성 풍진증후군이 생길 수 있는데, 선천성 백내장, 선천성 녹내장, 선천성 심장기형, 선천성 청력소실 등이 나타납니다. 질병관리청은 임신 1기에 감염되면 약 85%의 태아가 기형을 갖고 태어난다고 설명합니다. 풍진은 특별한 치료법이 없어 예방접종으로 미리 막는 것이 핵심입니다.","detailWhy":"MMR 백신은 살아 있는 바이러스를 약하게 만든 생백신이라 임신한 뒤에는 맞기 어렵습니다. 그래서 임신 전에 항체를 확인하고 접종을 끝내 두어야 합니다. 질병관리청은 면역이 없는 가임기 여성에게 특히 예방접종이 필요하다고 안내합니다.","detailHow":"의료기관에서 혈액검사로 풍진 항체를 확인합니다. 항체가 없으면 MMR 백신을 접종하고, 접종 후 4주간은 피임해야 합니다. 즉 임신 시도는 접종일로부터 최소 4주가 지난 뒤로 미루는 것이 안전합니다.","conditions":"풍진 항체 검사에서 면역이 없는 것으로 나온 가임기 여성이 접종 대상입니다.","quotes":[{"text":"풍진에 대한 면역력이 없는 가임기 여성은 백신을 접종받고, 접종 후 4주간 피임을 해야 합니다.","source":"질병관리청 국가건강정보포털 - 홍역, 볼거리, 풍진","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5283"},{"text":"임신 1기에 풍진에 감염되면 약 85%의 태아가 기형을 갖고 태어나지만","source":"질병관리청 국가건강정보포털 - 홍역, 볼거리, 풍진","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5283"},{"text":"선천성 백내장, 선천성 녹내장, 선천성 심장기형, 선천성 청력소실, 풍진 망막병증, 자반증, 비장비대, 황달, 소두(小頭)증, 정신지체, 뇌수막염, 뇌염 등을 보입니다.","source":"질병관리청 국가건강정보포털 - 홍역, 볼거리, 풍진","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5283"},{"text":"MMR 예방접종을 통해 세 가지 병을 한꺼번에 예방할 수 있습니다.","source":"질병관리청 국가건강정보포털 - 홍역, 볼거리, 풍진","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5283"},{"text":"임신을 하지 않은 가임기 여성이 풍진에 대한 면역이 없다면 특히 예방접종이 필요","source":"질병관리청 예방접종도우미 - 풍진","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=1122"},{"text":"풍진, 수두, B형 간염의 면역 여부 검사(면역이 없는 경우 예방접종 시행)","source":"임신육아종합포털 아이사랑 - 임신 전 상담 및 검사","url":"https://www.childcare.go.kr/?menuno=3"}]},{"id":"folic_acid","name":"엽산 복용","category":"의료","confidence":"확인","who":"mother","stages":["preparing","pregnant"],"whatToDo":"임신 약 1개월 전부터 하루 0.4~0.8mg의 엽산을 챙겨 먹습니다.","why":"신경관이 닫히는 시기가 임신 극초기라서, 임신을 알고 나서 시작하면 예방 시기를 놓칩니다. 아이사랑은 임신 전부터 임신 초기까지 엽산을 복용하면 태아 신경관 결손의 기형을 예방하는 데 도움이 된다고 안내합니다.","when":{"anchor":"preconception","text":"최소 임신 1개월 전부터 임신 12~14주까지","untilWeek":14},"isLegalDeadline":false,"penalty":null,"where":"엽산제 지원 신청은 관할 보건소 방문(의약품 기준), 일반 구입은 약국이나 의료기관","legalBasis":null,"evidence":{"quote":"최소 임신 약 1개월 전부터 하루 0.4mg-0.8mg의 엽산을 복용하고, 약 임신 12-14주까지 복용하는 것을 권장합니다.","url":"https://www.childcare.go.kr/?menuno=349","checkedAt":"2026-08-26"},"source":{"name":"임신육아종합포털 아이사랑 - 영양 및 식습관(임신준비)","url":"https://www.childcare.go.kr/?menuno=349","checkedAt":"2026-08-26"},"note":null,"unverified":["아직 임신하지 않은 여성이 보건소에서 엽산제를 미리 받을 수 있는지는 확인하지 못했습니다. 확인된 것은 지원 대상이 '임산부 본인'이고 지원 기간이 '임신 전·후 3개월'이라는 점까지입니다.","신경관결손 예방에 필요한 고용량 엽산(과거 신경관결손 임신력이 있는 경우 등)의 용량은 확인하지 못했습니다.","지자체별 엽산제 지원 수량과 지급 방식 차이는 개별 보건소 확인이 필요합니다."],"whatIsIt":"엽산은 비타민 B군의 하나로, 태아의 뇌와 척수가 만들어지는 데 쓰이는 영양소입니다. 임신육아종합포털 아이사랑은 음식 섭취와 상관없이 엽산제를 따로 복용하도록 권장한다고 안내합니다. 국가건강정보포털은 모든 가임기 여성에게 매일 400㎍(0.4mg)의 엽산 복용이 권장된다고 소개합니다.","disease":"신경관결손은 태아의 뇌와 척수가 될 신경관이 제대로 닫히지 않아 생기는 선천 기형입니다. 이 신경관은 임신 사실을 알기도 전인 임신 아주 초기에 만들어지고 닫힙니다. 그래서 임신을 확인한 뒤에 엽산을 먹기 시작하면 이미 늦을 수 있습니다.","detailWhy":"신경관이 닫히는 시기가 임신 극초기라서, 임신을 알고 나서 시작하면 예방 시기를 놓칩니다. 아이사랑은 임신 전부터 임신 초기까지 엽산을 복용하면 태아 신경관 결손의 기형을 예방하는 데 도움이 된다고 안내합니다.","detailHow":"특별한 위험 요인이 없다면 최소 임신 약 1개월 전부터 하루 0.4~0.8mg의 엽산을 복용하고, 임신 12~14주까지 이어서 복용하도록 권장합니다. 보건소에 임산부로 신고·등록하면 엽산제를 지원받을 수 있는데, 지원 기간은 임신 전·후 3개월(1인 기준 최대 3개월분)입니다. 의약품인 엽산제는 보건소 방문 신청만 가능합니다.","conditions":"임신을 계획하는 여성이 대상입니다. 다만 보건소 엽산제 지원은 관할 보건소에 임산부로 신고·등록한 경우에만 신청할 수 있습니다.","cost":"보건소 엽산제 지원은 관할 보건소에 임산부로 신고·등록한 뒤에만 신청할 수 있습니다. 임신을 확인하기 전에는 약국 등에서 직접 사야 합니다. 지원 기간은 임신 전·후 3개월이며 지자체 여건에 따라 수량과 시기가 다를 수 있습니다.","quotes":[{"text":"최소 임신 약 1개월 전부터 하루 0.4mg-0.8mg의 엽산을 복용하고, 약 임신 12-14주까지 복용하는 것을 권장합니다.","source":"임신육아종합포털 아이사랑 - 영양 및 식습관(임신준비)","url":"https://www.childcare.go.kr/?menuno=349"},{"text":"임신 전부터 임신 초기까지 엽산을 복용하면 태아 신경관 결손의 기형을 예방하는데 도움이 됩니다.","source":"임신육아종합포털 아이사랑 - 영양 및 식습관(임신준비)","url":"https://www.childcare.go.kr/?menuno=349"},{"text":"음식 섭취와 상관없이 추가적으로 엽산제를 따로 복용을 하도록 권장합니다.","source":"임신육아종합포털 아이사랑 - 영양 및 식습관(임신준비)","url":"https://www.childcare.go.kr/?menuno=349"},{"text":"미국 공중보건산업기구에서는 모든 가임기 여성에게 매일 400 ug의 엽산을 복용할 것을 권장하고 있습니다.","source":"질병관리청 국가건강정보포털 - 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"},{"text":"엽산제 지원의 경우 임신 전 · 후 3개월(1인기준 최대 3개월분)지원","source":"e보건소 공공보건포털 - 엽산제·철분제 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectParSupGudInfo.do?appFlg=05&menuId=200005"},{"text":"엽산제 및 철분제를 지원받기 위해서는 관할 보건소에 임산부로 신고 · 등록되어야 합니다.","source":"e보건소 공공보건포털 - 엽산제·철분제 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectParSupGudInfo.do?appFlg=05&menuId=200005"}]},{"id":"preconception_infection_screen","name":"수두·B형간염 등 면역 확인","category":"검사","confidence":"확인","who":"mother","stages":["preparing"],"whatToDo":"수두와 B형간염 면역 여부를 임신 전에 확인하고, 면역이 없으면 접종합니다.","why":"질병관리청은 이 세 가지 면역 여부가 임신 초기 기본 검사에 포함되어 있지만 미리 임신 전에 확인해 보고, 면역이 없으면 백신을 맞아 면역력을 얻을 수 있다고 안내합니다. 임신한 뒤에는 맞기 어려운 백신이 있으므로 순서를 앞당기는 것이 유리합니다.","when":{"anchor":"preconception","text":"임신 계획 단계 (임신 시도 전)"},"isLegalDeadline":false,"penalty":null,"where":"산부인과 등 의료기관","legalBasis":null,"evidence":{"quote":"풍진, 수두, B형 간염의 면역 여부는 임신 초기 기본 검사들에 포함되어 있지만 미리 임신 전에 확인해보고 면역이 없는 경우 백신을 맞아 면역력을 획득할 수 있습니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털 - 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"note":null,"unverified":["자궁경부암 백신(HPV)을 임신 전 확인 항목으로 명시한 공공 출처는 찾지 못했습니다. 예방접종도우미 HPV 페이지에는 접종 대상이 9~45세 남녀, 국가지원 대상이 12~17세 여성청소년 및 18~26세 저소득층 여성이라고만 되어 있습니다.","수두 백신 접종 후 임신을 피해야 하는 기간을 명시한 문구는 예방접종도우미 수두 페이지에서 찾지 못했습니다.","아이사랑 임신 전 검사 목록에 결핵·성병·톡소포자충증·거대세포바이러스 등이 함께 적혀 있으나, 원문 표기를 정확히 옮기지 못해 인용에서 제외했습니다.","B형간염 면역이 없는 경우의 구체적 접종 일정은 확인하지 못했습니다."],"whatIsIt":"질병관리청과 임신육아종합포털 아이사랑은 임신 전 관리에 필요한 검사로 풍진·수두·B형간염의 면역 여부 검사를 함께 제시합니다. 여기에 골반초음파와 자궁경부암 검진 등 부인과 진찰 및 검사도 임신 전 검사 목록에 들어 있습니다. 면역이 없는 것으로 확인되면 백신을 맞아 면역력을 갖출 수 있습니다.","disease":"수두는 온몸에 물집성 발진이 생기는 바이러스 감염병이고, B형간염은 간에 염증을 일으키는 바이러스 감염병입니다. 두 가지 모두 임신 전에 면역 여부를 확인하도록 안내되는 항목입니다. 면역이 없는 상태로 임신하면 임신 중에는 대응할 수 있는 선택지가 줄어듭니다.","detailWhy":"질병관리청은 이 세 가지 면역 여부가 임신 초기 기본 검사에 포함되어 있지만 미리 임신 전에 확인해 보고, 면역이 없으면 백신을 맞아 면역력을 얻을 수 있다고 안내합니다. 임신한 뒤에는 맞기 어려운 백신이 있으므로 순서를 앞당기는 것이 유리합니다.","detailHow":"의료기관에서 혈액검사로 수두와 B형간염(그리고 풍진)의 항체 유무를 확인합니다. 면역이 없으면 해당 백신을 접종합니다. 같은 임신 전 검사 목록에 골반초음파와 자궁경부암 검진 등 부인과 진찰도 함께 들어 있으므로 한 번에 상담받는 편이 효율적입니다.","conditions":"임신을 계획하는 여성이 대상입니다. 이미 면역이 확인된 항목은 다시 접종할 필요가 없습니다.","quotes":[{"text":"풍진, 수두, B형 간염의 면역 여부는 임신 초기 기본 검사들에 포함되어 있지만 미리 임신 전에 확인해보고 면역이 없는 경우 백신을 맞아 면역력을 획득할 수 있습니다.","source":"질병관리청 국가건강정보포털 - 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"},{"text":"풍진, 수두, B형 간염의 면역 여부 검사(면역이 없는 경우 예방접종 시행)","source":"임신육아종합포털 아이사랑 - 임신 전 상담 및 검사","url":"https://www.childcare.go.kr/?menuno=3"},{"text":"골반초음파, 자궁경부암 검진 등 부인과 진찰 및 검사","source":"임신육아종합포털 아이사랑 - 임신 전 상담 및 검사","url":"https://www.childcare.go.kr/?menuno=3"}]},{"id":"dental_checkup","name":"치과 검진과 스케일링","category":"의료","confidence":"확인","who":"mother","stages":["preparing"],"whatToDo":"임신 계획이 있으면 미리 스케일링과 구강검진을 받아 둡니다.","why":"임신 중에는 치과 치료를 받을 수 있는 시기가 제한됩니다. 국민건강보험공단 웹진은 임신 중 가장 적절한 치료 시기가 임신 중기(16~28주)라고 안내하는데, 그전에 문제가 생기면 대기해야 할 수 있습니다. 임신 전에 끝내 두면 이런 제약을 피할 수 있습니다.","when":{"anchor":"none","text":"임신 계획 단계 (임신 시도 전)"},"isLegalDeadline":false,"penalty":null,"where":"치과 의료기관","legalBasis":null,"evidence":{"quote":"임신 계획이 있다면 미리 스케일링과 구강검진을 실시할 것을 권장합니다.","url":"https://www.nhis.or.kr/static/alim/paper/oldpaper/202209/sub/04.html","checkedAt":"2026-08-26"},"source":{"name":"국민건강보험공단 건강보험 웹진","url":"https://www.nhis.or.kr/static/alim/paper/oldpaper/202209/sub/04.html","checkedAt":"2026-08-26"},"note":null,"unverified":["질병관리청 국가건강정보포털 '정상임신관리(임신 전 관리)' 문서와 아이사랑 '임신 전 상담 및 검사' 문서에는 치과 검진에 관한 문장이 없었습니다. 확인된 권고 출처는 국민건강보험공단 웹진 한 곳입니다.","임신 전 치과 검진이나 스케일링에 대한 별도 국가 지원 제도가 있는지는 확인하지 못했습니다.","치주질환이 조산이나 저체중아 위험과 연결된다는 설명은 원문 문구로 확정하지 못해 본문에서 제외했습니다."],"whatIsIt":"임신 전에 치아와 잇몸 상태를 점검하고 치석을 제거하는 스케일링을 받는 것입니다. 국민건강보험공단의 건강보험 웹진은 임신 계획이 있다면 미리 스케일링과 구강검진을 실시할 것을 권장한다고 안내합니다.","detailWhy":"임신 중에는 치과 치료를 받을 수 있는 시기가 제한됩니다. 국민건강보험공단 웹진은 임신 중 가장 적절한 치료 시기가 임신 중기(16~28주)라고 안내하는데, 그전에 문제가 생기면 대기해야 할 수 있습니다. 임신 전에 끝내 두면 이런 제약을 피할 수 있습니다.","detailHow":"치과에서 구강검진을 받고 필요하면 스케일링을 받습니다. 충치나 잇몸 치료가 필요하다고 나오면 임신을 시도하기 전에 치료를 마무리하는 편이 좋습니다.","conditions":"임신을 계획하는 사람이면 해당됩니다.","quotes":[{"text":"임신 계획이 있다면 미리 스케일링과 구강검진을 실시할 것을 권장합니다.","source":"국민건강보험공단 건강보험 웹진","url":"https://www.nhis.or.kr/static/alim/paper/oldpaper/202209/sub/04.html"},{"text":"가장 적절한 치료시기는 임신 중기(16~28주)입니다.","source":"국민건강보험공단 건강보험 웹진","url":"https://www.nhis.or.kr/static/alim/paper/oldpaper/202209/sub/04.html"}]},{"id":"quit_smoking_alcohol","name":"금연과 금주","category":"생활","confidence":"확인","who":"both","stages":["preparing"],"whatToDo":"임신을 계획하기 3~6개월 전부터 담배를 끊고, 임신 준비를 시작하면 부부가 함께 술을 끊습니다.","why":"임신 사실을 알게 되는 시점은 대개 생리가 늦어진 뒤라서, 그때 끊으면 이미 태아가 노출된 뒤일 수 있습니다. 아이사랑 포털은 아무리 소량이어도 알코올은 임신 중 안전하지 않은 것으로 간주한다고 안내하며, 임신 전부터 금주하라고 밝힙니다. 남성의 과도한 음주도 정자에 영향을 준다는 공공기관 자료가 있어 부부가 함께 끊는 편이 좋습니다.","when":{"anchor":"none","text":"담배는 임신 3~6개월 전부터, 술은 최소 2주 전부터"},"isLegalDeadline":false,"penalty":null,"where":"전국 보건소 금연클리닉, 금연상담전화 1544-9030, 금연치료 참여 병의원","legalBasis":null,"evidence":{"quote":"임신을 원하는 부부는 3-6개월 전부터 금연하는 것이 좋습니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털 – 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"note":null,"unverified":["남성의 흡연이 임신이나 정자에 미치는 영향을 직접 서술한 공공 출처 문장은 확인하지 못했습니다. 확인한 것은 남성 음주에 관한 문장뿐입니다.","배우자의 흡연으로 인한 간접흡연이 임신 결과에 미치는 영향을 명시한 국가건강정보포털 본문 문장은 확인하지 못했습니다(참고문헌 목록에만 관련 논문이 있었습니다).","임신을 준비하는 사람을 위한 별도의 금연 우대 프로그램이 있는지는 확인하지 못했습니다.","금주를 임신 확인 이후 언제까지 유지해야 하는지에 대한 별도 기준은 확인하지 못했습니다.","영아 돌연사 증후군이 2배 증가한다는 수치는 \"임신 기간 내내 하루 1개비라도 흡연한 경우\"에 대한 안내입니다. 임신 전 흡연만으로 같은 수치가 적용되는지는 확인하지 못했습니다."],"whatIsIt":"임신 전 금연·금주는 임신을 시도하기 전에 담배와 술을 미리 끊어 두는 것입니다. 질병관리청 국가건강정보포털은 담배와 술의 중단 시점을 각각 다르게 안내합니다. 담배는 임신 3~6개월 전부터, 술은 최소 2주 전부터 끊도록 권합니다.","disease":"술을 마신 상태에서 임신이 되면 태아 알코올스펙트럼 장애가 생길 수 있습니다. 얼굴 기형, 성장 지연, 중추 신경계(뇌와 척수) 이상, 심장·신장의 주요 기형까지 일으킬 수 있는 질환입니다. 흡연은 영아 돌연사 증후군(자던 아기가 갑자기 사망하는 것)의 위험을 2배로 높이는 것으로 안내되어 있습니다.","detailWhy":"임신 사실을 알게 되는 시점은 대개 생리가 늦어진 뒤라서, 그때 끊으면 이미 태아가 노출된 뒤일 수 있습니다. 아이사랑 포털은 아무리 소량이어도 알코올은 임신 중 안전하지 않은 것으로 간주한다고 안내하며, 임신 전부터 금주하라고 밝힙니다. 남성의 과도한 음주도 정자에 영향을 준다는 공공기관 자료가 있어 부부가 함께 끊는 편이 좋습니다.","detailHow":"보건소 금연클리닉은 지역사회 흡연자 누구나 무료로 이용할 수 있고, 6개월 동안 금연상담과 금연보조제를 제공합니다. 아이사랑 포털은 금연을 돕는 곳으로 지자체 보건소 금연클리닉, 금연상담전화(1544-9030), 국민건강보험공단 금연치료 건강보험 지원사업을 안내합니다. 병의원 금연치료는 8~12주 동안 6회 이내로 의사 진료·상담을 받는 방식입니다.","conditions":"담배를 피우거나 술을 마시는 사람. 여성과 남성 모두 해당합니다.","cost":"보건소 금연클리닉은 무료입니다. 병의원 금연치료는 3회차부터 본인부담금이 면제되고, 1~2회차에 낸 본인부담금도 프로그램을 이수한 뒤 신청하면 전액 환급됩니다.","quotes":[{"text":"임신을 원하는 부부는 3-6개월 전부터 금연하는 것이 좋습니다.","source":"질병관리청 국가건강정보포털 – 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"},{"text":"임신을 준비 중이라면 최소 2주 전부터는 금주하는 것이 좋습니다.","source":"질병관리청 국가건강정보포털 – 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"},{"text":"임신을 준비 중이라면 태아가 알코올에 노출되는 일이 없도록 임신 전부터 금주해야 합니다.","source":"임신육아종합포털 아이사랑 – 임신 전 음주","url":"https://www.childcare.go.kr/?menuno=346"},{"text":"태아 알코올스펙트럼 장애는 안면 기형, 성장 지연, 중추 신경계 이상, 신경 행동학적 장애, 그 외 심장, 신장 등 심각한 주요 기형을 유발할 수 있습니다.","source":"임신육아종합포털 아이사랑 – 임신 전 음주","url":"https://www.childcare.go.kr/?menuno=346"},{"text":"남성의 과도한 음주는 정자의 운동성을 저하시키고, 정자의 DNA 구조를 변화시켜 태어날 아기에게 선천성 결함을 일으킬 수 있습니다.","source":"한국건강증진개발원 절주온 – 남성의 음주도 태어날 아기에게 영향을 줄까요?","url":"https://www.khepi.or.kr/board/view?pageNum=1&rowCnt=8&no1=11&linkId=24813&menuId=MENU00645&schType=0&boardStyle=Gallery"},{"text":"모든 형태의 니코틴은 태반을 통과하여 태아의 뇌와 폐 발달에 안 좋은 영향을 끼칩니다.","source":"임신육아종합포털 아이사랑 – 임신 전 흡연","url":"https://www.childcare.go.kr/?menuno=347"},{"text":"금연상담전화(1544-9030)","source":"임신육아종합포털 아이사랑 – 임신 전 흡연","url":"https://www.childcare.go.kr/?menuno=347"},{"text":"지역사회 흡연자(청소년 포함) 누구나","source":"한국건강증진개발원 금연두드림 – 보건소 금연클리닉","url":"https://nosmk.khepi.or.kr/nsk/ntcc/subIndex/66.do"},{"text":"금연교육 및 금연상담서비스, CO 또는 코티닌 측정, 금연보조제 및 금연홍보물품 제공(6개월)","source":"한국건강증진개발원 금연두드림 – 보건소 금연클리닉","url":"https://nosmk.khepi.or.kr/nsk/ntcc/subIndex/66.do"},{"text":"1~2회차에 발생한 본인부담금을 전액 환급","source":"한국건강증진개발원 금연두드림 – 병의원 금연치료","url":"https://nosmk.khepi.or.kr/nsk/ntcc/subIndex/221.do"}]},{"id":"preconception_weight","name":"임신 전 체중 관리","category":"생활","confidence":"확인","who":"mother","stages":["preparing"],"whatToDo":"임신을 시도하기 전에 체질량지수를 확인하고 적정 범위로 맞춥니다.","why":"체중은 며칠 만에 바뀌지 않기 때문에 임신을 확인한 뒤에 조절하려 하면 늦습니다. 아이사랑 포털은 임신 전 적정 체중으로 감량하고 임신하는 것이 가장 바람직하다고 안내합니다. 질병관리청도 임신 전 본인의 비만도를 확인하고 임신 중 체중 증가량을 미리 계획하라고 권합니다.","when":{"anchor":"none","text":"임신을 시도하기 전에"},"isLegalDeadline":false,"penalty":null,"where":"산부인과 임신 전 상담","legalBasis":null,"evidence":{"quote":"체질량지수(BMI) 기준 18.5-23은 적절한 체중, 23-25는 과체중 25 이상은 비만으로 분류합니다.","url":"https://www.childcare.go.kr/?menuno=350","checkedAt":"2026-08-26"},"source":{"name":"임신육아종합포털 아이사랑 – 운동(체중, 비만)","url":"https://www.childcare.go.kr/?menuno=350","checkedAt":"2026-08-26"},"note":null,"unverified":["임신 전 저체중(체질량지수 18.5 미만) 자체가 임신에 어떤 영향을 주는지 직접 서술한 공공 출처 문장은 확인하지 못했습니다. 확인한 것은 모체의 영양 결핍이 태아 성장지연과 저체중으로 이어진다는 문장입니다.","임신 전 체중에 따른 임신 중 권장 체중 증가량 수치(예: 정상 체중 12~15kg)는 공식 원문에서 확인하지 못했습니다. 정확한 수치는 의료진에게 확인해 주세요.","남성의 체중이나 비만이 임신에 영향을 준다는 공공 출처 문장은 확인하지 못했습니다.","임신 전 체중 조절에 대한 국가 지원 제도가 있는지는 확인하지 못했습니다."],"whatIsIt":"체질량지수(BMI)는 몸무게(kg)를 키(m)의 제곱으로 나눈 값으로, 살이 찐 정도를 재는 지표입니다. 아이사랑 포털은 18.5~23을 적절한 체중, 23~25를 과체중, 25 이상을 비만으로 분류합니다. 임신 전 체중은 임신 중 늘려야 할 체중의 기준이 되기도 해서, 임신 전에 미리 확인해 두는 것이 좋습니다.","disease":"비만은 임신 전에는 난임(임신이 잘 되지 않는 상태)의 원인이 되고, 임신 뒤에는 유산, 고혈압, 당뇨병, 거대아(너무 큰 아기), 제왕절개 증가와 연관됩니다. 질병관리청은 비만이 임신당뇨, 고혈압, 자간전증(임신 중 혈압이 오르고 단백뇨가 생기는 병)의 위험을 높인다고 안내합니다. 반대로 모체의 영양이 부족하면 자궁 안에서 태아 성장이 지연되고 저체중으로 이어질 수 있습니다.","detailWhy":"체중은 며칠 만에 바뀌지 않기 때문에 임신을 확인한 뒤에 조절하려 하면 늦습니다. 아이사랑 포털은 임신 전 적정 체중으로 감량하고 임신하는 것이 가장 바람직하다고 안내합니다. 질병관리청도 임신 전 본인의 비만도를 확인하고 임신 중 체중 증가량을 미리 계획하라고 권합니다.","detailHow":"키와 몸무게를 재서 체질량지수를 계산해 보고, 18.5~23 범위를 벗어났다면 임신을 시도하기 전에 식사와 활동량을 조정합니다. 산부인과 임신 전 상담에서 식단과 생활방식은 정식 상담 항목에 들어 있으므로, 상담 때 체중 목표를 함께 정하면 됩니다.","conditions":"체질량지수가 18.5 미만이거나 23 이상인 경우 특히 해당합니다.","quotes":[{"text":"체질량지수(BMI) 기준 18.5-23은 적절한 체중, 23-25는 과체중 25 이상은 비만으로 분류합니다.","source":"임신육아종합포털 아이사랑 – 운동(체중, 비만)","url":"https://www.childcare.go.kr/?menuno=350"},{"text":"비만은 임신 전부터 난임의 원인이 되며, 임신 후에도 유산, 고혈압 및 당뇨병, 거대아, 제왕절개율 증가 등 여러 불량한 주산기예후와 연관","source":"임신육아종합포털 아이사랑 – 운동(체중, 비만)","url":"https://www.childcare.go.kr/?menuno=350"},{"text":"임신 전 적정 체중으로 감량하고 임신하는 것이 가장 바람직합니다.","source":"임신육아종합포털 아이사랑 – 운동(체중, 비만)","url":"https://www.childcare.go.kr/?menuno=350"},{"text":"비만은 임신당뇨, 고혈압, 자간전증의 위험을 높입니다.","source":"질병관리청 국가건강정보포털 – 식이영양(임산부)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5214"},{"text":"임신 전 본인의 비만도를 확인하고 임신 중 체중 증가량을 미리 계획하는 것이 좋습니다.","source":"질병관리청 국가건강정보포털 – 식이영양(임산부)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5214"},{"text":"모체의 영향결핍은 자궁 내 태아 성장지연, 저체중, 장기적으로는 인지능력장애, 운동능력장애, 만성질환과도 연관이 있습니다.","source":"임신육아종합포털 아이사랑 – 영양 및 식습관","url":"https://www.childcare.go.kr/?menuno=349"}]},{"id":"chronic_disease_preconception","name":"만성질환 임신 전 조절","category":"의료","confidence":"확인","who":"mother","stages":["preparing"],"whatToDo":"당뇨병·고혈압·갑상선질환이 있다면 임신 전에 주치의와 상의해 상태를 조절한 뒤 계획임신을 합니다.","why":"태아의 장기는 임신 8주경에 만들어지기 때문에, 임신을 확인한 뒤 혈당을 조절하기 시작하면 이미 늦습니다. 질병관리청은 임신 초기의 혈당 조절 정도가 선천성 기형과 유산의 발생 위험을 좌우한다고 설명합니다. 그래서 당뇨병이 있는 여성에게는 임신 전부터의 혈당 관리와 계획임신이 중요합니다.","when":{"anchor":"preconception","text":"임신을 시도하기 전, 병 상태가 안정될 때까지"},"isLegalDeadline":false,"penalty":null,"where":"해당 질환 주치의 진료와 산부인과 임신 전 상담","legalBasis":null,"evidence":{"quote":"당뇨병 여성은 임신 전부터 철저한 혈당 관리가 필요하므로 계획임신이 중요합니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/ntcnInfo/healthSourc/thtimtCntnts/thtimtCntntsView.do?thtimt_cntnts_sn=61","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털 – 임신 중 당뇨, 산모와 아이에게 어떤 영향이 있나요?","url":"https://health.kdca.go.kr/healthinfo/biz/health/ntcnInfo/healthSourc/thtimtCntnts/thtimtCntntsView.do?thtimt_cntnts_sn=61","checkedAt":"2026-08-26"},"note":null,"unverified":["임신 전 당화혈색소(HbA1c) 목표 수치를 제시한 공공·학회 출처 문장은 확인하지 못했습니다. 대한당뇨병학회 진료지침 원문은 파일 형식 문제로 열지 못했습니다.","갑상선기능저하증에서 임신 전 갑상선자극호르몬(TSH) 목표 수치를 제시한 문장은 확인하지 못했습니다.","고혈압 약 가운데 임신 전에 바꿔야 하는 구체적인 약 이름을 제시한 공공 출처 문장은 확인하지 못했습니다.","혈당·혈압이 어느 정도로 안정되어야 임신을 시도해도 되는지 기간이나 수치 기준은 확인하지 못했습니다.","남성의 만성질환이 임신에 영향을 준다는 공공 출처 문장은 확인하지 못했습니다.","인용한 안내문은 \"고령에서 임신을 계획하는 경우, 특히 만성 내과 질환이 있는 경우\"라는 맥락에서 나온 것입니다. 나이와 무관하게 같은 권고가 적용되는지는 확인하지 못했습니다."],"whatIsIt":"임신 전 관리는 임신 전에 기본 상담과 진찰을 받고 필요한 검사를 한 뒤, 과거 병력에 대한 상담과 관리를 함께 하는 것입니다. 당뇨병, 고혈압, 콩팥질환, 심장질환처럼 오래 앓는 병이 있으면 각 질환에 대한 검사를 추가로 받게 됩니다. 계획임신은 병 상태를 안정시킨 다음에 임신 시기를 정하는 것을 뜻합니다.","disease":"당뇨병이 있으면 임신 초기의 높은 혈당이 유산과 선천성 기형(태어날 때부터 있는 기형)의 위험을 높입니다. 갑상선기능항진증(갑상선호르몬이 너무 많이 나오는 병)의 방사성요오드 치료는 임신부에게 금기이며, 치료 후 최소 6개월이 지난 뒤 임신하도록 안내됩니다. 고혈압과 당뇨병은 고위험 임신을 일으키는 질환 목록에도 들어 있습니다.","detailWhy":"태아의 장기는 임신 8주경에 만들어지기 때문에, 임신을 확인한 뒤 혈당을 조절하기 시작하면 이미 늦습니다. 질병관리청은 임신 초기의 혈당 조절 정도가 선천성 기형과 유산의 발생 위험을 좌우한다고 설명합니다. 그래서 당뇨병이 있는 여성에게는 임신 전부터의 혈당 관리와 계획임신이 중요합니다.","detailHow":"임신 계획을 세우면 먼저 해당 질환의 주치의를 찾아 현재 상태와 복용 중인 약을 점검합니다. 산부인과에서는 임신 전 상담과 함께 만성질환별 검사를 받습니다. 만성 내과 질환이 있으면 임신이 질환에 미치는 영향과 질환이 임신에 미치는 영향을 전문의와 충분히 상의한 뒤 계획임신을 하도록 안내되어 있습니다. 진료 때 자신의 병과 수술 이력, 음주·흡연 여부를 산부인과 의사에게 반드시 먼저 알립니다.","conditions":"당뇨병, 고혈압, 갑상선질환, 심장질환, 콩팥질환, 천식 등 만성질환이 있는 경우","quotes":[{"text":"당뇨병 여성은 임신 전부터 철저한 혈당 관리가 필요하므로 계획임신이 중요합니다.","source":"질병관리청 국가건강정보포털 – 임신 중 당뇨, 산모와 아이에게 어떤 영향이 있나요?","url":"https://health.kdca.go.kr/healthinfo/biz/health/ntcnInfo/healthSourc/thtimtCntnts/thtimtCntntsView.do?thtimt_cntnts_sn=61"},{"text":"혈당이 임신 전이나 초기부터 높으면, 유산 또는 선천성 기형의 발생 위험이 증가합니다.","source":"질병관리청 국가건강정보포털 – 임신 중 당뇨, 산모와 아이에게 어떤 영향이 있나요?","url":"https://health.kdca.go.kr/healthinfo/biz/health/ntcnInfo/healthSourc/thtimtCntnts/thtimtCntntsView.do?thtimt_cntnts_sn=61"},{"text":"태아의 장기는 임신초기(임신 8주경)에 형성되기 때문에 임신초기의 혈당조절 정도가 선천성 기형과 유산의 발생 위험을 좌우합니다.","source":"질병관리청 국가건강정보포털 – 임신 중 당뇨, 산모와 아이에게 어떤 영향이 있나요?","url":"https://health.kdca.go.kr/healthinfo/biz/health/ntcnInfo/healthSourc/thtimtCntnts/thtimtCntntsView.do?thtimt_cntnts_sn=61"},{"text":"당뇨병, 고혈압, 신장 및 심장질환 등 만성 질환을 가진 경우 각각의 질환에 대한 검사","source":"임신육아종합포털 아이사랑 – 임신 전 상담 및 검사","url":"https://www.childcare.go.kr/?menuno=3"},{"text":"자신의 건강상태에 대한 정보를 반드시 산부인과 의사에게 미리 알려 도움을 받아야 합니다.","source":"임신육아종합포털 아이사랑 – 임신 전 상담 및 검사","url":"https://www.childcare.go.kr/?menuno=3"},{"text":"방사성요오드 치료를 받은 환자가 임신을 원할 경우에는 방사성요오드 치료 후 적어도 6개월 이상 경과한 후에 임신을 하는 것이 좋습니다.","source":"질병관리청 국가건강정보포털 – 갑상선기능항진증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=1831"},{"text":"만성 내과 질환이 있는 경우에는 임신이 질환에 미치는 영향과 질환이 임신에 미치는 영향에 대해 전문의와 충분한 상의를 거친 후 계획 임신을 하는 것이 좋습니다.","source":"임신육아종합포털 아이사랑 – 고위험 임신이란","url":"https://www.childcare.go.kr/?menuno=11"}]},{"id":"medication_review","name":"복용 중인 약 점검","category":"의료","confidence":"확인","who":"mother","stages":["preparing"],"whatToDo":"지금 먹고 있는 약을 임신 전에 의사에게 알리고, 임신 중에도 안전한 약인지 확인합니다.","why":"태아의 장기는 임신 아주 이른 시기에 만들어지기 때문에, 임신을 확인한 뒤에 약을 바꾸면 이미 노출된 뒤일 수 있습니다. 그래서 공식 안내는 임신 전에 미리 확인하라고 합니다. 또한 안내 문구는 약을 스스로 끊으라는 것이 아니라 주치의와 상의해 다른 약물로 변경하라는 쪽입니다.","when":{"anchor":"preconception","text":"임신을 시도하기 전, 임신 전 상담을 받을 때"},"isLegalDeadline":false,"penalty":null,"where":"산부인과 임신 전 상담, 해당 질환 주치의","legalBasis":null,"evidence":{"quote":"그 약물이 태아에게 영향을 주는지와 임신 중에 계속 복용해도 되는지를 전문의와 상의하는 것이 중요합니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털 – 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"note":null,"unverified":["한약, 건강기능식품, 처방 없이 사는 일반의약품에 대한 안내 문장은 해당 페이지에서 확인하지 못했습니다.","임신 몇 개월 전에 약을 바꿔야 하는지 구체적인 기간을 제시한 공공 출처 문장은 확인하지 못했습니다.","남성이 복용 중인 약이 임신에 영향을 준다는 공공 출처 문장은 확인하지 못했습니다.","아이소트레티노인·발프로산 외에 임신 전 중단·변경이 필요한 약물의 전체 목록은 확인하지 못했습니다."],"whatIsIt":"임신 전 상담에서 약물 복용력은 정식 상담 항목의 하나입니다. 지금 먹는 약을 모두 적어 의사에게 보여 주고, 임신 중에 계속 먹어도 되는 약인지, 다른 약으로 바꿔야 하는지 확인하는 과정입니다. 스스로 약을 끊는 것이 아니라, 바꿀지 말지를 의사와 함께 정하는 것이 핵심입니다.","disease":"아이소트레티노인은 중증 여드름 치료제이고, 발프로산은 뇌전증(경련이 반복되는 병)과 편두통 치료제입니다. 아이사랑 포털은 임신을 준비할 때 이 약들을 피해야 할 약물로 안내합니다. 고혈압, 당뇨병, 갑상샘기능항진증이 있는 여성도 지금 먹는 약을 임신 중에 안전한 약으로 바꿔야 하는지 확인해야 합니다.","detailWhy":"태아의 장기는 임신 아주 이른 시기에 만들어지기 때문에, 임신을 확인한 뒤에 약을 바꾸면 이미 노출된 뒤일 수 있습니다. 그래서 공식 안내는 임신 전에 미리 확인하라고 합니다. 또한 안내 문구는 약을 스스로 끊으라는 것이 아니라 주치의와 상의해 다른 약물로 변경하라는 쪽입니다.","detailHow":"임신 전 상담을 예약할 때 현재 먹는 약 이름과 용량을 적어 갑니다. 질병관리청은 기저질환으로 약을 복용 중이라면 임신 준비 시 의사에게 알리라고 안내합니다. 그 약이 태아에게 영향을 주는지, 임신 중에 계속 먹어도 되는지를 전문의와 상의합니다.","conditions":"정기적으로 약을 먹고 있는 경우. 여드름약이나 뇌전증약을 쓰고 있다면 특히 해당합니다.","quotes":[{"text":"그 약물이 태아에게 영향을 주는지와 임신 중에 계속 복용해도 되는지를 전문의와 상의하는 것이 중요합니다.","source":"질병관리청 국가건강정보포털 – 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"},{"text":"기저질환으로 약을 복용중이라면 임신 준비 시 의사에게 알려줍니다.","source":"질병관리청 국가건강정보포털 – 정상임신관리(임신 전 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"},{"text":"임신 전 주치의와 상의하여 다른 약물로 변경하는 것이 필요합니다","source":"임신육아종합포털 아이사랑 – 임신 전 약물복용","url":"https://www.childcare.go.kr/?menuno=348"},{"text":"고혈압, 당뇨병, 갑상샘기능항진증 등이 있는 여성도 전문의와 상담하여","source":"임신육아종합포털 아이사랑 – 임신 전 약물복용","url":"https://www.childcare.go.kr/?menuno=348"},{"text":"임신 전 관리의 내용은 임신 및 생식력, 가족력, 과거 병력, 약물 복용력, 식단과 생활방식, 사회력, 예방접종 등이 중요한 상담항목이 됩니다.","source":"임신육아종합포털 아이사랑 – 임신 전 상담 및 검사","url":"https://www.childcare.go.kr/?menuno=3"}]},{"id":"infertility_when_to_visit","name":"난임 검사 시작 시점","category":"의료","confidence":"확인","who":"both","stages":["preparing"],"whatToDo":"피임 없이 1년(여성이 35세 이상이면 6개월) 임신이 되지 않으면 부부가 함께 난임 검사를 받습니다.","why":"나이가 들수록 임신 가능성이 낮아지기 때문에, 기준 기간을 넘겼는데도 병원 방문을 미루면 치료를 시작할 시기가 늦어집니다. 자궁 질환이 있거나 난임과 관련된 기저 질환이 있으면 기준 기간을 다 채우지 않아도 더 일찍 진단받을 수 있습니다.","when":{"anchor":"none","text":"피임 없이 1년, 여성이 35세 이상이면 6개월"},"isLegalDeadline":false,"penalty":null,"where":"산부인과·비뇨의학과 진료. 시술비 지원 신청은 e보건소 온라인 또는 관할 보건소","legalBasis":null,"evidence":{"quote":"난임은 정상적인 부부관계에도 불구하고 1년간 임신이 되지 않을 때로 정의합니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5429","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털 – 불임증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5429","checkedAt":"2026-08-26"},"note":null,"unverified":["난임부부 시술비 지원의 연령별 지원 금액, 소득 기준, 적용 기준 연도는 확인하지 못했습니다. e보건소 안내에는 연령·소득 기준이 나와 있지 않았습니다. 보건소에 문의해 주세요.","대한생식의학회 자료는 40세 이상에서 6개월이면 검사를 권하는 의사가 많다고 설명해, 35세 기준과 표현이 다릅니다. 두 기준 가운데 어느 쪽이 현행 국내 표준인지는 확인하지 못했습니다.","35세 이상 6개월 기준은 상급종합병원 건강정보에서 확인했고, 질병관리청 본문에서는 '여성이 고령이면 더 일찍 검사할 수 있다'는 표현까지만 확인했습니다.","지방자치단체별 난임 시술비 추가 지원이나 한방 난임 지원 여부는 확인하지 못했습니다."],"whatIsIt":"난임은 피임하지 않고 정상적인 부부관계를 하는데도 1년간 임신이 되지 않는 상태를 말합니다. 여성의 나이에 따라 기준이 달라져서, 35세 이상은 6개월 이상 시도했는데 임신이 되지 않으면 해당합니다. 질병관리청도 1년이 되지 않더라도 여성이 고령이면 더 일찍 검사할 수 있다고 안내합니다.","disease":"난임의 원인은 여성 쪽에만 있지 않습니다. 질병관리청은 성별에 따른 원인 가운데 남성이 35% 정도라고 설명하고, 남성에 대한 검사도 같이 시행하는 것이 바람직하다고 안내합니다. 그래서 난임 검사는 부부가 함께 받는 것이 기본입니다.","detailWhy":"나이가 들수록 임신 가능성이 낮아지기 때문에, 기준 기간을 넘겼는데도 병원 방문을 미루면 치료를 시작할 시기가 늦어집니다. 자궁 질환이 있거나 난임과 관련된 기저 질환이 있으면 기준 기간을 다 채우지 않아도 더 일찍 진단받을 수 있습니다.","detailHow":"산부인과와 비뇨의학과를 찾아 병력 청취와 진찰을 받고, 여성은 배란·자궁·난관 관련 검사를, 남성은 정액검사를 받습니다. 남성 정액검사는 채취한 뒤 바로 처리해야 해서 반드시 미리 검사 날짜를 예약해야 하고, 검사 전 2~4일 정도 금욕이 필요합니다. 시술이 필요해지면 난임부부 시술비 지원사업을 신청할 수 있습니다.","conditions":"피임하지 않고 규칙적인 부부관계를 하는데도 임신이 되지 않는 경우","cost":"난임부부 시술비 지원사업이 있습니다. 출산당 25회(체외수정 최대 20회, 인공수정 최대 5회)까지 시술비의 일부를 지원합니다.","quotes":[{"text":"난임은 정상적인 부부관계에도 불구하고 1년간 임신이 되지 않을 때로 정의합니다.","source":"질병관리청 국가건강정보포털 – 불임증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5429"},{"text":"1년이 되지 않더라도 여성이 고령이면 좀 더 일찍 난임의 요인을 찾기 위한 검사를 할 수 있습니다.","source":"질병관리청 국가건강정보포털 – 불임증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5429"},{"text":"남성에 대한 검사도 같이 시행하는 것이 바람직합니다","source":"질병관리청 국가건강정보포털 – 불임증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5429"},{"text":"35세 이상 : 6개월 이상 시도했으나 임신이 되지 않는 경우","source":"서울아산병원 건강정보 – 여성 난임","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31932"},{"text":"피임을 하지 않은 상태에서 규칙적인 성생활을 1년 이상 지속했음에도 불구하고 임신에 도달하지 못하는 상태","source":"서울아산병원 건강정보 – 여성 난임","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31932"},{"text":"1년이 지나도 임신이 되지 않는 상태를 말합니다.","source":"임신육아종합포털 아이사랑 – 난임이란","url":"https://www.childcare.go.kr/?menuno=262"},{"text":"정액검사를 실시할 때는 채취 후 바로 전 처리와 현미경 검사를 진행해야 하므로 반드시 사전에 검사날짜를 예약해야 합니다","source":"임신육아종합포털 아이사랑 – 난임 검사","url":"https://www.childcare.go.kr/?menuno=263"},{"text":"출산당 25회(체외수정 최대 20회, 인공수정 최대 5회)","source":"e보건소 공공보건포털 – 난임부부 시술비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009"},{"text":"법적 혼인상태에 있는 난임부부 및 사실혼 관계","source":"e보건소 공공보건포털 – 난임부부 시술비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009"}]},{"id":"infertility_treatment_support","name":"난임 시술비 지원","category":"의료","confidence":"확인","who":"both","stages":["preparing"],"whatToDo":"난임 진단서를 받았다면 시술을 시작하기 전에 보건소나 e보건소에서 시술비 지원을 신청하세요.","why":"지원결정통지서가 발급된 이후에 발생한 시술비만 지원되고 이미 끝난 시술은 소급 지원이 되지 않습니다. 그래서 시술을 시작하기 전에 신청을 끝내야 합니다. 나이가 오를수록 성공률이 낮아지므로 난임이 의심되면 진단을 미루지 않는 편이 유리합니다.","when":{"anchor":"none","text":"난임 진단 후, 시술을 시작하기 전"},"isLegalDeadline":false,"penalty":null,"where":"주소지 관할 보건소 또는 e보건소 누리집","legalBasis":null,"evidence":{"quote":"법적 혼인상태에 있는 난임부부 및 사실혼 관계(단, 2회차부터 신청 가능하며, 최초 신청은 관할 보건소에 방문 필요)","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009","checkedAt":"2026-08-26"},"source":{"name":"e보건소 공공보건포털 — 난임부부 시술비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009","checkedAt":"2026-08-26"},"note":null,"unverified":["시술 종류별·연령별 지자체 지원 상한액(1회당 얼마)은 지역마다 달라 전국 공통 금액을 확인하지 못했습니다. 보건소에 확인하세요.","난임 진단서를 받기 위한 요건(임신 시도 기간 등)은 확인하지 못했습니다.","지자체가 요구하는 거주 기간 요건이 있는지는 확인하지 못했습니다. 지역마다 다르니 보건소에 확인하세요."],"whatIsIt":"난임부부 시술비 지원사업입니다. 체외수정(시험관 아기 시술)과 인공수정에 건강보험이 적용되고, 그 위에 지방자치단체가 본인부담금과 비급여 진료비를 추가로 지원합니다. 근거 법령은 모자보건법 제11조(난임 극복 지원사업)입니다. 지원 범위에는 배아동결비, 유산방지제, 착상보조제 등 비급여 3종도 들어갑니다.","disease":"난임은 의사의 난임 진단서로 확인되는 상태입니다. 보건복지부는 국내 체외수정의 임신 성공률이 평균 약 37%이고 만 35세(여성 기준)를 기점으로 낮아지기 시작해 40세 이후에는 매우 낮아진다고 밝혔습니다. 높은 연령대의 난임 시술은 다태임신(쌍둥이 이상 임신)이나 조산 같은 고위험 임신 가능성을 높일 수 있습니다.","detailWhy":"지원결정통지서가 발급된 이후에 발생한 시술비만 지원되고 이미 끝난 시술은 소급 지원이 되지 않습니다. 그래서 시술을 시작하기 전에 신청을 끝내야 합니다. 나이가 오를수록 성공률이 낮아지므로 난임이 의심되면 진단을 미루지 않는 편이 유리합니다.","detailHow":"의사에게 난임 진단서를 받은 뒤 주소지 관할 보건소를 방문하거나 e보건소 누리집에서 신청합니다. 사실혼 관계에 대해서는 '2회차부터 신청 가능하며, 최초 신청은 관할 보건소에 방문 필요'라고 안내되어 있습니다. 지원결정통지서를 받은 다음에 시술을 시작해야 지원 대상으로 인정됩니다.","conditions":"법적 혼인 상태의 난임부부와 사실혼 관계가 대상입니다. 부부 중 최소 한 명은 주민등록이 되어 있는 대한민국 국적자여야 하고, 부부 모두 건강보험 가입과 보험료 고지 여부가 확인되어야 합니다. 소득 기준과 연령 기준은 2024년에 전면 폐지되어 지금은 없습니다.","cost":"건강보험으로 출산당 총 25회(인공수정 5회, 체외수정 20회)까지 본인부담 30%로 급여가 적용됩니다. 여기에 더해 지방자치단체가 시술비 본인부담금과 비급여 진료비를 90% 수준까지 지원합니다. 시술 1회당 구체적인 지원 상한액은 지역마다 다르니 보건소에 확인하세요.","quotes":[{"text":"법적 혼인상태에 있는 난임부부 및 사실혼 관계(단, 2회차부터 신청 가능하며, 최초 신청은 관할 보건소에 방문 필요)","source":"e보건소 공공보건포털 — 난임부부 시술비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009"},{"text":"부부 중 최소한 한명은 주민등록이 되어 있는 대한민국 국적 소유자","source":"e보건소 공공보건포털 — 난임부부 시술비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009"},{"text":"출산당 25회(체외수정 최대 20회, 인공수정 최대 5회)","source":"e보건소 공공보건포털 — 난임부부 시술비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009"},{"text":"지원범위 : 체외수정(신선배아, 동결배아), 인공수정 시술비 중 일부 및 전액본인 부담금,","source":"e보건소 공공보건포털 — 난임부부 시술비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&menuId=200009"},{"text":"(소득 및 연령기준) 2024년도 전면 폐지, (지원횟수) ‘부부당 25회’에서 → ‘아이당 25회’로 확대","source":"보건복지부 보도참고자료(2026.5.14.) — 국가와 지방자치단체 난임부부 지원으로 2025년도 48,981명 태어나","url":"https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1490515&mid=a10503010100"},{"text":"건강보험으로 출산당 총 25회(인공수정 5회·체외수정 20회)까지 급여 적용(본인부담 30%)","source":"보건복지부 보도참고자료(2026.5.14.) — 국가와 지방자치단체 난임부부 지원으로 2025년도 48,981명 태어나","url":"https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1490515&mid=a10503010100"},{"text":"지방자치단체는 시술비 본인부담금 및 비급여 진료비 90% 수준까지 지원","source":"보건복지부 보도참고자료(2026.5.14.) — 국가와 지방자치단체 난임부부 지원으로 2025년도 48,981명 태어나","url":"https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1490515&mid=a10503010100"},{"text":"국내 난임 시술의 임신 성공률은 체외수정 기준 평균 약 37%지만, 만 35세(여성 기준)를 기점으로 감소하기 시작해서 40세 이후에는 매우 낮아지는 것으로 나타났다.","source":"보건복지부 보도참고자료(2026.5.14.) — 국가와 지방자치단체 난임부부 지원으로 2025년도 48,981명 태어나","url":"https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1490515&mid=a10503010100"}]},{"id":"gamete_cryopreservation","name":"난자·정자 냉동 지원","category":"의료","confidence":"확인","who":"both","stages":["preparing"],"whatToDo":"항암 치료 등으로 영구 불임이 예상되면 난자·정자 동결·보존 비용 지원을 신청하세요.","why":"생식세포는 치료로 손상되기 전에 채취해야 합니다. 안내에도 열거된 수술·치료를 진행할 예정이거나 진행을 마친 뒤에도 생식 기능 보전이 필요한 경우 지원한다고 되어 있습니다. 신청 기한이 채취일로부터 6개월이라, 치료 일정과 함께 미리 계획해야 합니다.","when":{"anchor":"none","text":"생식세포 채취일로부터 6개월 이내 신청"},"isLegalDeadline":false,"penalty":null,"where":"주민등록상 주소지 관할 보건소 또는 e보건소 누리집","legalBasis":null,"evidence":{"quote":"모자보건법 시행령 제14조에 해당하는 의학적 사유에 의한 생식건강의 손상으로 영구적 불임이 예상되는 자","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116","checkedAt":"2026-08-26"},"source":{"name":"e보건소 공공보건포털 — 영구 불임 예상 난자·정자 냉동 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116","checkedAt":"2026-08-26"},"note":null,"unverified":["의학적 사유가 없는 사람의 선택적 난자 냉동 비용을 지원하는 사업이 있는지는 확인하지 못했습니다. 지역마다 다를 수 있으니 보건소에 확인하세요.","지원 금액이 지방자치단체에 따라 달라지는지, 아니면 전국 공통 기준인지는 확인하지 못했습니다.","보관 기간 연장 비용은 지원 제외라고만 되어 있고, 기본 보관 지원 기간이 몇 년인지는 확인하지 못했습니다."],"whatIsIt":"영구 불임 예상 난자·정자 냉동 지원 사업입니다. 의학적 사유로 생식 기능을 영구히 잃을 것으로 예상되는 사람에게 검사, 과배란유도, 생식세포 채취·동결·보관 비용의 일부를 지원합니다. 근거 법령은 모자보건법 제11조의7(생식세포 동결·보존 등을 위한 지원)입니다.","disease":"항암 치료(항암제 투여, 복부나 골반이 포함된 방사선 치료, 면역 억제 치료)와 난소부분절제술·고환적출술 같은 수술, 터너 증후군과 클라인펠터 증후군 등 염색체 이상은 생식 기능을 영구적으로 잃게 만들 수 있습니다. 안내에는 항호르몬 치료(내분비 치료)도 항암 치료에 포함된다고 되어 있습니다. 치료 전에 난자나 정자를 얼려 두면 나중에 임신을 시도할 여지가 남습니다.","detailWhy":"생식세포는 치료로 손상되기 전에 채취해야 합니다. 안내에도 열거된 수술·치료를 진행할 예정이거나 진행을 마친 뒤에도 생식 기능 보전이 필요한 경우 지원한다고 되어 있습니다. 신청 기한이 채취일로부터 6개월이라, 치료 일정과 함께 미리 계획해야 합니다.","detailHow":"난임 시술 의료기관에서 생식세포를 채취·동결·보존하고 비용을 낸 뒤, 의사의 진단서와 동결·보존 확인서, 진료비 영수증과 세부내역서를 갖춰 신청합니다. 방문 신청은 주민등록상 주소지 관할 보건소에서 하고, 온라인은 e보건소에서 인증서 로그인 후 신청합니다. 온라인으로 신청하면 본인 명의 통장 사본만 첨부하면 됩니다.","conditions":"모자보건법 시행령 제14조에 열거된 의학적 사유로 영구적 불임이 예상되는 사람이 대상입니다. 주민등록이 되어 있는 대한민국 국적자이면서 건강보험 가입이 확인되어야 합니다. 주민등록 말소자와 재외국민 주민등록자는 제외됩니다.","cost":"본인부담금의 50%를 지원하며 여성은 최대 200만 원, 남성은 최대 30만 원입니다. 생애 1회만 지원됩니다. 입원료, 동결·보존과 관련 없는 검사료, 연장 보관료는 지원되지 않습니다.","quotes":[{"text":"모자보건법 시행령 제14조에 해당하는 의학적 사유에 의한 생식건강의 손상으로 영구적 불임이 예상되는 자","source":"e보건소 공공보건포털 — 영구 불임 예상 난자·정자 냉동 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116"},{"text":"검사, 과배란유도, 생식세포(난자·정자) 채취, 동결, 보관비용 일부 지원","source":"e보건소 공공보건포털 — 영구 불임 예상 난자·정자 냉동 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116"},{"text":"지원 횟수 : 생애 1회","source":"e보건소 공공보건포털 — 영구 불임 예상 난자·정자 냉동 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116"},{"text":"지원 금액 : 본인부담금의 50%, 여) 최대 200만원, 남) 최대 30만원","source":"e보건소 공공보건포털 — 영구 불임 예상 난자·정자 냉동 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116"},{"text":"신청 기한: 생식세포(난자·정자) 채취일로부터 6개월 이내 신청","source":"e보건소 공공보건포털 — 영구 불임 예상 난자·정자 냉동 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116"},{"text":"방문 신청 : 주민등록상 주소지 관할 보건소","source":"e보건소 공공보건포털 — 영구 불임 예상 난자·정자 냉동 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00001&heSrvcCd=005&menuId=200116"},{"text":"이에 정부는 임신 사전 건강관리사업(가임력 검사 지원), 영구불임 예상 남·녀 생식세포 보존 지원, 난임·임산부 심리상담센터 지속 확충 등 다양한 정책을 실시하고 있다.","source":"보건복지부 보도참고자료(2026.5.14.) — 국가와 지방자치단체 난임부부 지원으로 2025년도 48,981명 태어나","url":"https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1490515&mid=a10503010100"}]},{"id":"maternity_card_balance_and_deadline","name":"국민행복카드 잔액·사용기한 확인하기","category":"행정","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"국민행복카드로 진료비를 결제하고 잔액과 사용기한(분만예정일로부터 2년)을 확인해 소멸되지 않게 관리합니다.","why":"정부24 안내에 따르면 사용기한 내 사용하지 못한 잔액은 자동 소멸되므로, 중기에 받는 정밀초음파·임신성 당뇨병 선별검사 등 진료비를 이 카드로 결제하며 잔액과 기한을 확인해 두어야 소멸을 피할 수 있습니다.","when":{"anchor":"none","text":"카드 발급 후 진료비를 결제할 때마다 — 사용기한은 분만예정일로부터 2년"},"isLegalDeadline":false,"penalty":null,"where":null,"legalBasis":null,"evidence":{"quote":"사용 종료일: 분만예정일(출산일, 유산일, 사산일)로부터 2년","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000007672","checkedAt":"2026-08-26"},"source":{"name":"정부24 - 건강보험 임신·출산 진료비 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000007672","checkedAt":"2026-08-26"},"note":null,"unverified":[],"whatIsIt":"임신·출산 진료비 지원(국민행복카드)은 건강보험공단이 임산부에게 발급하는 바우처 카드로, 산부인과 등 진료비 본인부담금을 카드에 충전된 포인트로 결제할 수 있게 해주는 제도입니다. 이미 발급받았다면 이번에는 '신청'이 아니라 '사용과 잔액·기한 관리'가 할 일입니다.","detailWhy":"정부24 안내에 따르면 사용기한 내 사용하지 못한 잔액은 자동 소멸되므로, 중기에 받는 정밀초음파·임신성 당뇨병 선별검사 등 진료비를 이 카드로 결제하며 잔액과 기한을 확인해 두어야 소멸을 피할 수 있습니다.","detailHow":"카드 발급 시 받은 국민행복카드로 병원 진료비를 결제하면 자동으로 지원금이 차감됩니다. 카드사 홈페이지/앱이나 국민행복카드 사이트에서 잔액조회가 가능하며, 사용 종료일(분만예정일로부터 2년)이 지나면 잔액은 자동 소멸됩니다.","conditions":"건강보험 가입자 또는 피부양자로 임신·출산(유산·사산 포함)이 확인된 임산부. 2세 미만 자녀의 법정대리인도 잔여 포인트로 진료비 지급이 가능합니다.","cost":"카드 자체는 무료 발급. 지원금은 일태아 100만원(분만취약지 +20만원), 다태아 140만원 기본 + 태아당 추가 지원. 미사용 잔액은 사용기한 경과 시 자동 소멸.","deadlineText":"사용기한: 분만예정일(출산일·유산일·사산일)로부터 2년, 미사용 잔액은 자동 소멸","quotes":[{"text":"사용 종료일: 분만예정일(출산일, 유산일, 사산일)로부터 2년","source":"정부24 - 건강보험 임신·출산 진료비 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000007672"},{"text":"사용 기간 내 사용하지 못한 잔액은 자동 소멸","source":"정부24 - 건강보험 임신·출산 진료비 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000007672"},{"text":"임신 1회당 100만원(다태아 임신부의 경우 140만원 기본지급)","source":"정부24 - 건강보험 임신·출산 진료비 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000007672"},{"text":"분만취약지의 경우 20만원 추가지원","source":"정부24 - 건강보험 임신·출산 진료비 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000007672"},{"text":"다태아 임산부의 경우 태아당 100만원이 되도록 추가지원","source":"정부24 - 건강보험 임신·출산 진료비 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000007672"}]},{"id":"maternity_badge_pickup","name":"임산부 배지 받기","category":"행정","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"임신확인서를 들고 지하철역 고객안전실이나 보건소에 가서 임산부 배지를 받아 착용합니다.","why":"서울시 안내에 따르면 임신 초기·중기처럼 배가 잘 드러나지 않는 시기에는 주변에서 임산부인지 알아채기 어려워 배지의 필요성이 큽니다.","when":{"anchor":"pregnancyStart","text":"임신 사실을 확인한 뒤부터, 배가 눈에 띄기 전인 중기 초반에"},"isLegalDeadline":false,"penalty":null,"where":null,"legalBasis":null,"evidence":{"quote":"임신 확인서를 지참한 후 바로 가까운 지하철역 고객안전실에 방문하면 임산부 배지를 받을 수 있다.","url":"https://mediahub.seoul.go.kr/archives/2007995","checkedAt":"2026-08-26"},"source":{"name":"서울시 - 내 손안에 서울","url":"https://mediahub.seoul.go.kr/archives/2007995","checkedAt":"2026-08-26"},"note":null,"unverified":["지역(서울 외 지자체)별로 배지 배부 방식과 재고 운영이 다를 수 있습니다.","수령·착용 시기를 주 수로 못박은 공식 문구는 없습니다(공식 표현은 \"임신 초기\"까지). 그래서 이 항목에 주차 창을 만들지 않았습니다."],"whatIsIt":"임산부 배지는 임신한 사람임을 표시해 대중교통 배려석 등에서 배려를 받을 수 있게 해주는 배지(뱃지)로, 지하철역이나 보건소에서 무료로 받을 수 있습니다.","detailWhy":"서울시 안내에 따르면 임신 초기·중기처럼 배가 잘 드러나지 않는 시기에는 주변에서 임산부인지 알아채기 어려워 배지의 필요성이 큽니다.","detailHow":"임신확인서를 지참하고 가까운 지하철역 고객안전실을 방문하면 즉시 수령할 수 있습니다. 보건소에 임산부 등록을 하러 갈 때 함께 받을 수도 있습니다(같은 기사에서 확인). 다만 기사에 따르면 보건소는 거리·근무시간 제약이 있어 지하철역 수령이 더 간편합니다.","conditions":"임신이 확인된 임산부 누구나 대상이며 별도 소득 요건은 없습니다. 지하철역별로 배지 재고 여부가 달라 규모가 큰 역을 방문하는 것이 권장됩니다.","cost":"무료 수령","quotes":[{"text":"임신 확인서를 지참한 후 바로 가까운 지하철역 고객안전실에 방문하면 임산부 배지를 받을 수 있다.","source":"서울시 - 내 손안에 서울","url":"https://mediahub.seoul.go.kr/archives/2007995"},{"text":"배지를 달고 임산부 배려석으로 가면 자리를 양보받을 수 있기 때문이다.","source":"서울시 - 내 손안에 서울","url":"https://mediahub.seoul.go.kr/archives/2007995"},{"text":"특히 각별한 주의가 필요한 임신 초기라면 임부인지 잘 모르는 경우가 많기 때문에 임산부 배지는 필수품이기도 하다.","source":"서울시 - 내 손안에 서울","url":"https://mediahub.seoul.go.kr/archives/2007995"},{"text":"보건복지부는 임신 초기에 외견상 임신 여부를 구분하기 어렵다는 점에서 초기 임산부를 쉽게 알아보고 배려할 수 있도록 주요 서울 지하철역*과 전국 보건소를 통하여 임산부 배려 엠블럼 ’가방고리’와 임산부 ‘배려카드’를 무료 배포할 예정이고,","source":"보건복지부 (mohw.go.kr) 보도자료","url":"https://mohw.go.kr/board.es?act=view&bid=0027&list_no=259443&mid=a10503010200&nPage=967&tag="}]},{"id":"iron_supplement_start","name":"철분제 복용 시작하기","category":"의료","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"임신 16주가 되면 관할 보건소에 임신확인서를 제시해 철분제 5개월분을 신청·수령합니다.","why":"정부24 공식 서비스 안내 페이지에 '(철분제) 임신 16주부터 철분제 5개월분'이라고 지원시기와 지원내용이 명시되어 있습니다.","when":{"anchor":"week","windows":[{"from":16,"to":45,"label":"임신 16주 이후"}],"text":"임신 16주부터 분만 전까지 (보건소 지원은 16주부터 5개월분)"},"isLegalDeadline":false,"penalty":null,"where":"주소지 관할 보건소 / 정부24(www.gov.kr)","legalBasis":null,"evidence":{"quote":"(철분제) 임신 16주 이상","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000016094","checkedAt":"2026-08-26"},"source":{"name":"정부24(행정안전부) - 임산부 엽산제, 철분제 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000016094","checkedAt":"2026-08-26"},"note":null,"unverified":["철분제가 임신 16주부터 필요한 이유(철 요구량 증가 등 생리적 근거)를 설명하는 질병관리청 공식 문구는 확인하지 못했습니다. 지원사업의 시기와 내용만 확인했습니다. 정확한 설명은 질병관리청에 확인해 주세요.","택배 배송비의 구체적인 금액(3,500원 등)은 공식 원문에서 확인하지 못했습니다. 정확한 금액은 해당 기관에 문의해 주세요."],"whatIsIt":"관할 보건소에서 임신부에게 철분제를 지원하는 사업으로, 정부24를 통해서도 신청할 수 있습니다.","detailWhy":"정부24 공식 서비스 안내 페이지에 '(철분제) 임신 16주부터 철분제 5개월분'이라고 지원시기와 지원내용이 명시되어 있습니다.","detailHow":"보건소 방문 등록 또는 온라인(정부24, www.gov.kr) 신청. 구비서류는 임신확인서. 방문 수령 또는 택배 수령 중 선택 가능하며, 택배 수령을 선택하면 배송비는 본인부담이며, 금액은 보건소마다 다를 수 있습니다.","conditions":"임신 16주 이상 임신부. 원문에 별도의 소득기준이나 제외대상은 명시되어 있지 않습니다.","cost":"현물 지원(무료). 택배 수령 선택 시 배송비만 본인부담.","quotes":[{"text":"(철분제) 임신 16주 이상","source":"정부24(행정안전부) - 임산부 엽산제, 철분제 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000016094"},{"text":"(철분제) 임신 16주부터 철분제 5개월분","source":"정부24(행정안전부) - 임산부 엽산제, 철분제 지원","url":"https://www.gov.kr/portal/service/serviceInfo/SD0000016094"}]},{"id":"flu_vaccine_pregnant","name":"인플루엔자(독감) 무료 예방접종 받기","category":"접종","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"임신 중이라면 주수에 상관없이 가까운 위탁의료기관이나 보건소를 방문해 산모수첩·임신확인서 등을 제시하고 인플루엔자 예방접종을 무료로 받습니다.","why":"질병관리청 예방접종도우미 원문에 '산모수첩 등을 통해 임신여부를 확인한 임신부'가 지원대상이며 임신주수 무관이라고 명시되어 있고, 정책브리핑 기사에도 '임신부, 65세 이상 어르신...이 국가지원 대상이다'라고 확인됩니다.","when":{"anchor":"fixed","from":"2026-09-21","to":"2027-04-30","text":"임신 주수와 무관하게 접종 가능. 2026-2027절기 국가예방접종 지원기간 2026년 9월 21일 ~ 2027년 4월 30일 (절기마다 날짜가 다르다)"},"isLegalDeadline":false,"penalty":null,"where":"전국 위탁의료기관(약 2만3천여 개소) 또는 보건소, 주소지 무관","legalBasis":null,"evidence":{"quote":"산모수첩 등을 통해 임신여부를 확인한 임신부","url":"https://nip.kdca.go.kr/irhp/mngm/goVcntMngm.do?menuCd=333&menuLv=3","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 예방접종도우미 - 인플루엔자 국가예방접종 사업","url":"https://nip.kdca.go.kr/irhp/mngm/goVcntMngm.do?menuCd=333&menuLv=3","checkedAt":"2026-08-26"},"note":null,"unverified":["2026~2027절기(2026년 하반기 접종분)의 정확한 지원 시작일은 아직 공식 발표되지 않았습니다(2026년 8월 기준). 매년 9월 하순경 질병관리청이 공고합니다."],"whatIsIt":"질병관리청이 임신부를 인플루엔자 국가예방접종 지원대상으로 정해, 지원 기간 중 위탁의료기관이나 보건소에서 무료로 접종해 주는 사업입니다.","detailWhy":"질병관리청 예방접종도우미 원문에 '산모수첩 등을 통해 임신여부를 확인한 임신부'가 지원대상이며 임신주수 무관이라고 명시되어 있고, 정책브리핑 기사에도 '임신부, 65세 이상 어르신...이 국가지원 대상이다'라고 확인됩니다.","detailHow":"위탁의료기관 또는 보건소 방문 전 접종 가능 여부를 확인한 뒤 방문하여 산모수첩·임신확인서 등 서류를 제시하고 접종받습니다.","conditions":"임신여부가 확인된 임신부 전체. 별도 제외대상은 원문에서 확인되지 않음.","cost":"무료(국가예방접종 지원)","deadlineText":"해당 절기 국가예방접종 지원기간 종료일까지(예: 2025~2026절기는 2026.4.30. 종료 — 절기마다 날짜가 갱신되므로 접종 시점 기준으로 재확인 필요)","quotes":[{"text":"산모수첩 등을 통해 임신여부를 확인한 임신부","source":"질병관리청 예방접종도우미 - 인플루엔자 국가예방접종 사업","url":"https://nip.kdca.go.kr/irhp/mngm/goVcntMngm.do?menuCd=333&menuLv=3"},{"text":"2025년 9월 29일 ∼ 2026년 4월 30일","source":"질병관리청 예방접종도우미 - 인플루엔자 국가예방접종 사업","url":"https://nip.kdca.go.kr/irhp/mngm/goVcntMngm.do?menuCd=333&menuLv=3"},{"text":"임신부, 65세 이상 어르신(1958.12.31. 이전 출생자)이 국가지원 대상이다.","source":"대한민국 정책브리핑(문화체육관광부), 2023.09.25 — 2023~2024절기 기준(연도 컷오프는 절기마다 갱신됨)","url":"https://www.korea.kr/news/healthView.do?newsId=148920767"}]},{"id":"refuse_night_holiday_work","name":"야간·휴일 근무 거부하기","category":"근로","confidence":"확인","who":"mother","stages":["pregnant","postpartum"],"whatToDo":"회사가 밤 10시~아침 6시 사이 근무나 휴일 근무를 시키려 하면 거부할 수 있다는 것을 알아 두고, 필요하면 명확히 거부 의사를 밝힙니다","why":"근로기준법 제70조 제2항은 사용자가 임산부를 야간·휴일에 근로시키는 것을 원칙적으로 금지합니다. 예외적으로 임신 중의 여성 본인이 '명시적으로 청구'하고 고용노동부장관의 인가를 받은 경우에만 가능하므로, 뒤집어 말하면 본인이 원하지 않으면 언제든 거부할 수 있는 권리입니다.","when":{"anchor":"none","text":"임신이 확인된 때부터 출산 후 1년까지 (임신 전 기간 + 산후 1년, 주차 상한 없음)"},"isLegalDeadline":false,"penalty":null,"where":"재직 중인 회사(사용자)에 통보","legalBasis":"근로기준법 제70조 제2항 (관련: 제65조제1항 임산부 정의, 시행령 별표1)","evidence":{"quote":"사용자는 임산부와 18세 미만자를 오후 10시부터 오전 6시까지의 시간 및 휴일에 근로시키지 못한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우로서 고용노동부장관의 인가를 받으면 그러하지 아니하다.","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C70%EC%A1%B0","checkedAt":"2026-08-26"},"source":{"name":"국가법령정보센터 - 근로기준법 제70조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C70%EC%A1%B0","checkedAt":"2026-08-26"},"note":null,"unverified":[],"detailWhy":"근로기준법 제70조 제2항은 사용자가 임산부를 야간·휴일에 근로시키는 것을 원칙적으로 금지합니다. 예외적으로 임신 중의 여성 본인이 '명시적으로 청구'하고 고용노동부장관의 인가를 받은 경우에만 가능하므로, 뒤집어 말하면 본인이 원하지 않으면 언제든 거부할 수 있는 권리입니다.","detailHow":"구두보다는 문자·이메일 등 기록이 남는 방식으로 회사에 야간·휴일근로 불가 의사를 전달해 둡니다. 회사가 계속 강요하면 관할 지방고용노동관서 또는 고용노동부 국민신문고(민원마당)에 진정을 제기할 수 있습니다.","conditions":"여성 근로자 전체가 아니라 '임산부(임신 중이거나 산후 1년이 지나지 않은 여성)'에게 적용되는 조항이며, 상시 4명 이하 사업장에도 적용됩니다(근로기준법 시행령 별표1에 제70조제2항·제3항이 명시되어 있음). 적용됨. 근로기준법 시행령 별표1(제7조 관련, '상시 4명 이하의 근로자를 사용하는 사업 또는 사업장에 적용하는 법 규정')에 '제70조제2항·제3항'이 명시되어 있어, 임산부 야간·휴일근로 금지는 상시 4명 이하 사업장에도 그대로 적용됩니다.","quotes":[{"text":"사용자는 임산부와 18세 미만자를 오후 10시부터 오전 6시까지의 시간 및 휴일에 근로시키지 못한다. 다만, 다음 각 호의 어느 하나에 해당하는 경우로서 고용노동부장관의 인가를 받으면 그러하지 아니하다.","source":"국가법령정보센터 - 근로기준법 제70조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C70%EC%A1%B0"},{"text":"임신 중의 여성이 명시적으로 청구하는 경우","source":"국가법령정보센터 - 근로기준법 제70조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C70%EC%A1%B0"},{"text":"제64조, 제65조제1항·제3항(임산부와 18세 미만인 자로 한정한다), 제66조부터 제69조까지의 규정, 제70조제2항·제3항, 제71조, 제72조, 제74조","source":"근로기준법 시행령 [별표 1] 상시 4명 이하의 근로자를 사용하는 사업 또는 사업장에 적용하는 법 규정(제7조 관련)","url":"https://www.law.go.kr/flDownload.do?flSeq=43334647"},{"text":"사용자는 임신 중이거나 산후 1년이 지나지 아니한 여성(이하 '임산부'라 한다)과 18세 미만자를 도덕상 또는 보건상 유해·위험한 사업에 사용하지 못한다.","source":"국가법령정보센터 - 근로기준법 제65조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C65%EC%A1%B0"}],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"id":"refuse_overtime_request_light_duty","name":"시간외근로 거부하고 쉬운 근로 요청하기","category":"근로","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"연장(시간외)근로를 거부할 수 있고, 업무가 힘들면 회사에 더 가벼운 종류의 근로로 바꿔 달라고 요청할 수 있습니다","why":"근로기준법 제74조 제5항은 임신 중인 여성 근로자에게 시간외근로를 시키는 것 자체를 금지하고, 근로자가 요구하면 사용자가 쉬운 종류의 근로로 전환해야 할 의무를 부과합니다. 전환 의무는 근로자의 '요구'가 있어야 발생하므로, 힘든 업무를 맡고 있다면 스스로 요청해야 합니다.","when":{"anchor":"none","text":"임신이 확인된 때부터 출산 전까지 (임신 중 전 기간, 주차 상한 없음)"},"isLegalDeadline":false,"penalty":null,"where":"재직 중인 회사(사용자)에 요청","legalBasis":"근로기준법 제74조 제5항","evidence":{"quote":"사용자는 임신 중의 여성 근로자에게 시간외근로를 하게 하여서는 아니 되며, 그 근로자의 요구가 있는 경우에는 쉬운 종류의 근로로 전환하여야 한다.","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0","checkedAt":"2026-08-26"},"source":{"name":"국가법령정보센터 - 근로기준법 제74조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0","checkedAt":"2026-08-26"},"note":null,"unverified":["위반하면 징역이나 벌금 등 형사처벌을 받을 수 있습니다. 다만 근로기준법 제110조 등 처벌 조항의 정확한 내용은 확인하지 못했습니다. 고용노동부에 확인해 주세요."],"detailWhy":"근로기준법 제74조 제5항은 임신 중인 여성 근로자에게 시간외근로를 시키는 것 자체를 금지하고, 근로자가 요구하면 사용자가 쉬운 종류의 근로로 전환해야 할 의무를 부과합니다. 전환 의무는 근로자의 '요구'가 있어야 발생하므로, 힘든 업무를 맡고 있다면 스스로 요청해야 합니다.","detailHow":"쉬운 근로로 바꿔 달라는 요청은 서면(사내 신청 양식이 없으면 이메일 등)으로 남겨 두는 것이 안전합니다. 회사가 시간외근로를 시키거나 전환 요청을 거부하면 관할 지방고용노동관서에 진정할 수 있습니다.","conditions":"상시 4명 이하 사업장에도 적용됩니다(근로기준법 시행령 별표1에 제74조 전체가 명시되어 있음). '요구가 있는 경우'에만 사용자의 전환 의무가 발생하므로 별도 요청 없이는 자동으로 바뀌지 않습니다. 적용됨. 근로기준법 시행령 별표1에 '제74조'가 항 구분 없이 조문 전체가 열거되어 있어, 제74조제5항(시간외근로 금지 및 쉬운 근로 전환)도 상시 4명 이하 사업장에 적용됩니다.","quotes":[{"text":"사용자는 임신 중의 여성 근로자에게 시간외근로를 하게 하여서는 아니 되며, 그 근로자의 요구가 있는 경우에는 쉬운 종류의 근로로 전환하여야 한다.","source":"국가법령정보센터 - 근로기준법 제74조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0"},{"text":"제64조, 제65조제1항·제3항(임산부와 18세 미만인 자로 한정한다), 제66조부터 제69조까지의 규정, 제70조제2항·제3항, 제71조, 제72조, 제74조","source":"근로기준법 시행령 [별표 1] 상시 4명 이하의 근로자를 사용하는 사업 또는 사업장에 적용하는 법 규정(제7조 관련)","url":"https://www.law.go.kr/flDownload.do?flSeq=43334647"}],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"id":"refuse_hazardous_work_assignment","name":"유해·위험 업무면 전환 요구하기","category":"근로","confidence":"확인","who":"mother","stages":["pregnant","postpartum"],"whatToDo":"지금 맡은 업무가 몸에 해롭거나 위험한 종류라면 회사에 다른 업무로 바꿔 달라고 요구합니다","why":"근로기준법 제65조 제1항은 사용자가 임산부를 도덕상 또는 보건상 유해·위험한 사업에 사용하는 것 자체를 금지합니다. 구체적으로 어떤 업무가 금지 직종인지는 근로기준법 시행령 별표4에서 정합니다.","when":{"anchor":"none","text":"임신이 확인된 때부터 출산 후 1년까지 (주차 상한 없음)"},"isLegalDeadline":false,"penalty":null,"where":"재직 중인 회사(사용자)","legalBasis":"근로기준법 제65조 제1항","evidence":{"quote":"사용자는 임신 중이거나 산후 1년이 지나지 아니한 여성(이하 \"임산부\"라 한다)과 18세 미만자를 도덕상 또는 보건상 유해·위험한 사업에 사용하지 못한다.","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C65%EC%A1%B0","checkedAt":"2026-08-26"},"source":{"name":"국가법령정보센터 - 근로기준법 제65조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C65%EC%A1%B0","checkedAt":"2026-08-26"},"note":null,"unverified":["금지 직종의 구체적인 목록은 근로기준법 시행령 별표4에 정해져 있습니다. 다만 그 세부 내용은 확인하지 못했습니다. 고용노동부에 확인해 주세요.","위반하면 징역이나 벌금 등의 처벌을 받을 수 있습니다. 다만 정확한 처벌 수위는 법령 원문으로 확인하지 못했습니다. 고용노동부에 확인해 주세요."],"detailWhy":"근로기준법 제65조 제1항은 사용자가 임산부를 도덕상 또는 보건상 유해·위험한 사업에 사용하는 것 자체를 금지합니다. 구체적으로 어떤 업무가 금지 직종인지는 근로기준법 시행령 별표4에서 정합니다.","detailHow":"본인 업무가 금지 직종에 해당하는지 애매하면 관할 지방고용노동관서나 고용노동부 고객상담센터(국번없이 1350)에 문의할 수 있습니다. 해당하면 회사는 업무 자체를 시킬 수 없으므로 별도 전환 배치를 요구합니다.","conditions":"상시 4명 이하 사업장에도 적용되며, 이 경우 '임산부와 18세 미만인 자로 한정'한다고 시행령에 명시되어 있다(제2항인 비임산부 여성 대상 조항은 4명 이하 사업장 목록에서 확인되지 않았다). 적용됨. 근로기준법 시행령 별표1에 '제65조제1항·제3항(임산부와 18세 미만인 자로 한정한다)'로 명시되어 있어, 임산부에 대한 유해·위험사업 사용금지는 상시 4명 이하 사업장에도 그대로 적용된다(제2항의 '임산부가 아닌 18세 이상 여성'에 대한 부분만 4인 이하 사업장에 적용되지 않음).","quotes":[{"text":"사용자는 임신 중이거나 산후 1년이 지나지 아니한 여성(이하 \"임산부\"라 한다)과 18세 미만자를 도덕상 또는 보건상 유해·위험한 사업에 사용하지 못한다.","source":"국가법령정보센터 - 근로기준법 제65조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C65%EC%A1%B0"},{"text":"제65조제1항·제3항(임산부와 18세 미만인 자로 한정한다)","source":"근로기준법 시행령 [별표 1] 상시 4명 이하의 근로자를 사용하는 사업 또는 사업장에 적용하는 법 규정(제7조 관련)","url":"https://www.law.go.kr/flDownload.do?flSeq=43334647"},{"text":"사용자는 임신 중이거나 산후 1년이 지나지 아니한 여성(이하 '임산부'라 한다)과 18세 미만자를 도덕상 또는 보건상 유해·위험한 사업에 사용하지 못한다.","source":"국가법령정보센터 - 근로기준법 제65조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C65%EC%A1%B0"},{"text":"제64조, 제65조제1항·제3항(임산부와 18세 미만인 자로 한정한다), 제66조부터 제69조까지의 규정, 제70조제2항·제3항, 제71조, 제72조, 제74조","source":"근로기준법 시행령 [별표 1] 상시 4명 이하 사업장 적용 법 규정(제7조 관련) — 국가법령정보센터 PDF(2018.6.29 개정판) 텍스트 추출","url":"https://www.law.go.kr/flDownload.do?flSeq=43334647&flNm=%5B%EB%B3%84%ED%91%9C+1%5D+%EC%83%81%EC%8B%9C+4%EB%AA%85+%EC%9D%B4%ED%95%98%EC%9D%98+%EA%B7%BC%EB%A1%9C%EC%9E%90%EB%A5%BC+%EC%82%AC%EC%9A%A9%ED%95%98%EB%8A%94+%EC%82%AC%EC%97%85+%EB%98%90%EB%8A%94+%EC%82%AC%EC%97%85%EC%9E%A5%EC%97%90+%EC%A0%81%EC%9A%A9%ED%95%98%EB%8A%94+%EB%B2%95+%EA%B7%9C%EC%A0%95%28%EC%A0%9C7%EC%A1%B0+%EA%B4%80%EB%A0%A8%29"}],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"id":"check_maternity_leave_pay_deadline","name":"출산전후휴가급여 신청 기한 미리 알아두기","category":"근로","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"출산전후휴가는 회사에 배정받는 것과 별개로, 급여는 고용센터에 따로 신청해야 하며 신청 가능 기간이 정해져 있다는 것을 미리 확인해 둡니다","why":"출산전후휴가 급여는 자동으로 지급되지 않고 근로자가 직접 고용센터에 신청해야 하며, 신청 가능 기간을 넘기면 급여를 받을 수 없습니다. 우선지원대상기업과 대규모기업은 신청 가능 시점이 다릅니다.","when":{"anchor":"week","text":"출산전후휴가를 시작하는 시점(출산 후 45일\u003c다태아 60일> 이상을 반드시 확보해야 하므로 역산하면 출산예정일 최대 44일 전, 실무상 통상 임신 33~36주경부터 시작) 이후 1개월부터, 휴가 종료 후 12개월 이내","windows":[{"from":33,"to":45}]},"isLegalDeadline":true,"penalty":null,"where":"사업장 관할 고용센터 또는 고용24 홈페이지(work24.go.kr)","legalBasis":"고용보험법 제75조(출산전후휴가 급여 등) 제2호, 고용보험법 시행령 제94조·제100조","evidence":{"quote":"휴가를 시작한 날 이후 1개월부터 휴가가 끝난 날 이후 12개월 이내에 신청","url":"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=1379&ccfNo=3&cciNo=1&cnpClsNo=2","checkedAt":"2026-08-26"},"source":{"name":"찾기쉬운 생활법령정보 - 출산전후휴가 기간의 급여(법제처)","url":"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=1379&ccfNo=3&cciNo=1&cnpClsNo=2","checkedAt":"2026-08-26"},"note":null,"unverified":["신청에 필요한 서류의 전체 목록과 우선지원대상기업 판정 기준(업종별 상시근로자 수 등)은 상세히 확인하지 못했습니다. 고용센터에 확인해 주세요."],"detailWhy":"출산전후휴가 급여는 자동으로 지급되지 않고 근로자가 직접 고용센터에 신청해야 하며, 신청 가능 기간을 넘기면 급여를 받을 수 없습니다. 우선지원대상기업과 대규모기업은 신청 가능 시점이 다릅니다.","detailHow":"필요 서류(출산전후휴가 급여등 신청서, 고용보험 피보험자격 확인 서류 등)를 챙겨 관할 고용센터에 방문·우편·팩스로 제출하거나 고용24 홈페이지(work24.go.kr)에서 온라인으로 신청합니다.","conditions":"고용보험에 가입된 근로자에게 적용됩니다. 우선지원대상기업은 휴가 시작 후 곧바로 신청 가능하고, 대규모기업은 휴가 시작 후 60일(다태아 75일)이 지난 날부터 신청 가능합니다. 근로기준법의 '상시 4명 이하 예외(별표1)' 체계와는 기준이 다릅니다. 출산전후휴가급여는 사업장 규모가 아니라 '고용보험 가입(피보험자) 여부'가 요건이며, 상시근로자 1인 이상 사업장은 원칙적으로 고용보험 당연가입 대상이므로(농림어업 등 일부 예외) 4인 이하 사업장 근로자도 고용보험에 가입돼 있다면 급여를 받을 수 있습니다. 다만 출산전후휴가라는 휴가 자체(근로기준법 제74조상 권리)는 별표1에 '제74조'로 명시되어 4인 이하 사업장에도 적용됩니다.","cost":"무료(고용보험 급여 신청)","deadlineText":"휴가를 시작한 날[우선지원대상기업이 아닌 경우에는 휴가 시작 후 60일(한 번에 둘 이상의 자녀를 임신한 경우에는 75일)이 지난 날로 본다] 이후 1개월부터 휴가가 끝난 날 이후 12개월 이내에 신청. 그 기간에 대통령령으로 정하는 사유로 신청할 수 없었던 사람은 그 사유가 끝난 후 30일 이내에 신청.","quotes":[{"text":"휴가를 시작한 날 이후 1개월부터 휴가가 끝난 날 이후 12개월 이내에 신청","source":"찾기쉬운 생활법령정보 - 출산전후휴가 기간의 급여(법제처)","url":"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=1379&ccfNo=3&cciNo=1&cnpClsNo=2"},{"text":"휴가 시작 후 60일(한 번에 둘 이상의 자녀를 임신한 경우에는 75일)이 지난 날","source":"찾기쉬운 생활법령정보 - 출산전후휴가 기간의 급여(법제처), 대규모기업 신청 가능 시점","url":"https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=1379&ccfNo=3&cciNo=1&cnpClsNo=2"},{"text":"휴가를 시작한 날[출산전후휴가 또는 유산·사산휴가를 받은 피보험자가 속한 사업장이 우선지원 대상기업이 아닌 경우에는 휴가 시작 후 60일(한 번에 둘 이상의 자녀를 임신한 경우에는 75일)이 지난 날로 본다] 이후 1개월부터 휴가가 끝난 날 이후 12개월 이내에 신청할 것. 다만, 그 기간에 대통령령으로 정하는 사유로 출산전후휴가 급여등을 신청할 수 없었던 사람은 그 사유가 끝난 후 30일 이내에 신청하여야 한다.","source":"고용보험법 제75조 제2호 (국가법령정보센터)","url":"https://www.law.go.kr/LSW//lsLawLinkInfo.do?lsJoLnkSeq=1000631491&lsId=001761&chrClsCd=010202&print=print"},{"text":"사용자는 임신 중의 여성에게 출산 전과 출산 후를 통하여 90일(한 번에 둘 이상 자녀를 임신한 경우에는 120일)의 출산전후휴가를 주어야 한다.","source":"국가법령정보센터 - 근로기준법 제74조","url":"https://www.law.go.kr/%EB%B2%95%EB%A0%B9/%EA%B7%BC%EB%A1%9C%EA%B8%B0%EC%A4%80%EB%B2%95/%EC%A0%9C74%EC%A1%B0"}],"requires":[{"field":"subjectEmployment","eq":"employee"}]},{"id":"spouse_tdap_vaccination","name":"배우자 백일해(Tdap) 예방접종 받기","category":"접종","confidence":"확인","who":"partner","stages":["pregnant"],"whatToDo":"과거 Tdap 접종 이력이 없거나 불분명하다면, 배우자(아빠)가 신생아와 접촉하기 2주 전까지 Tdap 백신을 1회 접종합니다","why":"신생아 백일해는 가족 내 2차 발병률이 높고 신생아 본인은 접종으로 방어할 수 없는 시기이기 때문에, 밀접 접촉자인 아빠가 항체를 미리 확보해 두는 것이 감염 경로 차단의 핵심으로 설명됩니다.","when":{"anchor":"week","windows":[{"from":13,"to":45,"label":"임신 중기부터 출산 전까지"}],"text":"아기와 접촉하기 최소 2주 전까지 — 출산 직전에 몰리지 않도록 임신 중기(13~27주) 사이에 미리 맞아두는 것이 실무적으로 안전하다"},"isLegalDeadline":false,"penalty":null,"where":"내과·가정의학과 등 성인 예방접종 가능 의료기관","legalBasis":null,"evidence":{"quote":"12개월 미만 연령의 영유아를 돌보는 가족 및 의료 종사자도 과거에 Tdap 백신 접종을 받지 않았다면 Tdap 백신 접종을 권장한다.","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148923417","checkedAt":"2026-08-26"},"source":{"name":"대한민국 정책브리핑 - Q&A로 알아보는 백일해","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148923417","checkedAt":"2026-08-26"},"note":null,"unverified":["질병관리청 예방접종도우미(nip.kdca.go.kr) 백일해 페이지 자체에는 '아빠·가족 코쿤 접종' 권고 문구가 직접 실려 있지 않음을 확인함 — 위 인용은 상급종합병원(서울대학교병원) 안내문 기준.","정확한 접종 비용은 병원마다 다릅니다. 정부의 공식 고시 가격은 확인하지 못했습니다. 안내된 금액은 민간 의료정보 사이트의 참고치입니다. 접종받을 병원에 정확한 비용을 문의해 주세요."],"whatIsIt":"백일해는 전염성이 매우 높은 호흡기 감염병으로, 생후 2개월 미만 신생아는 아직 자체 예방접종(DTaP)을 시작하지 못해 감염 시 폐렴·경련 등 중증 합병증 위험이 큽니다. 아기를 돌볼 가족(아빠, 조부모 등)이 미리 접종해 아기 주위에 면역 방어막을 만드는 방식을 '코쿤(Cocooning) 전략'이라 합니다. 산모는 임신 27~36주에 Tdap을 접종하지만, 아빠는 이 시기와 무관하게 접종력이 없다면 별도로 맞아야 합니다.","detailWhy":"신생아 백일해는 가족 내 2차 발병률이 높고 신생아 본인은 접종으로 방어할 수 없는 시기이기 때문에, 밀접 접촉자인 아빠가 항체를 미리 확보해 두는 것이 감염 경로 차단의 핵심으로 설명됩니다.","detailHow":"내과, 가정의학과 등 성인 예방접종이 가능한 의료기관에서 접종합니다. 과거 성인기에 Tdap을 평생 1회 맞은 이력이 있다면 임신할 때마다 다시 맞을 필요는 없는 것으로 안내되며, 접종력이 없거나 기록이 불분명한 경우에만 새로 접종합니다.","conditions":"Tdap 접종 이력이 없거나 불분명한 배우자·가족 구성원에 해당. 최근 접종 이력이 확인되는 경우는 재접종이 필요하지 않다는 것이 통상적 설명입니다.","cost":"국가예방접종 지원 대상은 아니지만, 일부 지자체 보건소가 자체 사업으로 임산부 배우자의 Tdap 접종을 무료 지원합니다. 접종 전에 거주지 보건소에 지원 여부를 먼저 확인하는 것이 좋습니다. 지자체 지원이 없으면 본인부담이며 병원마다 가격이 다릅니다(공식 고시 가격 없음).","quotes":[{"text":"12개월 미만 연령의 영유아를 돌보는 가족 및 의료 종사자도 과거에 Tdap 백신 접종을 받지 않았다면 Tdap 백신 접종을 권장한다.","source":"대한민국 정책브리핑 - Q&A로 알아보는 백일해","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148923417"},{"text":"12개월 미만 영아와의 밀접한 접촉자 : Tdap 접종력이 없는 성인은 신생아와 밀접하게 접촉하기 2주 전까지 Tdap 1회 접종을 권장","source":"서울대학교병원 건강증진센터 - 예방접종별 세부정보(백일해)","url":"https://health4u.snu.ac.kr/healthCare/Inoculation/shotDetails/_/11359/view.do"},{"text":"Td 백신으로는 백일해를 예방할 수 없습니다. 생후 12개월 미만 영아와 접촉하는 가족구성원, 의료기관 및 보육시설 종사자는 접촉 2주 전까지 Tdap 백신 접종을 권고합니다.","source":"서울대학교병원 건강증진센터 - 예방접종별 세부정보(백일해)","url":"https://health4u.snu.ac.kr/healthCare/Inoculation/shotDetails/_/11359/view.do"}]},{"id":"civil_servant_spouse_checkup_leave","name":"공무원이면 임신검진 동행휴가 신청하기","category":"근로","confidence":"확인","who":"partner","stages":["pregnant"],"whatToDo":"국가공무원·지방공무원인 남성 근로자는 연차를 쓰지 않고 배우자의 임신 중 정기검진에 동행할 수 있는 '임신검진 동행휴가'를 소속 기관에 신청합니다","why":"개정 전에는 배우자 검진에 동행하려면 연차를 써야 했는데, 이를 별도의 특별휴가로 분리해 연차 소진 없이 동행할 수 있도록 한 것이 이번 개정의 핵심입니다.","when":{"anchor":"none","text":"임신 기간 중 아무 때나, 검진 일정에 맞춰 하루 또는 반일 단위로 나눠 쓸 수 있다(총 10일 범위, 2025년 7월 22일부터 시행)"},"isLegalDeadline":false,"penalty":null,"where":"소속 국가기관·지방자치단체 인사(복무) 담당 부서","legalBasis":null,"evidence":{"quote":"남성공무원은 배우자의 임신기간 중 검진에 동행하기 위해 10일의 범위에서 임신검진 동행휴가를 사용할 수 있다.","url":"https://www.nhis.or.kr/lm/lmxsrv/law/lawLinkContentView.do?SEQ=1040&LINKCODE=c002000000","checkedAt":"2026-08-26"},"source":{"name":"국가공무원 복무규정 제20조제19항(2025.7.22. 시행) 원문 게재","url":"https://www.nhis.or.kr/lm/lmxsrv/law/lawLinkContentView.do?SEQ=1040&LINKCODE=c002000000","checkedAt":"2026-08-26"},"note":null,"unverified":["민간기업 근로자에게 적용되는 동일 성격의 법정 유급 동행휴가는 확인되지 않음 — 공무원 복무규정 개정 사항에 한정됨.","이 특별휴가가 전액 유급인지 등 구체적인 급여 처리 내용은 확인하지 못했습니다. 소속 기관에 확인해 주세요."],"whatIsIt":"2025년 7월 22일 시행된 국가공무원 복무규정(및 지방공무원 복무규정) 개정으로 신설된 특별휴가 항목입니다. 임신한 여성 공무원이 쓸 수 있는 임신검진휴가와 같은 방식으로, 남성 공무원이 배우자의 검진에 동행할 때 별도로 쓸 수 있습니다.","detailWhy":"개정 전에는 배우자 검진에 동행하려면 연차를 써야 했는데, 이를 별도의 특별휴가로 분리해 연차 소진 없이 동행할 수 있도록 한 것이 이번 개정의 핵심입니다.","detailHow":"소속 기관의 인사(복무) 담당 부서에 임신검진 동행휴가 사용을 신청합니다. 검진 예정일에 맞춰 하루 또는 반일 단위로, 임신 기간 중 총 10일 범위 내에서 나눠 쓸 수 있습니다.","conditions":"국가공무원·지방공무원인 남성 근로자에 한합니다. 민간기업 근로자에게는 이 규정이 적용되지 않으며, 회사 자체의 가족돌봄휴가 등 별도 규정이 없다면 검진 동행에 쓸 수 있는 법정 유급휴가는 없습니다.","cost":"공무원 특별휴가로 운영되는 유급 휴가로 분류됩니다. 다만 급여 처리에 관한 정확한 조문 내용까지는 확인하지 못했습니다. 소속 기관에 확인해 주세요.","steps":[{"id":"s1","text":"소속 기관 인사(복무) 담당 부서에 임신검진 동행휴가 사용을 신청합니다"},{"id":"s2","text":"검진 예정일에 맞춰 하루 또는 반일 단위로 사용합니다"},{"id":"s3","text":"임신 기간 중 총 10일 범위 내에서 필요할 때마다 나눠 씁니다"}],"quotes":[{"text":"남성공무원은 배우자의 임신기간 중 검진에 동행하기 위해 10일의 범위에서 임신검진 동행휴가를 사용할 수 있다.","source":"국가공무원 복무규정 제20조제19항(2025.7.22. 시행) 원문 게재","url":"https://www.nhis.or.kr/lm/lmxsrv/law/lawLinkContentView.do?SEQ=1040&LINKCODE=c002000000"},{"text":"임신한 공무원이 사용할 수 있는 임신검진휴가와 같게 배우자 동행 휴가도 임신 중 10일 이내, 하루 또는 반일 단위로 사용할 수 있다.","source":"아시아경제, \"임신 검진 동행 남성 공무원에 '특별 휴가'준다\"","url":"https://www.asiae.co.kr/article/2025071415290954004"},{"text":"배우자 임신기간 중 검진에 동행하는 남성 공무원은 앞으로 연차를 쓰지 않아도 된다.","source":"더스쿠프, \"임신 배우자 병원 갈 때 男 공무원도 연차 대신 '특별휴가'\"","url":"https://www.thescoop.co.kr/news/articleView.html?idxno=306602"}]},{"id":"spouse_secondhand_smoke_prevention","name":"집 안에서 배우자 흡연·간접흡연 차단하기","category":"생활","confidence":"확인","who":"partner","stages":["pregnant"],"whatToDo":"배우자(아빠)가 집 안과 임신부 주변에서 담배를 피우지 않도록 하고, 임신부가 실내외 흡연구역이나 흡연자 곁에 노출되지 않게 합니다","why":"임신 중 흡연(간접 노출 포함)은 조산, 태아성장제한에 따른 저체중출생아, 태반조기박리 등의 위험을 높이는 것으로 설명되며, 임신부 본인이 비흡연자라도 배우자의 흡연으로 인한 노출 자체가 위험 요인으로 지목됩니다.","when":{"anchor":"none","text":"임신 기간 내내 지켜야 하는 생활수칙이며, 13~27주 사이에도 예외 없이 유지한다"},"isLegalDeadline":false,"penalty":null,"where":null,"legalBasis":null,"evidence":{"quote":"임신을 원하는 부부는 3-6개월 전부터는 금연하는 것이 좋습니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털, \"정상임신관리(임신 전 관리)\"","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388","checkedAt":"2026-08-26"},"note":null,"unverified":["질병관리청 국가건강정보포털에서 '배우자의 간접흡연'을 직접·전용으로 다루는 문서는 찾지 못함. 첫 인용은 임신 '전' 단계의 부부 공동 금연 권고이고, 두 번째 인용은 임신부 본인 흡연에 대한 설명이며, 간접흡연에 대한 직접 문장은 국내 공공기관 페이지가 아닌 해외 의료매뉴얼(MSD, 한국어판)에서 확인됨.","'흡연 후 손 씻기·옷 갈아입기' 같은 세부 행동수칙은 공식 정부 페이지가 아닌 민간 의료뉴스 기사들에서 반복적으로 언급되는 내용이라 이번 항목에는 포함하지 않음."],"whatIsIt":"임신부 본인이 담배를 피우지 않아도 배우자나 주변인의 흡연으로 인한 간접흡연에 노출되면 태아에 영향을 줄 수 있다는 것이 의학적으로 설명되고 있습니다. 질병관리청 국가건강정보포털은 임신을 계획하는 단계에서부터 '부부'가 함께 금연할 것을 권고하고 있습니다.","detailWhy":"임신 중 흡연(간접 노출 포함)은 조산, 태아성장제한에 따른 저체중출생아, 태반조기박리 등의 위험을 높이는 것으로 설명되며, 임신부 본인이 비흡연자라도 배우자의 흡연으로 인한 노출 자체가 위험 요인으로 지목됩니다.","detailHow":"집 안에서는 금연하고, 외출 시에는 흡연구역과 거리를 두게 하는 방식이 일반적으로 권장됩니다.","conditions":"흡연 중인 배우자 또는 함께 사는 가족 구성원이 있는 경우에 해당합니다.","quotes":[{"text":"임신을 원하는 부부는 3-6개월 전부터는 금연하는 것이 좋습니다.","source":"질병관리청 국가건강정보포털, \"정상임신관리(임신 전 관리)\"","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6388"},{"text":"임신 중 흡연은 조산이나 태아성장제한으로 저체중출생아, 그리고 태반조기박리 위험을 증가시킵니다.","source":"질병관리청 국가건강정보포털, \"정상임신관리(임신의 진단과 관리)\"","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301"},{"text":"간접 흡연이 태아에게 해를 끼칠 수 있기에, 임신부는 이에 대한 노출을 피해야 합니다.","source":"MSD 매뉴얼(일반인용), \"임신 중 물질 사용\"","url":"https://www.msdmanuals.com/ko/home/%EC%97%AC%EC%84%B1-%EA%B1%B4%EA%B0%95-%EB%AC%B8%EC%A0%9C/%EC%9E%84%EC%8B%A0-%EC%A4%91-%EC%95%BD%EB%AC%BC-%EB%B0%8F-%EB%AC%BC%EC%A7%88-%EC%82%AC%EC%9A%A9/%EC%9E%84%EC%8B%A0-%EC%A4%91-%EB%AC%BC%EC%A7%88-%EC%82%AC%EC%9A%A9"}]},{"id":"car_seat_preparation","name":"영유아 카시트 미리 준비하기","category":"출산준비","confidence":"확인","who":"both","stages":["pregnant"],"whatToDo":"신생아용(인펀트) 카시트를 미리 구매하고, 뒷좌석 후면 장착법을 숙지해 둡니다","why":"도로교통법 제50조제1항에 따라 운전자는 영유아(6세 미만) 동승자에게 유아보호용 장구를 장착한 좌석안전띠를 매도록 해야 하며, 위반 시 도로교통법 제160조제2항제2호 및 시행령 제88조제4항·별표 6 제9호에 근거해 13세 미만 기준 6만원의 과태료가 부과됩니다. 신생아는 퇴원 직후부터 자동차 이동에 카시트가 필요하므로 병원 방문 전에 준비가 끝나 있어야 합니다.","when":{"anchor":"week","windows":[{"from":20,"to":45,"label":"임신 20주 이후 여유 있게"}],"text":"정확한 권장 시작 주수를 못박은 공식 자료는 없음. 신생아는 퇴원 순간부터 자동차 이동 시 카시트가 필요하므로 출산 예정일보다 여유 있게, 중기 중 미리 구매·설치법 숙지 권장"},"isLegalDeadline":false,"penalty":null,"where":null,"legalBasis":null,"evidence":{"quote":"모든 좌석의 동승자에게도 좌석안전띠[영유아(6세 미만인 사람)인 경우에는 유아보호용 장구를 장착한 후의 좌석안전띠를 말함]를 매도록 해야","url":"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?popMenu=ov&csmSeq=684&ccfNo=1&cciNo=2&cnpClsNo=2&menuType=cnpcls","checkedAt":"2026-08-26"},"source":{"name":"찾기쉬운 생활법령정보(법제처) - 도로교통법 제50조제1항","url":"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?popMenu=ov&csmSeq=684&ccfNo=1&cciNo=2&cnpClsNo=2&menuType=cnpcls","checkedAt":"2026-08-26"},"note":null,"unverified":["카시트 구입비에 대한 정부·지자체 지원(대여사업 포함) 여부는 공식 안내에서 확인하지 못했습니다. 해당 기관에 문의해 주세요.","'준비를 언제부터 시작하라'는 권장 주수를 못박은 공식 자료를 찾지 못해 weekFrom/weekTo는 임의 추정치임"],"whatIsIt":"도로교통법상 6세 미만 영유아가 자동차에 탈 때 반드시 장착해야 하는 유아보호용 장구(카시트). 신생아는 병원에서 퇴원하는 순간부터 필요합니다.","detailWhy":"도로교통법 제50조제1항에 따라 운전자는 영유아(6세 미만) 동승자에게 유아보호용 장구를 장착한 좌석안전띠를 매도록 해야 하며, 위반 시 도로교통법 제160조제2항제2호 및 시행령 제88조제4항·별표 6 제9호에 근거해 13세 미만 기준 6만원의 과태료가 부과됩니다. 신생아는 퇴원 직후부터 자동차 이동에 카시트가 필요하므로 병원 방문 전에 준비가 끝나 있어야 합니다.","detailHow":"임신육아종합포털 아이사랑에 따르면 카시트는 차량 뒷좌석에 장착해야 하며, 조수석은 에어백 충격 위험으로 피해야 합니다. 체중 10kg 이하·생후 12개월 미만이면 반드시 후면(진행방향 반대)으로 장착해야 하고, 머리지지대 높이를 아이에게 맞게 조절하며 흔들림이 최소화되도록 단단히 고정해야 합니다.","conditions":"자동차로 신생아를 이동시킬 모든 가정(특히 퇴원 시 자차 이용 예정인 경우)","cost":"제품 구입비는 자비로 부담합니다. 정부 지원 여부는 공식 안내에서 확인하지 못했습니다. 해당 기관에 문의해 주세요.","steps":[{"id":"s1","text":"카시트를 차량 뒷좌석에 장착합니다"},{"id":"s2","text":"체중 10kg 이하·생후 12개월 미만이면 후면(진행방향 반대)으로 장착합니다"},{"id":"s3","text":"머리지지대 높이를 아이 머리에 맞게 조절하고 흔들림 없이 단단히 고정합니다"}],"quotes":[{"text":"모든 좌석의 동승자에게도 좌석안전띠[영유아(6세 미만인 사람)인 경우에는 유아보호용 장구를 장착한 후의 좌석안전띠를 말함]를 매도록 해야","source":"찾기쉬운 생활법령정보(법제처) - 도로교통법 제50조제1항","url":"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?popMenu=ov&csmSeq=684&ccfNo=1&cciNo=2&cnpClsNo=2&menuType=cnpcls"},{"text":"동승자(영유아)에게 좌석안전띠를 매도록 하지 않은 운전자는 13세 미만인 경우 6만원의 과태료를 부과받습니다","source":"찾기쉬운 생활법령정보(법제처) - 도로교통법 제160조제2항제2호·시행령 제88조제4항 별표6 제9호","url":"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?popMenu=ov&csmSeq=684&ccfNo=1&cciNo=2&cnpClsNo=2&menuType=cnpcls"},{"text":"카시트는 차량 뒷좌석에 장착하여야 합니다.","source":"임신육아종합포털 아이사랑 - 출산준비","url":"https://www.childcare.go.kr/index.html?menuno=266"},{"text":"차량 조수석에 카시트를 설치하면 교통사고 발생 시 전개되는 에어백에 의해 강한 충격을 받아 영유아의 생명ㆍ신체 안전을 위협할 수 있습니다.","source":"임신육아종합포털 아이사랑 - 출산준비","url":"https://www.childcare.go.kr/index.html?menuno=266"},{"text":"체중 10kg이하, 생후 12개월 미만의 아기를 자동차에 태울 때는 반드시 후면 창을 바라보는 방향으로 카시트를 장착해야 합니다.","source":"임신육아종합포털 아이사랑 - 출산준비","url":"https://www.childcare.go.kr/index.html?menuno=266"}]},{"id":"breastfeeding_preparation","name":"모유수유 미리 준비하기","category":"출산준비","confidence":"확인","who":"mother","stages":["pregnant"],"whatToDo":"산전 모유수유 교육을 받고, 분만 예정 병원에 모유수유 의사를 미리 표명해 둡니다","why":"질병관리청 국가건강정보포털에 따르면 산모가 출산 직후 분비하는 초유는 면역글로불린과 락토페린 등의 면역 성분과 면역세포를 고농도로 함유하고 있어, 갓 태어난 아기를 질병으로부터 보호하는 데 중요한 역할을 하므로 아기에게 반드시 먹여야 한다고 안내합니다. 이를 위해 출산 전 교육과 의사 표명이 권고됩니다.","when":{"anchor":"none","text":"질병관리청 자료는 '산전'과 '임신 후반기'라고만 표현하고 정확한 주수를 특정하지 않음. 중기 중 산전교육 신청·수강을 권장"},"isLegalDeadline":false,"penalty":null,"where":null,"legalBasis":null,"evidence":{"quote":"산전 모유 수유 교육을 꼭 받고 모유 수유 의사를 적극적으로 표명하도록 합니다.","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586","checkedAt":"2026-08-26"},"source":{"name":"질병관리청 국가건강정보포털 - 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586","checkedAt":"2026-08-26"},"note":null,"unverified":["'임신 후반기'가 정확히 몇 주부터인지 원문에 명시되어 있지 않음","산전 모유수유 교육을 제공하는 기관(보건소/병원)별 신청 절차와 비용은 개별 확인 필요"],"whatIsIt":"출산 직후 나오는 초유에는 면역 성분이 고농도로 들어있어 신생아 보호에 중요하므로, 출산 전에 모유수유 방법을 배우고 수유 의사를 미리 정해 두는 것","detailWhy":"질병관리청 국가건강정보포털에 따르면 산모가 출산 직후 분비하는 초유는 면역글로불린과 락토페린 등의 면역 성분과 면역세포를 고농도로 함유하고 있어, 갓 태어난 아기를 질병으로부터 보호하는 데 중요한 역할을 하므로 아기에게 반드시 먹여야 한다고 안내합니다. 이를 위해 출산 전 교육과 의사 표명이 권고됩니다.","detailHow":"\"산전 모유 수유 교육을 꼭 받고 모유 수유 의사를 적극적으로 표명하도록 합니다.\"(질병관리청). 함몰유두가 걱정돼 호프만 기법 등 교정을 시도하려는 경우, 자료는 \"출산 전에는 이 기법이 효과가 거의 없는 경우가 많습니다\"라고 명시하므로 자가 교정보다 전문 상담이 낫습니다. 조산 위험이 있으면 유두 자극 자체를 피해야 합니다.","conditions":"모유수유를 고려하는 모든 임신부. 다만 조산 위험이 있는 경우 출산 전 유두 자극(호프만 기법 등)은 피해야 한다고 명시됨","cost":"국가건강정보포털 자료는 무료로 열람할 수 있습니다. 병원별 산전교육 프로그램의 비용과 유무료 여부는 병원마다 달라 확인하지 못했습니다. 이용하실 병원에 확인해 주세요.","steps":[{"id":"s1","text":"산전 모유수유 교육을 신청해 받습니다"},{"id":"s2","text":"분만 예정 병원에 모유수유 의사를 미리 표명해 둡니다"},{"id":"s3","text":"조산 위험이 있다면 유두 자극(호프만 기법 등)은 하지 않습니다"}],"quotes":[{"text":"산전 모유 수유 교육을 꼭 받고 모유 수유 의사를 적극적으로 표명하도록 합니다.","source":"질병관리청 국가건강정보포털 - 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586"},{"text":"산모가 출산 직후 분비하는 초유는 면역글로불린과 락토페린 등의 면역 성분과 면역세포를 고농도로 함유하고 있어, 갓 태어난 아기를 질병으로부터 보호하는 데 중요한 역할을 하므로 아기에게 반드시 먹여야 합니다.","source":"질병관리청 국가건강정보포털 - 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586"},{"text":"임신 첫 3개월 동안은 유두가 충분히 튀어나오지 않는 경우가 많지만, 임신 후반기에는 대부분의 산모에서 유두 주위의 피부가 신장성을 가지게 되어 유두가 돌출되기 시작합니다.","source":"질병관리청 국가건강정보포털 - 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586"},{"text":"출산 전에는 이 기법이 효과가 거의 없는 경우가 많습니다.","source":"질병관리청 국가건강정보포털 - 성공적인 모유 수유 (호프만 기법 관련)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586"},{"text":"조산 위험이 있는 경우에는 출산 전 유두에 자극을 주지 않는 것이 중요합니다.","source":"질병관리청 국가건강정보포털 - 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586"}]},{"id":"high_risk_pregnancy_medical_support","name":"고위험 임산부 의료비 지원사업","category":"의료","confidence":"확인","who":"mother","stages":["pregnant","postpartum"],"whatToDo":"분만일(사산 포함)로부터 6개월 이내에 임산부 주민등록 주소지 관할 보건소를 방문하거나, e보건소 공공보건포털(www.e-health.go.kr) 또는 아이마중 앱으로 온라인 신청합니다.","why":"고위험 임신질환으로 입원치료를 받으면 비급여 진료비 등 의료비 부담이 커지는데, 이 사업은 그 비용의 90%(최대 300만원)를 국가가 지원해 임산부의 의료비 부담을 낮추기 위한 것입니다. 2024년 소득기준 폐지로 이전에는 소득 초과로 지원받지 못했던 가구도 대상에 포함되었습니다.","when":{"anchor":"birth","monthsFromBirth":6,"text":"분만일로부터 6개월 이내 신청"},"isLegalDeadline":false,"penalty":null,"where":"지원신청일 기준 임산부 주민등록 주소지 관할 보건소. 온라인은 e보건소 공공보건포털(www.e-health.go.kr) 또는 아이마중 앱.","legalBasis":null,"evidence":{"quote":"조기진통, 분만관련 출혈, 중증 임신중독증, 양막의 조기파열, 태반조기박리, 전치태반, 절박유산, 양수과다증, 양수과소증, 분만전 출혈, 자궁경부무력증, 고혈압, 다태임신, 당뇨병, 대사장애를 동반한 임신과다구토, 신질환, 심부전, 자궁 내 성장 제한, 자궁 및 자궁의 부속기 질환","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00002&menuId=200010","checkedAt":"2026-08-26"},"source":{"name":"e보건소 공공보건포털 - 고위험임산부 의료비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00002&menuId=200010","checkedAt":"2026-08-26"},"note":null,"unverified":["'의료급여수급자는 비급여 본인부담금 전액 지원'은 강남구보건소 1개 출처에서만 확인되었고 e보건소·하남시·안산시 등 다른 공식 출처에는 없어 전국 공통 규정인지 미확인.","지자체별 추가 지원(국가 300만원 한도를 넘는 별도 지자체 예산 지원) 여부는 조사 범위에서 확인되지 않음 — 조사한 서울 중구·강남구·서초구·안산시·하남시 보건소 모두 국가 기준(90%, 300만원)과 동일하게 안내하고 있어 지자체별 차이는 발견하지 못함.","외래진료도 지원되는지 여부 — 모든 출처가 '입원치료'만 명시했고 외래를 명시적으로 배제하거나 포함한다고 밝힌 출처는 없었음.","질환별 최신 인정기준은 보건복지부·e보건소의 공고를 따릅니다(2026년 기준). 사업 내용(질환 목록 변경 등)은 매년 지침 개정에 따라 바뀔 수 있습니다. 신청 시점에 관할 보건소에서 다시 확인해 주세요."],"whatIsIt":"19대 고위험 임신질환으로 진단받아 입원치료를 받은 임산부에게 입원치료비 중 비급여 진료비와 급여 중 전액본인부담금의 90%를 1인당 300만원 한도로 지원하는 국가 사업(보건복지부 모자보건사업, 시행 근거: 모자보건법). 2024년 1월부터 소득기준(기존: 기준 중위소득 180% 이하)이 폐지되어 소득과 관계없이 지원됩니다.","detailWhy":"고위험 임신질환으로 입원치료를 받으면 비급여 진료비 등 의료비 부담이 커지는데, 이 사업은 그 비용의 90%(최대 300만원)를 국가가 지원해 임산부의 의료비 부담을 낮추기 위한 것입니다. 2024년 소득기준 폐지로 이전에는 소득 초과로 지원받지 못했던 가구도 대상에 포함되었습니다.","detailHow":"구비서류(보건소 공통, 지자체별로 다소 표현 차이 있음): 1) 의사 진단서(질병명·질병코드·진단일 포함), 2) 입·퇴원 확인서, 3) 입원진료비 영수증 원본, 4) 입원진료비 상세내역서(세부내역서) 원본, 5) 건강보험증 사본 또는 건강보험 자격확인서, 6) 주민등록등본(가구원 및 주민번호 포함), 7) 입금계좌 통장사본(임산부 본인 명의), 8) 신청인 신분증, 9) 출생증명서 또는 출생보고서 사본(출생신고 전인 경우), 10) 사산증명서(사산한 경우), 11) 개인정보 제공 동의서. 신청은 임산부 본인이 원칙이며, 대리신청 시 위임장이 필요합니다(안산시 단원보건소 안내 기준). 정확한 서류 목록은 관할 보건소별로 다를 수 있어 방문 전 확인이 필요합니다.","conditions":"19가지 고위험 임신질환으로 진단받아 입원치료를 받은 경우. 질환마다 인정 주수가 다르다 — ① 조기진통·양막의 조기파열: 임신 20주 이상~37주 미만 ② 분만관련출혈·중증임신중독증·태반조기박리·전치태반·절박유산·양수과다증·양수과소증: 임신 20주 이상(상한 없음) ③ 분만전출혈·자궁경부무력증·고혈압·다태임신·당뇨병·대사장애를 동반한 임신과다구토·신질환·심부전·자궁내 성장제한·자궁 및 자궁의 부속기 질환: 주수 제한 없음. 19대 고위험 임신질환으로 진단받고 입원치료를 받은 임산부(분만 결과 자궁내 태아사망 등으로 사산한 경우도 지원대상 포함). 소득기준 없음(2024년 1월 폐지). 원칙적으로 입원치료만 지원 대상이며, 조사 범위의 공식 출처 중 외래진료를 지원 대상으로 명시한 곳은 없었습니다. 이 사업은 근로기준법상 사업장 규모(상시 4명 이하 등)에 따른 적용 제외와 무관한 보건복지부 모자보건사업으로, 별도의 사업장 규모 제외 규정은 확인되지 않았습니다.","cost":"고위험 임신 질환의 입원치료비 중 급여 항목의 전액본인부담금과 비급여 진료비(병실입원료·환자특식 등은 제외)에 해당하는 금액의 90%를 지원하며, 1인당 지원한도는 300만원입니다. 나머지 10%는 개인 부담입니다. 강남구보건소 안내에는 '단, 의료급여수급자는 비급여 본인부담금 전액 지원'이라는 문구가 있었으나 다른 출처에서는 확인되지 않아 unverified로 분류합니다.","deadlineText":"분만일로부터 6개월 이내(모든 확인된 출처에서 공통).","quotes":[{"text":"조기진통, 분만관련 출혈, 중증 임신중독증, 양막의 조기파열, 태반조기박리, 전치태반, 절박유산, 양수과다증, 양수과소증, 분만전 출혈, 자궁경부무력증, 고혈압, 다태임신, 당뇨병, 대사장애를 동반한 임신과다구토, 신질환, 심부전, 자궁 내 성장 제한, 자궁 및 자궁의 부속기 질환","source":"e보건소 공공보건포털 - 고위험임산부 의료비 지원","url":"https://www.e-health.go.kr/gh/caSrvcGud/selectMdclSupGudInfo.do?heBiz=PG00002&menuId=200010"},{"text":"기준 중위소득 180% 이하","source":"보건
