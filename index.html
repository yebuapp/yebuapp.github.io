var GUIDE      = {"적재일":"2026-08-25","용도":"임신 중 위험 신호와 생활 주의사항. 앱의 '이럴 땐 병원' 시트와 주차별 안내에 쓴다.","규율":["공공 출처 원문에서 확인한 문장만 싣는다. 흔히 도는 수치라도 출처를 못 찾으면 싣지 않는다.","출처끼리 어긋나면 양쪽을 다 적고 어느 쪽인지 밝힌다. 하나로 합치지 않는다.","이 데이터는 진단이 아니다. 판단은 의료진이 한다는 것을 화면에 함께 보여야 한다.","아빠오늘하나: 배우자 화면의 행동 제안 문구. 조사 원문이 아니라 우리가 쓴 생활 제안이다(2026-08-26 시안 승인). 의료 조언·복용·검사 지시 금지, 대리 체크·재촉 금지 원칙을 따른다."],"싣지_않은_것":[{"항목":"태동 감소 기준 (흔히 도는 '2시간에 10회 미만')","이유":"국내 공식 출처에 확립된 수치가 없습니다. 서울대학교병원이 '아직 바람직한 태동의 횟수나 기간에 대해 정확히 정해져 있는 것은 없는 상태'라고 명시합니다.","출처":"https://www.snuh.org/health/nMedInfo/nView.do?category=SYM&medid=AC000123","대신":"'평소와 다르게 태동이 줄었다고 느끼면 병원에 문의'로만 안내합니다."},{"항목":"태아 크기의 과일 비유 (25주 = 가지 등)","이유":"질병관리청·아이사랑·대한산부인과학회·상급종합병원 어디에서도 표준화된 비유를 찾지 못했습니다.","대신":"WHO 추정 체중 중앙값만 숫자로 보여 줍니다."}],"위험신호":[{"id":"preeclampsia_severe","긴급도":"즉시","제목":"심한 두통과 함께 눈이 침침하거나, 오른쪽 윗배가 아프거나, 소변이 확 줄었다","무엇":"중증 전자간증(임신중독증)의 증상입니다. 이 조합이 나타나면 바로 병원에 가야 합니다.","해당주차":{"from":20,"to":45},"인용":"중증의 전자간증이 되면 두통, 시력장애, 오른쪽 상복부 통증이 생기고 소변량이 줄어듭니다.","출처":{"name":"국가건강정보포털(질병관리청) — 임신고혈압과 전자간증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=3329","checkedAt":"2026-08-25"},"단계":"pregnant"},{"id":"preeclampsia_early","긴급도":"당일 문의","제목":"체중이 갑자기 늘고 손발이나 얼굴이 심하게 부었다","무엇":"전자간증의 초기 신호일 수 있습니다. 임신 중 부종 자체는 흔하지만, 갑작스럽고 심하면 확인이 필요합니다.","해당주차":{"from":20,"to":45},"인용":"초기 증상은 체중이 갑자기 늘고, 몸이 붓는 것입니다.","출처":{"name":"국가건강정보포털(질병관리청) — 임신고혈압과 전자간증","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=3329","checkedAt":"2026-08-25"},"덧붙임":"진단 기준은 임신 20주 이후 수축기 140mmHg 이상 또는 이완기 90mmHg 이상에 단백뇨가 함께 있는 경우입니다.","단계":"pregnant"},{"id":"preterm_labor","긴급도":"즉시","제목":"37주 전인데 배가 규칙적으로 뭉치거나, 출혈이 있거나, 물 같은 분비물이 흐른다","무엇":"조산 징후입니다. 임신 37주 이전의 분만을 조산이라고 합니다.","해당주차":{"from":16,"to":37},"인용":"질 분비물 증가, 물 같이 흐르는 질 분비물, 출혈, 규칙적인 복통, 평소와 다른 통증이 발생한 경우","출처":{"name":"국가건강정보포털(질병관리청) — 조산","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6583","checkedAt":"2026-08-25"},"덧붙임":"산모 스스로 조기진통을 구별하기 어려울 수 있으니, 이상하다고 느끼면 참지 말고 병원에 가세요.","단계":"pregnant"},{"id":"rupture_membranes","긴급도":"즉시","제목":"물이 왈칵 쏟아지거나 계속 흐른다 (양막 파수)","무엇":"양막이 터져 양수가 흐르는 것입니다. 아기가 바깥 환경에 노출되어 감염 위험이 있으므로 바로 병원에 가야 합니다.","해당주차":{"from":16,"to":45},"인용":"양막이 찢어지면서 양수의 일부가 흘러나오는 현상으로, 즉시 병원 방문이 필요합니다.","출처":{"name":"아이사랑 임신육아종합포털(보건복지부) — 출산 징후","url":"https://www.childcare.go.kr/?menuno=267","checkedAt":"2026-08-25"},"덧붙임":"임신부 10명 중 2~3명은 진통보다 양수가 먼저 터집니다. 드문 일이 아닙니다.","단계":"pregnant"},{"id":"bleeding_early","긴급도":"당일 문의","제목":"임신 20주 전에 피가 비친다","무엇":"임신 20주 이전 출혈은 산모의 20~25%가 겪을 만큼 흔하지만, 원인을 확인해야 합니다.","해당주차":{"from":4,"to":20},"인용":"약 20~25%의 산모가 임신 20주 이전에 출혈을 경험합니다.","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"단계":"pregnant"},{"id":"labor_onset","긴급도":"준비","제목":"규칙적인 진통이 시작됐다","무엇":"보통 10분 간격에서 시작해 점점 짧아집니다. 초산이면 5분 간격이 될 때 병원으로 갑니다.","해당주차":{"from":37,"to":45},"인용":"통상적으로 초산인 경우, 대부분의 의사들은 수축 현상이 규칙적으로 5분 주기로 짧아지면 병원에 와야 한다고 말합니다.","출처":{"name":"아이사랑 임신육아종합포털(보건복지부) — 출산 징후","url":"https://www.childcare.go.kr/?menuno=267","checkedAt":"2026-08-25"},"덧붙임":"같은 안내에 '15분 간격'이라는 기준도 함께 나옵니다. 어느 쪽이 출발 시점인지 분명하지 않으니 다니는 병원의 기준을 미리 물어 두세요. 둘째 이상이면 10분 간격이라도 진통이 강하면 미루지 마세요.","출처불일치":true,"단계":"pregnant"},{"id":"fetal_movement","긴급도":"당일 문의","제목":"평소와 다르게 태동이 줄었다고 느낀다","무엇":"태동은 20주경부터 느끼기 시작해 32주경 가장 활발합니다. 산모는 실제 태동의 약 80%만 느낍니다.","해당주차":{"from":20,"to":45},"인용":"실제로 약 80%의 태동만을 임산부가 감지하는 것으로 알려져 있다","출처":{"name":"서울대학교병원 의학정보 — 태동","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=SYM&medid=AC000123","checkedAt":"2026-08-25"},"덧붙임":"며칠에 몇 회 미만이면 위험하다는 공식 기준은 국내에 없습니다. 흔히 도는 '2시간에 10회' 같은 숫자는 근거를 찾지 못해 싣지 않았습니다. 숫자를 세기보다 '평소와 다른가'를 기준으로 삼고, 이상하면 문의하세요.","단계":"pregnant"},{"id":"pp_sign_01","단계":"postpartum","긴급도":"즉시","제목":"피가 지나치게 많이 나온다","무엇":"출산 직후 정상적인 오로와 다르게 지나치게 많은 양의 선홍색 피를 흘리거나, 질에서 500cc 이상의 출혈이 나타나는 경우(분만 후 출혈)","인용":"출산 직후에 지나치게 많은 양의 선홍색 피를 흘리거나 질에서 많은 양(500cc 이상)의 출혈이 나타나면 분만 후 출혈으로 진단할 수 있습니다.","출처":{"name":"서울아산병원 — 분만 후 출혈(Postpartum hemorrhage)","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31951","checkedAt":"2026-09-04"}},{"id":"pp_sign_02","단계":"postpartum","긴급도":"즉시","제목":"피는 많지 않은데 어지럽고 식은땀이 나며 가슴이 두근거린다","무엇":"겉으로 보이는 출혈은 적어 보여도 심장이 두근거리면서 어지럽고 식은땀이 나며 정신이 혼미해지는 경우(내부 출혈 의심 — 자궁 검진 필요)","인용":"심장이 두근거리면서 어지럽고 식은땀이 나면서 정신이 혼미해지는 증세가 동반될 경우 반드시 자궁 검진을 시행해야 합니다.","출처":{"name":"서울아산병원 — 분만 후 출혈(Postpartum hemorrhage)","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31951","checkedAt":"2026-09-04"}},{"id":"pp_sign_03","단계":"postpartum","긴급도":"즉시","제목":"갑자기 숨이 차고 가슴이 아프며 식은땀이 난다","무엇":"빈맥, 빈호흡, 흉통, 발한이 나타나는 경우(폐색전증 의심 — 매우 치명적, 응급처치 필요)","인용":"빈맥, 빈호흡, 흉통, 발한 등의 소견을 보이는 경우에는 폐 색전증을 의심합니다. 매우 치명적인 질환으로 응급처치가 필요하나","출처":{"name":"질병관리청 국가건강정보포털 — 제왕절개술","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6244","checkedAt":"2026-09-04"}},{"id":"pp_sign_04","단계":"postpartum","긴급도":"즉시","제목":"회음부가 붓고 아프거나 푸르스름하게 튀어나왔다","무엇":"회음절개·열상 부위나 음순이 아프거나 붉게 부어오르거나 푸르스름하게 튀어나오거나, 소변보기가 힘들거나 변의가 느껴지는 경우","인용":"회음 절개 부위나 음순이 아프거나, 붉게 부어오르거나, 푸르스름하게 튀어나온 부분이 있거나 소변 보기가 힘들거나 변의가 느껴진다면, 즉시 적절한 치료를 받아야 합니다.","출처":{"name":"서울아산병원 — 회음 열상(Perineal laceration)","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31950","checkedAt":"2026-09-04"}},{"id":"pp_sign_05","단계":"postpartum","긴급도":"즉시","제목":"죽음이나 자살에 대한 생각이 반복해서 떠오른다","무엇":"죽음이나 자살에 대한 생각이 반복적으로 떠오르는 경우","인용":"죽음이나 자살에 대한 생각이 반복적으로 떠오른다면 우울감이 심각한 것이므로 반드시 병원을 찾아야 합니다.","출처":{"name":"질병관리청 국가건강정보포털 — 우울감","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6788","checkedAt":"2026-09-04"}},{"id":"pp_sign_06","단계":"postpartum","긴급도":"즉시","제목":"말이 조리 없거나 환각이 있거나, 나나 아기를 해칠 것 같은 생각이 든다","무엇":"말의 조리가 없어지거나 강박적 사고, 망상·환각 등 산후정신증이 의심되는 경우, 또는 자신이나 아기에게 위해가 되는 사고·행동 가능성이 있는 경우","인용":"자신이나 아이에게 위해가 되는 사고와 행동화 가능성이 높아, 발견 즉시 전문 의료기관으로 안내한다.","출처":{"name":"국립정신건강센터 — 산모 우울증","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"}},{"id":"pp_sign_07","단계":"postpartum","긴급도":"당일 문의","제목":"열이 38도를 넘고 아랫배가 아프거나 냄새나는 분비물이 나온다","무엇":"산욕 10일 이내 이틀간 38℃ 이상 발열이 지속되며 회음부 통증·배뇨통·잔뇨·오한·복통·냄새나는 분비물이 동반되는 경우(산욕열 의심)","인용":"산욕열의 증상으로는 회음부 통증, 배뇨통, 잔뇨, 고열, 오한, 복통, 냄새나는 분비물 등이 있습니다.","출처":{"name":"서울아산병원 — 산욕열(Puerperal fever)","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31975","checkedAt":"2026-09-04"}},{"id":"pp_sign_08","단계":"postpartum","긴급도":"당일 문의","제목":"오로가 갑자기 많아졌다","무엇":"갑자기 피 같은 분비물이 다량 나오는 경우","인용":"갑자기 피같은 분비물이 다량 나오면 진찰을 받아 보아야 합니다.","출처":{"name":"보건복지부 임신육아종합포털 아이사랑 — 산욕기","url":"https://www.childcare.go.kr/?menuno=276","checkedAt":"2026-09-04"}},{"id":"pp_sign_09","단계":"postpartum","긴급도":"당일 문의","제목":"3주가 지났는데 붉은 오로가 줄지 않는다","무엇":"출산 후 3주가 지났는데도 출혈량이 줄지 않고 붉은색 오로가 장기간 계속되는 경우","인용":"출산 후 3주 정도가 지났는데 출혈량이 줄어들지 않고, 색깔이 붉은색으로 장기간 나올 경우에는 병원을 방문하여 진찰을 받아야 합니다.","출처":{"name":"보건복지부 임신육아종합포털 아이사랑 — 자연분만 (대한산부인과학회)","url":"https://www.childcare.go.kr/?menuno=270","checkedAt":"2026-09-04"}},{"id":"pp_sign_10","단계":"postpartum","긴급도":"당일 문의","제목":"수술 상처가 붉게 붓거나 고름 같은 것이 나온다","무엇":"제왕절개 수술 상처에 발열과 함께 압통·충혈·경화가 있거나 고름 같은 분비물이 있는 경우(상처 감염)","인용":"수술 후 발열이 있는 환자는 수술 상처 부위의 압통, 충혈, 경화가 있거나, 고름 같은 분비물이 있을 때 상처 감염을 진단합니다.","출처":{"name":"질병관리청 국가건강정보포털 — 제왕절개술","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6244","checkedAt":"2026-09-04"}},{"id":"pp_sign_11","단계":"postpartum","긴급도":"당일 문의","제목":"한쪽 다리가 붓고 아프다","무엇":"제왕절개 후 한쪽 다리가 붓고 동통·압통이 있는 경우(심부정맥혈전증 의심)","인용":"한쪽 다리가 붓고 동통과 압통이 있을 때 심부정맥혈전증을 의심할 수 있으며","출처":{"name":"질병관리청 국가건강정보포털 — 제왕절개술","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6244","checkedAt":"2026-09-04"}},{"id":"pp_sign_12","단계":"postpartum","긴급도":"당일 문의","제목":"소변보기가 어렵거나 다 본 뒤에도 남은 느낌이 든다","무엇":"출산 후 소변보기가 어렵거나 소변을 본 뒤에도 잔뇨감이 있는 경우","인용":"출산 후 소변을 보기 어렵거나 소변을 본 후에도 잔뇨감이 있는 경우에는 의사의 진찰을 받아야 합니다.","출처":{"name":"보건복지부 임신육아종합포털 아이사랑 — 자연분만 (대한산부인과학회)","url":"https://www.childcare.go.kr/?menuno=270","checkedAt":"2026-09-04"}},{"id":"pp_sign_13","단계":"postpartum","긴급도":"당일 문의","제목":"유방이 붓고 아프면서 열이 나고 몸살 기운이 있다","무엇":"유선염이 진행되면서 발열, 빈맥, 백혈구 증가 등 패혈증 증상을 보이는 경우","인용":"더 진행되면 발열, 빈맥, 백혈구 증가 등 패혈증 증상을 보일 수도 있습니다","출처":{"name":"질병관리청 국가건강정보포털 — 유선염","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5680","checkedAt":"2026-09-04"}},{"id":"pp_sign_14","단계":"postpartum","긴급도":"당일 문의","제목":"우울한 기분이 2주 넘게 이어지거나 일상에 지장을 준다","무엇":"산후우울감(baby blues) 증상이 2주 이상 지속되는 경우","인용":"증상이 열흘 이내에 대부분 가라앉기는 하나, 2주 이상 지속된다면 전문 기관으로 안내하는 것이 좋다.","출처":{"name":"국립정신건강센터 — 산모 우울증","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"}}],"생활수칙":[{"id":"caffeine","제목":"카페인","내용":"하루 200mg 이하를 권합니다. 원두커피 한 잔(200ml)에 150~164mg이 들어 있어 사실상 하루 한 잔입니다.","인용":"일반적으로 1일 200 mg 이하의 카페인 섭취는 문제가 되지 않습니다.","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"덧붙임":"같은 질병관리청 포털의 다른 문서(식이영양)는 300mg 이하로 안내합니다. 기관 안에서도 값이 갈려 있어 더 보수적인 200mg을 기준으로 적었습니다.","출처불일치":true},{"id":"alcohol","제목":"술","내용":"한 모금도 안 됩니다. 안전한 양이 정해져 있지 않습니다.","인용":"에탄올은 강력한 기형유발물질로","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"덧붙임":"계속 마시면 태아의 성장 제한, 얼굴 이상, 중추신경계 기능장애를 특징으로 하는 태아알코올증후군이 생길 수 있습니다."},{"id":"smoking","제목":"담배","내용":"조산, 저체중 출생, 태반조기박리 위험이 올라갑니다.","인용":"임신 중 흡연은 조산이나 태아성장제한으로 저체중출생아, 그리고 태반조기박리 위험을 증가","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"}},{"id":"fish","제목":"생선","내용":"상어, 황새치, 냉동 참치는 주 1회 이하로 드세요. 수은 때문입니다.","인용":"상어, 황새치, 냉동 참치를 주 1회 이하로 섭취할 것을 권고","출처":{"name":"국가건강정보포털(질병관리청) — 임산부 식이영양","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5214","checkedAt":"2026-08-25"}},{"id":"exercise","제목":"운동","내용":"하루 30분 이상 규칙적으로 움직이는 것을 권합니다.","인용":"하루 30분 이상 규칙적이고 적절한 정도의 운동을 할 것을 권고","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"}},{"id":"sauna","제목":"사우나·뜨거운 목욕","내용":"임신 초기에는 피하세요.","해당주차":{"from":0,"to":13},"인용":"임신 초기에 사우나나 뜨거운 욕조 목욕은 피해야","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"}},{"id":"sex","제목":"부부관계","내용":"건강한 임신이라면 마지막 4주를 포함해 전 기간 제한할 필요가 없습니다.","인용":"건강한 임신부는 임신 마지막 4주를 포함한 임신 전 기간에 걸쳐 성교를 제한할 필요는 없습니다.","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"덧붙임":"조산 위험이 있거나 전치태반 등 문제가 있으면 다릅니다. 담당의에게 확인하세요."},{"id":"travel","제목":"여행","내용":"34~36주 이후에는 장거리 이동을 피하세요. 이동 중에는 한 시간마다 다리를 움직입니다.","해당주차":{"from":34,"to":45},"인용":"임신 34~36주 이후에는 진통이 생기면서 분만이 임박할 가능성이 높으므로","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"덧붙임":"항공사마다 탑승 제한 주수가 따로 있습니다. 정부 공식 자료에는 항공사별 기준이 없어 싣지 못했으니, 표를 끊기 전에 항공사에 직접 확인하세요."},{"id":"weight","제목":"체중","내용":"임신 전 체질량지수가 18.5~24.9였다면 임신 기간 전체에 11.5~16kg 늘어나는 것이 적절합니다.","인용":"정상 신체비만지수를 가진 여성(BMI 18.5~24.9)의 경우 임신 중 체중이 11.5~16 kg 증가하는 것이 적절","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"덧붙임":"임신 첫 12주에는 1~2kg 정도만 늘어납니다. '2인분을 먹어야 한다'는 말은 근거가 없습니다."},{"id":"iron_folate","제목":"철분과 엽산","내용":"철분은 하루 24mg(성분철 기준), 엽산은 임신부 기준 하루 620㎍을 권합니다.","인용":"가임기 여성은 하루에 400 ug, 임산부는 620 ug, 수유부는 550 ug의 엽산 섭취가 권장","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"}},{"id":"flu_vaccine","제목":"독감 예방접종","내용":"임신 주수와 상관없이 맞을 수 있고, 주소지와 관계없이 전국 위탁의료기관과 보건소에서 무료입니다.","인용":"임신부는 주소지와 관계없이 전국 위탁의료기관 및 보건소에서 무료로 인플루엔자 예방접종을 받으실 수 있습니다.","출처":{"name":"예방접종도우미(질병관리청)","url":"https://nip.kdca.go.kr/irhp/infm/goVcntInfo.do?menuLv=1&menuCd=134","checkedAt":"2026-08-25"},"덧붙임":"산모수첩이나 임신확인서를 가져가면 됩니다. 2026-2027절기 접종 기간은 2026년 9월 21일부터입니다."}],"몸의변화":[{"id":"nausea","제목":"입덧","해당주차":{"from":6,"to":22},"내용":"대개 6주경 시작해 14~16주까지 갑니다. 절반은 14주경에, 90%는 22주경에 사라집니다.","인용":"대개 입덧은 임산부의 절반이 14주 경에, 90%는 22주 경에 없어집니다.","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"아빠오늘하나":"저녁 메뉴를 정하지 말고 물어보기 — 입덧엔 '먹을 수 있는 것'이 그날그날 다릅니다."},{"id":"fatigue","제목":"피로와 졸음","해당주차":{"from":4,"to":13},"내용":"임신 초기에는 피로를 많이 느끼고 잠이 많아집니다.","인용":"임신 초기에는 피로를 많이 느끼며 잠이 많아지는데","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"아빠오늘하나":"오늘 설거지와 쓰레기는 말없이 내 몫으로. 생색은 다음 주에."},{"id":"heartbeat","제목":"태아 심박동","해당주차":{"from":5,"to":45},"내용":"5~6주경 초음파로 심박동이 확인되고, 17주부터는 청진기로도 들을 수 있습니다. 정상 심박수는 분당 110~160회입니다.","인용":"임신 기간 중 정상적인 태아 심박동수는 분당 110~160회입니다.","출처":{"name":"국가건강정보포털(질병관리청) — 정상 임신의 관리","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-25"},"아빠오늘하나":"다음 검진 날짜를 내 캘린더에도 넣기 — 심박동은 같이 들을 수 있습니다."},{"id":"movement_start","제목":"태동","해당주차":{"from":18,"to":45},"내용":"초음파로는 7~8주부터 보이지만, 산모가 느끼는 것은 대개 18~20주부터입니다. 32주경 가장 활발합니다.","인용":"초음파 검사를 통해 임신 7~8주경부터 관찰되며 임산부는 보통 18~20주부터 태동을 감지할 수 있다","출처":{"name":"서울대학교병원 의학정보 — 태동","url":"https://www.snuh.org/health/nMedInfo/nView.do?category=SYM&medid=AC000123","checkedAt":"2026-08-25"},"아빠오늘하나":"오늘 밤 10분, 손을 올려놓고 기다려 보기 — 겉에서는 아직 안 느껴질 수 있습니다."},{"id":"uterus_size","제목":"자궁 크기","해당주차":{"from":7,"to":20},"내용":"7주에 거위알, 11주에 주먹, 19주에는 어린아이 머리 정도가 됩니다.","인용":"자궁의 크기는 일반적으로 임신 7주일 때는 거위알 크기만 하며 11주일 때는 주먹크기, 19주일 때는 어린애 머리 크기만하다","출처":{"name":"서울시민건강포털(서울의료원)","url":"https://health.seoulmc.or.kr/healthCareInfo/pregnancyView.do?boardPid=847","checkedAt":"2026-08-25"},"덧붙임":"아기가 아니라 자궁의 크기입니다. 헷갈리기 쉬워 함께 적어 둡니다.","아빠오늘하나":"\"배 나왔네\" 대신 몸이 오늘 어떤지 물어보기 — 지금 커지는 건 아기가 아니라 자궁입니다."},{"id":"weight_trimester","제목":"체중이 느는 속도","해당주차":{"from":4,"to":45},"내용":"첫 12주에는 1~2kg만 늘고, 마지막 3개월에 5kg 정도 늡니다. 초기 증가분은 아기가 아니라 태반·가슴·자궁·늘어난 혈액입니다.","출처":{"name":"아이사랑 임신육아종합포털(보건복지부)","url":"https://www.childcare.go.kr/?menuno=8","checkedAt":"2026-08-25"},"덧붙임":"포털 본문을 요약해 옮긴 것으로, 문장 단위 원문 대조는 하지 못했습니다.","아빠오늘하나":"체중 이야기는 오늘도 꺼내지 않기 — 늘어난 것은 살이 아니라 태반과 혈액입니다."}]};
var LIFE       = [{"id":"fertile_window","drawer":"prep","title":"임신은 언제 되는가","summary":"배란 5일 전부터가 가장 가능성이 높은 시기입니다","lead":"임신이 되는 날은 한 달 중 며칠뿐입니다 — 특히 남성이 모르는 경우가 많은 기본입니다.","facts":[{"factKo":"배란일은 다음 생리 시작 예정일로부터 14일 전입니다.","quote":"'배란일'은 다음 생리 시작 예정일로부터 14일 전이며, 임신 가능성이 가장 높은 가임시기는 배란예정일 5일 전부터 배란예정일 2~3일 까지가 됩니다.","grade":"확인","source":{"name":"임신육아종합포털 아이사랑(보건복지부) - 배란,수정,착상","url":"https://www.childcare.go.kr/?menuno=354","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"임신 가능성이 가장 높은 가임기는 배란예정일 5일 전부터 배란예정일 후 2~3일까지입니다.","quote":"임신 가능성이 가장 높은 가임시기는 배란예정일 5일 전부터 배란예정일 2~3일 까지가 됩니다.","grade":"확인","source":{"name":"임신육아종합포털 아이사랑(보건복지부) - 배란,수정,착상","url":"https://www.childcare.go.kr/?menuno=354","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"난자의 생존 기간은 배란 후 18~24시간이며, 정자는 그보다 생존 기간이 길어 사정 후 수일 동안 생존합니다.","quote":"난자의 생명은 배란 후 18~24시간 정도입니다. 하지만 정자는 그보다 생명이 길어 사정 후 수 일 동안 살아 있습니다.","grade":"확인","source":{"name":"임신육아종합포털 아이사랑(보건복지부) - 배란,수정,착상","url":"https://www.childcare.go.kr/?menuno=354","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"정상 생리주기는 평균 21~35일(평균 28일) 범위에 듭니다.","quote":"생리주기의 평균값이 21~35일 이내(평균 28일)에 들어가면 정상이다.","grade":"확인","source":{"name":"국민건강보험공단(nhis.or.kr) 매거진 - 생리주기? 배란일? 이렇게 계산하세요!","url":"https://www.nhis.or.kr/magazin/145/html/sub6.html","checkedAt":"2026-08-26"},"caveats":[]}]},{"id":"supplements_women","drawer":"prep","title":"여성 영양제 — 공식 권고 수치","summary":"엽산은 임신 1개월 전부터, 비타민A 는 과잉이 문제입니다","facts":[{"factKo":"임신을 준비하거나 임신 중인 여성에게 질병관리청은 엽산(가임기 여성 하루 400ug, 임산부 620ug, 수유부 550ug), 철분(하루 대략 성분철 기준 24mg), 비타민D·칼슘(태아 골격 형성을 위해 유제품 섭취 권장) 섭취를 권고합니다.","quote":"임신 전과 임신 초기에 엽산을 복용하면 태아의 신경관결손 발생 위험을 낮춥니다. 가임기 여성은 하루에 400 ug, 임산부는 620 ug, 수유부는 550 ug의 엽산 섭취가 권장됩니다.","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 - 정상임신관리(임신의 진단과 관리)","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6301","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"임신 준비 및 임신 중 여성은 최소 임신 1개월 전부터 임신 12~14주까지 하루 0.4~0.8mg의 엽산을 복용할 것이 권장되며, 동물성 비타민A(레티놀)는 과잉 복용 시 태아 기형을 유발할 수 있어 주의해야 합니다.","quote":"동물성 비타민 A인 레티놀 성분은 임신준비 및 임신 중에 과도하게 복용하면 태아 기형을 유발할 수 있습니다.","grade":"확인","source":{"name":"임신육아종합포털 아이사랑(보건복지부) - 임신준비 - 영양 및 식습관","url":"https://www.childcare.go.kr/?menuno=349","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["비타민D·칼슘은 \"유제품을 식단에 포함하라\"는 정성 권고까지만 있고, 하루 용량 수치는 공식 안내에 없습니다."]},{"id":"supplements_men","drawer":"prep","title":"남성 영양제 — 공식 권고가 없다","summary":"없다는 사실까지가 확인된 정보입니다","lead":"정부·공공기관의 남성(예비아빠) 대상 영양제 권고를 아이사랑·질병관리청·식약처에서 찾았지만 없었습니다. 광고가 권하는 것과 공식 권고는 다릅니다 — 궁금하면 가임력 검사 때 의사에게 물어보는 것이 정확합니다.","grade":"참고","gradeLabel":"탐색 결과","facts":[],"caveats":["국내 학회 차원의 권고 원문은 확인하지 못했습니다. 학회 권고가 있을 가능성은 있습니다. (2026-08-26 기준)"]},{"id":"ovulation_test","drawer":"prep","title":"배란테스트기 바로 쓰기","summary":"같은 시간대에, 개봉 즉시, 임신 진단 용도는 아닙니다","facts":[{"factKo":"식약처는 배란테스트기를 매일 같은 시간대에 검사하고, 개봉 후 바로 사용하며, 검사 전 제품별 사용설명서를 숙지하라고 안내합니다. 테스트 결과는 임신 진단 용도로 쓸 수 없습니다.","quote":"검사 시작 전 제품 사용설명서를 충분히 숙지하세요.","grade":"확인","source":{"name":"식품의약품안전처(부산지방식품의약품안전청) - 컨슈머 뉴스레터: 배란테스트기의 올바른 사용법","url":"https://www.mfds.go.kr/brd/m_768/view.do?seq=3665","checkedAt":"2026-08-26"},"caveats":[]}]},{"id":"fish_mercury","drawer":"food","title":"생선 — 일주일 400g, 고수은 어종은 100g","summary":"\"적당히\"가 아니라 g 으로 말하는 식약처 기준입니다","facts":[{"factKo":"임신·수유 여성은 일반어류·참치통조림을 섭취할 경우 일주일에 400g 이하(1회 60g 기준 주 6회 정도)로 섭취하는 것이 좋다는 것이 식약처 안내입니다.","quote":"메틸수은 함량이 비교적 낮은 일반어류와 참치통조림은 일주일에 400g 이하로 섭취하는 것이 좋으며, 한번 섭취할 때 60g(100g 참치통조림 1캔의 3/5) 기준 일주일에 6회 정도 섭취할 수 있는 양이다.","grade":"확인","source":{"name":"식품의약품안전처 imFOOD(임산부·어린이 안전 식생활 정보) - 생선 안전 섭취 가이드","url":"https://impfood.mfds.go.kr/CFBBB02F02/getCntntsDetail?cntntsSn=282419","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"다랑어류·새치류·상어류(심해성 어류)만 섭취할 경우 임신·수유 여성은 일주일에 100g 이하, 주 1회 정도로 제한하라는 것이 식약처 안내입니다.","quote":"메틸수은 함량이 비교적 높은 다랑어‧새치류 및 상어류는 일주일에 100g의 이하로 섭취하며, 일주일에 한번 정도 섭취하는 것이 바람직하다.","grade":"확인","source":{"name":"식품의약품안전처 imFOOD(임산부·어린이 안전 식생활 정보) - 생선 안전 섭취 가이드","url":"https://impfood.mfds.go.kr/CFBBB02F02/getCntntsDetail?cntntsSn=282419","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"식약처는 메틸수은이 태아·영아의 신경계 발달에 영향을 줄 수 있어 임신·수유 여성과 어린이는 생선 섭취에 주의가 필요하다고 안내합니다.","quote":"메틸수은이 태아 또는 영아의 신경계 발달에 영향을 주기 때문에 생선 섭취에 주의가 필요하다","grade":"확인","source":{"name":"식품의약품안전처 imFOOD(임산부·어린이 안전 식생활 정보) - 생선 안전 섭취 가이드","url":"https://impfood.mfds.go.kr/CFBBB02F02/getCntntsDetail?cntntsSn=282419","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["400g 은 일반어류·참치통조림만 먹을 때의 기준이다 — 다랑어·새치류를 함께 먹는 주에는 그만큼 줄입니다.","다랑어류·새치류·상어류에 정확히 어떤 생선이 들어가는지는 원문 페이지의 표에서 확인할 수 있습니다."]},{"id":"listeria","drawer":"food","title":"리스테리아 — 임산부가 조심해야 하는 균","summary":"비살균 유제품·무른 치즈·훈제식품이 주의 대상입니다","facts":[{"factKo":"리스테리아균에 감염되면 건강한 사람은 대부분 정상 회복되지만, 임산부·태아를 포함한 면역저하자는 증상이 심각한 경우 패혈증·뇌수막염으로 이어질 수 있다는 것이 국립수산물품질관리원(해양수산부) 안내입니다.","quote":"건강한 사람이 이 균에 감염되면 증상이 없거나 1~7일의 잠복기를 거쳐 가벼운 열과 복통, 설사, 구토 등을 일으키다 대부분 정상 회복되지만 임산부 및 태아, AIDS 등 면역력이 약화된 환자, 암 환자, 당뇨, 간경병증, 천식, 궤양성대장염을 앓고 있는 환자, 노약자 등은 증상이 심각한 경우 패혈증, 뇌수막염의 증세로 이어질 수도 있다.","grade":"확인","source":{"name":"국립수산물품질관리원(해양수산부 산하) - 리스테리아 모노사이토제네스","url":"https://www.fsis.go.kr/front/contents/cmsView.do?cate_id=0101&cnts_id=22724&select_list_no=52","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"신경계로 감염이 진행되면 두통·경련 등이 나타나며, 임산부의 경우 태아에게 전이되어 유산·사산을 유발할 수 있다는 것이 국립수산물품질관리원 안내입니다.","quote":"감염이 신경계로 감염될 경우 두통, 뒷목의 뻣뻣함, 혼미, 평형감각 소실 및 경련 등이 나타나며, 임산부의 경우 태아에게 전이되어 유산, 사산 등을 유발할 수 있다.","grade":"확인","source":{"name":"국립수산물품질관리원(해양수산부 산하) - 리스테리아 모노사이토제네스","url":"https://www.fsis.go.kr/front/contents/cmsView.do?cate_id=0101&cnts_id=22724&select_list_no=52","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"리스테리아균 예방을 위해서는 65℃에서 10분 또는 72℃에서 30초 이상 충분히 가열한 뒤 바로 먹어야 하며, 훈제식품도 섭취 전 충분히 가열해야 한다는 것이 국립수산물품질관리원 안내입니다.","quote":"조리할 때 65℃에서 10분, 또는 72℃에서 30초 이상 가열하는 등 반드시 음식물을 충분히 끓인 뒤 바로 먹도록 해야 하며","grade":"확인","source":{"name":"국립수산물품질관리원(해양수산부 산하) - 리스테리아 모노사이토제네스","url":"https://www.fsis.go.kr/front/contents/cmsView.do?cate_id=0101&cnts_id=22724&select_list_no=52","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"리스테리아 식중독을 일으키는 주요 식품에 원유, 살균처리하지 않은 우유, 치즈, 아이스크림 등이 포함되며, 유제품·주스는 반드시 살균 처리된 것을 섭취해야 한다는 것이 국립수산물품질관리원 안내입니다.","quote":"리스테리아 모노사이토제네스 식중독을 일으키는 주요 식품으로는 원유, 살균처리하지 아니한 우유, 핫도그, 치즈, 아이스크림, 소시지 및 건조소시지, 가공·비가공 가금육, 비가공 식육 등 식육제품과 비가공·훈연생선 및 채소류 등이 있다.","grade":"확인","source":{"name":"국립수산물품질관리원(해양수산부 산하) - 리스테리아 모노사이토제네스","url":"https://www.fsis.go.kr/front/contents/cmsView.do?cate_id=0101&cnts_id=22724&select_list_no=52","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"단단한 치즈보다 무른(물렁한) 치즈에서 리스테리아균이 검출될 위험이 더 높다는 것이 국립수산물품질관리원 안내입니다.","quote":"딱딱한 치즈보다 물렁한 치즈에서 리스테리아 모노사이토제네스가 검출될 위험이 더 높다.","grade":"확인","source":{"name":"국립수산물품질관리원(해양수산부 산하) - 리스테리아 모노사이토제네스","url":"https://www.fsis.go.kr/front/contents/cmsView.do?cate_id=0101&cnts_id=22724&select_list_no=52","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["살균 처리된 유제품은 괜찮고, 비살균 유제품과 무른(연성) 치즈가 주의 대상입니다.","브리·카망베르처럼 치즈 이름을 짚은 목록은 공식 원문에 없다 — 원문은 \"물렁한 치즈\"까지만 말합니다."]},{"id":"reheat_74","drawer":"food","title":"남은 음식 재가열은 74℃","summary":"식중독 예방의 일반 기준 — 리스테리아 기준과는 다른 수치입니다","facts":[{"factKo":"식중독균을 효과적으로 제거하려면 조리 시 74℃ 이상 중심부 온도에서 1분 이상 가열해야 하고, 남은 음식을 재가열할 때도 최초 조리 시와 동일하게 74℃ 기준을 적용한다는 것이 식품안전나라(식약처) 안내입니다.","quote":"식중독균을 효과적으로 제거하려면 조리 시 74℃ 이상의 중심부 온도에서 1분 이상 가열하고, 보관은 5℃ 이하 또는 60℃ 이상에서 하는 것이 안전합니다.","grade":"확인","source":{"name":"식품안전나라(식품의약품안전처) - 식중독 예방을 위한 권장 온도가 있다면서요?","url":"https://www.foodsafetykorea.go.kr/portal/board/boardDetail.do?menu_no=3120&bbs_no=bbs001&ntctxt_no=21793&menu_grp=MENU_NEW01","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["74℃(1분 이상)는 식중독 예방 일반 기준이고, 리스테리아 전용 기준은 65℃ 10분 또는 72℃ 30초다 — 서로 다른 안내의 수치라 섞어 쓰지 않습니다."]},{"id":"undercooked","drawer":"food","title":"덜 익힌 것들 — 육류·해산물·생채소","summary":"속까지 익히고, 씻어서 먹습니다","facts":[{"factKo":"임신부는 면역 기능이 저하된 상태이므로 식중독 예방을 위해 생채소·과일은 깨끗이 씻어 섭취하고 육류·해산물은 속까지 충분히 익혀 먹어야 한다는 것이 식약처(정책브리핑) 안내입니다.","quote":"임신부는 면역 기능이 저하되어 있는 상태이므로, 식중독을 예방하기 위해 생채소·과일 등은 깨끗하게 씻어 섭취하고 육류·해산물 등을 식품 내부까지 충분히 익혀 먹어야 한다.","grade":"확인","source":{"name":"식품의약품안전처(대한민국 정책브리핑 게재, 보건복지부 복지로 전재) - 임산부를 위한 영양·식생활 관리","url":"https://www.bokjiro.go.kr/ssis-tbu/cms/pc/news/news/6534141.html","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["흔히 톡소플라스마 예방으로 알려져 있지만, 이를 명시한 정부 원문은 확인하지 못했습니다. 여기에 실은 내용은 식중독 예방을 위한 일반 권고입니다."]},{"id":"daycare_wait","drawer":"child","title":"어린이집 — 대기는 출생 후, 임신부 자녀는 1순위","summary":"태아 상태로는 신청이 안 되지만, 임신 자체가 우선순위를 만듭니다","facts":[{"factKo":"어린이집 입소대기 신청은 태아 상태로는 불가하며 원칙적으로 출생 후부터 가능합니다. 다만 출산예정일이 입소 희망일 이전인 경우에 한해 진단서 등을 제출하면 임신 중인 태아를 자녀수에 포함할 수 있습니다.","quote":"태아는 자녀에 포함되지 않으므로 태아에 대한 입소대기신청은 불가합니다. 다만, 임신 중인 태아가 입소일 전에 출산예정인 경우 임신중인 태아를 자녀수에 포함 가능합니다(출산예정일이 명시된 진단서 등 제출).","grade":"확인","source":{"name":"찾기쉬운 생활법령정보(법제처) - 보육대상 및 입소자 등 \u003c 어린이집 운영","url":"https://www.easylaw.go.kr/CSP/CnpClsMainBtr.laf?popMenu=ov&csmSeq=1291&ccfNo=1&cciNo=1&cnpClsNo=2","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"어린이집 우선 제공 대상에 '임신부의 자녀인 영유아'가 있습니다(영유아보육법 시행규칙 제29조제3항제3호). 엄마가 임신 중일 때 이미 태어나 있는 아이가 해당합니다. 아이사랑 안내에 따르면 대기를 신청한 아이가 어린이집에 등원할 때 엄마가 임신 중이어야 이 항목으로 인정되고, 출산한 뒤라면 '자녀가 2명 이상인 가구' 항목을 고릅니다.","quote":"임신부의 자녀인 영유아","grade":"확인","source":{"name":"국가법령정보센터 - 영유아보육법 시행규칙 제29조(보육의 우선 제공) · 임신육아종합포털 아이사랑 - 우선순위 관련 규정","url":"https://www.law.go.kr/법령/영유아보육법시행규칙","checkedAt":"2026-10-07"},"caveats":[]}],"caveats":["출산예정일 예외를 쓸 때 내야 하는 진단서 등 구체 서류·절차는 유보통합포털의 안내를 따로 확인해야 합니다."]},{"id":"nursery_portal","drawer":"child","title":"유치원·어린이집 신청은 유보통합포털 한 곳","summary":"예년 기준 11월 초에 다음 학년도 신청이 열립니다","facts":[{"factKo":"유치원 입학 신청과 어린이집 입소대기 신청이 '유보통합포털' 한 곳으로 통합되어, 기존에 각각 쓰이던 '아이사랑'(어린이집)과 '처음학교로'(유치원) 사이트를 대체했습니다. 통합포털은 매년 11월경 개통되어 다음 학년도 입소·입학 신청을 받습니다.","quote":"내년도 어린이집 입소와 유치원 입학 신청을 한곳에서 할 수 있는 '유보통합포털'이 오는 11월 1일에 개통한다. ... 기존에는 어린이집 입소 대기 신청이 '아이사랑' 사이트, 유치원 입학 신청은 '처음학교로' 사이트에서 별도로 이뤄졌으나, 이번 유보통합포털 구축으로 앞으로는 유보통합포털 한 곳에서 신청할 수 있다.","grade":"확인","source":{"name":"대한민국 정책브리핑(korea.kr) 정책뉴스","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148935558","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["올해(2026년) 정확한 접수 개시일은 아직 공식 확인 전이다 — 확인된 것은 \"매년 11월경 개통\"이라는 예년 패턴까지입니다."]},{"id":"english_academy","drawer":"child","title":"유아 영어학원 — 모집 시험이 금지된다","summary":"레벨테스트 금지 학원법 개정이 국회를 통과했습니다 (2026.3.12)","facts":[{"factKo":"교육부는 「학원의 설립·운영 및 과외교습에 관한 법률」(학원법)을 개정하여, 유아를 대상으로 모집이나 수준별 배정을 목적으로 하는 모든 형태의 시험·평가를 금지했습니다. 이 '레벨테스트 금지' 개정안은 2026년 3월 12일 국회 본회의를 통과했습니다.","quote":"'레벨테스트 금지'에 대한 「학원법」 개정 건은 국회 본회의 통과('26.3.12.)","grade":"확인","source":{"name":"대한민국 정책브리핑(korea.kr) 교육부 보도자료 - 아동 발달권 보호를 위한 「영유아 사교육 대응 방안」","url":"https://m.korea.kr/briefing/pressReleaseView.do?newsId=156752310","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["시행일과 위반 시 과태료의 단계별 금액은 공식 원문에서 확인하지 못해 싣지 않았습니다. 언론은 2026년 10월 시행, 과태료 100~300만원으로 보도했으나 아직 원문 대조 전입니다. 정확한 내용은 관계 기관에 확인해 주세요."]},{"id":"baby_names","drawer":"ref","title":"이름 — 통계와 규칙만","summary":"추천은 하지 않습니다. 취향은 부모의 것입니다","grade":"참고","gradeLabel":"통계","facts":[{"factKo":"올해 인기 이름은 대법원 전자가족관계등록통계시스템의 \"상위 출생신고 이름 현황\"에서 지역·기간을 골라 직접 조회할 수 있다 — 출생신고 실데이터를 이름 순위로 집계한 공식 통계입니다.","quote":"가족관계의 등록 등에 관한 법률 시행(2008. 1. 1.) 이후 조회일 현재까지 해당 지역의 가족관계등록관서를 통하여 출생사건이 접수된 후 가족관계등록부에 기록된 정보를 이름 순위로 집계한 일단위 통계 잠정치임(등록일 기준)","grade":"확인","source":{"name":"대법원 전자가족관계등록통계시스템 - 상위 출생신고 이름 현황","url":"https://stfamily.scourt.go.kr/st/StFrrStatcsView.do?pgmId=090000000025","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"대법원은 2024년 6월 11일부터 인명용 한자를 기존 8,319자에서 1,070자 추가해 총 9,389자로 확대 시행했습니다. 이는 2014년 이후 최대 폭의 확대입니다.","quote":"○ 현재 우리나라 국민이 이름에 사용할 수 있는 인명용(人名用)한자 수는 8,319자임\n○ 대법원은 국민의 출생신고나 개명 시 이름에 쓸 수 있는 한자에 㖀(률), 疋(아), 䬈(태) 등 한자 1,070자를 새로 추가하여 총 9,389자로 대폭 확대하여 2024. 6. 11.부터 시행\n○ 이번 개정은 2014년 이후 최대 폭의 확대로, 인명용 한자 제한 규정이 신설되기 전부터 이름에 사용되어 가족관계등록부 이름란에 기재된 인명용 외 한자 등을 정책연구용역을 통하여 인명용 한자에 추가한 것임","grade":"확인","source":{"name":"대법원 보도자료 \"대법원, 이름에 쓸 수 있는 한자 수 대폭 확대 !\" (2024-05-23)","url":"https://scourt.go.kr/portal/news/NewsViewAction.work?seqnum=2642&gubun=6&searchOption=&searchWord=","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"이름은 성을 제외하고 5자를 넘으면 출생신고가 수리되지 않습니다.","quote":"이름 글자수가 5자(성은 포함하지 않음)를 초과하는 출생신고는 수리할 수 없으나 그동안 외국인 부와 한국인 모 사이에 출생한 혼인중의 자에 한정하여 ① 외국인 부의 성을 따라 ② 부의 나라의 신분등록부에 기재된 ③ 외국식 이름으로 출생신고를 하는 경우에만 이러한 제한을 두지 않았습니다.","grade":"확인","source":{"name":"대법원 보도자료 \"외국인과 한국인 사이에 출생한 자녀, 이름 글자수 제한 없이 출생신고 가능\" (2025-06-24)","url":"https://www.scourt.go.kr/portal/news/NewsViewAction.work?pageIndex=3&searchWord=&searchOption=&seqnum=2820&gubun=6","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"2025년 6월 20일부터 외국인-한국인 부부의 자녀는 외국 신분등록부에 기재된 이름이면 글자수 제한 없이 출생신고할 수 있습니다. 한국인 부부의 자녀는 5자 제한이 그대로입니다.","quote":"2025. 6. 20.부터 대법원은 외국인과 한국인 사이에 출생한 자녀에 대하여 이름 글자수 제한 없이 출생신고가 가능하도록 함으로써 당사자의 선택권을 대폭 보장하게 되었습니다.\n◎ 외국인 부와 한국인 모 사이에 출생한 혼인중의 자의 이름은 부의 나라의 신분등록부에 기재된 이름으로 출생신고를 하는 경우, 이름 글자수 제한을 받지 않습니다.\n◎ 한국인 부와 외국인 모 사이에 출생한 혼인중의 자의 이름도 모의 나라의 신분등록부에 기재된 이름으로 출생신고를 하는 경우, 이름 글자수 제한을 받지 않습니다.\n◎ 관련 규정의 개정 전에 이미 출생신고를 한 경우에도 이름 글자수 제한 없이 외국의 신분등록부에 기재된 이름을 사용하기 위해서는 추후보완신고로 가족관계등록부에 그 이름을 기록할 수 있습니다.","grade":"확인","source":{"name":"대법원 보도자료 \"외국인과 한국인 사이에 출생한 자녀, 이름 글자수 제한 없이 출생신고 가능\" (2025-06-24)","url":"https://www.scourt.go.kr/portal/news/NewsViewAction.work?pageIndex=3&searchWord=&searchOption=&seqnum=2820&gubun=6","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["이름 순위 값(1·2·3위)은 공식 원문으로 확정하지 못해 싣지 않는다 — 위 통계에서 직접 조회하는 것이 정확합니다."]},{"id":"taemong","drawer":"ref","title":"태몽 — 학술 사전의 언어로","summary":"판정하지 않습니다. 사전이 기록한 민속만 옮깁니다","lead":"태몽은 믿음의 영역입니다. 여기 실은 것은 국립민속박물관·한국민족문화대백과사전이 기록한 민속 서술이지, 성별이나 운명의 판정이 아닙니다.","grade":"참고","gradeLabel":"민속","facts":[{"factKo":"국립민속박물관 한국민속대백과사전은 태몽을 '태아의 임신, 성별, 운명 등을 예측할 수 있는 꿈'으로 정의합니다.","quote":"태아의 임신, 성별, 운명 등을 예측할 수 있는 꿈.","grade":"참고","source":{"name":"국립민속박물관 한국민속대백과사전 \"태몽(胎夢)\"","url":"https://folkency.nfm.go.kr/topic/detail/492","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"태몽 상징물은 해·달·별 같은 천체, 호랑이·돼지·구렁이·잉어·꽃·난초 같은 동식물, 산·바위 같은 자연물, 가위·가락지·비녀 같은 도구, 동자·선녀 같은 인물 등 매우 다양하게 나타납니다.","quote":"태몽에 나오는 상징물은 천체(해・달・별)나 동식물(호랑이・늑대・돼지・황소・토끼・고양이・구렁이・우렁이・조개・잉어・꽃・난초・새), 자연물(산・바위), 도구 및 장식물(가위・가락지・비녀・실・시계), 인물(동자・선녀・군인・예쁜 사람), 기타(비행기) 등으로 매우 다양하다.","grade":"참고","source":{"name":"국립민속박물관 한국민속대백과사전 \"태몽(胎夢)\" — 내용","url":"https://folkency.nfm.go.kr/topic/detail/492","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"태몽 해석에서는 상징물의 형상적 유사성에 따라 남녀 성별을 예측합니다. 호랑이·용·뱀·가지·고구마·고추·옥수수 등 남근을 연상시키는 것은 아들, 반지·조개·꽃·달걀·애호박 등 작고 예쁜 것은 딸의 태몽으로 여겨졌습니다.","quote":"남성상징물인 호랑이 · 용 · 뱀 · 비녀 · 가지 · 고구마 · 고추 · 옥수수 · 금장도 · 호두 등 남성적 특성인 남근상징과 연상되는 것은 남아로 믿으며, 여성의 상징물인 반지 · 조개 · 꽃 · 달걀 · 애호박 등 주로 예쁘고 작은 것으로 여성적 특성인 여성의 생식기와 관련된 꿈의 경우 여아의 잉태로 믿으려 한다.","grade":"참고","source":{"name":"한국민족문화대백과사전 \"태몽(胎夢)\"","url":"https://encykorea.aks.ac.kr/Article/E0058917","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"용꿈·돼지꿈·잉어꿈·자라꿈은 태몽 중에서도 대표적인 길몽으로 꼽힙니다.","quote":"① 길몽-꿈이 선명함, 용꿈 · 돼지꿈 · 잉어꿈 · 자라꿈","grade":"참고","source":{"name":"한국민족문화대백과사전 \"태몽(胎夢)\" — (3) 길몽·흉몽의 구분 형상","url":"https://encykorea.aks.ac.kr/Article/E0058917","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"같은 상징물이라도 지역에 따라 성별 해석이 정반대로 나타나는 사례가 있습니다. 대표적으로 대추 꿈은 경기도에서는 아들, 경상도에서는 딸의 태몽으로 풀이됩니다.","quote":"경기도지방에서는 대추의 꿈을 남아로 풀이하는데 경상도지방에서는 여아로 본다.","grade":"참고","source":{"name":"한국민족문화대백과사전 \"태몽(胎夢)\"","url":"https://encykorea.aks.ac.kr/Article/E0058917","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"태몽에 대한 사람들의 신뢰도는 높지만, 정작 해석 기준은 지역과 개인에 따라 다양하게 갈립니다. 예컨대 길쭉한 애호박은 모양으로는 남성 생식기를 닮아 아들을 상징하면서도 푸른색이라는 이유로 동시에 딸을 상징하기도 하는 등, 하나의 사물도 상반된 해석이 공존합니다.","quote":"태몽에 관한 신뢰도는 매우 높은 편임에도 불구하고, 그 해석의 기준은 지역과 사람에 따라서 다양하게 나타난다. 예를 들어, 길쭉한 애호박은 남성의 생식기와 비슷하여 아들을 나타냄과 동시에 그 색이 푸르기 때문에 딸을 상징하기도 한다.","grade":"참고","source":{"name":"국립민속박물관 한국민속대백과사전 \"태몽(胎夢)\" — 특징 및 의의","url":"https://folkency.nfm.go.kr/topic/detail/492","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"태몽에 대한 습속은 다른 점복신앙과 마찬가지로 과학의 발전과 합리적 사고의 확대에 따라 점차 사라지고 있으며 비합리적인 것으로 인식되는 경향이 커지고 있다는 것이 백과사전의 서술이다 — 즉 태몽은 과학적으로 검증된 사실이 아니라 민간의 속신(俗信) 영역으로 다루어집니다.","quote":"습속화하여 전승되어 오는 꿈에 대한 속신, 특히 태몽에 대한 습속은 다른 점복신앙과 마찬가지로, 과학의 발전에 따라 합리적인 사고의 영역이 넓어짐으로써 결과적으로 급속히 자취를 감추어 가고 있으며, 또한 비합리적인 것으로 인식하는 경향이 증대되고 있다.","grade":"참고","source":{"name":"한국민족문화대백과사전 \"태몽(胎夢)\"","url":"https://encykorea.aks.ac.kr/Article/E0058917","checkedAt":"2026-08-26"},"caveats":[]}]},{"id":"seoul_toy","drawer":"save","title":"서울장난감도서관 (연 1만원)","summary":"카시트·아기침대까지 1,533종을 빌려줍니다 (서울)","facts":[{"factKo":"서울장난감도서관은 장난감·육아용품 총 1,533종 5,236개를 보유하고 있으며 서울시육아종합지원센터가 운영합니다.","quote":"장난감과 육아용품 등 총 1,533종, 5,236개에 달하는 용품을 보유","grade":"확인","source":{"name":"서울시 미디어허브(서울시 공식)","url":"https://mediahub.seoul.go.kr/archives/2010109","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"서울장난감도서관은 최신 장난감뿐 아니라 아기침대, 분유 제조기, 카시트 같은 육아용품도 대여합니다.","quote":"새로 나온 최신 장난감부터 아기침대, 분유 제조기, 카시트 같은 육아용품까지","grade":"확인","source":{"name":"서울시 미디어허브(서울시 공식)","url":"https://mediahub.seoul.go.kr/archives/2010109","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"만72개월 이하 영유아(장애아동은 만12세 이하)를 둔 서울시민이나 서울 근무 직장인은 연회비 1만 원만 내면 서울장난감도서관을 무료로 이용할 수 있습니다.","quote":"자녀가 만72개월 이하 영유아(장애아동 만12세)인 서울시민·서울 근무 직장인 누구나 연회비 1만 원만 내면 무료로 이용","grade":"확인","source":{"name":"서울시 미디어허브(서울시 공식)","url":"https://mediahub.seoul.go.kr/archives/2010109","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["보유 수치는 게시 시점 기준이라 달라질 수 있습니다."],"region":{"sido":"서울특별시"}},{"id":"local_rental","drawer":"save","title":"지자체 육아용품 대여, 우리 동네에도 있다","summary":"카시트·바운서·아기침대를 공공이 빌려주는 사례들입니다","facts":[{"factKo":"경기 안양시육아종합지원센터는 생후 100일 이하 자녀를 둔 안양시 거주·직장인에게 신생아 카시트를 대여합니다. 이용자는 보증금 1만 원(현금)을 내고, 대여기간은 2개월(최대 1개월 연장 가능)이며 연체료는 1일 1,000원입니다.","quote":"안양시 거주 및 직장인으로 생후 100일 이하 자녀 양육자(자녀출생후 또는 자녀출생 한달전)","grade":"확인","source":{"name":"안양시육아종합지원센터(go.kr)","url":"https://www.aycteducare.go.kr/rent/carseat/carseatInfo.asp","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"부산육아종합지원센터는 도서·시청각 자료·장난감 등을 대여하는 책·장난감도서관을 운영하며, 회원가입 후 카드를 당일 발급받아 대여할 수 있습니다.","quote":"회원가입 후 카드발급은 당일 즉시발급이 가능하며, 카드수령 후 도서/장난감 대여가 가능함","grade":"확인","source":{"name":"부산육아종합지원센터(childcare.go.kr)","url":"https://busan.childcare.go.kr/lbusan/d3_20000/d3_20042/d3_20034.jsp","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"울산 중구육아종합지원센터는 '아이세상 육아용품 대여 지원사업'으로 중구에 거주하는 영유아 가정에 육아용품을 무료로 대여합니다.","quote":"중구에 거주하는 영유아를 둔 가정에 육아용품을 무료로 대여하는 사업입니다.","grade":"참고","source":{"name":"울산 중구육아종합지원센터(jgicare.or.kr)","url":"https://www.jgicare.or.kr/childRea/childProducts.php","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"울산 중구육아종합지원센터의 무료 대여 품목에는 바운서, 바구니 카시트, 쏘서, 범보의자, 보행기, 휴대용카시트, 아기침대, 돌(백일)상차림&한복 등이 포함됩니다.","quote":"바운서, 바구니 카시트, 쏘서, 범보의자, 보행기, 휴대용카시트, 아기침대, 돌(백일)상차림&한복","grade":"참고","source":{"name":"울산 중구육아종합지원센터(jgicare.or.kr)","url":"https://www.jgicare.or.kr/childRea/childProducts.php","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["여기 실은 곳은 사례다 — 내 지역 육아종합지원센터 홈페이지에서 같은 서비스를 확인해 보라.","부산의 회비와 대여료 금액은 확인하지 못했습니다. 해당 내용은 별도 페이지에서 확인해 주세요."]},{"id":"birth_kit","drawer":"save","title":"출생신고하면 주는 것들","summary":"지자체마다 다릅니다 — 주민센터에서 물어보면 됩니다","facts":[{"factKo":"서울 중구는 출생신고 시 신생아 1인당 손세정제 세트(용기 250㎖, 리필 200㎖, 물티슈 10매) 1팩을 지원합니다.","quote":"각 동주민센터에서 출생신고시 신생아 1인당 손세정제 세트(용기 250㎖, 리필 200㎖, 물티슈 10매) 1팩씩 지원한다.","grade":"확인","source":{"name":"서울특별시 중구청 공식 홈페이지","url":"https://www.junggu.seoul.kr/news/content.do?cmsid=16207&mode=view&cid=9906","checkedAt":"2026-08-26"},"caveats":[]},{"factKo":"출산지원금·다둥이카드·출산축하용품은 지자체 개별 서비스라 지자체마다 내용이 다릅니다.","quote":"지자체에 따라 다름","grade":"확인","source":{"name":"대한민국 정책브리핑(korea.kr)","url":"https://korea.kr/news/policyNewsView.do?newsId=148918337","checkedAt":"2026-08-26"},"caveats":[]}],"caveats":["출생신고 하러 갈 때 주민센터에 \"출산축하 지원이 있나요\"라고 물어보면 됩니다."]},{"id":"infant_sleep_safety","drawer":"child","title":"아기를 재우는 자리 — 공식 기관이 밝힌 것","summary":"역류방지쿠션 같은 경사진 물건에 재우지 말라는 조사 결과와 권고가 있습니다","lead":"많이 팔리는 물건이라고 수면용으로 안전한 것은 아닙니다. 아래는 공식 기관이 밝힌 내용 그대로입니다.","facts":[{"factKo":"한국소비자원이 영아 수면용품 30개(요람 10·쿠션류 10·베개 10)를 조사한 결과, 17개(56.7%)가 수면용으로 쓸 경우 질식 사고를 일으킬 우려가 있는 수준으로 나타났습니다. 쿠션류는 10개 중 7개가 미국 기준(경사 10도 이하)을 넘었습니다. 소비자원은 해당 사업자에게 시정을 권고했고 사업자들은 자율 개선을 회신했다 — 강제 리콜은 아니다.","quote":"17개(56.7%) 제품은 수면용으로 사용할 경우 질식사고를 일으킬 우려가 있는 수준으로 나타났다","grade":"확인","source":{"name":"한국소비자원 보도자료 — 영아 수면용품 안전실태 조사 (2024-08-27)","url":"https://www.kca.go.kr/home/sub.do?menukey=4002&mode=view&no=1003719725","checkedAt":"2026-09-04"},"caveats":["조사 시점의 특정 제품에 대한 결과입니다. 지금 파는 같은 이름의 제품이 그때와 같은지는 저희가 확인하지 못했습니다.","조사 대상이 아니었던 제품이 안전하다는 뜻은 아닙니다."]},{"factKo":"질병관리청은 생후 1년이 안 된 아기를 옆으로 눕히거나 엎어 재우지 말고 반드시 똑바로 눕혀 재우라고 권고합니다.","quote":"생후 1년이 안된 아기들은 옆으로 누워 재우거나 엎어 재우면 안 되고 반드시 똑바로 눕혀 재워야 합니다","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 영아돌연사증후군","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5467","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"국가기술표준원은 2025년 6월 기울어진 요람을 비수면용 제품으로 명확히 구분하는 안전기준을 제정한다고 밝혔습니다. 그때까지는 유아용 침대의 일부로만 다뤄지고 있었습니다.","quote":"‘비수면용 기울어진 요람’안전기준을 제정하여 ‘유아용 침대’의 일부로 존재하던 ‘기울어진 요람’을 비수면용 제품으로 명확히 구분한다","grade":"확인","source":{"name":"국가기술표준원 보도자료 — 기울어진 요람에서는 아기를 절대 재우지 마세요 (2025-06-10)","url":"https://www.kats.go.kr/mobile/content.do?cmsid=482&skin=/mobile/&mode=view&page=&cid=25220","checkedAt":"2026-09-04"},"caveats":["기준 제정을 알린 보도자료입니다. 시행 시점과 최종 내용은 저희가 확인하지 못했습니다."]}],"caveats":["여기 적은 것은 공식 기관의 조사 결과와 권고입니다. 특정 제품을 사라거나 사지 말라는 뜻이 아닙니다.","아기가 자는 자리에 대해 걱정되는 점이 있으면 소아과에 물어보세요."]},{"id":"pp_recovery","drawer":"postpartum","title":"출산 후 몸이 낫는 동안 — 오로와 상처","summary":"오로는 색이 바뀌며 줄어듭니다. 회음부 상처는 대개 3~4주면 돌아옵니다","lead":"출산 직후부터 몇 주 동안 몸에서 일어나는 일입니다. 공식 자료가 밝힌 것만 적었습니다.","facts":[{"factKo":"오로는 산후 수일간 적색을 띠다가 색이 점점 옅어지고 양이 줄어, 붉은색 → 갈색 → 노란색 → 옅은 백색 순으로 색깔이 변합니다.","quote":"산후 수일간 적색 오로가 나오고, 색이 점점 옅어지고 양이 줄어 붉은색에서 갈색, 노란색, 옅은 백색으로 색깔이 변합니다.","grade":"확인","source":{"name":"보건복지부 임신육아종합포털 아이사랑 — 산욕기 (질 분비물(오로))","url":"https://www.childcare.go.kr/?menuno=276","checkedAt":"2026-09-04"},"caveats":["같은 포털의 다른 페이지(자연분만, 대한산부인과학회 감수)에서는 구체적 색 순서 나열 없이 '오로의 색도 엷어지고 그 양도 점차 줄어든다'고만 서술함"]},{"factKo":"샤워는 출산 이후부터 가능하지만, 통목욕(욕조 목욕)은 일반적으로 오로가 완전히 멈춘 뒤에 하도록 권장됩니다.","quote":"샤워는 출산이후부터 할 수 있으며, 통목욕은 일반적으로 오로가 멈춘 후 하도록 권장되고 있습니다.","grade":"확인","source":{"name":"보건복지부 임신육아종합포털 아이사랑 — 자연분만 (출처: 대한산부인과학회, 정상분만 산모의 퇴원교육)","url":"https://www.childcare.go.kr/?menuno=270","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"회음 열상은 대부분 봉합 후 적절한 치료를 받으면 3~4주 이내에 정상으로 돌아옵니다. 통증은 보통 일주일 후 없어지고, 분만 3주 후면 거의 증상이 없어집니다.","quote":"회음 열상은 대부분 봉합 후 적절한 치료를 받으면 3~4주 이내에 정상으로 돌아옵니다.","grade":"확인","source":{"name":"서울아산병원 — 회음 열상(Perineal laceration)","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31950","checkedAt":"2026-09-04"},"caveats":["'치료 기간은 개인차가 있을 수 있으나, 보통 일주일 후면 통증은 없어지고 치유'된다고도 원문에 명시"]},{"factKo":"회음부 관리는 좌욕(따뜻한 물, 하루 2~3회)이 기본이며, 패드는 손을 씻은 뒤 항문 쪽 세균이 닿지 않도록 앞에서 뒤로 제거·착용하고, 물기도 앞에서 뒤로 두드려 닦습니다.","quote":"좌욕은 따뜻한 물로 하루 2~3회 정도 시행합니다.","grade":"확인","source":{"name":"보건복지부 임신육아종합포털 아이사랑 — 자연분만 (출처: 대한산부인과학회, 정상분만 산모의 퇴원교육)","url":"https://www.childcare.go.kr/?menuno=270","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"비데를 너무 세게 사용하거나 질 내부를 무리하게 세척하거나 뜨거운 찜질을 하는 것은 회음부 상처가 벌어지거나 염증을 일으킬 수 있어 삼가야 합니다.","quote":"비데를 너무 세게 하거나, 질 내부를 무리하게 세척하거나, 뜨거운 찜질을 시행하는 것은 상처가 벌어지거나 염증이 발생할 수 있으므로 삼가는 것이 좋습니다.","grade":"확인","source":{"name":"보건복지부 임신육아종합포털 아이사랑 — 자연분만 (출처: 대한산부인과학회, 정상분만 산모의 퇴원교육)","url":"https://www.childcare.go.kr/?menuno=270","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"제왕절개 상처는 아랫배에 가로로 나며, 절개 부위는 몇 주간 아프고 불편할 수 있습니다. 조심스럽게 천천히 움직이고 초기 며칠은 진통제로 통증을 완화할 수 있습니다.","quote":"제왕 절개 상처는 아랫배에 가로로 나게 됩니다. 절개 부위는 몇 주간 아프고 불편할 수 있습니다.","grade":"확인","source":{"name":"보건복지부 임신육아종합포털 아이사랑 — 제왕절개술 (출처: 대한산부인과학회, 제왕절개분만 산모의 퇴원교육)","url":"https://www.childcare.go.kr/?menuno=273","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"합병증이 없는 경우 제왕절개 수술 후 3~4일째 퇴원하며, 산후 진찰(합병증 확인)은 분만 1주 후에 시행합니다.","quote":"합병증이 없는 경우 수술 후 3~4일째 퇴원합니다.","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 제왕절개술","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6244","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"산후 출혈은 출산 후 12주까지도 발생할 수 있으며, 산모용 패드를 버리지 말고 출혈량을 확인해야 합니다.","quote":"출혈은 출산 후 12주까지 발생하기도 합니다.","grade":"확인","source":{"name":"서울아산병원 — 분만 후 출혈(Postpartum hemorrhage)","url":"https://www.amc.seoul.kr/asan/healthinfo/disease/diseaseDetail.do?contentId=31951","checkedAt":"2026-09-04"},"caveats":["'산모는 대부분 분만 후에 산모용 패드를 대고 있는데, 출혈량을 알기 위해서 이를 그냥 버리지 말고 반드시 출혈량을 확인해야 합니다'라고 원문에 별도 명시"]}],"caveats":["여기 적은 기간은 공식 자료가 말한 일반적인 경과입니다. 사람마다 다릅니다.","이 내용은 진단이 아닙니다. 걱정되는 것이 있으면 병원에 물어보세요."]},{"id":"pp_changes","drawer":"postpartum","title":"출산 후 달라지는 것들 — 붓기·땀·탈모","summary":"붓기와 땀은 몸이 물을 빼내는 과정이고, 탈모도 시기가 있습니다","lead":"미리 알면 덜 놀랍니다. 공식 자료가 밝힌 것만 적었습니다.","facts":[{"factKo":"임신 중 피하조직에 쌓여 있던 수분이 산후 며칠 동안 땀과 소변으로 많이 배출되며, 이 과정(부종 감소)으로 체중이 2~3kg가량 줄어듭니다.","quote":"산후 몇 일 동안에는 임신 기간 중 피하조직에 쌓여 있던 수분이 땀이나 소변으로 많이 배출됩니다.","grade":"확인","source":{"name":"보건복지부 아이사랑(임신육아종합포털) — 산욕기(소변과 땀)","url":"https://www.childcare.go.kr/?menuno=276","checkedAt":"2026-09-04"},"caveats":["부종이 정확히 며칠/몇 주간 지속되는지 숫자로 못박은 표현은 이 자료에 없음(\"산후 몇 일\"이라고만 되어 있음). 아래 '체중' 항목의 인용도 같은 페이지의 근거."]},{"factKo":"임신 기간 중 피하조직에 쌓였던 수분이 산후 며칠간 땀과 소변으로 많이 배출되는 것이 산후 발한의 기전으로 설명됩니다.","quote":"산후 몇 일 동안에는 임신 기간 중 피하조직에 쌓여 있던 수분이 땀이나 소변으로 많이 배출됩니다.","grade":"확인","source":{"name":"보건복지부 아이사랑(임신육아종합포털) — 산욕기(소변과 땀)","url":"https://www.childcare.go.kr/?menuno=276","checkedAt":"2026-09-04"},"caveats":["정확한 지속 일수(예: 며칠부터 며칠까지)는 명시되어 있지 않고 \"산후 몇 일\"이라고만 되어 있음."]},{"factKo":"출산 후 여성의 80% 이상이 산후 2~5개월 사이에 탈모 증상을 겪으며, 이는 임신 중 늘었던 모량이 다시 줄어드는 현상입니다.","quote":"출산 후 80%가 넘는 여성들이 산후 2~5개월 사이에 탈모 증상을 경험하나","grade":"확인","source":{"name":"보건복지부 아이사랑(임신육아종합포털) — 산후 일상생활 관리(출산 후 미용관리)","url":"https://www.childcare.go.kr/?menuno=415","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"자궁은 태반 만출 직후 어른 머리 크기로 수축했다가 1주 후 어른 주먹 크기가 되고, 산후 4~6주경 임신 전과 같은 달걀 크기로 돌아옵니다. 전체적인 자궁 복구는 분만 후 5~6주가 걸리며, 경산부보다 초산부가, 비수유부보다 수유부가 더 빠릅니다.","quote":"분만 후 5~6주면 원래 상태로 복구되며, 경산부보다는 초산부가, 비수유부보다는 수유부가 더 빠릅니다.","grade":"확인","source":{"name":"보건복지부 아이사랑(임신육아종합포털) — 산욕기(자궁의 복구/크기)","url":"https://www.childcare.go.kr/?menuno=276","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"임신 중 늘어난 몸무게(평균 12~16kg) 가운데 5~6kg 정도는 출산과 동시에 줄어들고, 부종이 빠지며 2~3kg가 추가로 줄어듭니다. 이후 점진적으로 감소해 6개월 정도 지나면 임신 전 상태와 비슷해지지만, 대개 임신 전보다 약간 체중이 남아있는 경우가 많습니다.","quote":"임신 중에 늘어난 몸무게(평균 12~16kg) 중 5~6kg 정도는 출산과 동시에 줄어듭니다.","grade":"확인","source":{"name":"보건복지부 아이사랑(임신육아종합포털) — 산욕기(체중)","url":"https://www.childcare.go.kr/?menuno=276","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"임신 후반기가 되면 대부분의 임신부가 치핵(치질)을 경험하며, 임신 중 커진 자궁이 하체 정맥압을 높이고 호르몬이 정맥 확장을 유발하는 것이 원인으로 설명됩니다.","quote":"임신 후반기가 되면 대부분의 임신부들이 치핵을 경험하게 됩니다.","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 치핵","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5818","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"아이사랑(보건복지부)은 산욕기를 '출산할 때 받은 상처가 완전히 치유되어 생식기와 그 주변의 변화가 임신 전 상태로 되돌아갈 때까지의 기간'으로 정의하며, 출산 후부터 출산 후 4~6주까지로 봅니다.","quote":"산욕기란 출산할 때 받은 상처가 완전히 치유되어... 출산 후부터 출산 후 4~6주까지의 기간을 의미합니다.","grade":"확인","source":{"name":"보건복지부 아이사랑(임신육아종합포털) — 산욕기","url":"https://www.childcare.go.kr/?menuno=276","checkedAt":"2026-09-04"},"caveats":[]}],"caveats":["부종과 발한이 정확히 며칠 가는지는 공식 자료가 숫자로 밝히지 않았습니다 — 저희도 모릅니다.","흔히 말하는 “산후풍”은 공식 의학 용어가 아니어서, 그 이름으로는 아무것도 확인할 수 없었습니다."]},{"id":"pp_feeding_body","drawer":"postpartum","title":"수유하는 몸 — 젖몸살·유두 통증·유선염","summary":"울혈은 출산 3~5일에 흔하고, 유선염이라도 수유를 멈출 필요는 없다고 합니다","lead":"수유하면서 몸에 생기는 일입니다. 공식 자료가 밝힌 것만 적었습니다.","facts":[{"factKo":"유방 울혈은 대개 출산 후 3~5일 이내에 생기며, 유방이 팽창하고 아프면서 4~6시간 정도 열이 나기도 합니다.","quote":"출산 후 3~5일 이내에 유방 울혈이 생겨 유방이 팽창되고 아프면서 4~6시간 정도 고열이 발생할 수 있다","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586","checkedAt":"2026-09-04"},"caveats":["며칠 만에 가라앉는지 등 지속 기간을 일 단위로 명시한 내용은 확인하지 못했습니다. 다만 '대부분 빠르게 완화된다'는 설명만 있습니다."]},{"factKo":"수유 중 유두 통증의 대부분은 아기가 유두만 얕게 물고 빠는 등 잘못된 젖물리기에서 시작됩니다.","quote":"수유 시 발생하는 유두 통증의 대부분은 잘못된 젖물리기에서 시작된다","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"유선염은 수유기와 비수유기 질환으로 구분되며, 수유기 유선염은 아이 입속 세균이 유관을 통해 침투해 생깁니다. 통증·발적·부종·압통이 나타나고, 심하면 오한·발열 같은 전신 증상이 동반될 수 있습니다.","quote":"수유기와 비수유기의 질환으로 구별","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 유선염","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=5680","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"적은 양이라도 독성이나 위험성이 보고됐거나 그럴 가능성이 조금이라도 있는 약물은 수유 기간 중 피하는 것이 좋습니다. 신생아는 간·신장 기능이 미숙하고 뇌혈액관문이 미형성되어 있어 특별한 주의가 필요합니다.","quote":"적은 양이라 하더라도 독성이나 위험성이 보고되었거나 그런 가능성이 조금이라도 있는 약물들은 수유기간 중 피하는 것이 좋습니다","grade":"확인","source":{"name":"식품의약품안전처 의약품안전나라","url":"https://nedrug.mfds.go.kr/cntnts/55","checkedAt":"2026-09-04"},"caveats":["개별 약물명은 요청에 따라 옮기지 않음(원문에는 절대 피해야 할 약물 예시가 나열되어 있음)"]},{"factKo":"초유는 출산 직후 분비되는 젖으로, 아이사랑(보건복지부 임신육아종합포털)은 출산 후 생후 일주일간 나오는 젖으로 설명하며, 늦게 수유를 시작해도 그 시점부터 초유가 분비되기 시작한다고 안내합니다.","quote":"아이를 낳고 나서 생후 일주일 간 나오는 젖","grade":"확인","source":{"name":"보건복지부 임신육아종합포털 아이사랑 — 모유수유의 시작(자주하는질문)","url":"https://www.childcare.go.kr/?menuno=306","checkedAt":"2026-09-04"},"caveats":["'초유=생후 일주일간'이라는 기간 표현은 아이사랑 상담 답변 문구이며, 질병관리청 문서의 '출산 직후'라는 표현과 결이 다소 다름 — 두 표현 모두 옮겨 병기함"]},{"factKo":"일반 여성의 하루 권장 열량 2,000kcal에 더해 수유 중에는 약 400kcal의 추가 열량이 필요합니다.","quote":"일반 여성의 1일 열량 권장량인 2,000 kcal에 추가하여 수유 중에는 400 kcal 정도의 추가적인 열량이 필요하다","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 성공적인 모유 수유","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6586","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"2개월 미만 영아나 미숙아, 면역체계가 약한 영유아는 70℃ 이상의 뜨거운 물로 분유를 준비한 뒤 충분히 식혀서 먹이도록 권장된다(사카자키균 등 세균 예방 목적).","quote":"2개월 미만의 영아 및 미숙아 또는 면역체계가 약한 영유아의 경우에는 70℃ 이상의 뜨거운 물을 이용하여 분유를 준비한 후에 충분히 식혀서 수유할 것을 권장","grade":"확인","source":{"name":"식품의약품안전처 회신(국가법령정보센터 중앙부처 1차 해석 — 올바른 분유타는법 가이드, 2024-08-28)","url":"https://www.law.go.kr/LSW/cgmExpcInfoP.do?cgmExpcDatSeq=2290171&mode=2&ofiClsCd=350123","checkedAt":"2026-09-04"},"caveats":[]}],"caveats":["모유와 분유 가운데 어느 쪽이 낫다는 판단은 하지 않습니다. 공식 자료가 말한 사실만 적었습니다.","약을 먹어야 할 때는 의사나 약사와 상의하라는 것이 식약처의 기본 원칙입니다."]},{"id":"pp_mind","drawer":"postpartum","title":"출산 후 마음 — 우울감과 우울증은 다릅니다","summary":"산모의 약 85%가 우울감을 겪고, 그중 10~20%는 우울증으로 이어집니다","lead":"기분이 가라앉는 것은 흔한 일입니다. 다만 흔한 것과 그냥 두어도 되는 것은 다릅니다 — 공식 자료가 무엇이라 하는지 그대로 적었습니다.","facts":[{"factKo":"산후우울감은 전체 산모의 최대 약 85%가 겪는 자연스러운 현상으로, 출산 후 2주 이내에 발병하는 일시적 기분장해이며 증상은 대부분 열흘 이내에 가라앉습니다. 2주 이상 지속되면 전문기관 안내가 권장됩니다.","quote":"전체 산모의 최대 약 85% 정도가 경험하는 자연스러운 현상으로, 출산 후 2주 이내에 발병하는 일시적인 기분장해이다. 증상이 열흘 이내에 대부분 가라앉기는 하나, 2주 이상 지속된다면 전문 기관으로 안내하는 것이 좋다.","grade":"확인","source":{"name":"국립정신건강센터 — 산모 우울증","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"산후우울감을 겪은 산모 중 약 10~20%는 산후우울증으로 진행하며, 피로·무기력·의욕 상실·짜증·초조·수면장애·인지기능 저하가 나타날 수 있습니다.","quote":"약 10~20%는 산후 우울증으로 진행해 피로, 무기력, 의욕 상실, 짜증, 초조, 수면장애, 인지기능 저하가 나타날 수 있습니다.","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 우울감","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6788","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"출산 전이나 후에 나타나는 우울증(산모 우울증)은 전체 산모의 10~20%가 경험하며, 시간이 지나도 저절로 낫지 않고 지속되지만 치료를 통해 회복될 수 있습니다.","quote":"산모 우울증은 시간이 지나도 지속되고, 치료를 통해 회복 될 수 있다.","grade":"확인","source":{"name":"국립정신건강센터 — 산모 우울증","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"},"caveats":["\"회복될 수 있다\"는 조건부(치료를 통해) 서술이며, 자연 호전을 단정한 문장이 아님"]},{"factKo":"산후우울증의 독특한 증상으로, 아기의 건강이나 사고에 대해 과도하고 부적절한 걱정을 하거나 반대로 아예 관심을 잃는 경우가 있으며, 이로 인해 아기에게 적대적·폭력적 행동을 하거나 아기나 자신을 해칠 것 같은 두려움이 나타나기도 합니다.","quote":"산후 우울증의 독특한 증상은 아기의 건강이나 사고 발생에 대해 과도하고 부적절한 걱정을 하거나, 반대로 아예 관심을 잃는 것입니다.","grade":"확인","source":{"name":"질병관리청 국가건강정보포털 — 우울감","url":"https://health.kdca.go.kr/healthinfo/biz/health/gnrlzHealthInfo/gnrlzHealthInfo/gnrlzHealthInfoView.do?cntnts_sn=6788","checkedAt":"2026-09-04"},"caveats":["\"아기에게 애정이 안 생길까 걱정\"과 직접 연결되는 표현은 아니며, 관심 상실·과도한 걱정·적대적 행동 가능성을 기술한 원문임"]},{"factKo":"산후정신증은 입원과 약물 치료가 필요한 매우 심각한 장애로, 말의 조리가 없어지거나 강박적 사고, 망상·환각을 동반할 수 있습니다.","quote":"산후 정신증은 입원과 약물 치료가 필요한 매우 심각한 장애이다. 말의 조리가 없어지고 강박적인 사고에 집착하며, 망상이나 환각을 경험하기도 한다.","grade":"확인","source":{"name":"국립정신건강센터 — 산모 우울증","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"산후우울감은 산모 10명 중 3명이, 산후우울증은 1명이 겪는 것으로 알려져 있으며, 유병률을 10~15%로 추정할 때 실제 치료받는 환자 수는 1% 미만이라는 2015년 연구 결과가 있습니다.","quote":"산후우울감은 산모 10명 중 3명이 겪고 1명은 산후우울증을 겪는다고 한다... 유병률을 10~15%로 추정할 때, 치료받는 환자 수는 1% 미만(산후우울증관리체계 구축방안 연구, 2015)이라고 하니 안타깝다.","grade":"확인","source":{"name":"국립정신건강센터 — 산모 우울증","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"},"caveats":["2015년 연구를 인용한 수치로 최신 통계가 아닐 수 있음"]},{"factKo":"산모의 가족, 특히 배우자의 관심과 지지가 산모 우울증을 치유하는 데 가장 중요한 요소입니다.","quote":"산모의 가족, 특히 배우자의 관심과 지지는 산모 우울증을 치유하는데 가장 중요한 요소이다.","grade":"확인","source":{"name":"국립정신건강센터 — 산모 우울증 (산모의 가족을 위한 안내)","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"배우자에게 권장되는 행동: 아기 돌보기와 집안일에 적극 참여해 산모의 부담을 덜어줄 것, 우울증세를 비난하지 말고 격려·지지할 것(외모에 대한 언급은 자제), 애정표현을 자주 할 것.","quote":"아기를 돌보는 일과 집안일에 적극적으로 참여하세요 ... 배우자의 우울증상을 비난하지 말고 우울증세가 감소할 때까지 격려와 지지를 해주세요 ... 농담으로라도 산모의 외모에 대해 언급하지 말고 애정표현을 더 자주 해 주세요.","grade":"확인","source":{"name":"국립정신건강센터 — 산모 우울증 (산모의 가족을 위한 안내)","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"},"caveats":[]},{"factKo":"산모뿐 아니라 남편도 가장으로서의 중압감 때문에 산모 우울증을 흔히 경험하며, 스트레스와 어려움을 주변 사람들과 솔직하게 나누는 것이 도움이 됩니다.","quote":"산모 뿐 아니라 남편 역시 가장으로서의 중압감 때문에 산모 우울증을 흔하게 경험합니다. 남편의 스트레스와 어려움에 대해 주변 사람들과 솔직한 감정을 나누는것이 도움이 됩니다.","grade":"확인","source":{"name":"국립정신건강센터 — 산모 우울증 (산모의 가족을 위한 안내)","url":"https://www.ncmh.go.kr/ncmh/board/boardView.do?no=8655&menu_cd=02_06_01&bn=newsView","checkedAt":"2026-09-04"},"caveats":[]}],"channels":[{"name":"109 (자살예방상담전화)","who":"자살예방상담전화(24시간). 2024.1.1부터 자살예방 상담 번호를 109로 모두 통합 — 정신건강상담전화(1577-0199)·청소년전화(1388)·여성긴급전화(1366)는 종전대로 담당 분야 상담","contact":"109","url":"https://www.129.go.kr/109","checkedAt":"2026-10-07"},{"name":"정신건강상담전화 1577-0199","who":"전국 어디서 걸어도 시·군·구별 정신건강전문요원 등이 정신건강상담·정보 제공·정신의료기관 안내","contact":"1577-0199 (보건복지부 안내: 전국 동일번호 1577-0199, 국번 없이 129(보건복지콜센터))","url":"https://www.mohw.go.kr/menu.es?mid=a10706040100","checkedAt":"2026-10-07"},{"name":"시·군·구 정신건강복지센터","who":"지방자치단체 운영(광역·기초 정신건강복지센터)","contact":"지역마다 별도(전국 단일 번호 없음)","url":"https://www.mohw.go.kr/menu.es?mid=a10706040100","checkedAt":"2026-10-07"},{"name":"난임·임산부심리상담센터 (중앙 1곳 + 권역)","who":"권역: 서울·서울서남·경기남부·경기북부·인천·대구·전북·전남·경북·경북서부·경남. 센터 미설치 지역은 중앙센터로 연락(국립중앙의료원 중앙센터 누리집, 2026-10-07)","contact":"서울권역 강남센터 02-2019-4581 / 송파센터 02-6956-6248 (복지로)","url":"https://www.bokjiro.go.kr/ssis-tbu/cms/pc/news/news/1305332_1114.html","checkedAt":"2026-10-07"},{"name":"아이사랑(임신육아종합포털) 온라인 상담 — 산전후 우울증","who":"인구보건복지협회 임신출산종합상담센터(전화) · 산전후 우울증 게시판 상담은 정신건강의학과 전문의가 매주 화·금","contact":"1644-7373 (2번 심리·정서 / 평일 09:00~18:00, 토·일·공휴일 휴무)","url":"https://www.childcare.go.kr/?menuno=301","checkedAt":"2026-10-07"}],"caveats":["여기 적은 것은 진단이 아닙니다. 스스로 판단하지 말고 도움을 청하세요.","지금 힘들다면 위 상담 창구에 전화하실 수 있습니다. 109와 1577-0199는 24시간 받습니다."]}];

 출산준비물 목록","url":"https://www.childcare.go.kr/?menuno=266","quote":"부드러운 솔이나 스펀지로 된 것을 고르고, 우유병에 손상이 가지 않을 정도이어야 합니다. (1개 필요)","checkedAt":"2026-09-10"},"tests":[],"cautions":[],"links":[{"url":"https://link.coupang.com/a/g182sE64SO","label":"젖병 브러쉬","addedAt":"2026-09-14"},{"url":"https://link.coupang.com/a/g184hQxnhs","label":"젖병 세척솔","addedAt":"2026-09-14"}]},{"id":"nipple","group":"feeding","tier":"A","name":"젖꼭지","icon":"bottle","when":"출산 전 준비 — 단계별로 교체","qty":"3~4개","official":{"name":"아이사랑 임신육아종합포털(보건복지부) — 출산준비물 목록","url":"https://www.childcare.go.kr/?menuno=266","quote":"단계별로 바꾸어 주어야 하므로 필요한 만큼만 구입합니다. (3개~4개 필요)","checkedAt":"2026-09-10"},"tests":[],"cautions":[],"links":[{"url":"https://link.coupang.com/a/g186z6oyar","label":"젖병 젖꼭지","addedAt":"2026-09-14"}]},{"id":"thermometer","group":"newborn","tier":"A","name":"체온계","icon":"bottle","when":"출산 전 준비","qty":"1개","official":{"name":"아이사랑 임신육아종합포털(보건복지부) — 출산준비물 목록","url":"https://www.childcare.go.kr/?menuno=266","quote":"디지털 체온계를 사거나 바로 온도를 잴 수 있는 제품으로 사는 것이 좋습니다. 물론 가격은 일반 체온계보다는 비쌉니다. (1개 필요)","checkedAt":"2026-09-10"},"tests":[],"cautions":[],"noLinks":"체온계는 의료기기로 분류될 수 있어 구매 링크와 제품 추천을 두지 않습니다(「의료기기법」 제24조: 누구든지 성능·효능을 암시하는 광고 금지). 준비물 목록에는 그대로 둡니다.","links":[]},{"id":"carrier","group":"outing","tier":"B","name":"아기띠","icon":"carrier","when":"외출 — 목을 가누기 전이면 머리판 있는 것","qty":null,"official":{"name":"아이사랑 임신육아종합포털(보건복지부) — 출산준비물 목록","url":"https://www.childcare.go.kr/?menuno=266","quote":"아기 띠를 구입할 때 안전인증 여부를 확인합니다. 목을 가누지 못하는 아기의 목과 머리를 보호하기 위해서 머리판이 붙어있는 것이 좋습니다. 여름에는 망사 소재, 겨울에는 면 소재가 좋습니다.","checkedAt":"2026-09-10"},"tests":[{"org":"한국소비자원·공정거래위원회","title":"아기띠 사용 시 추락사고에 주의하세요! — ‘머리 및 얼굴’ 부상이 96.8%이며, 뇌진탕이나 두개골 골절 위험이 큰 것으로 나타나 (소비자안전주의보)","date":"2025-05-19","url":"https://www.kca.go.kr/home/sub.do?menukey=4002&mode=view&no=1003871276","quote":"최근 5년간(2020년~2024년) 소비자위해감시시스템(CISS)에 접수된 아기띠 관련 추락사고는 총 62건이며, 이 중 움직임이 자유롭지 못한 ‘12개월 미만’이 83.9%(52건)로 대부분을 차지했다.","facts":["위해 부위는 ‘머리 및 얼굴’이 96.8%(60건). 영유아 3명 중 1명은 ‘뇌진탕’(12건 19.4%)이나 ‘두개골 골절’(8건, 12.9%) 등 중증 상해.","사고 유형: 사용 중 아기띠가 풀리거나 느슨해져 추락(20건)이 가장 많았고, 착용자의 신체와 아기띠 사이 틈새로 빠져 추락(13건)이 그 뒤.","구입 시: 품질표시를 확인하여 KC인증 아기띠를 구입하세요.","착용 시: 사용설명서를 숙지하여 올바르게 장착하고, 한 손으로 영유아를 고정한 채 착용하며, 착용하거나 자세를 바꿀 때는 낮은 자세에서.","착용 중: 급격히 허리를 구부리지 말고 무릎을 구부려 자세를 낮출 것, 이동 중 주기적으로 위치·자세 점검, 버클이 느슨해질 수 있어 주기적으로 버클과 벨트 재조정, 착용자나 복장이 바뀌면 재조정."],"checkedAt":"2026-09-10"}],"cautions":[],"kc":"안전인증(KC) 표시가 있는 제품만 — 아이사랑·소비자원 둘 다 KC 확인을 첫 번째로 말합니다.","links":[{"url":"https://link.coupang.com/a/g188iJkhy0","label":"아기띠","addedAt":"2026-09-14"}]},{"id":"stroller","group":"outing","tier":"B","name":"휴대형 유모차","icon":"stroller","when":"외출 — 제품이 표시한 사용 가능 월령부터","qty":null,"official":null,"tests":[{"org":"한국소비자원","title":"휴대형 유모차, 품질·성능 전 제품 우수하나 가격 차이 커 — 낙상사고 예방을 위해서는 손잡이에 짐 걸지 말아야","date":"2024-09-24","url":"https://www.kca.go.kr/home/sub.do?menukey=4002&mode=view&no=1003730197","quote":"시험평가 결과 모든 제품의 내구성이 우수했고 기본·섬유 품질, 안전성 등에서 관련 기준을 충족했으나 사용 편의성, 가격 등은 제품 간에 차이가 있어 제품 구매 시 꼼꼼한 확인이 필요하다.","facts":["내구성: 모든 제품이 안전기준의 2배(주행 150,000회·접고 펴기 200회) 가혹 조건에서도 파손·변형 없음.","손잡이 걸이에 3kg의 짐을 걸 경우 편평한 지면에서도 유모차가 넘어질 수 있어 주의 필요 — 최근 3년(2021~2023) 유모차 안전사고 559건 중 넘어짐 또는 추락이 519건(92.8%).","8개 중 6개 제품이 의무표시사항인 사용가능연령·체중을 잘못 표시하거나 연속사용시간 표시를 누락 → 소비자원 권고 후 7개 업체가 사용설명서·누리집에 반영했다고 회신.","가격(2024년 2월 온라인 구입가): 312,000원 ~ 826,500원, 최대 2.6배 차이.","휴대형 유모차는 「어린이제품 안전 특별법」에 따른 안전확인대상 어린이제품 — 안전기준에 적합한 제품만 판매가 허용됩니다."],"products":"시험 대상 8개(2024년 1월 설문 기준 선호 브랜드): 뉴나 트래블, 리안 레브, 부가부 버터플라이, 스토케 요요2 6+, 와이업 지니에스, 잉글레시나 뉴퀴드2, 줄즈 에어플러스, 타보 플렉스탭3 — 전부 제조국 중국","checkedAt":"2026-09-10"},{"org":"한국소비자원·국가기술표준원","title":"「유모차 영유아 끼임 사고」 소비자안전주의보 발령 — 베이비트렌드社 일부 유모차 제품, 영유아의 질식 및 부상 유발 위험","date":"2023-02-15","url":"https://www.kca.go.kr/home/sub.do?menukey=4002&mode=view&no=1003457167","quote":"해당 제품이 해외 구매대행이나 중고거래 등을 통해 KC 인증(안전인증)을 받지 않고 유통되고 있어 국내 소비자들도 각별한 주의와 관심이 필요한 상황이다.","facts":["대상: Sit N’ Stand Double stroller(모델명 ‘SS76’으로 시작), Sit N’ Ultra stroller(‘SS66’으로 시작). 미국 CPSC 접수 사례에 14개월 영유아 질식사 포함.","「어린이제품안전특별법」 제30조에 따라 안전인증(안전확인) 표시가 없는 유모차 등 어린이제품의 판매 중개 및 구매·수입대행은 금지됩니다."],"checkedAt":"2026-09-10"}],"cautions":[{"text":"손잡이에 짐을 걸지 마세요 — 3kg만 걸어도 편평한 바닥에서 넘어질 수 있다는 것이 소비자원 시험 결과입니다.","source":"한국소비자원 2024-09-24"}],"kc":"안전확인(KC) 표시와 국내 정식 수입 여부를 확인하세요. 해외 구매대행·중고는 KC 없이 유통되는 사례가 있었습니다(2023-02-15 안전주의보).","links":[{"url":"https://link.coupang.com/a/g19aqMdVRs","label":"휴대용 유모차","addedAt":"2026-09-14"}]},{"id":"carseat","group":"outing","tier":"B","name":"카시트(자동차용 어린이보호장치)","icon":"carseat","when":"퇴원하는 날부터 — 차로 이동한다면 첫날부터 필요","qty":null,"official":null,"tests":[{"org":"한국소비자원·보험개발원","title":"저가형 휴대용 카시트, 안전인증 표시 없고 보호기능도 미흡 — 2개 제품에서 허용기준을 초과하는 폼알데하이드도 검출돼","date":"2020-02-27","url":"https://www.kca.go.kr/home/sub.do?menukey=4002&mode=view&no=1002911831","quote":"저가형 휴대용 자동차용 어린이보호장치 15개 제품을 공동으로 조사한 결과, 전 제품에 안전인증 표시가 없었고 일부 제품은 안전기준에도 부적합한 것으로 드러났다.","facts":["조사 대상은 포털 검색 상위권의 5만원 이하 제품 15개(해외직구·구매대행). 인증받은 제품은 주로 5만원~20만원대.","차량충돌시험: 미인증 제품은 충돌 시 더미 상체가 크게 움직여 상해 위험이 높았고, 1종은 골반 고정장치가 파손됐습니다.","2개 제품(13.3%)의 원단에서 허용기준(75mg/kg)을 약 2.2배·1.8배 초과한 폼알데하이드 검출.","자동차용 어린이보호장치는 안전인증대상 어린이제품 — 안전인증표시가 없는 제품은 판매가 금지됩니다(「어린이제품안전특별법」 제20조)."],"checkedAt":"2026-09-10"},{"org":"한국소비자원","title":"영유아용 카시트, 올바로 장착해야 안전 담보할 수 있어","date":"2018-10-16","url":"https://www.kca.go.kr/home/sub.do?menukey=4002&mode=view&no=1002713284","quote":"올바른 카시트 장착수칙은 ▲뒷좌석(좌우측)에 장착할 것 ▲좌석에 단단히 고정할 것 ▲만1세 미만은 뒤보기로 장착할 것 ▲등받이를 충분히 눕혀서 장착할 것 ▲머리지지대는 머리를 충분히 지지하도록 높이를 조절할 것 등이다.","facts":["고속도로 휴게소 현장조사 100명 중 17명의 카시트가 장착수칙 중 하나 이상을 지키지 않았고, 47명은 잘못 장착해 이용한 경험이 있었습니다.","2018년 자료 기준: 6세 미만 영유아는 유아보호용 장구 착용이 의무(도로교통법 제50조). 과태료 액수는 그 뒤 바뀌었을 수 있어 여기 적지 않습니다."],"checkedAt":"2026-09-10"}],"cautions":[{"text":"5만원 이하 ‘휴대용 카시트’는 조사 대상 15개 전부 안전인증 표시가 없었습니다. KC 안전인증 표시가 없는 제품은 사지 마세요.","source":"한국소비자원·보험개발원 2020-02-27"}],"kc":"안전인증(KC) 표시와 인증번호를 확인하세요 — 안전인증대상 어린이제품입니다.","links":[{"url":"https://link.coupang.com/a/g19dobUX6q","label":"신생아 카시트","addedAt":"2026-09-14"}]},{" function loadCouple() {

    .then(function (r) {

/* 상대 닉네임과 완료 표시를 서버에서 다시 받아온다(무료 = 수동 동기화). */
function refreshCouple() {
  if (!SUPA || !sync.user || !sync.coupleId) return Promise.resolve();
  // 요청 시점의 커플을 기억한다 — 응답이 오는 사이 해제·재연결이 일어나면
  // 옛 상대의 늦은 응답이 새 커플의 표시를 덮어쓸 수 있다(32차).
  var cid = sync.coupleId;

    .eq('couple_id', cid).neq('user_id', sync.user.id);

    .eq('couple_id', cid);

    .eq('couple_id', cid).maybeSingle();

    if (!sync.user || sync.coupleId !== cid) return;
    // supabase-js 는 HTTP 오류를 reject 가 아니라 r.error 로 돌려준다. 검사하지
    // 않으면 data 가 null 인 것을 '상대가 없다'·'완료가 없다'로 읽어, 서버 오류
    // 한 번에 배우자가 사라졌다(37차).
    //
    // 두 조회는 대등하지 않다 — 상대의 완료 표시는 상대가 있어야 뜻이 있는
    // 딸린 사실이다(39차). 그래서 상대 조회를 먼저 보고 세 갈래로 나눈다:
    //  · 상대를 확인하지 못했으면(오류) 관계 자체를 모르는 것이니 아무것도
    //    건드리지 않는다. 완료 표시만 새로 받아 봐야 반쪽짜리 진실이 된다.
    //  · 상대가 없는 것이 확인됐으면 그의 완료 표시도 함께 내린다. 모르면
    //    지우지 않지만, 없는 것이 확인됐는데 딸린 기록을 남겨 두지도 않는다
    //    (실측: 콩은 하나인데 옛 배우자의 완료로 둥지 조각이 켜져 있었다).
    //  · 상대가 있으면 그의 완료 표시만 갱신하고, 그 조회가 실패했을 때는
    //    마지막으로 확인된 값을 그대로 둔다.
    if (rs[0] && rs[0].error) { onSyncFail(); return; }
    // 상대의 '행이 있는가'가 존재의 근거다 — 닉네임 유무로 판단하면 join 직후
    // 닉네임이 아직 안 채워진 짧은 구간에 상대를 없다고 오판한다(36차 조사).
    var partner = (rs[0] && rs[0].data && rs[0].data[0]) || null;
    sync.partnerLinked = !!partner;
    sync.partnerName = partner ? partner.nickname : null;
    if (!partner) {
      // 상대가 없다 — 완료 표시 조회가 실패했든 아니든 결과는 같다(빈 값).
      // 사용자가 보는 화면은 정확하므로 실패를 따로 알리지 않는다.
      sync.partnerMarks = {};
      render(); return;
    }
    // 상대가 고친 공유 프로필 — 알리되 덮어쓰지 않는다. 이 조회의 실패는 이 기능만 건너뛴다.
    noteSharedUpdate(rs[2]);

}

/* 상대가 고친 공유 프로필을 '보류'로 잡는다 — 내가 확인한 뒤에만 반영한다.
   updated_by 가 나면 내 것이고, 이미 본 updated_at(yebu.sharedSeen)이면 새 것이 아니다.
   차이가 없으면 본 것으로 표시만 한다. 공유 행은 커플당 하나라 마지막에 쓴 쪽이 남는다
   (updated_by·updated_at 이 누가 언제인지 말한다) — 그래서 받는 쪽은 자동으로 덮어쓰지 않는다. */
function noteSharedUpdate(r) {
  if (!r || r.error || !r.data || !r.data.data || r.data.data.v !== 1 || !sync.user) return;
  var row = r.data;
  if (row.updated_by === sync.user.id) { sync.sharedPending = null; return; }
  if (row.updated_at && row.updated_at === store('yebu.sharedSeen')) { sync.sharedPending = null; return; }
  var diff = APPLOGIC.sharedDiff(profile, row.data);
  if (!Object.keys(diff).length) {
    if (row.updated_at) store('yebu.sharedSeen', row.updated_at);
    sync.sharedPending = null; return;
  }
  sync.sharedPending = { changes: diff, data: row.data, updatedAt: row.updated_at || null };
}
/* 상대가 고친 공유 정보 — 확인한 뒤에만 반영한다. 자동으로 덮어쓰지 않는다(2026-09-10 F04). */
function sharedPendingHtml() {
  var sp = sync.sharedPending;
  if (!sp) return '';
  var rows = Object.keys(sp.changes).map(function (k) {
    var v = sp.changes[k];
    var label = SHEET_FIELD_LABEL[k] || FIELD_LABEL[k] || k;
    var txt = v === true ? '예' : v === false ? '아니오' : v == null ? '비움' : String(v);
    return '<div class="dl"><dt>' + esc(label) + '</dt><dd>' + esc(txt) + '</dd></div>';
  }).join('');
  return '<div class="askwrap" style="margin:6px 0 10px"><div class="ask-head">' + esc(sync.partnerName || '배우자') + ' 님이 공유 정보를 고쳤습니다</div>' +
    rows + '<div class="fieldnote">내 정보에 반영할지 직접 고릅니다. 자동으로 덮어쓰지 않습니다.</div>' +
    '<div class="seg" style="margin-top:8px"><button data-shared="apply">내 정보에 반영</button><button data-shared="dismiss">그대로 두기</button></div></div>';

/* 내 완료 표시 하나를 서버에 반영한다. 실패해도 로컬은 그대로다. */
function pushMark(id, on) {
  if (!SUPA || !sync.user || !sync.coupleId) return;
  if (on) {
    SUPA.from('done_marks').upsert({ couple_id: sync.coupleId, item_id: id, by_user: sync.user.id })
      .then(syncDone, onSyncFail);
  } else {
    SUPA.from('done_marks').delete().eq('couple_id', sync.coupleId)
      .eq('item_id', id).eq('by_user', sync.user.id).then(syncDone, onSyncFail);
  }

      sync.err = m.indexOf('TOO_MANY_ATTEMPTS') >= 0 ? '코드 확인 시도가 많아 잠시 막혔습니다. 10분 뒤에 다시 넣어 주세요.'
        : m.indexOf('INVALID_CODE') >= 0 ? '코드가 맞지 않거나 쓸 수 없는 코드입니다. 배우자에게 새 코드를 받아 다시 넣어 주세요.'
        : m.indexOf('COUPLE_FULL') >= 0 ? '이 코드로는 이미 두 사람이 연결을 마쳤습니다. 코드를 만든 배우자에게 확인해 주세요.'
        : m.indexOf('ALREADY_COUPLED') >= 0 ? '이미 연결된 상대가 있거나 내가 만든 초대가 남아 있습니다. 다른 사람과 연결하려면 먼저 기존 연결을 해제하거나 내 초대를 취소해 주세요.'
        : m.indexOf('OWN_CODE') >= 0 ? '코드가 맞지 않거나 쓸 수 없는 코드입니다. 배우자에게 새 코드를 받아 다시 넣어 주세요.'
        : '연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';

    SUPA.from('profile_shared').select('data,updated_at').eq('couple_id', sync.coupleId).maybeSingle()
      .then(function (s) {
        /* 이 클라이언트는 HTTP 오류를 reject 가 아니라 결과.error 로 준다 — 묻지 않으면

        if (s && s.error) { onSyncFail(); return; }

          if (s.data.updated_at) store('yebu.sharedSeen', s.data.updated_at);

}

/** 클립보드가 막힌 환경(샌드박스 등)에서는 최소한 선택이라도 되게 한다. */

/** 정의 목록 한 칸. 값이 비면 아무것도 그리지 않는다. */

}

/* 공문서 원문 칸 — "○ …\r\n - …\r\n※ …"를 한 문단으로 이어 붙이면 기호가 한 줄에 늘어서 읽을 수 없다.
   글자는 그대로 두고 원문의 줄을 살려 목록으로 보여 준다(APPLOGIC.srcLines, 2026-09-30). */
function srcHtml(value) {

  // 클래스는 src- 접두 — 'item' 은 카드 목록의 전역 클래스라 그대로 쓰면 줄마다 카드가 씌워진다(2026-09-30 실화면).

}

function srcInline(value) {

/** 원문 칸 전용 정의 목록 한 칸. */
function dlSrc(label, value) {

}

/** 근거 인용 묶음. 여러 개면 모두 보여주고 각각 출처를 단다. */
function quoteList(quotes) {
  if (!Array.isArray(quotes) || !quotes.length) return '';
  var seen = {};
  var items = quotes.filter(function (q) {
    if (!q || !q.text || seen[q.text]) return false;
    seen[q.text] = true;
    return true;
  });
  var one = function (q) {
    return '<div class="quote">&ldquo;' + esc(q.text) + '&rdquo;' +
      (q.source ? '<cite>' + esc(q.source) + '</cite>' : '') + '</div>' +
      (q.url ? goLinks([{ url: q.url, label: '원문 확인' }]) : '');
  };
  // 둘까지는 바로, 나머지는 접어 둔다 — 한 항목에 인용 상자가 7~10개 줄지어 서 있었다(2026-09-14 실측).
  var head = items.slice(0, 2).map(one).join('');
  var rest = items.slice(2);
  if (!rest.length) return head;
  return head + '<details class="more"><summary>원문 인용 ' + rest.length + '개 더 보기</summary><div>' +
    rest.map(one).join('') + '</div></details>';
}

/** 확인하지 못한 것. 숨기지 않고 화면까지 끌고 온다 — 다만 본문보다 한 단계 물러난 글자로. */

  if (!Array.isArray(list) || !list.length) return '';

    list.map(function (u) { return '· ' + esc(u); }).join('<br>') + '</dd></div>';
}

    '<span class="steps-count num">' + doneN + ' / ' + steps.length + '</span></div>';

      : '<div class="chk locked' + (rowDone || remoteDone ? ' on' : '') + '" title="' + ROLE_LABEL[it.who] + ' 몫입니다" aria-hidden="true"><i>' +
        (rowDone || remoteDone ? ICON.check : ICON.lock) + '</i></div>') +
    '<button class="row-main" data-open="' + esc(it.id) + '" aria-expanded="' + (open[it.id] ? 'true' : 'false') + '" style="background:none;border:0;text-align:left">' +
      '<div class="row-title">' + esc(it.name) + '</div>' +
      // 펼치면 상세 첫 줄(무엇을 하나요)과 같은 문장이 위아래로 겹친다 — 접혔을 때만.
      (open[it.id] ? '' : '<div class="row-sub">' + esc(it.whatToDo) + '</div>') +
      (tags ? '<div class="row-meta">' + tags + '</div>' : '') +
    '</button>' +
    (w.txt ? '<div class="row-side"><div class="row-when ' + w.cls + '">' + esc(w.txt) + '</div>' +
      (w.unit ? '<div class="row-when-unit">' + esc(w.unit) + '</div>' : '') + '</div>' : '') +
  '</div>' +
  // 신청처가 있는 항목은 링크를 펼치지 않아도 카드 안에 보인다 — 할 일의 첫 행동은 '완료 표시'가
  // 아니라 신청이다(외부감사 E.2). 펼치면 상세 안의 같은 링크가 대신한다.
  (it.applyUrl && !open[it.id] ? goLinks([{ url: it.applyUrl, label: applyLabel(it), ev: 'apply-open', id: it.id, layer: 'checkpoint' }]) : '') +
  '</div>';

  // 대상 조건을 판단할 값이 비어 있으면 그 자리에서 묻는다(제도 카드와 같은 질문 상자).
  // 묶음(ASK_ABOVE)이 그 묶음의 질문을 위에서 한 번 물었으면 행마다 되풀이하지 않는다 —
  // 고용 형태 하나를 여덟 행이 각자 묻던 것을 한 번으로.
  if (c.state === 'unknown' && c.missingFields && c.missingFields.length && !ASK_ABOVE) h += askBlock(c);
  // 세부 체크리스트는 상세를 펼치지 않아도 보인다 — 이게 이 항목의 본체다.
  h += stepsBlock(it, mine);

  if (open[it.id]) {
    h += '<div class="detail">' + chkDetailBody(it) +
      goLinks([
        { url: it.applyUrl, label: applyLabel(it), ev: 'apply-open', id: it.id, layer: 'checkpoint' },
        { url: it.source && it.source.url, label: it.applyUrl ? '안내 원문' : '원문 보기' }
      ]) +
      // 입원 가방 항목에서 준비물 서랍으로 — 목록(무엇을 몇 개)은 알아보기 탭의 준비물 서랍이 맡는다.
      (it.id === 'birth_bag_prepare' ? '<div class="golinks"><button class="golink" data-goods="open">준비물 목록 보기</button></div>' : '') +
      '</div>';
  }
  return h;
}

/* compact === true 면 제목과 시기만 — 준비 탭 '검사 일정'이 접혀 있을 때. 세 줄 요약 셋이
   할 일 목록을 첫 화면 밖으로 밀어냈다(375px 실측). 열면 요약이 돌아온다. */
/* 조건부 일정의 조건 이름표(감사 H-2). 데이터의 conditionField 가 늘면 여기에 더한다 — 없으면 '해당될 때만'. */
var CONDITION_TAG = { isRhNegative: 'Rh 음성일 때만' };
function tlRow(t, compact) {

  var h = '<div class="item"><button class="row" data-open="' + esc(id) + '" aria-expanded="' + (open[id] ? 'true' : 'false') + '" style="background:none;border:0;text-align:left">' +
    '<div class="row-main">' +
      '<div class="row-title">' + esc(it.name) +
        // 검사가 아닌 준비 항목과 '확인' 아닌 등급은 이름 옆에 밝힌다 — 보험사 한 곳 기준(추정)이 확인된 검사처럼 보였다(감사 E-2).
        (it.category === '준비' ? ' <span class="tag line">준비</span>' : '') +

        (t.conditionalUnknown ? ' <span class="tag line">' + esc(CONDITION_TAG[it.conditionField] || '해당될 때만') + '</span>' : '') + '</div>' +
      (compact === true || (open[id] && it.whatIsIt) ? '' : '<div class="row-sub">' + esc(it.summaryLine || it.timingText || '') + '</div>') +

    h += dlRow('비용', it.cost);

}

/** 지금 주차에 해당하는 항목만 고른다. 주차 정보가 없으면 상시 항목만. */
function inWeekNow(x, weeks) {
  var w = x['해당주차'];
  if (!w) return true;                       // 시기 제한이 없으면 늘 해당
  if (weeks == null) return false;           // 주차를 모르면 시기 한정 항목은 뺀다
  return weeks >= w.from && weeks <= w.to;
}

/** 생활 수칙 · 몸의 변화 — 읽을거리라 체크박스를 두지 않는다. */

/** 생후 개월 접종·검진 행 — 펼치면 차수·원문·출처까지. */

/** 지금이 어느 시기인가를 한 글자열로. 이 값이 달라졌으면 화면이 새로 맞춰진 것이다.
    임신 중은 주차, 출산 후는 개월. 둘 다 아니면(준비 중) 시기가 흐르지 않으므로 표식이 없다. */
function periodMark() {
  if (profile.stage === 'pregnant' && D.weeks != null) return 'w' + D.weeks;
  if (profile.stage === 'postpartum' && D.childAgeMonths != null) return 'm' + D.childAgeMonths;
  return '';
}
/** 무엇이 달라졌는지 사실만 적는다. 숫자가 뒤로 갔거나(예정일을 고쳤을 때)
    단위가 바뀌었으면 몇 주가 지났다고 말할 수 없으니 담백하게 알린다. */
function periodMessage(last, now) {
  var unit = now.charAt(0), n = Number(now.slice(1)), p = Number(last.slice(1));
  if (unit !== last.charAt(0) || !(n > p)) {
    return unit === 'w' ? '임신 ' + n + '주에 맞춰 이번 주 카드와 할 일을 새로 정리했습니다.'
                        : '생후 ' + n + '개월에 맞춰 할 일을 새로 정리했습니다.';
  }
  var gap = n - p;
  if (unit === 'w') {
    return gap === 1 ? '임신 ' + n + '주가 되었습니다. 이번 주 카드와 할 일이 새로 맞춰졌습니다.'
                     : '지난번 이후 ' + gap + '주가 지나 ' + n + '주가 되었습니다. 카드와 할 일을 새로 맞췄습니다.';
  }
  return gap === 1 ? '생후 ' + n + '개월이 되었습니다. 접종·검진과 할 일이 새로 맞춰졌습니다.'
                   : '지난번 이후 ' + gap + '개월이 지나 생후 ' + n + '개월이 되었습니다. 할 일을 새로 맞췄습니다.';
}

function viewToday() {
  var h = '';
  // 태아 성장은 '오늘'의 몸이라 펼침이 기본이다 — 버튼 뒤에 숨기지 않는다.
  /* 또래 중앙값 해설은 기본 접힘(2026-09-10 UX 검토 #4 — 읽을거리가 '이번 주 세 가지'보다 위에서
     첫 화면을 차지했다). 표기 의무는 두 층으로 지킨다: 숫자 바로 밑 한 줄에 출처(WHO)와
     "추정·정상 범위 아님"을 늘 보이고, 네 문장 전문과 원 논문 링크는 ? 한 번에 연다. */
  /* 히어로 카드 — 주차·D-day 가 먼저 서고, 작은 둥지는 오른쪽 레이어다(캐릭터는 주인공이
     아니다 — 30차 실측 원칙 그대로). 둥지 상태는 둥지 카드와 같은 계산(currentNest)을 쓴다. */
  var row = '', kv = '';
  if (profile.stage === 'pregnant' && D.weeks != null) {
    // 확정 시트 구도 — "N주 M일" + 박스형 D-day. 주차·일수 계산은 공유 카드와
    // 같은 단일 소스(APPLOGIC.weeklyCardData)를 쓴다 — 두 화면의 숫자가 갈라지지 않게.
    var wk = APPLOGIC.weeklyCardData({
      weeks: D.weeks, dueDate: profile.dueDate, today: TODAY,
      timeline: TIMELINE, checkpoints: CHK, doneIds: done, role: profile.role, conditions: profile
    });
    row = '<div style="display:flex;align-items:baseline;min-width:0"><div class="big">' + wk.weeks + '</div><div class="big-unit">주</div>' +
      (wk.dayPart ? '<div class="big" style="margin-left:7px">' + wk.dayPart + '</div><div class="big-unit">일</div>' : '') + '</div>';
    row += '<div class="dbox"><div class="dbox-label">출산까지</div><div class="dbox-value">' + (wk.left != null ? 'D-' + wk.left : '—') + '</div></div>';
    // 히어로 둘째 줄 — 또래 중앙값은 우리만 주는 정보라 뺄 수 없다. 줄을 나눠 자리를 준다.

      kv = '<button class="kv-btn" data-open="fetal" aria-expanded="' + (open.fetal ? 'true' : 'false') + '"><div class="kv-label">또래 중앙값 <span class="qmark">?</span></div>' +
        '<div class="kv-value num">' + GROWTH.efwG + '<small>g</small></div>' +
        '<div class="kv-note">WHO 성장곡선의 중앙값(추정)일 뿐, 정상 범위가 아닙니다.</div>' +
        (profile.fetusCount > 1 ? '<div class="kv-note">한 명 기준 값입니다. 쌍둥이는 기준이 다릅니다.</div>' : '') + '</button>';
    } else if (GROWTH && GROWTH.reason) {
      kv = '<div><div class="kv-label">또래 중앙값</div><div class="kv-note">' + esc(GROWTH.reason) + '</div></div>';
    }
  } else if (profile.stage === 'postpartum' && D.childAgeMonths != null) {
    var bd = new Date(profile.birthDate + 'T00:00:00');
    var days = Math.round((TODAY - bd) / 86400000);
    row = '<div style="display:flex;align-items:baseline"><div class="big">' + days + '</div><div class="big-unit">일째</div></div>';
    row += '<div class="hero-side"><div><div class="kv-label">생후</div><div class="kv-value num">' + D.childAgeMonths + '<small>개월</small></div></div></div>';
  } else if (profile.stage === 'pregnant') {
    // 예정일이 없다고 주차를 지어내지 않는다 — 무엇이 잠겨 있는지 알리고 입력을 청한다.
    // 예정일을 넣었는데 주차를 못 셌다면(이미 지났거나 너무 멀다) "입력하면"이라고 말하지 않는다 — 입력한 사람에게 틀린 안내다(plan 086-2).
    if (profile.dueDate) {
      var dueShown = fmtDates(profile.dueDate);
      var duePast = profile.dueDate < ENG.fmtDate(TODAY);
      row = '<div style="flex:1"><div class="kv-label">' + (duePast
          ? '입력한 예정일(' + esc(dueShown) + ')이 이미 지났습니다.'
          : '입력한 예정일(' + esc(dueShown) + ')이 너무 멉니다.') + '</div>' +
        '<div class="hero-note" style="margin-top:4px">' + (duePast
          ? '출산하셨다면 단계를 &lsquo;출산 후&rsquo;로 바꾸고 출생일을 넣어 주세요.'

        (READONLY ? '' : '<div style="margin-top:10px"><button class="askbtn" data-sheet="me" data-focus="dueDate">내 정보 입력하기</button></div>') + '</div>';
    } else {
      row = '<div style="flex:1"><div class="kv-label">출산 예정일을 입력하면</div>' +
        '<div class="hero-note" style="margin-top:4px">주차별 검사·할 일 안내와 신청 기한 계산이 시작됩니다.</div>' +
        (READONLY ? '' : '<div style="margin-top:10px"><button class="askbtn" data-sheet="me" data-focus="dueDate">내 정보 입력하기</button></div>') + '</div>';
    }
  } else if (profile.stage === 'postpartum') {
    row = '<div style="flex:1"><div class="kv-label">아이 생일을 입력하면</div>' +
      '<div class="hero-note" style="margin-top:4px">접종·검진 일정과 신청 기한 계산이 시작됩니다.</div>' +
      (READONLY ? '' : '<div style="margin-top:10px"><button class="askbtn" data-sheet="me" data-focus="birthDate">내 정보 입력하기</button></div>') + '</div>';
  } else {
    // 준비 중에는 주차도 날짜도 없다. 대신 임신 전에 챙길 것이 몇 가지
    // 남았는지를 세어 보여 준다 — 하나씩 지워 나가는 것이 이 단계의 일이다.
    var prep = CHK.filter(function (c) {

    var prepLeft = prep.length - prepDone;
    row = '<div style="display:flex;align-items:baseline"><div class="big">' + prepLeft + '</div><div class="big-unit">가지</div></div>';
    row += '<div class="hero-side"><div class="kv-label">임신 전에 챙길 것</div>' +
      '<div class="hero-note">' +
      (prepDone ? prepDone + '가지를 마쳤습니다' : '하나씩 지워 나가시면 됩니다') +
      '</div></div>';
  }
  var nestMini = (profile.stage === 'pregnant' || profile.stage === 'postpartum') ? heroNestSvg() : '';
  h += '<div class="hero"><div class="hero-row">' + row + '</div>' +
    ((kv || nestMini) ? '<div class="hero-kv">' + kv + nestMini + '</div>' : '') + '</div>';

  // 또래 중앙값 해설 — 히어로 바로 아래에 붙어야 무엇을 설명하는지 보인다.
