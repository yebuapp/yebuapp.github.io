      : '') +
    (GUIDE['싣지_않은_것'] || []).map(function (x) {
      return '<div class="warn" style="background:var(--sunken);color:var(--sub);margin-top:12px">' +
        '<b>' + esc(x['항목']) + '</b>: 싣지 않았습니다. ' + esc(x['이유']) +
        (x['대신'] ? ' ' + esc(x['대신']) : '') + '</div>';
    }).join('') +
    '</div></div></div>';
}

/* ── 검색 ──────────────────────────────────────────────────────────
   색인은 한 번만 만든다. 제도가 291건이라 입력할 때마다 다시 만들면 버벅인다. */
var SEARCH_INDEX = null;

function buildIndex() {
  var idx = [];
  var push = function (kind, id, title, sub, body, ref) {
    idx.push({ kind: kind, id: id, title: title, sub: sub || '', ref: ref, hay: (title + ' ' + (sub || '') + ' ' + (body || '')).toLowerCase() });
  };

  CHECKITEMS.forEach(function (it) {
    var steps = (it.steps || []).map(function (st) { return st.text + ' ' + (st.where || '') + ' ' + (st.note || ''); }).join(' ');
    push('할 일', 's_c_' + it.id, it.name, it.whatToDo, [it.why, it.where, it.category, steps].join(' '), it);
  });

  TIMELINE.forEach(function (it) {
    push('검사', 's_t_' + it.id, it.name, it.timingText, [it.detail, it.whatIsIt, it.disease, it.whyNeeded].join(' '), it);
  });

  /* 제도 — 본체 + 받아 둔 시·도 파일 전부(plan 112). 파일이 도착하면 SEARCH_INDEX 를 버려 여기서 다시 만든다. */
  programsWith(Object.keys(REGION_DATA)).forEach(function (p) {
    push('혜택', 's_p_' + p.id, p.name, p.applyVia, [p.summary, p.amountText, p.eligibilityText, p.docsText, p.notes].join(' '), p);
  });

  (LAWDATA.changes || []).forEach(function (c) {
    push('바뀌는 것', 's_l_' + c.id, c.title, c.summary, [c.who, c.before, c.after].join(' '), c);
  });

  (GUIDE['위험신호'] || []).forEach(function (x) {
    push('병원', 's_s_' + x.id, x['제목'], x['무엇'], x['덧붙임'] || '', x);
  });

  (GUIDE['생활수칙'] || []).forEach(function (x) {
    push('생활', 's_g_' + x.id, x['제목'], x['내용'], x['덧붙임'] || '', x);
  });

  // 몸의 변화도 찾아진다 — '입덧'을 검색했는데 아무것도 안 나오면 앱이 모르는 줄 안다.
  (GUIDE['몸의변화'] || []).forEach(function (x) {
    push('생활', 's_b_' + x.id, x['제목'], x['내용'], x['덧붙임'] || '', x);
  });

  (LIFE || []).forEach(function (x) {
    push('생활', 's_f_' + x.id, x.title, x.summary,
      (x.facts || []).map(function (f) { return f.factKo + ' ' + (f.quote || ''); }).join(' '), x);
  });

  // 준비물 — '기저귀'·'카시트'를 찾으면 공식 목록과 소비자원 시험이 나와야 한다.
  (GOODS || []).forEach(function (x) {
    if (x.excluded) return;
    push('준비물', 's_g_' + x.id, x.name, x.when,
      [(x.official && x.official.quote) || '', (x.tests || []).map(function (t) { return t.title + ' ' + (t.quote || ''); }).join(' ')].join(' '), x);
  });

  // 아기 접종·검진 — 'BCG'나 '영유아 검진'을 검색하면 나와야 한다.
  (MONTHS || []).forEach(function (x) {
    push(x.kind, 's_m_' + x.id, x.name, x.timingText, (x.doseNote || '') + ' ' + (x.evidence ? x.evidence.quote : ''), x);
  });

  return idx;
}

/* 검색 본체(낱말 맞추기·어미 맞춤·제도 이름 동의어·정렬)는 src/applogic.mjs 의 searchRank 다 — 테스트가 거기 붙어 있다(plan 111).
   여기서는 색인과 '내 지역' 판정만 넘긴다. 내 지역 것을 위로 — "보건소"로 찾으면 남의 동네 제도가 마흔 건 쏟아진다. */
function searchFor(q) {
  if ((q || '').trim().length < 1) return [];
  if (!SEARCH_INDEX) SEARCH_INDEX = buildIndex();
  var mine = function (e) {
    var rg = e.ref && e.ref.region;
    if (!rg) return 1;                       // 전국 제도는 중간
    if (!profile.sido) return 1;
    if (rg.sigungu) return (rg.sido === profile.sido && rg.sigungu === profile.sigungu) ? 0 : 2;
    return rg.sido === profile.sido ? 0 : 2;
  };
  return APPLOGIC.searchRank(SEARCH_INDEX, q, mine);
}

/** 검색 결과 하나를 펼쳤을 때의 본문. 유형마다 담긴 것이 달라 나눠 그린다. */
function searchDetail(e) {
  var r = e.ref || {};
  var h = '<div class="detail">';

  if (e.kind === '접종' || e.kind === '검진') {
    // 아기 접종·검진(월령 일정) — moRow 상세와 같은 내용
    h += dlRow('언제', r.timingText);
    h += dlRow('차수', r.doseNote);
    if (r.evidence && r.evidence.quote) h += '<div class="quote">&ldquo;' + esc(r.evidence.quote) + '&rdquo;</div>';
    h += unverifiedBlock(r.caveats);
    if (r.source) {
      h += '<div class="srcline">' + esc(r.source.name) + '</div>' +
        goLinks([{ url: r.source.url, label: '일정 안내 원문' }]);
    }
    return h + '</div>';
  }

  if (e.kind === '검사') {
    if (r.whatIsIt) h += '<div class="lead">' + esc(r.whatIsIt) + '</div>';
    h += dlRow('어떤 병인가요', r.disease);
    h += dlRow('왜 하나요', r.whyNeeded);
    h += dlRow('어떻게 하나요', r.howDone);
    h += dlRow('결과는 무엇을 뜻하나요', r.resultMeaning);
    h += dlRow('비용', r.cost);
    h += dlRow('시기', r.timingText);
    if (!r.whatIsIt) h += dlRow('내용', r.detail);
    else if (r.detail) h += dlRow('덧붙임', r.detail);
    h += quoteList(r.quotes);
    h += unverifiedBlock(r.unverified);
    if (r.source) h += '<div class="srcline">' + esc(r.source.name) + '</div>' + goLinks([{ url: r.source.url, label: '검사 안내 원문' }]);

  } else if (e.kind === '할 일') {
    if (r.steps && r.steps.length) {
      h += '<div class="dl"><dt>준비할 것</dt><dd>' +
        r.steps.map(function (st) { return '· ' + esc(st.text) + (st.confidence === '참고' ? ' (참고)' : ''); }).join('<br>') +
        '</dd></div>';
    }
    h += chkDetailBody(r);
    if (r.applyUrl) h += goLinks([{ url: r.applyUrl, label: applyLabel(r), ev: 'apply-open', id: r.id, layer: r.layer }]);

  } else if (e.kind === '혜택') {
    if (r.summary) h += '<div class="lead">' + esc(fmtDates(r.summary)) + '</div>';
    h += dlSrc('지원 대상', r.eligibilityText);
    h += dlSrc('지원 금액', r.amountText);
    // 혜택 탭 상세(moneyRow)에 있는 정적 필드는 검색에서도 보인다 — 진입 경로에
    // 따라 정보가 달라지면 안 된다(평가 결과가 필요한 줄만 의도적으로 뺀다).
    h += extraBenefitsHtml(r);
    h += dlSrc('선정 기준', r.selectionText);
    h += dlRow('신청 기한', deadlineLine(null, r));
    h += deadlineNoteHtml(null, r);
    if (r.usageBy && r.usageBy.text) h += dlRow('사용 기한', r.usageBy.text);
    h += dlRow('급여 신청 기한', payDeadlineLine(null, r));
    if (r.pendingChange && r.pendingChange.text) h += '<div class="warn">' + esc(r.pendingChange.text) + '</div>';
    h += dlSrc('필요 서류', r.docsText);
    h += dlSrc('신청 방법', r.applyVia);
    if (r.payout && r.payout.detailText) h += dlRow('나눠 받는 기간', r.payout.detailText);
    h += dlSrc('지급 시기', r.paymentScheduleText);
    h += dlRow('유의 사항', fmtDates(r.notes));
    h += dlRow('법적 근거', r.legalBasis);
    if (r.evidence && r.evidence.quote) h += quoteList([{ text: r.evidence.quote, source: r.source && r.source.name, url: r.evidence.url }]);
    // 혜택 탭 상세(moneyRow)와 같은 출처·확인일 줄 — 검색으로 들어와도 낡은 정보에 같은 표시가 붙는다(plan 105).
    if (r.source) h += checkedLine(r.source.name, r.source.checkedAt);
    h += goLinks([
      { url: r.applyUrl || r.onlineApplyUrl, label: applyLabel(r), ev: 'apply-open', id: r.id, layer: r.layer },
      { url: r.source && r.source.url, label: '제도 안내 원문' }
    ]);
    // 혜택 탭 상세와 같은 제보 단추 — 검색으로 들어와도 오류를 알릴 길은 같다.
    h += '<div class="golinks"><button class="golink" data-report="' + esc(r.id) + '">공식 정보와 다른가요? 알려주세요</button></div>';

  } else if (e.kind === '바뀌는 것') {
    h += dlRow('누가', r.who);
    h += dlRow('전에는', r.before);
    h += dlRow('앞으로는', r.after);
    // 추진 단계는 시행일이 없다 — 칸을 지우지 않고 '정해지지 않았다'고 말한다(2026-09-29 자동 지급 추진).
    h += dlRow('시행일', r.effectiveFrom === null ? '정해지지 않음' : r.effectiveFrom);
    if (r.caution) h += '<div class="warn">' + esc(r.caution) + '</div>';
    if (r.evidence && r.evidence.quote) h += quoteList([{ text: r.evidence.quote, source: r.source && r.source.name, url: r.evidence.url }]);
    h += unverifiedBlock(r.unverified);

  } else if (e.id.indexOf('s_g_') === 0) {
    h += goodsDetailHtml(r);

  } else if (e.id.indexOf('s_f_') === 0) {
    // 찾아보는 안내서(생활 탭) 항목 — 탭과 같은 상세를 그대로 쓴다. 예전엔 아래
    // 한글 키 분기로 떨어져 빈 카드가 나왔다(구조가 전혀 달라 아무것도 안 읽혔다).
    h += lifeDetailHtml(r);

  } else {
    // 위험 신호 · 생활 수칙 · 몸의 변화
    if (r['무엇']) h += '<div class="lead">' + esc(r['무엇']) + '</div>';
    if (r['내용']) h += '<div class="lead">' + esc(r['내용']) + '</div>';
    if (r['긴급도']) h += dlRow('언제 가나요', r['긴급도'] === '즉시' ? '바로 병원으로' : r['긴급도'] === '준비' ? '갈 준비' : '오늘 안에 문의');
    h += dlRow('덧붙임', r['덧붙임']);
    if (r['출처불일치']) h += '<div class="warn">공식 자료 안에서도 기준이 갈리는 항목입니다. 다니는 병원 기준을 확인하세요.</div>';
    if (r['인용']) h += quoteList([{ text: r['인용'], source: r['출처'] && r['출처'].name, url: r['출처'] && r['출처'].url }]);
  }

  return h + '</div>';
}

/* 몸이 걱정되어 찾아온 사람에게는 병원 안내를 함께 준다.
   "어지럽고 토해요"처럼 증상을 우리 문장과 다른 말로 물으면 색인이 못 잡는데,
   그 사람이 정말 필요한 것은 검색 결과가 아니라 병원에 가야 하는지에 대한 답이다.

   여기 낱말들은 **일상어 목록일 뿐 의학 판정이 아니다.** "어지럼은 전자간증 신호"
   같은 연결은 근거 없이 하면 위험하므로 하지 않는다 — 몸 이야기가 오면 병원에
   가야 하는 신호 목록으로 데려다줄 뿐이고, 무엇이 어느 병인지는 그 목록이 말한다. */
var BODY_WORDS = /아프|아파|아픔|통증|쑤시|결리|피가|피\s*비|출혈|하혈|어지|현기|토하|구토|메스|울렁|붓|부었|부어|부종|열이|고열|오한|배가|배뭉|뭉치|쏟아|샌다|새요|흐르|분비물|태동|안\s*움직|숨차|숨이|가슴이|경련|쥐가|시야|침침/;
function bodyAskHtml(empty) {
  if (!BODY_WORDS.test(searchQuery)) return '';
  return '<div class="secnote"' + (empty ? ' style="margin-top:14px"' : '') + '>' +
    '몸이 걱정되어 찾으셨다면 <b>이럴 땐 병원</b>을 함께 보세요. 병원에 가야 하는 신호를 시기별로 모아 두었습니다.</div>' +
    '<div style="padding:0 2px 12px"><button class="askbtn" data-sheet="sos">이럴 땐 병원 열기</button></div>';
}

/* 찾기 시트의 결과 영역 — 한 글자 입력마다 화면 전체가 아니라 이 부분만 다시 그린다(plan 082). */
function searchBodyHtml() {
  var hits = searchFor(searchQuery);
  var body = '';
  if (!searchQuery.trim()) {
    body = '<div class="empty">제도 이름을 몰라도 됩니다.<br>&lsquo;기저귀&rsquo;, &lsquo;출생신고 서류&rsquo;, &lsquo;백일해&rsquo;처럼 떠오르는 말로 찾아 보세요.</div>';
  } else if (!hits.length) {
    body = '<div class="empty">&lsquo;' + esc(searchQuery) + '&rsquo;' + APPLOGIC.josa(searchQuery.trim(), '으로', '로') + ' 찾은 것이 없습니다.<br>다른 말로 해 보시거나, 지역·단계를 바꾸면 결과가 달라집니다.</div>' +
      bodyAskHtml(true);
  } else {
    body = bodyAskHtml(false) +
      '<div class="sec-head" style="cursor:default"><h3>찾은 것</h3><span class="count">' + hits.length + (hits.length >= 40 ? '+' : '') + '</span></div>' +
      // 낱말이 다 맞은 것이 없어 하나라도 맞는 것을 보여줄 때는 그렇다고 말한다.
      // 말하지 않으면 엉뚱한 결과를 정답으로 읽는다.
      (hits.partial ? '<div class="secnote">&lsquo;' + esc(searchQuery) + '&rsquo; 전부와 맞는 것은 없어, ' +
        '<b>일부 낱말이라도 맞는 것</b>을 가까운 순서로 보여드립니다.</div>' : '') +
      searchRowsHtml(hits);
  }
  return body + otherRegionsHtml();
}
/* 검색 '다른 지역에서도 찾기' (plan 112, U12) — 분할 빌드에서 받지 않은 시·도 제도는 색인에 없다. 건수를 셀 수 없으므로
   누르면 나머지 시·도 파일을 받아 색인에 더한다. 받은 뒤에는 예전처럼 '다른 지역 제도 N건 보기' 접힘이 그대로 나온다.
   못 받으면(오프라인) 정직하게 한 줄로 말한다. */
function otherRegionsHtml() {
  if (!REGION_SPLIT || !searchQuery.trim() || regionsAllReady()) return '';
  if (OTHER_REGIONS === 'loading') return '<div class="secnote" role="status">다른 지역 제도를 불러오는 중입니다.</div>';
  return (OTHER_REGIONS === 'failed' ? '<div class="secnote">인터넷에 연결되면 다른 지역도 찾을 수 있습니다.</div>' : '') +
    '<div class="sec-head"><button class="count" data-rdall="1" style="min-height:44px">' +
    (profile.sido ? '다른 지역 제도에서도 찾기' : '시·도 제도에서도 찾기') + '</button></div>';
}
/* 검색 결과 줄 — 혜택에는 지역 꼬리표를 달고, 내 지역 → 전국 → 다른 지역 순으로 둔다.
   다른 지역 제도는 기본 접힘(내 지역을 고른 사람에게만 — 지역을 모르면 가리지 않는다). plan 086-10. */
function searchRowsHtml(hits) {
  var rowHtml = function (e) {
    var opened = !!open[e.id];
    var isBenefit = e.kind === '혜택';
    // 원문 줄머리 기호는 srcInline 이, 줄 가운데에 낀 ○ 는 여기서 가운뎃점으로 — 요약 줄에 원문 기호가 그대로 보이지 않게.
    var sub = e.sub ? (isBenefit ? srcInline(e.sub).replace(/\s*[○●◦]\s*/g, ' · ') : e.sub) : '';
    return '<div class="item"><button class="row" data-open="' + esc(e.id) + '" style="background:none;border:0">' +
      '<div class="row-main">' +
        '<div class="row-title">' + esc(e.title) + '</div>' +
        (sub ? '<div class="row-sub">' + esc(sub.slice(0, 90)) + '</div>' : '') +
        '<div class="row-meta"><span class="tag line">' + esc(e.kind) + '</span>' +
        (isBenefit ? '<span class="tag">' + esc(regionTagText(e.ref)) + '</span>' : '') +
        '<span class="tag">' + (opened ? '접기' : '자세히') + '</span></div>' +
      '</div></button>' +
      (opened ? searchDetail(e) : '') + '</div>';
  };
  var tier = function (e) {   // 0 내 지역 · 1 전국(및 혜택이 아닌 것) · 2 다른 지역
    if (e.kind !== '혜택' || !e.ref.region) return 1;
    if (regionMatchesMine(e.ref.region)) return 0;
    return profile.sido ? 2 : 1;
  };
  var withIdx = hits.map(function (e, i) { return { e: e, i: i, t: tier(e) }; });
  var main = withIdx.filter(function (x) { return x.t < 2; })
    .sort(function (a, b) { return a.t - b.t || a.i - b.i; });
  var other = withIdx.filter(function (x) { return x.t === 2; });
  var out = main.map(function (x) { return rowHtml(x.e); }).join('');
  /* 다른 시·도 파일을 다 받기 전에는 접힘(건수)을 그리지 않는다(plan 112) — 받은 것만 센 수는 틀린 수다
     (강남구에서 9건, 실제 36건). 그동안은 숫자 없는 '다른 지역 제도에서도 찾기' 단추(otherRegionsHtml)만 둔다. */
  if (other.length && regionsAllReady()) {
    var oo = !!open.search_other;
    out += '<div class="sec-head"><button class="count" data-open="search_other" aria-expanded="' + (oo ? 'true' : 'false') + '" style="min-height:44px">' +
      (oo ? '다른 지역 제도 접기' : '다른 지역 제도 ' + other.length + '건 보기') + '</button></div>';
    if (oo) out += other.map(function (x) { return rowHtml(x.e); }).join('');
  }
  return out;
}
function renderSearchResults() {
  var box = document.getElementById('searchResults');
  if (!box) { render(); return; }
  box.innerHTML = searchBodyHtml();
}

/* 밤새 열어 둔 화면 — 다시 볼 때 날짜가 바뀌었으면 오늘을 다시 잡는다.
   TODAY 는 로드 시 한 번 굳는데, 설치형 앱은 자정을 넘겨 살아 있는 일이 흔하다.
   소비처는 전부 호출 시점 참조(recompute 가 매 렌더 TODAY 를 넘긴다)라 재할당이면
   충분하다. 자정 타이머는 두지 않는다 — 백그라운드 탭에서 타이머는 스로틀되고,
   보이는 순간 갱신이면 충분하다. */
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  var t = new Date(); t.setHours(0, 0, 0, 0);
  if (t.getTime() !== TODAY.getTime()) { TODAY = t; render(); schedulePushAlerts(); }
});

/* Esc 로 덮개를 닫는다 — 시트·카드가 열리면 화면 전체를 덮는데 지금까지는 키보드로
   빠져나올 길이 없었다(43차 감사 E절). 온보딩이 끝나기 전에는 닫지 않는다: 역할·단계를
   고르지 않은 채로 나가면 그 값이 미입력인 채 화면 전체의 방향이 정해진다. */
/* 포커스 가두기 — 시트·카드는 화면 전체를 덮는 대화상자다(role=dialog). 그런데 Tab 은
   덮개 뒤의 탭바·본문으로 새어 나가, 키보드로 쓰는 사람은 보이지 않는 곳을 누르게 됐다
   (2026-09-10 리디자인 043). 열린 대화상자가 있으면 Tab 은 그 안에서만 돈다. */
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Tab') return;
  var box = openDialogEl();
  if (!box) return;
  var els = box.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
  if (!els.length) return;
  var first = els[0], last = els[els.length - 1], cur = document.activeElement;
  if (e.shiftKey && (cur === first || !box.contains(cur))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (cur === last || !box.contains(cur))) { e.preventDefault(); first.focus(); }
});

/* 합계 '어떻게 더했나요?' 의 열림 상태를 기억한다 — 칩·탭을 눌러 다시 그려도 접히지 않게.
   toggle 은 버블링하지 않아 캡처로 받는다. */
document.addEventListener('toggle', function (e) {
  var d = e.target;
  if (d && d.id === 'sumHow') fold.sumhow = !!d.open;
  if (d && d.id === 'abHow') fold.abhow = !!d.open;
  if (d && d.id === 'incHelper') fold.inchelp = !!d.open;
}, true);

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (cardState.open) { closeCard(); return; }
  if (sheetOpen === 'report') { closeReport(); return; }
  if (sheetOpen) {
    if (onboardingIncomplete()) return;
    saveProfile();
    sheetOpen = false;
    render();
  }
});

// 바깥으로 나가는 링크의 클릭만 센다 — 새 탭으로 열리므로 keepalive 로 보낸다.
document.addEventListener('click', function (e) {
  var a = e.target.closest ? e.target.closest('a[data-ev]') : null;
  if (!a) return;
  track(a.getAttribute('data-ev'), { id: a.getAttribute('data-ev-id'), layer: a.getAttribute('data-ev-layer') });
});
document.addEventListener('click', function (e) {
  // 조작 가능한 것을 한 곳에서 센다 — 여기에 이름을 빠뜨려서 버튼이 죽는 일이
  // 두 번 있었다. 새 data-* 를 만들면 이 배열에만 넣으면 된다.
  var t = e.target.closest(ACTIONS);
  if (!t) return;
  if (READONLY && roBlocked(t)) { transientNote('가족 보기에서는 체크하거나 고칠 수 없습니다'); return; }   // 읽기 전용 보기 — 고치거나 남기는 조작은 화면에서 숨겼고, 여기서 한 번 더 막는다
  if (t.id === 'themeBtn') { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(theme); render(); return; }
  // 짧은 첫 실행 시트는 한 번뿐이다. 사용자가 스스로 '내 정보'를 다시 열었다면
  // 그때는 설정 화면을 원하는 것이므로 전체를 보여준다.
  if (t.id === 'meBtn') { sheetOpen = 'me'; sheetExpanded = true; render(); return; }
  if (t.id === 'searchBtn') { sheetOpen = 'search'; render(); focusSearch(); return; }

  if (t.hasAttribute('data-chip') || t.hasAttribute('data-who')) {
    // 칩·세그먼트를 바꿔도 자리를 지킨다 — 접기와 같은 이유(전체 재렌더가 스크롤을 0으로 되돌린다).
    if (t.hasAttribute('data-who')) whoView = t.getAttribute('data-who');
    else { var cv = t.getAttribute('data-chip'); if (tab === 'money') moneyChip = cv; else prepChip = cv; }
    var scC = document.querySelector('.scroll'); var yC = scC ? scC.scrollTop : 0;
    render();
    var scC2 = document.querySelector('.scroll'); if (scC2) scC2.scrollTop = yC;
    return;
  }
  if (t.hasAttribute('data-view')) {
    // 가족 읽기 전용 링크 — 만들기(내 정보 '함께' 카드)와 받은 쪽의 띠 단추(plan 072)
    var vw = t.getAttribute('data-view');
    if (vw === 'start' || vw === 'dismiss-bad') {
      // 해시를 지우고 보통 화면으로 — 저장된 내 프로필이 있으면 그것이, 없으면 첫 실행 질문이 나온다.
      try { history.replaceState(null, '', location.pathname + location.search); } catch (err) {}
      location.reload();
      return;
    }
    if (vw === 'open') viewLinkOpen = true;
    else if (vw === 'close') viewLinkOpen = false;
    else if (vw === 'copy') {
      var vEl = document.getElementById('viewLinkText');
      var vTxt = vEl ? vEl.textContent : '';
      var vOk = function () { t.textContent = '복사했습니다'; setTimeout(function () { if (t && t.isConnected) t.textContent = '링크 복사'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(vTxt).then(vOk, function () { selectText(vEl); });
      else selectText(vEl);
      return;
    }
    var sbV = document.querySelector('.sheet-body'); var syV = sbV ? sbV.scrollTop : 0;
    render();
    var sbV2 = document.querySelector('.sheet-body'); if (sbV2) sbV2.scrollTop = syV;
    return;
  }
  if (t.hasAttribute('data-recv')) {
    // 받은 금액 적기 — 신청 완료 행 아래(plan 072). 열기·저장·취소·지우기. 자리를 지킨다.
    var rv = t.getAttribute('data-recv'), rvId = t.dataset.recvId;   // data-recv-id 는 값을 실어 나르는 칸이라 이벤트 목록에 넣지 않는다
    if (rv === 'open') { recvOpenId = rvId; recvErr = null; recvDraft = null; }
    else if (rv === 'cancel') { recvOpenId = null; recvErr = null; recvDraft = null; }
    else if (rv === 'save') recvSave(rvId);
    else if (rv === 'clear') recvClear(rvId);
    var scR = document.querySelector('.scroll'); var yR = scR ? scR.scrollTop : 0;
    render();
    var scR2 = document.querySelector('.scroll'); if (scR2) scR2.scrollTop = yR;
    if (rv === 'open' || (rv === 'save' && recvErr)) refocusById('recv_won');
    return;
  }
  if (t.hasAttribute('data-report')) { openReport(t.getAttribute('data-report')); return; }   // 제도 정보 오류 알리기(plan 106)
  if (t.hasAttribute('data-rpsend')) { sendReport(); return; }
  if (t.hasAttribute('data-share')) { shareSummary(); return; }
  if (t.hasAttribute('data-sharecard')) { openCard(t.getAttribute('data-sharecard')); return; }
  if (t.hasAttribute('data-cardshare')) { shareCard(); return; }
  if (t.hasAttribute('data-cardsave')) { saveCard(); return; }
  if (t.hasAttribute('data-cardclose')) { closeCard(); return; }
  if (t.hasAttribute('data-backup')) {
    var ba = t.getAttribute('data-backup');
    if (ba === 'export') backupExport();
    else if (ba === 'pick') { var bfEl = document.getElementById('backupFile'); if (bfEl) bfEl.click(); }
    else if (ba === 'apply') backupApply();
    else if (ba === 'cancel') { backupPending = null; backupMsg = null; render(); }
    return;
  }
  if (t.hasAttribute('data-closesheet')) {
    // 닫는 방법을 값으로 적는다. 예전에는 '시트 안이면 무시하되 iconbtn 은 예외'로
    // 걸러서, 나중에 추가한 '이대로 시작하기' 버튼이 아무 일도 하지 않았다 —
    // 첫 실행의 주 버튼이 조용히 죽어 있었다. 이제 배경만 시트 밖을 확인한다.
    if (t.getAttribute('data-closesheet') === 'backdrop' && e.target.closest('.sheet')) return;
    // 오류 알리기 시트는 프로필을 고치지 않는다 — 저장 없이 연 자리(내 정보 시트 또는 본문)로 돌아간다.
    if (sheetOpen === 'report') { closeReport(); return; }
    // conditions — 첫 실행 카드를 끝냄. 단계·역할·시·도(광역)까지만.
    if (t.getAttribute('data-closesheet') === 'done') track('conditions', { stage: profile.stage, role: profile.role, sido: profile.sido }, true);
    saveProfile();
    sheetOpen = false; render(); return;
  }
  if (t.hasAttribute('data-sync')) {
    var sa = t.getAttribute('data-sync');
    if (sa === 'login') { svLogin(); return; }
    if (sa === 'logout') { svLogout(); render(); return; }
    if (sa === 'invite') { svInvite(); return; }
    if (sa === 'join') {
      var svi = document.getElementById('svCodeInput');
      svJoin(svi ? svi.value.trim().toUpperCase() : '');
      return;
    }
    if (sa === 'refresh') {
      sync.msg = '동기화 중…'; sync.err = null; render();
      // loadCouple 은 커플 성립 여부부터 다시 본다 — 상대가 방금 들어온 경우를 잡는다.
      loadCouple().then(function () { sync.msg = null; render(); });
      return;
    }
    if (sa === 'copy') {
      var ce = document.getElementById('svCode');
      var ct = ce ? ce.textContent : '';
      var cok = function () { t.textContent = '복사했습니다'; setTimeout(function () { if (t && t.isConnected) t.textContent = '코드 복사'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ct).then(cok, function () { selectText(ce); });
      else selectText(ce);
      return;
    }
    if (sa === 'push-on') { pushSubscribe(); return; }
    if (sa === 'push-off') { pushUnsubscribe(); return; }
    if (sa === 'push-test') { pushTest(); return; }
    if (sa === 'leave') { sync.confirm = 'leave'; render(); return; }
    if (sa === 'delete') { sync.confirm = 'delete'; render(); return; }
    if (sa === 'confirm-off') { sync.confirm = null; render(); return; }
    if (sa === 'leave-yes') { svLeave(); return; }
    if (sa === 'delete-yes') { svDelete(); return; }
    sync.mode = sa === 'off' ? null : sa;   /* 'enter' */
    sync.err = null;
    render();
    return;
  }
  if (t.hasAttribute('data-region-hint')) {
    // 지역 힌트 반영 — 사용자가 눌렀을 때만 프로필에 들어간다(F08).
    if (URL_REGION && profile.sido == null && SIDO.indexOf(URL_REGION.sido) >= 0) {
      profile.sido = URL_REGION.sido;
      var sgsH = (SIGUNGU.bySido && SIGUNGU.bySido[URL_REGION.sido]) || [];
      profile.sigungu = URL_REGION.sigungu && sgsH.indexOf(URL_REGION.sigungu) >= 0 ? URL_REGION.sigungu : null;
      saveProfile();
    }
    render(); return;
  }
  if (t.hasAttribute('data-shared')) {
    // 상대가 고친 공유 정보 — 반영은 사용자가 고른다. 어느 쪽이든 그 판은 본 것으로 표시한다.
    var spx = sync.sharedPending;
    if (spx) {
      // 확인 화면에 보인 차이(spx.changes)만 반영한다 — 원본(spx.data)을 넣으면 화면에 없던 role 까지 바뀌었다(plan 108-B).
      if (t.getAttribute('data-shared') === 'apply') applySharedDiff(spx.changes);
      if (spx.updatedAt) store('yebu.sharedSeen', spx.updatedAt);
      sync.sharedPending = null;
    }
    render(); return;
  }
  if (t.hasAttribute('data-health')) {
    // 연결된 배우자가 없으면 공유할 상대가 없다 — 설정을 바꾸지 않고 안내만 한다(plan 086-18).
    if (t.getAttribute('data-health') === 'on' && !sync.partnerLinked) { transientNote('배우자와 연결하면 이 설정이 적용됩니다'); return; }
    // saveProfile 이 커플 연결 시 pushShared 를 부른다 — 끄면 그때 서버 값이 지워진다.
    profile.healthShareConsent = t.getAttribute('data-health') === 'on';
    saveProfile();
    render();
    return;
  }
  if (t.hasAttribute('data-invite')) {
    var mode = t.getAttribute('data-invite');
    if (mode === 'copy') {
      var el = document.getElementById('inviteCode');
      var txt = el ? el.textContent : '';
      var ok = function () { t.textContent = '복사했습니다'; setTimeout(function () { if (t) t.textContent = '코드 복사'; }, 1600); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok, function () { selectText(el); });
      } else selectText(el);
      return;
    }
    if (mode === 'apply') {
      var input = document.getElementById('inviteInput');
      var r = readInviteCode(input ? input.value : '');
      if (r.error) { inviteError = r.error; render(); return; }
      applyInvite(r.data);
      inviteMode = null; inviteError = null;
      render();
      return;
    }
    inviteMode = mode === 'off' ? null : mode;
    inviteError = null;
    render();
    return;
  }
  if (t.hasAttribute('data-copysteps')) {
    var cid = t.getAttribute('data-copysteps');
    var item = CHECKITEMS.filter(function (x) { return x.id === cid; })[0];
    if (item) {
      var lines = [item.name];
      var lastGroup = null;
      (item.steps || []).forEach(function (st) {
        if (isDone(cid + '/' + st.id)) return;      // 이미 챙긴 것은 뺀다
        if (st.group && st.group !== lastGroup) { lines.push('[' + st.group + ']'); lastGroup = st.group; }
        lines.push('- ' + st.text + (st.where ? ' (' + st.where + ')' : ''));
      });
      var text = lines.join('\n');
      var mark = function (ok) {
        t.textContent = ok ? '복사했습니다' : '길게 눌러 복사하세요';
        transientNote(ok ? '복사했습니다' : '길게 눌러 복사하세요');   // 버튼이 다시 그려져도 알림은 남는다(plan 086-18)
        setTimeout(function () { if (t && t.isConnected) t.textContent = '남은 것 복사'; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { mark(true); }, function () { mark(false); });
      } else mark(false);
    }
    return;
  }
  if (t.hasAttribute('data-goods')) {
    var gv = t.getAttribute('data-goods');
    if (gv === 'open') { fold.life_goods = true; go('life'); return; }
    if (gv.indexOf('have:') === 0) {
      goodsToggle(gv.slice(5));
      var scg = document.querySelector('.scroll'); var yg = scg ? scg.scrollTop : 0;
      render();
      var scg1 = document.querySelector('.scroll'); if (scg1) scg1.scrollTop = yg;
    }
    return;
  }
  if (t.hasAttribute('data-editme')) {
    // 혜택 탭 맨 위 '고치기' — 내 정보 시트를 기본 항목(지역·역할·단계·날짜·자녀·아기 수)이 펼쳐진 채로 연다.
    fold.me_basic = true; sheetOpen = 'me'; sheetExpanded = true; render(); return;
  }
  if (t.hasAttribute('data-fold')) {
    var g = t.getAttribute('data-fold'); fold[g] = !fold[g];
    var sc0 = document.querySelector('.scroll'); var y0 = sc0 ? sc0.scrollTop : 0;
    render();
    var sc1 = document.querySelector('.scroll'); if (sc1) sc1.scrollTop = y0;
    return;
  }
  if (t.hasAttribute('data-tab')) { go(t.getAttribute('data-tab')); return; }
  if (t.hasAttribute('data-sheet')) {
    sheetOpen = t.getAttribute('data-sheet');
    // 항목이 '내 정보에서 입력합니다'로 보낸 것이므로 짧은 시트로 받으면 안 된다.
    if (sheetOpen === 'me') sheetExpanded = true;
    // 어떤 칸을 고치러 온 버튼이면(data-focus) 기본 항목을 펼친 채 열고 그 칸에 초점을 둔다(plan 086-14).
    var focusName = sheetOpen === 'me' ? t.getAttribute('data-focus') : null;
    if (focusName) fold.me_basic = true;
    render();
    if (focusName) {
      var focusEl = document.getElementById('f_' + focusName);
      if (focusEl) { try { focusEl.focus(); if (focusEl.scrollIntoView) focusEl.scrollIntoView({ block: 'center' }); } catch (err) {} }
    }
    if (sheetOpen === 'search') focusSearch();   // 알아보기 탭의 검색 바로 열었을 때
    return;
  }
  if (t.hasAttribute('data-iosclose')) { store('yebu.iosbanner', 'off'); render(); return; }
  if (t.hasAttribute('data-freshseen')) { store('yebu.lastPeriod', periodMark()); render(); return; }
  if (t.hasAttribute('data-install')) {
    var ev = installEvent;
    installEvent = null;               // 한 번 쓴 이벤트는 다시 쓸 수 없다
    if (ev && ev.prompt) ev.prompt();
    render();
    return;
  }
  if (t.hasAttribute('data-ask')) {
    // 인라인 질문 — 항목 상세 안에서 판단에 막힌 프로필 값을 그 자리에서 받는다.
    // 값은 JSON 으로 실어 보낸다: 불리언과 문자열을 한 통로로 다루기 위해서다.
    try { profile[t.getAttribute('data-ask')] = JSON.parse(t.getAttribute('data-val')); } catch (err) { return; }
    saveProfile();
    var scA = document.querySelector('.scroll'); var yA = scA ? scA.scrollTop : 0;
    render();
    var scB = document.querySelector('.scroll'); if (scB) scB.scrollTop = yA;
    return;
  }
  if (t.hasAttribute('data-done')) { toggleDone(t.getAttribute('data-done')); return; }
  if (t.hasAttribute('data-reload')) { location.reload(); return; }
  if (t.hasAttribute('data-vote')) {   // 지불 의사 한 줄 설문 — 답의 종류만, 기기당 한 번
    var vv = t.getAttribute('data-vote');
    if (vv === 'pay' || vv === 'free') { store('yebu.valuevote', vv); track('value-vote', { code: vv }, true); voteThanks = true; render(); }
    return;
  }
  if (t.hasAttribute('data-wipe')) {   // 이 기기의 기록 지우기(B-3) — 두 번 눌러야 지운다
    var wv = t.getAttribute('data-wipe');
    if (wv === 'yes') { wipeDevice(); return; }
    wipeAsk = wv === 'ask'; render(); return;
  }   // 그리기 실패 안내의 다시 불러오기(G-1)
  // 우리 동네 제도 다시 불러오기 · 검색 '다른 지역에서도 찾기' (plan 112)
  if (t.hasAttribute('data-rdretry')) { retryRegion(); return; }
  if (t.hasAttribute('data-rdall')) { loadOtherRegions(); renderSearchResults(); return; }
  if (t.hasAttribute('data-open')) {
    var k = t.getAttribute('data-open'); open[k] = !open[k];
    if (open[k]) {   // goods-open — 서랍(g_)과 검색 결과(s_g_) 둘 다
      if (k.indexOf('g_') === 0) track('goods-open', { id: k.slice(2) });
      else if (k.indexOf('s_g_') === 0) track('goods-open', { id: k.slice(4) });
    }
    if (sheetOpen === 'search') {
      var sb = document.querySelector('.sheet-body'); var sy = sb ? sb.scrollTop : 0;
      render();
      var sb2 = document.querySelector('.sheet-body'); if (sb2) sb2.scrollTop = sy;
      return;
    }
    var sc = document.querySelector('.scroll'); var y = sc ? sc.scrollTop : 0;
    render();
    var sc2 = document.querySelector('.scroll'); if (sc2) sc2.scrollTop = y;
    return;
  }
  if (t.hasAttribute('data-onb')) {
    onbStep += t.getAttribute('data-onb') === 'next' ? 1 : -1;
    onbStep = Math.max(0, Math.min(onbStep, onbSteps().length - 1));
    render(); return;
  }
  if (t.hasAttribute('data-tri')) {
    var tf = t.getAttribute('data-tri'), tv = t.getAttribute('data-val');
    profile[tf] = tv === '' ? null : tv === 'true';
    // 부모 중 장애인이 있다면 '산모 본인인지'는 따로 물어야 한다(금액이 다르다).
    // 아니라고 답했으면 산모도 아닌 것이 확정이고, 모른다면 산모도 모르는 것이다.
    if (tf === 'isDisabledParent') {
      profile.isDisabledMother = profile[tf] === false ? false : null;
    }
    // 시트 안에서 눌렀으면 읽던 자리를 지킨다 — 7장은 한 화면보다 길어, 다시 그리면 맨 위로 돌아갔다.
    var sbT = document.querySelector('.sheet-body'); var syT = sbT ? sbT.scrollTop : 0;
    saveProfile(); render();
    var sbT2 = document.querySelector('.sheet-body'); if (sbT2) sbT2.scrollTop = syT;
    return;
  }
  if (t.hasAttribute('data-set') && t.tagName === 'BUTTON') {
    profile[t.getAttribute('data-set')] = t.getAttribute('data-val');
    saveProfile(); render(); return;
  }
});

/* 재렌더 뒤 같은 입력으로 초점을 되돌린다 — 질문에 답한 뒤 그 질문이 사라졌으면(제자리를 찾아 접힘) 아무것도 하지 않는다. */
function refocusById(id) {
  if (!id) return;
  var el = document.getElementById(id);
  if (el) { try { el.focus({ preventScroll: true }); } catch (e) {} }
}
function focusSearch() {
  var el = document.getElementById('searchInput');
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

document.addEventListener('input', function (e) {
  var el = e.target.closest('#searchInput');
  if (!el) return;
  searchQuery = el.value;
  renderSearchResults();   // 입력창은 그대로 두고 결과만 — 포커스·커서·IME 조합이 끊기지 않는다
});

/* 누르던 버튼을 재렌더가 갈아 끼우면 click 이 사라진다 (2026-09-23 감사 E-1).
   숫자·글자 칸의 change 는 blur 때, 곧 다른 버튼을 누르는 도중에 온다. 그 자리에서 render() 하면
   mousedown 과 mouseup 이 서로 다른 DOM 에 떨어져 click 이 나지 않았다 — 온보딩 '다음'·
   '이대로 시작하기'의 첫 탭이 무시됐다(헤드리스 크롬 click·tap 둘 다 재현).
   그래서 값은 곧바로 저장하고 그리기만 미룬다: 포인터가 눌려 있으면 뗀 뒤 한 틱, 아니면 한 틱.
   그 사이 버튼 처리기가 저장된 값으로 먼저 그리면 미룬 그리기는 건너뛴다.
   초점 되돌리기(F05)는 키보드로 칸을 떠났을 때만 한다 — 다른 곳을 누른 사람의 초점을 뺏지 않는다. */
var ptrDown = false, lastInputPointer = false, deferredChange = null;
document.addEventListener('pointerdown', function () { ptrDown = true; lastInputPointer = true; }, true);
document.addEventListener('keydown', function () { lastInputPointer = false; }, true);
function releasePointer() { ptrDown = false; if (deferredChange) setTimeout(flushDeferredChange, 0); }
document.addEventListener('pointerup', releasePointer, true);
document.addEventListener('pointercancel', releasePointer, true);
function deferChangeRender(scrollSel, refocus) {
  deferredChange = { seq: renderSeq, scrollSel: scrollSel, refocus: lastInputPointer ? null : refocus };
  if (!ptrDown) setTimeout(flushDeferredChange, 0);
}
function flushDeferredChange() {
  var d = deferredChange; deferredChange = null;
  if (!d || d.seq !== renderSeq) return;   // 그 사이 버튼 처리기가 새 값으로 이미 그렸다
  var sc = document.querySelector(d.scrollSel); var y = sc ? sc.scrollTop : 0;
  render();
  var sc2 = document.querySelector(d.scrollSel); if (sc2) sc2.scrollTop = y;
  if (d.refocus) d.refocus();
}
function refocusSheetField(f) {
  var againF = document.querySelector('.sheet [data-set="' + f + '"]');
  if (againF && againF.tagName !== 'BUTTON') { try { againF.focus({ preventScroll: true }); } catch (e) {} }
}

document.addEventListener('change', function (e) {
  if (READONLY) return;   // 읽기 전용 보기 — 입력으로 프로필을 고치지 않는다(plan 072)
  var bf = e.target.closest('#backupFile');
  if (bf) {
    var file = bf.files && bf.files[0];
    bf.value = '';
    if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      var parsed = null;
      try { parsed = JSON.parse(String(rd.result)); } catch (err) {}
      var r = parsed ? APPLOGIC.importBackup(parsed) : { error: '파일을 읽지 못했습니다.' };
      if (r.error) { backupMsg = r.error; backupPending = null; }
      else { backupPending = r; backupMsg = null; }
      render();
    };
    // 읽기 실패도 알린다 — onerror 가 없으면 아무 말 없이 멈춘 것처럼 보였다(A-3).
    rd.onerror = function () { backupMsg = '파일을 읽지 못했습니다.'; backupPending = null; render(); };
    rd.readAsText(file);
    return;
  }
  var aTxt = e.target.closest('[data-asktext]');
  if (aTxt) {
    // 인라인 날짜·월 질문 — 값을 그대로 저장한다(빈 값은 미입력).
    profile[aTxt.getAttribute('data-asktext')] = aTxt.value === '' ? null : aTxt.value;
    saveProfile();
    var fidT = aTxt.id;
    deferChangeRender('.scroll', function () { refocusById(fidT); });
    return;
  }
  var a = e.target.closest('[data-asknum]');
  if (a) {
    // 인라인 숫자 질문 — 배율은 질문이 정한다(소득은 만원 단위, 생일은 그대로).
    var sc = Number(a.getAttribute('data-askscale')) || 1;
    var nv = a.value === '' ? null : Number(a.value) * sc;
    profile[a.getAttribute('data-asknum')] = nv;
    saveProfile();
    var fidN = a.id;
    deferChangeRender('.scroll', function () { refocusById(fidN); });
    return;
  }
  var t = e.target.closest('[data-set]');
  if (!t || t.tagName === 'BUTTON') return;
  var f = t.getAttribute('data-set'), v = t.value;
  if (t.type === 'number') v = v === '' ? null : Number(v);
  if (f === 'incomeBracket' && v === '') v = null;
  if (f === 'sigungu' && v === '') v = null;
  if (f === 'sido' && v === '') v = null;
  profile[f] = v;
  if (f === 'sido') profile.sigungu = null;
  saveProfile();
  // 입력 뒤 전체 재렌더가 초점을 문서로 돌려보냈다(외부감사 F05) — 같은 칸으로 되돌리고 시트 스크롤도 지킨다.
  // 입력칸은 그리기를 미룬다(E-1). select 는 고르는 순간 change 가 오므로 바로 그린다.
  if (t.tagName === 'INPUT') { deferChangeRender('.sheet-body', function () { refocusSheetField(f); }); return; }
  var sbF = document.querySelector('.sheet-body'); var syF = sbF ? sbF.scrollTop : 0;
  render();
  var sbF2 = document.querySelector('.sheet-body'); if (sbF2) sbF2.scrollTop = syF;
  refocusSheetField(f);
});

// 읽기 전용 보기에서는 로그인·동기화·알림을 아예 켜지 않는다 — 보고 있는 프로필은 남의 것이라 내 계정으로 올라가면 안 된다(plan 072).
if (!READONLY) initSync();   // 호스팅 빌드에서만 켜진다 — 라이브러리가 없으면 조용히 통과
render();
</script>
