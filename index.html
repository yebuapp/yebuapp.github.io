// 자격 판정
// ---------------------------------------------------------------------------

/* ── 연령 조건 ──────────────────────────────────────────────────────────
   나이는 '몇 살인가'만으로 판정할 수 없다. '언제 기준으로 몇 살인가'가 제도의
   일부다. 지금 데이터에 있는 세 제도가 이미 서로 다른 시점을 쓴다:

   · 청소년 한부모(24세 이하) — 급여 산정월 기준. 지침이 "25세가 되는 생일이
     도래하는 달의 전 달까지"라고 못박아, 시간이 지나면 답이 바뀐다.
   · 청소년 산모 의료비(만 19세 이하) — "임신확인서상 임신확인일" 기준.
     지나간 시점이라 한 번 정해지면 바뀌지 않는다.
   · 성주군 풍진(20세 이상) — 기준 시점이 원문에 없다. 하한 조건이라 어느
     시점으로 재도 한 번 넘으면 계속 넘는다.

   그래서 하나의 boolean 으로는 어느 값을 넣어도 최소 하나가 틀렸다(20~24세).
   대신 생년월을 받아 시점별로 계산한다. 날짜(일)는 받지 않는다 — 한부모
   규칙이 월 단위라 월이면 정확히 충분하고, 그만큼 덜 묻는 편이 낫다.
   일을 모르니 만 나이는 두 값 중 하나가 되는데, 두 값의 판정이 갈리면
   확정하지 않고 unknown 으로 둔다(경계에 선 사람에게 지어내지 않는다). */
function ymToParts(ym) {
  const m = /^(\d{4})-(\d{2})$/.exec(String(ym ?? ''));
  if (!m) return null;
  const y = +m[1], mo = +m[2];
  return mo >= 1 && mo <= 12 ? { y, mo } : null;
}
/**
 * 생년월(+ 알면 일)과 기준일로 만 나이를 낸다.
 * 일을 모르면 그 달에는 만 나이가 두 값 중 하나라 범위로 돌려준다.
 */
function ageRangeAt(birthYm, birthDay, at) {
  const b = ymToParts(birthYm);
  if (!b || !(at instanceof Date) || isNaN(at)) return null;
  const y = at.getFullYear(), mo = at.getMonth() + 1, d = at.getDate();
  let n = y - b.y;
  if (mo < b.mo) return { min: n - 1, max: n - 1 };   // 생월이 아직 안 왔다
  if (mo > b.mo) return { min: n, max: n };           // 생월이 지났다
  // 생월 당일 달 — 일을 알면 확정되고, 모르면 두 값 사이다.
  if (typeof birthDay === 'number' && birthDay >= 1 && birthDay <= 31) {
    return d >= birthDay ? { min: n, max: n } : { min: n - 1, max: n - 1 };
  }
  return { min: n - 1, max: n };
}

/**
 * 어느 생년월을 볼 것인가. subject 가 대상을 정한다.
 * - 'mother'    산모의 나이 (사용자가 아빠여도 산모 기준 제도가 있다)
 * - 'applicant' 신청인 본인의 나이 (한부모처럼 '모 또는 부'가 대상인 제도)
 */
function ageSourceFields(rule, p) {
  if (rule.subject === 'applicant' && p.role === 'partner') {
    return { ym: 'applicantBirthYearMonth', day: null };
  }
  /* '신청인 본인'이 대상인데 그 본인이 누구인지 모르면 산모 쪽으로 넘어가서는 안 된다.
     역할이 비면 아빠인 사용자에게 산모의 생년월로 한부모 연령을 판정하게 된다.
     필드 이름을 주지 않으면 checkRequirement 가 값 없음으로 보고 'unknown' 을
     돌려준다 — 모르는 것을 모른다고 두는 쪽이 맞다(CLAUDE.md 규칙 1). */
  if (rule.subject === 'applicant' && p.role == null) {
    return { ym: null, day: null };
  }
  return { ym: 'motherBirthYearMonth', day: 'motherBirthDay' };
}

const AGE_OPS = { lte: (a, n) => a <= n, gte: (a, n) => a >= n, lt: (a, n) => a < n, gt: (a, n) => a > n };

/**
 * 연령 조건을 판정한다. 기준 시점(asOf)이 제도의 일부이고, 시점마다 계산이 다르다.
 *
 * · 'birthdayMonthExpiry' — "N+1세가 되는 생일이 속한 달부터 만료". 한부모가족지원
 *   지침이 월 단위로 자르므로 생일이 그 달 며칠인지는 판정에 영향이 없다.
 *   그래서 일(day)을 묻지 않아도 확정된다 — 안 물어도 되는 것은 묻지 않는다.
 * · 'pregnancyConfirmation' — 임신확인일 시점의 만 나이. 지나간 시점이라 답이 바뀌지 않는다.
 * · 'applicationDate' — 신청일(= 오늘) 시점의 만 나이. 날이 지나면 답이 바뀐다.
 * · 'unknown' — 공식 원문이 기준 시점을 밝히지 않았다. 나이로 가르지 않는다.
 *
 *   41.4 는 여기서 '오늘 앞뒤 1년'이라는 폭을 만들어 그 안에서 답이 같으면
 *   확정했다. 폐기한다. 그 1년은 어떤 공식 자료에서도 나오지 않는 숫자였다.
 *   41.5 전수 조사에서:
 *   · 성주군보건소는 형제 사업 열 곳에 전부 기한을 쓰는데 풍진에만 쓰지 않았다.
 *     상한을 산출할 문구가 아예 없다("상시신청" 네 글자뿐, 영수증 인정기간 없음).
 *   · 같은 보건소가 다른 사업에서 실제로 쓰는 기준은 "연 나이 — 분만 예정연도
 *     빼기 출생 연도"다. 연 나이는 '어느 날짜냐'가 아니라 계산 방식 자체가
 *     다르므로, 날짜를 앞뒤로 밀어 보는 방식으로는 애초에 재현되지 않는다.
 *   · 보령시는 '20~49세'가 보령시 자신의 안내 어디에도 없고 정부24 에만 있다.
 *
 *   그리고 방향이 반대였다: 폭을 좁게 잡을수록 "폭 전체에서 답이 같은 사람"이
 *   늘어 확정이 많아진다. 안전 마진이 아니라 조용한 오판정을 만드는 장치였다.
 *   모르는 것에서 유한한 상한을 끌어낼 수는 없다.
 */
function checkAgeRule(rule, p) {
  // 기준 시점을 모르는 조건은 계산하지 않는다.
  // 확인되지 않은 시간 범위로 pass/fail 을 만들어 내지 않는다.
  if (rule.asOf === 'unknown') return 'unknown';
  const op = AGE_OPS[rule.op];
  if (!op || typeof rule.age !== 'number') return 'unknown';
  const src = ageSourceFields(rule, p);
  const ym = p[src.ym];

  if (rule.asOf === 'birthdayMonthExpiry') {
    // lte N 전용 — "N+1세 생일이 속한 달"부터 만료된다.
    if (rule.op !== 'lte') return 'unknown';
    const b = ymToParts(ym);
    if (!b || !(p.__today instanceof Date)) return 'unknown';
    const expY = b.y + rule.age + 1, expM = b.mo;      // 만료가 시작되는 연·월
    const y = p.__today.getFullYear(), mo = p.__today.getMonth() + 1;
    const beforeExpiry = y < expY || (y === expY && mo < expM);
    return beforeExpiry ? 'pass' : 'fail';
  }

  // · 'calendarYear' — 연 나이(올해 연도 − 출생 연도). 생일·날짜와 무관하게 해로만 센다.
  //   오산시 기형아 검사비 "검사일 기준 연 나이 35세 이상으로 1991년생 이상"(정부24, 2026-10-15).
  if (rule.asOf === 'calendarYear') {
    const b = ymToParts(ym);
    if (!b || !(p.__today instanceof Date)) return 'unknown';
    const a0 = p.__today.getFullYear() - b.y;
    // 원문은 '검사일·신청일의 해'를 본다 — 그 일이 올해일지 내년일지 모른다. 두 해의 답이 같을 때만 확정한다(plan 060).
    const r0 = op(a0, rule.age), r1 = op(a0 + 1, rule.age);
    return r0 === r1 ? (r0 ? 'pass' : 'fail') : 'unknown';
  }

  const at = rule.asOf === 'pregnancyConfirmation' ? toDate(p.pregnancyConfirmedOn)
    : rule.asOf === 'applicationDate' ? p.__today
      : null;
  if (!at) return 'unknown';
  const range = ageRangeAt(ym, src.day ? p[src.day] : null, at);
  if (!range) return 'unknown';
  const lo = op(range.min, rule.age), hi = op(range.max, rule.age);
  return lo === hi ? (lo ? 'pass' : 'fail') : 'unknown';
}

/**
 * 연령 조건이 판단 불가일 때, 사용자가 답해서 풀 수 있는 것을 짚는다.
 * 풀 수 없는 것(기준 시점 미확인, 우리가 받지 않는 사람의 나이)은 빈 배열을 돌려
 * '저희가 확인하지 못한 것'으로 분류되게 둔다 — 답할 수 없는 질문을 만들지 않는다.
 */
function missingOfAgeRule(rule, p) {
  // 기준 시점을 모르는 조건은 사용자가 무엇을 답해도 풀리지 않는다.
  // 생년월을 받아도, 생일을 며칠까지 받아도 마찬가지다 — 모자란 것은
  // 사용자의 정보가 아니라 공식 안내다. 답할 수 없는 질문을 만들지 않는다.
  if (rule.asOf === 'unknown') return [];
  const src = ageSourceFields(rule, p);
  // 누구의 나이인지조차 정해지지 않았으면(역할 미입력) 물어볼 필드가 없다.
  // 여기서 null 을 밀어 넣으면 화면이 이름 없는 질문을 만든다.
  if (src.ym == null) return [];
  const need = [];
  if (p[src.ym] == null || p[src.ym] === '') need.push(src.ym);
  if (rule.asOf === 'pregnancyConfirmation' &&
      (p.pregnancyConfirmedOn == null || p.pregnancyConfirmedOn === '')) {
    need.push('pregnancyConfirmedOn');
  }
  if (need.length) return need;
  if (rule.asOf === 'calendarYear') return [];   // 해로만 세므로 생일 날짜를 물어도 풀리지 않는다(plan 060)
  // 필요한 값이 다 있는데도 판단이 갈린다면 생월이 걸린 것이다 — 그 달의 며칠인지만
  // 더 받으면 확정된다. 평소에는 묻지 않고 이때만 묻는다.
  if (src.day && checkAgeRule(rule, p) === 'unknown' && p[src.day] == null) return [src.day];
  return [];
}

// 체크포인트 층도 이 판정기를 쓴다(checkpointsFor 의 4번째 인자) — 대상 조건의
// 진실은 한 곳이어야 한다.
function checkRequirement(req, p) {
  // OR 조건. 하나라도 통과하면 pass, 판단 불가가 섞이면 unknown.
  if (req.anyOf) {
    const rs = req.anyOf.map((r) => checkRequirement(r, p));
    if (rs.includes('pass')) return 'pass';
    if (rs.includes('unknown')) return 'unknown';
    return 'fail';
  }
  // AND 조건. OR 안에 여러 조건이 함께 걸리는 갈래를 위해 쓴다 — 사전건강관리처럼
  // "20~49세" 또는 "15~19세이면서 부부"로 갈리는 제도가 그렇다.
  if (req.allOf) {
    const rs = req.allOf.map((r) => checkRequirement(r, p));
    if (rs.includes('fail')) return 'fail';   // 하나만 어긋나도 그 갈래는 끝난다
    if (rs.includes('unknown')) return 'unknown';
    return 'pass';
  }
  // 창구 확인 — 원문이 대상을 앱이 받지 않는 사실(기초수급·다문화·직업 등)로 가른다.
  // 묻지도 판정하지도 않는다. 모르는 것을 '해당'으로도 '해당 없음'으로도 바꾸지 않는다(2026-10-15).
  if (typeof req.officeCheck === 'string') return 'unknown';
  if (req.ageRule) return checkAgeRule(req.ageRule, p);
  const v = p[req.field];
  if (v === null || v === undefined) return 'unknown';
  if (req.in) return req.in.includes(v) ? 'pass' : 'fail';
  if (req.eq !== undefined) return v === req.eq ? 'pass' : 'fail';
  if (req.gte !== undefined) return v >= req.gte ? 'pass' : 'fail';
  if (req.lte !== undefined) return v <= req.lte ? 'pass' : 'fail';
  return 'unknown';
}


/**
 * '판단 불가'를 만든 미입력 프로필 필드를 찾는다.
 * 파생 필드(childAgeMonths 등)는 사용자가 실제로 입력하는 원천 필드로 되돌려
 * 묻는다 — "childAgeMonths 를 입력하세요"는 질문이 아니다.
 */
const ASK_SOURCE = {
  childAgeMonths: ['birthDate'],
  weeks: ['dueDate'],
  newbornLoanIncomeOk: ['householdIncomeAnnual', 'dualIncome'],
  householdIncomeMax: ['householdIncomeAnnual'],
  birthOrder: ['childrenBefore'],
  childrenAfterBirth: ['childrenBefore', 'fetusCount'],
};

function missingOf(req, p) {
  if (req.anyOf) {
    return req.anyOf.flatMap((r) =>
      checkRequirement(r, p) === 'unknown' ? missingOf(r, p) : []
    );
  }
  if (req.allOf) {
    // AND 갈래는 순차 관문이다 — 앞의 것을 모르는 채로 뒤의 것까지 묻지 않는다.
    // (나이도 모르는 사람에게 혼인 여부부터 함께 묻는 화면이 되면 안 된다)
    for (const r of req.allOf) {
      if (checkRequirement(r, p) !== 'unknown') continue;
      const m = missingOf(r, p);
      if (m.length) return m;   // 창구 확인처럼 물을 것이 없는 갈래는 건너뛰고 다음 관문을 본다(plan 060)
    }
    return [];
  }
  if (typeof req.officeCheck === 'string') return [];   // 답할 수 없는 질문을 만들지 않는다
  if (req.ageRule) return missingOfAgeRule(req.ageRule, p);
  const v = p[req.field];
  if (v !== null && v !== undefined) return [];
  return askSource(req.field, p);
}

/**
 * 파생 필드를 사용자가 실제로 입력하는 원천 필드로 되돌린다. 당사자별 고용 형태는
 * 역할에 따라 원천이 다르다 — 엄마 사용자의 motherEmployment 는 employment 이고,
 * 아빠 사용자의 것은 spouseEmployment 다. 역할을 모르면 역할부터 묻는다.
 */
function askSource(field, p) {
  if (field === 'motherEmployment') {
    return p.role === 'mother' ? ['employment'] : p.role === 'partner' ? ['spouseEmployment'] : ['role'];
  }
  if (field === 'partnerEmployment') {
    return p.role === 'partner' ? ['employment'] : p.role === 'mother' ? ['spouseEmployment'] : ['role'];
  }
  return ASK_SOURCE[field] ?? [field];
}

/**
 * '조건 불일치'를 만든 필드를 찾는다 — missingOf 의 대칭.
 * 여기서는 ASK_SOURCE 로 되돌리지 않는다: 값은 이미 있고(파생 포함) 판정이
 * '아니오'로 난 것이므로, 어느 조건이 걸렸는지를 그 조건의 이름으로 말한다.
 * ("자녀 수를 입력하세요"가 아니라 "출산 순위 조건이 맞지 않습니다"가 답이다)
 */
function failedOf(req, p) {
  if (req.anyOf) {
    // OR 전체가 fail 일 때만 여기 온다 — 모든 가지가 각자 실패했으므로 전부 짚는다.
    return req.anyOf.flatMap((r) =>
      checkRequirement(r, p) === 'fail' ? failedOf(r, p) : []
    );
  }
  if (req.allOf) {
    return req.allOf.flatMap((r) =>
      checkRequirement(r, p) === 'fail' ? failedOf(r, p) : []
    );
  }
  if (req.ageRule) return [ageSourceFields(req.ageRule, p).ym];
  return [req.field];
}

/** 기준 시점을 확인하지 못한 연령 조건이 이 요구사항 안에 있는가. */
function hasUnknownAsOf(req) {
  if (req.anyOf) return req.anyOf.some(hasUnknownAsOf);
  if (req.allOf) return req.allOf.some(hasUnknownAsOf);
  return req.ageRule?.asOf === 'unknown';
}

/** 연 나이(calendarYear) 조건이 이 요구사항 안에 있는가. */
function hasCalendarYear(req) {
  if (req.anyOf) return req.anyOf.some(hasCalendarYear);
  if (req.allOf) return req.allOf.some(hasCalendarYear);
  return req.ageRule?.asOf === 'calendarYear';
}

/** 판단 불가로 남은 요구사항 안의 창구 확인 문구들 — 화면이 사유를 지어내지 않도록 원문 쪽 문구를 그대로 넘긴다. */
function officeChecksOf(req, p, inAny = false) {
  if (checkRequirement(req, p) !== 'unknown') return [];
  if (req.anyOf) return req.anyOf.flatMap((r) => officeChecksOf(r, p, true));
  if (req.allOf) return req.allOf.flatMap((r) => officeChecksOf(r, p, inAny));
  return typeof req.officeCheck === 'string' ? [{ text: req.officeCheck, inAny }] : [];
}

function checkRegion(program, p) {
  if (!program.region) return 'pass';
  // 지자체 한정 제도인데 어느 지역인지 데이터에 특정되어 있지 않으면
  // 전국 사용자에게 '해당됨'으로 보이면 안 된다. 판단 불가로 남긴다.
  if (!program.region.sido) return 'unknown';
  if (p.sido == null) return 'unknown';
  if (p.sido !== program.region.sido) return 'fail';
  // 시군구 한정 제도 — 같은 시·도라도 시군구가 다르면 해당되지 않는다.
  // (인천 서구 첫째 30만 vs 연수구 다섯째 3,000만 같은 편차가 실측됐다)
  if (program.region.sigungu) {
    if (p.sigungu == null) return 'unknown';
    return p.sigungu === program.region.sigungu ? 'pass' : 'fail';
  }
  // 시·도 안의 일부 구역에만 적용되는 광역 제도 — 행정구역 통합이 만들어낸다.
  // 전남광주통합특별시(2026-07-01 통합)에는 옛 전남에만 적용되는 출생기본소득과
  // 옛 광주에만 적용되는 상생카드가 같은 시·도 이름 아래 공존한다. 시·도만 보고
  // 통과시키면 통합 시·도 주민 절반에게 해당되지 않는 제도가 '확정'으로 뜬다.
  if (Array.isArray(program.region.sigungus) && program.region.sigungus.length > 0) {
    if (p.sigungu == null) return 'unknown';
    return program.region.sigungus.includes(p.sigungu) ? 'pass' : 'fail';
  }
  return 'pass';
}

// ---------------------------------------------------------------------------
// 아동수당 지역 구분 자동 판정
// ---------------------------------------------------------------------------
const CAPITAL_SIDOS = ['서울특별시', '경기도', '인천광역시'];

/**
 * 시·도+시군구로 아동수당 지역 구분(capital/noncapital/depopulation)을 판정한다.
 * @param {string|null} sido
 * @param {string|null} sigungu
 * @param {Array<{sido:string,sigungu:string,tier?:'preferred'|'special'}>} depopulationList 인구감소지역 명단.
 *   엔진은 명단을 내장하지 않는다 — 출처·확인일자가 붙은 데이터 파일로 주입받는다.
 * @returns {'capital'|'noncapital'|'depopulation'|'depopulation_special'|null} 판정 불가면 null (호출부는 수동 입력을 유지)
 *
 * 특별지역(depopulation_special)은 tier === 'special' 인 지역만이다. 근거는 보건복지부
 * 「아동수당 추가지급 대상지역 고시」(제2026-59호) 별표 1 — 아동수당법 시행령 제2조제2항제1호 단서
 * (월 2만원 추가). tier 가 없으면 우대(depopulation)로 본다(2026-10-19).
 */
function regionTypeFor(sido, sigungu, depopulationList) {
  if (!sido) return null;
  if (!Array.isArray(depopulationList) || depopulationList.length === 0) return null;
  if (!sigungu) {
    // 시군구를 모르면 인구감소 여부를 배제할 수 없다 — 수도권 시·도에도
    // 인구감소지역이 있을 수 있으므로 단정하지 않는다.
    return null;
  }
  const hit = depopulationList.find((d) => d.sido === sido && d.sigungu === sigungu);
  if (hit) return hit.tier === 'special' ? 'depopulation_special' : 'depopulation';
  return CAPITAL_SIDOS.includes(sido) ? 'capital' : 'noncapital';
}

function checkStage(program, p) {
  const stages = program.eligibility?.stages ?? [];
  if (stages.length === 0) return 'pass';
  if (p.stage == null) return 'unknown';
  if (stages.includes(p.stage)) return 'pass';
  const cur = STAGE_ORDER[p.stage];
  const min = Math.min(...stages.map((s) => STAGE_ORDER[s]));
  return min > cur ? 'future' : 'past';
}

/**
 * 신청 기한을 계산한다.
 * 기준일이 없으면 날짜를 지어내지 않고 unknown 을 반환한다.
 * 출산 전 사용자에게 '출산일 기준' 기한을 보여줄 때는 출산예정일로 계산하되
 * estimated=true 를 붙여 확정 날짜가 아님을 호출부가 알 수 있게 한다.
 */
function computeDeadline(program, p, today) {
  return deadlineFrom(program.deadline, p, today);
}

/** 신청 자체가 불가능해지는 최종 기한(hardDeadline)을 계산한다. */
function computeHardDeadline(program, p, today) {
  return deadlineFrom(program.hardDeadline, p, today);
}

/**
 * 날짜로 셀 수 없는 기한 종류. 정보가 없는 것이 아니라 '날짜가 아닌 사실'이다.
 * · alwaysOpen     공식 문서가 상시·연중이라고 밝혔거나, 법령에 청구 기한 규정이
 *                  없음을 확인했다 — 확인된 사실이다.
 * · budgetLimited  마감일 없이 예산이 소진되면 끝난다 — D-day 를 만들면 거짓이 된다.
 * · perNotice      모집공고·기관마다 접수기간이 달라 전국 공통 날짜가 없다(확인됨).
 *                  LH 매입임대(분기별 공고), 영양플러스(보건소별 상이)가 이렇다.
 * · notApplicable  따로 신청하는 행위가 없다 — 자동 적용되거나(임신부 본인부담률
 *                  경감), 다른 청구 때 함께 처리된다(국민연금 출산크레딧).
 * · sourceUnknown  공식 자료에서 신청 시점 규정을 찾지 못했다.
 *   이들을 '기한 없음' 하나로 뭉치면, 확인 못 한 제도가 상시 제도처럼 보인다.
 */
const NO_DATE_KINDS = new Set(['alwaysOpen', 'budgetLimited', 'perNotice', 'notApplicable', 'sourceUnknown']);

/**
 * 프로필의 날짜 필드를 그대로 기준일로 쓰는 기준점(44차). 이름이 곧 필드명이다 —
 * 출산전후휴가·육아휴직·육아기 단축의 '끝나는 날'. 비어 있으면 그 자리에서 묻는다.
 * 유산·사산휴가(miscarriageLeaveEnd)는 앱이 그 사실을 받지 않으므로 여기 없다.
 */
const PROFILE_DATE_ANCHORS = new Set([
  'maternityLeaveEnd', 'parentalLeaveEnd', 'reducedHoursEnd',
  // 45차: 배우자 출산휴가의 급여 신청 기한(payDeadline)이 이 날짜를 쓴다. 44차에는
  // 체크포인트 층만 이 필드를 알아 두 층이 어긋나 있었다(적대 검증이 짚은 비대칭).
  'paternityLeaveEnd',
]);
/** 기준점 종류 가운데 프로필에서 날짜를 꺼낼 수 있는 것. 나머지는 원문만 보여준다. */
const COMPUTABLE_ANCHORS = new Set(['birth', 'due', 'exam', ...PROFILE_DATE_ANCHORS]);

function urgencyOf(daysLeft) {
  return daysLeft < 0 ? 'expired' : daysLeft <= 14 ? 'critical' : daysLeft <= 30 ? 'warning' : 'normal';
}

/**
 * 매년 돌아오는 고정 날짜(연말정산·자녀장려금·지역난방 4/30)는 올해 날짜가 지났으면
 * 다음 해로 굴린다. 2026년에 태어난 아기의 세액공제 신고는 2027년이다.
 */
function nextOccurrence(date, today) {
  let next = date;
  // 데이터에 적힌 해가 몇 해 전이어도 '다음 도래일'까지 굴린다(한 해만 굴리면 2027년에 2026년 날짜를 본다).
  while (next.getTime() < today.getTime()) {
    next = new Date(next.getFullYear() + 1, next.getMonth(), next.getDate());
  }
  return next;
}

function deadlineFrom(dl, p, today) {
  if (!dl) return null;
  if (NO_DATE_KINDS.has(dl.kind)) {
    return { kind: dl.kind, text: dl.text ?? null, noDate: true };
  }
  // 고정 달력 날짜 — 기준점이 없다(자녀장려금 5월 정기신청 같은 것).
  if (dl.kind === 'fixed') {
    let date = toDate(dl.date);
    if (!date) return { unknown: true, text: dl.text ?? null, kind: dl.kind };
    if (dl.recurring === true) date = nextOccurrence(date, today);
    const daysLeft = daysBetween(today, date);
    return { date: fmtDate(date), daysLeft, urgency: urgencyOf(daysLeft), kind: dl.kind,
      text: dl.text ?? null, estimated: false, recurring: dl.recurring === true };
  }
  let anchorDate = null;
  let estimated = false;
  if (dl.anchor === 'birth') {
    anchorDate = toDate(p.birthDate);
    if (!anchorDate && p.dueDate) {
      anchorDate = toDate(p.dueDate);
      estimated = true;
    }
  } else if (dl.anchor === 'due') {
    anchorDate = toDate(p.dueDate) ?? toDate(p.birthDate);
  } else if (dl.anchor === 'exam') {
    // 검사일 기준 청구 기한. 검사일을 입력하지 않으면 날짜를 만들지 않는다.
    anchorDate = toDate(p.examDate);
  } else if (PROFILE_DATE_ANCHORS.has(dl.anchor)) {
    // 휴가·휴직·단축이 끝나는 날 — 사용자가 적은 날짜 그대로다. 추정하지 않는다.
    anchorDate = toDate(p[dl.anchor]);
  }
  if (!anchorDate) {
    // 기준점을 모른다 — 날짜를 지어내지 않는다. 다만 두 경우를 구분해 알린다:
    // 프로필에 없는 종류의 기준점(유산일·취득일·퇴원일)은 우리가 아직 받지 않는
    // 사실이고, 받는 종류인데 비어 있는 것은 사용자가 채우면 풀린다 — 그 필드를
    // missingFields 로 넘겨 화면이 그 자리에서 묻게 한다.
    const computable = COMPUTABLE_ANCHORS.has(dl.anchor);
    return { unknown: true, text: dl.text, kind: dl.kind,
      anchor: dl.anchor ?? null, anchorComputable: computable,
      missingFields: PROFILE_DATE_ANCHORS.has(dl.anchor) ? [dl.anchor] : [] };
  }
  let date;
  if (dl.offsetMonths != null) {
    // 월·년 단위 기간은 역(曆)으로 센다(민법 제160조). 초일 불산입이 원칙이라
    // 기산일은 기준일 다음 날이고, '포함'이라고 못박은 원문만 기준일이 1일차다.
    const start = dl.inclusive === true ? anchorDate : addDays(anchorDate, 1);
    date = deadlineByMonths(start, dl.offsetMonths);
  } else {
    // "출생일을 포함한 60일"은 출생일이 1일째다 — 마지막 날은 출생일 + 59일.
    // 원문이 '포함'이라고 못박은 것만 이렇게 센다. 하루 늦게 보여주면 마지막 날에
    // 신청하려던 사람이 놓친다.
    const offset = dl.offsetDays - (dl.inclusive === true ? 1 : 0);
    date = addDays(anchorDate, offset);
  }
  const daysLeft = daysBetween(today, date);
  /* softLoss — "기한을 넘기면 구체적으로 무엇을 잃는가". 데이터에는 여섯 제도에
     적혀 있는데 이 반환이 필드를 골라 담느라 떨어뜨리고 있었고, 그래서 화면의
     '지금 신청해도 일부는 못 받습니다' 묶음이 무엇을 못 받는지 말하지 못했다.
     없는 제도가 대부분이므로 null 로 둔다(화면이 있을 때만 그린다). */
  return { date: fmtDate(date), daysLeft, urgency: urgencyOf(daysLeft), kind: dl.kind, text: dl.text,
    estimated, softLoss: dl.softLoss ?? null };
}

/**
 * 바우처·포인트의 사용 기한. 신청 기한과 다른 사실이라 다른 필드에 둔다.
 * (임신·출산 진료비 바우처는 신청은 임신 확인 후 상시인데 사용은 2년까지다.
 *  이 둘을 한 자리에 두면 "신청 마감이 2년 남았다"로 읽힌다)
 */
function computeUsageBy(program, p, today) {
  return deadlineFrom(program.usageBy, p, today);
}

/**
 * 급여 신청 기한(payDeadline). 제도를 쓰는 기한과 그 급여를 청구하는 기한이
 * 서로 다른 행위인 제도가 있다 — 배우자 출산휴가는 출생일부터 120일 안에 '쓰고',
 * 그 급여는 휴가가 끝난 날부터 12개월 안에 '신청'한다(고용보험법 제75조).
 * 한 칸에 넣으면 둘 중 하나는 반드시 거짓이 되므로 다른 칸에 둔다 — usageBy 와 같은 이유다.
 */
function computePayDeadline(program, p, today) {
  return deadlineFrom(program.payDeadline, p, today);
}

/** 신청 창구가 열리는 날짜(window.start)를 계산한다. 기준일이 없으면 null. */
function computeWindowStart(program, p, today) {
  const w = program.window && program.window.start;
  if (!w) return null;
  // 창구가 열리는 규칙 자체가 아직 시행 전이면(배우자 출산전후휴가의 '예정일 50일 전부터'는
  // 2026-09-18 시행) 그날까지는 열리지 않은 것으로 본다 — 법이 바뀌기 전에 미리
  // "신청하세요"라고 말하지 않는다. 시행일이 오면 아래 계산이 그대로 살아난다.
  if (w.effectiveFrom) {
    const eff = toDate(w.effectiveFrom);
    if (eff && today.getTime() < eff.getTime()) {
      const daysLeft = daysBetween(today, eff);
      return { date: fmtDate(eff), daysLeft, opened: false, notYetEffective: true };
    }
  }
  // 고정 날짜로 열리는 창구(인플루엔자 절기 접종 9/21 개시 같은 것)
  if (w.date) {
    const fixed = toDate(w.date);
    if (!fixed) return null;
    const daysLeft = daysBetween(today, fixed);
    return { date: fmtDate(fixed), daysLeft, opened: daysLeft <= 0 };
  }
  const anchorDate =
    w.anchor === 'due' ? toDate(p.dueDate) ?? toDate(p.birthDate) : toDate(p.birthDate);
  if (!anchorDate) return null;
  const date = addDays(anchorDate, w.offsetDays);
  const daysLeft = daysBetween(today, date);
  return { date: fmtDate(date), daysLeft, opened: daysLeft <= 0 };
}

/**
 * 프로필과 제도 목록을 받아 매칭 결과를 반환한다.
 * @param {object} profile
 * @param {Array} programs
 * @param {Date} today
 */
function evaluate(profile, programs, today = new Date()) {
  today = dayStart(today);
  // 단계에 맞지 않는 날짜는 판정에 쓰지 않는다.
  // (임신 중인 사용자에게 남아 있던 출생일로 기한을 만들어내는 사고를 막는다)
  const cleaned = {
    ...profile,
    // 출산예정일은 임신 중일 때만, 출생일은 출산 후일 때만 쓴다.
    // 준비 중인 사람에게 폼에 남아 있던 예정일로 기한을 만들어내면
    // 아직 임신도 하지 않았는데 D-day 가 흐른다.
    dueDate: profile.stage === 'pregnant' ? profile.dueDate : null,
    birthDate: profile.stage === 'postpartum' ? profile.birthDate : null,
  };
  const p = derive(cleaned, today);
  // 연령 조건은 '지금'을 알아야 판정된다(청소년 한부모는 달이 바뀌면 답이 바뀐다).
  p.__today = today;

  // 실데이터가 그 지역을 덮었으면 '요약 항목'은 물러난다.
  // 시군구 실데이터를 확보하기 전에 만든 안내성 항목(예: "인천 자치구별 추가 출산장려금",
  // "전남 시군 출산장려금")은 그 지역의 확인 등급 제도가 승격되는 순간 중복이 된다 —
  // 사용자는 "서구 출산장려금(확인)"과 "자치구별 추가 장려금(추정)"을 나란히 보게 된다.
  // supersededByConfirmedLocal 을 단 항목은 그럴 때 조용히 물러난다.
  const hasConfirmedLocal =
    p.sido != null &&
    p.sigungu != null &&
    programs.some(
      (x) =>
        x.confidence === '확인' &&
        x.layer === 'city' &&
        x.region?.sido === p.sido &&
        x.region?.sigungu === p.sigungu
    );

  const results = programs.map((program) => {
    const stage = checkStage(program, p);
    const region = checkRegion(program, p);
    const superseded = program.supersededByConfirmedLocal === true && hasConfirmedLocal;

    let status;
    let missingFields = [];
    let failedFields = [];
    let unknownReason = null;
    let officeChecks = [];
    let officeCheckAny = false;
    let missingAnyReq = null;   // 판단 불가인 최상위 요구사항 중 anyOf 가 정확히 하나일 때 그 요구사항
    if (superseded) status = 'ineligible';
    else if (region === 'fail') status = 'ineligible';
    else if (stage === 'past') status = 'past';
    else if (stage === 'future') status = 'future';
    else {
      const reqs = program.eligibility?.requires ?? [];
      const checks = reqs.map((r) => checkRequirement(r, p));
      if (region === 'unknown' || stage === 'unknown' || checks.includes('unknown')) {
        status = checks.includes('fail') ? 'ineligible' : 'unknown';
      } else if (checks.includes('fail')) status = 'ineligible';
      else status = 'eligible';
      // 어느 조건이 걸렸는지 — UI 가 이유를 지어내지 않도록 엔진이 짚어 준다.
      if (status === 'ineligible') {
        failedFields = [
          ...new Set(reqs.flatMap((r, i) => (checks[i] === 'fail' ? failedOf(r, p) : []))),
        ];
      }
      if (status === 'unknown') {
        missingFields = [
          ...new Set(
            reqs.flatMap((r, i) => (checks[i] === 'unknown' ? missingOf(r, p) : []))
          ),
        ];
        // 지역 판단 불가는 어느 입력이 비었는지까지 짚어 준다.
        if (region === 'unknown') {
          if (p.sido == null) missingFields.push('sido');
          else if (p.sigungu == null) missingFields.push('sigungu');
        }
        // 창구 확인 문구는 물을 것이 남아 있어도 함께 넘긴다 — 답해도 창구 확인이 남는다는 걸 미리 알린다.
        const oc = reqs.flatMap((r) => officeChecksOf(r, p));
        officeChecks = [...new Set(oc.map((o) => o.text))];
        officeCheckAny = oc.some((o) => o.inAny);
        const unkAny = reqs.filter((r, i) => checks[i] === 'unknown' && r.anyOf);
        if (unkAny.length === 1) missingAnyReq = unkAny[0];
        // 물어볼 것이 하나도 없는 보류는 사용자가 아니라 우리가 모르는 것이다.
        // 무엇을 모르는지는 제도마다 다르므로, 화면이 이유를 지어내지 않도록
        // 엔진이 사유를 짚어 준다. ('지역 시행 여부를 확인 못 했습니다'를
        // 연령 기준 시점이 없는 제도에 붙이면 그 설명이 거짓이 된다)
        if (missingFields.length === 0) {
          if (region === 'unknown' && program.region?.sido == null) {
            unknownReason = 'regionNotIdentified';
          } else if (
            reqs.some((r, i) => checks[i] === 'unknown' && hasUnknownAsOf(r))
          ) {
            unknownReason = 'sourceAgeAsOf';
          } else if (
            reqs.some((r, i) => checks[i] === 'unknown' && hasCalendarYear(r))
          ) {
            unknownReason = 'yearBoundary';
          } else if (officeChecks.length) {
            unknownReason = 'officeCheck';
          }
        }
      }
    }

    const notYetEffective =
      program.effectiveFrom != null && toDate(program.effectiveFrom) > today;

    const deadline = computeDeadline(program, p, today);
    const hardDeadline = computeHardDeadline(program, p, today);

    // 기한이 지나 신청 자체가 불가능해진 제도는 절대 합산하지 않는다.
    // soft(소급 마감)는 신청은 가능하되 소급분을 잃는 것이므로 별도 플래그로만 표시한다.
    const isExpired = (d) => d && !d.unknown && !d.estimated && d.daysLeft < 0;
    // 바우처 사용 기한이 지났으면 신청이 열려 있어도 받을 것이 없다 — 만료로 본다.
    const usageBy = computeUsageBy(program, p, today);
    // 지나면 막히는 종류: hard·windowEnd·(반복하지 않는) 고정 날짜. 매년 반복하는 날짜는
    // 다음 해로 굴러가므로 만료가 없다. soft 는 신청이 열려 있고 소급분만 잃는다.
    const blocked =
      isExpired(hardDeadline) ||
      isExpired(usageBy) ||
      (isExpired(deadline) &&
        (deadline.kind === 'hard' || deadline.kind === 'windowEnd' ||
          (deadline.kind === 'fixed' && !deadline.recurring)));
    const softLost = isExpired(deadline) && deadline.kind === 'soft';

    // 판단 불가여도 신청 자체가 막혔으면 누구도 받을 수 없다 — 묻는 것이 헛수고다(2026-10-16).
    // 해당 없음(ineligible)은 그대로 둔다: 기한이 아니라 조건이 이유다.
    // 지역을 모르면(region 'unknown') 내 지역 제도인지조차 모른다 — 남의 지역 마감을 '기한 지남'으로 쌓지 않는다(plan 060).
    if ((status === 'eligible' || (status === 'unknown' && region === 'pass')) && blocked) {
      status = 'expired';
      missingFields = []; unknownReason = null; officeChecks = []; officeCheckAny = false; missingAnyReq = null;
    }

    const rule = program.amountRule ? AMOUNT_RULES[program.amountRule] : null;
    // 금액의 갈래는 넷이다: 순위별 표 → 태아 수별 표 → 하드코딩 규칙 → 못 구함(사유).
    // 순위표와 태아표를 함께 두면 뒤엣것이 조용히 죽으므로 승격 검증이 동시 지정을 막는다.
    const amount = program.amountByOrder
      ? amountByOrder(program, p)
      : program.amountByFetus
        ? amountByFetus(program, p)
        : rule
          ? rule(p)
          : { value: null, reason: program.amountUnknownReason ?? null };

    const countsToward =
      status === 'eligible' &&
      program.confidence === '확인' &&
      !notYetEffective &&
      amount.value != null &&
      amount.isCap !== true;

    // 자격은 확정인데 기한의 기준일(휴가 종료일)만 비어 있으면 그 날짜를 묻는다 —
    // 조건 질문이 먼저다(순차 관문). 조건이 남아 있으면 날짜까지 함께 묻지 않는다.
    if (status === 'eligible' && deadline && deadline.unknown && deadline.missingFields && deadline.missingFields.length) {
      missingFields = [...new Set([...missingFields, ...deadline.missingFields])];
    }

    // 질문이 여럿 뜨지만 전부 답할 필요는 없는 경우 — 최종 missingFields 전부가
    // 판단 불가인 anyOf 요구사항 하나에서 나왔고 2개 이상일 때만 true (plan 061).
    let missingAny = false;
    if (missingAnyReq && missingFields.length >= 2) {
      const own = new Set(missingOf(missingAnyReq, p));
      missingAny = own.size === missingFields.length && missingFields.every((f) => own.has(f));
    }

    return {
      program,
      status,
      missingFields,
      failedFields,
      // 물을 것이 없는 보류의 사유 — 'regionNotIdentified' | 'sourceAgeAsOf' | 'officeCheck' | null
      unknownReason,
      // unknownReason 이 'officeCheck' 일 때 창구에서 확인할 것(데이터 원문 쪽 문구)
      officeChecks,
      // officeChecks 중 하나라도 '또는' 갈래에서 왔는가 — 맞으면 "해당해야"로 단정하면 안 된다
      officeCheckAny,
      // 물을 칸이 여럿이지만 그중 하나만 해당해도 되는가(anyOf 하나에서 전부 나옴)
      missingAny,
      // 지역이 달라 해당되지 않는 경우 — 대체(superseded)와 구분해 이유를 밝힌다.
      regionFail: region === 'fail' && !superseded,
      notYetEffective,
      softLost,
      superseded,
      amount,
      countsToward,
      deadline,
      hardDeadline,
      // 바우처 사용 기한 — 신청 기한과 섞이면 "신청 마감이 2년 남았다"로 읽힌다.
      usageBy,
      // 급여 신청 기한 — 제도를 쓰는 기한과 다른 행위다(배우자 출산휴가: 사용 120일 / 급여 12개월).
      payDeadline: computePayDeadline(program, p, today),
      windowStart: computeWindowStart(program, p, today),
    };
  });

  const confirmed = results.filter((r) => r.countsToward);
  const conditional = results.filter(
    (r) => !r.countsToward && (r.status === 'eligible' || r.status === 'future')
  );
  const needsInput = results.filter((r) => r.status === 'unknown');
  const expired = results.filter((r) => r.status === 'expired');
  const excluded = results.filter((r) => r.status === 'ineligible' || r.status === 'past');

  const total = confirmed.reduce((s, r) => s + r.amount.value, 0);

  // 기한이 있는 항목만 임박한 순으로 정렬한다. 이미 지난 것은 뺀다.
  const deadlines = results
    .filter((r) => r.status === 'eligible' || r.status === 'unknown')
    .filter((r) => r.deadline && !r.deadline.unknown && r.deadline.daysLeft >= 0)
    .sort((a, b) => a.deadline.daysLeft - b.deadline.daysLeft);

  return {
    profile: p,
    results,
    confirmed,
    conditional,
    needsInput,
    expired,
    excluded,
    total,
    deadlines,
    counts: {
      confirmed: confirmed.length,
      conditional: conditional.length,
      needsInput: needsInput.length,
      expired: expired.length,
      excluded: excluded.length,
    },
  };
}

/**
 * 원스톱 신청 서비스를 현재 프로필 기준으로 분해한다.
 * "무엇이 한 번에 신청되고, 무엇을 따로 신청해야 하는가"를 보여주는 것이 목적이다.
 * @param {Array} onestops data/onestop.json
 * @param {object} evalResult evaluate() 결과
 */
function onestopFor(onestops, evalResult) {
  const stage = evalResult.profile.stage;
  const covered = new Set();

  const services = onestops
    .filter((o) => o.stage === 'any' || o.stage === stage)
    .map((o) => {
      const items = (o.includes || []).map((inc) => {
        const r = inc.programId
          ? evalResult.results.find((x) => x.program.id === inc.programId)
          : null;
        // 이 원스톱에 포함되고 내가 해당되는 항목만 '커버됨'으로 친다.
        const applies = r ? r.status === 'eligible' || r.status === 'unknown' : null;
        if (applies && inc.programId) covered.add(inc.programId);
        return {
          label: inc.label,
          programId: inc.programId,
          status: r ? r.status : null,
          applies,
          inDataset: !!r,
        };
      });
      return { onestop: o, items, appliesCount: items.filter((i) => i.applies).length };
    });

  // 내가 해당되는데 어떤 원스톱에도 없는 제도 = 개별 신청 필요.
  // 의료기관·연말정산에서 자동 적용되는 제도는 '신청' 대상이 아니므로 뺀다.
  const isAutoApplied = (p) =>
    /자동 적용|연말정산|종합소득세/.test(p.applyVia || '');
  const separate = evalResult.results.filter(
    (r) =>
      (r.status === 'eligible' || r.status === 'unknown') &&
      r.program.category !== 'admin' &&
      !isAutoApplied(r.program) &&
      !covered.has(r.program.id)
  );

  return { services, separate, coveredIds: [...covered] };
}

/**
 * 생후 개월 기반 접종·검진 필터 — timelineFor 의 월령판.
 * '이번 달(now)'은 monthFrom~monthTo 구간, 지나면 past, 아직이면 upcoming.
 */
function monthsFor(items, profile, today = new Date()) {
  today = dayStart(today);
  const p = derive(profile, today);
  const m = p.childAgeMonths;
  return items.map((it) => {
    const applicable =
      it.monthFrom == null || m == null
        ? 'unknown'
        : m > it.monthTo
          ? 'past'
          : m >= it.monthFrom
            ? 'now'
            : 'upcoming';
    return { item: it, applicable };
  });
}

/** 주수 기반 의료 타임라인 필터. 근거등급 '확인'만 확정 일정으로 취급한다. */
function timelineFor(items, profile, today = new Date()) {
  today = dayStart(today);
  const p = derive(profile, today);
  return items.map((it) => {
    const applicable =
      it.weekFrom == null
        ? 'unknown'
        : p.weeks == null
          ? 'unknown'
          : p.weeks > it.weekTo
            ? 'past'
            : p.weeks >= it.weekFrom
              ? 'now'
              : 'upcoming';
    // 조건부 일정(예: Rh 음성 산모 면역글로불린)은 조건이 '아니오'로 확인될 때만 숨긴다. 모르면 보이되
    // conditionalUnknown 으로 알려 화면이 "해당될 때만"을 밝히게 한다 — 모르는 값을 아니오로 다루면
    // 해당하는 사람까지 확인된 일정을 못 본다(2026-09-23 감사 H-2: 기본값 false 로 모두에게 숨겨져 있었다).
    const cv = it.conditionField != null ? p[it.conditionField] : undefined;
    const conditionalHidden = it.conditionField != null && cv === false;
    const conditionalUnknown = it.conditionField != null && cv == null;
    return { item: it, applicable, conditionalHidden, conditionalUnknown, isConfirmed: it.confidence === '확인' };
  });
}

/**
 * 부부 여정 체크리스트 — 매칭 결과를 '신청할 일' 목록으로 재구성한다.
 * 새 정보를 만들지 않는다: 제도의 기한·신청처를 기한 임박순으로 정렬할 뿐이다.
 * 분담(엄마/아빠/함께)·완료 상태는 UI 가 로컬에 저장하고, 엔진은 관여하지 않는다.
 * 버킷: overdue(경과) / softlost(소급분 상실) / urgent(D-30) / soon(D-90)
 *       / later(그 이후) / anytime(상시) / notyet(아직 신청할 수 없음)
 */
function journeyFor(evalResult) {
  const src = [...(evalResult.confirmed ?? []), ...(evalResult.conditional ?? [])];
  return src
    .filter((r) => !r.notYetEffective)
    .map((r) => {
      const d = r.deadline && !r.deadline.unknown && !r.deadline.noDate ? r.deadline : null;
      const opened = r.windowStart ? r.windowStart.opened : true;
      let bucket;
      let order;
      if (!opened) {
        bucket = 'notyet';
        order = 200000 + (r.windowStart.daysLeft ?? 0);
      } else if (r.status === 'future') {
        /* 단계가 아직 오지 않았으면 지금은 신청할 수 없다 — 기한이 계산되든 아니든.
           날짜부터 보게 두었더니, 임신 12주인 사람의 '지금 신청할 수 있는 제도 26건'
           안에 출생신고·첫만남이용권·부모급여가 들어 있었다. 예정일에서 역산한
           기한(255일 남음)이 있다는 이유로 '그 뒤에 신청'으로 샜기 때문이다.
           44차에 기한 없는 쪽은 막았는데 기한 있는 쪽이 남아 있었다. */
        bucket = 'notyet';
        order = 210000 + (d && d.daysLeft != null ? d.daysLeft : 0);
      } else if (d && d.daysLeft != null) {
        if (d.daysLeft < 0) {
          bucket = r.softLost ? 'softlost' : 'overdue';
          order = d.daysLeft;
        } else if (d.daysLeft <= 30) {
          bucket = 'urgent';
          order = d.daysLeft;
        } else if (d.daysLeft <= 90) {
          bucket = 'soon';
          order = d.daysLeft;
        } else {
          bucket = 'later';
          order = d.daysLeft;
        }
      } else if (r.deadline && r.deadline.noDate) {
        // 날짜로 셀 수 없지만 확인된 사실이다 — 종류마다 사용자가 할 일이 다르다.
        const k = r.deadline.kind;
        bucket = k === 'budgetLimited' ? 'budget'
          : k === 'alwaysOpen' ? 'anytime'
            : k === 'perNotice' ? 'perNotice'
              : k === 'notApplicable' ? 'auto'
                : 'unknownDeadline';
        order = { budget: 90000, anytime: 100000, perNotice: 105000, auto: 120000 }[bucket] ?? 110000;
      } else if (r.deadline && r.deadline.unknown && r.deadline.missingFields && r.deadline.missingFields.length) {
        // 기한도 확인됐고 기준일도 받는 종류인데 아직 비어 있다(휴가 종료일). 날짜를
        // 적으면 그 자리에서 D-day 가 된다 — 원문만 보여주는 것과 다른 상태다.
        bucket = 'askDate';
        order = 107000;
      } else if (r.deadline && r.deadline.unknown && r.deadline.text) {

    var theirs = ch[k] == null || ch[k] === '' ? null : ch[k];
    if (JSON.stringify(mine) !== JSON.stringify(theirs)) diff[k] = theirs;
  });
  return diff;
}

/* 건강에 관한 정보 — 별도 동의 없이는 기기 밖으로 내보내지 않는다.
   개인정보 보호법은 건강정보를 민감정보로 보고 별도 동의를 요구한다. 이 두 값은
   SHARED_FIELDS 에 들어 있어 예전에는 부부를 연결하는 순간 나머지와 함께 나갔다.
   기본값은 '동의하지 않음'이다 — 묻지 않은 동의를 있는 것으로 치지 않는다
   (CLAUDE.md 규칙 1: 확인 안 된 값을 기본값으로 박지 않는다).
   빠지면 배우자 화면에서 이 값을 쓰는 제도가 'fail' 이 아니라 '판단 불가'가 된다
   (checkRequirement 는 값이 없으면 unknown 을 준다) — 정직한 저하다. */
const HEALTH_FIELDS = ['isHighRiskPregnancy', 'isDisabledParent'];

/** 이 프로필에서 실제로 내보내도 되는 필드. 두 공유 경로(서버 업서트·로컬 초대코드)가
 *  같은 규칙을 써야 한다 — 한쪽만 막으면 다른 쪽으로 그대로 나간다. */
function shareableFields(profile) {
  if (profile.healthShareConsent === true) return SHARED_FIELDS;
  return SHARED_FIELDS.filter(function (k) { return HEALTH_FIELDS.indexOf(k) < 0; });
}

function sharedPayload(profile) {
  var p = { v: 1, from: profile.role };
  shareableFields(profile).forEach(function (k) { if (profile[k] != null && profile[k] !== '') p[k] = profile[k]; });
  return p;
}

/** v2~v4 마이그레이션 — 복사본을 돌려준다. changed 는 저장 필요 여부. */
/** 화면 전체의 방향을 정하는 두 값이 실제로 고를 수 있는 값인가.
 *  온보딩 시트가 주는 선택지 그대로다(역할 2·단계 3). */
const VALID_ROLES = ['mother', 'partner'];
const VALID_STAGES = ['preparing', 'pregnant', 'postpartum'];

function migrateProfile(p) {
  const out = { ...p };
  const before = JSON.stringify(out);
  /* 2026-09-07 적대 검증 — role 이 null 은 아닌데 'x' 같은 알 수 없는 값이면,
     첫 실행 검사(role == null)를 그대로 통과해 온보딩이 열리지 않는다. 그런데
     isMine() 은 모든 항목을 거짓으로 판정해 '내 몫'이 통째로 배우자 몫으로 넘어간다.
     확인 안 된 값을 기본값으로 박지 않는다(CLAUDE.md 규칙 1) — 모르는 값은
     모른다고 두고 다시 묻는다. 짐작해서 'mother' 로 채우면 남의 제도가 내 목록이 된다. */
  if (out.role != null && !VALID_ROLES.includes(out.role)) out.role = null;
  if (out.stage != null && !VALID_STAGES.includes(out.stage)) out.stage = null;
  // v2 마이그레이션 — 입력 UI 가 없던 시절의 하드코딩 기본값이 저장돼 있다.
  // 그 값들은 사용자가 고른 적이 없으므로 미입력으로 되돌린다.
  if (!out._v || out._v < 2) {
    if (out.employment === 'employee') out.employment = null;
    if (out.spouseEmployment === 'employee') out.spouseEmployment = null;
    if (out.isPreterm === false) out.isPreterm = null;
    if (out.isCongenitalAnomaly === false) out.isCongenitalAnomaly = null;
    if (out.isUninsuredEmployee === false) out.isUninsuredEmployee = null;
    // 부모 중 장애인이 있다고만 알고 있으면 '산모 본인인지'는 물어야 한다.
    if (out.isDisabledParent === true) out.isDisabledMother = null;
    out._v = 2;
  }
  // v3 마이그레이션 — 초기 버전은 첫 실행 시트를 그냥 닫아도 기본값(강남구·거주
  // 12개월)이 확인값처럼 저장됐다. 세 값이 그 조합 그대로면 사용자가 고른 적
  // 없는 값일 가능성이 압도적이라 미입력으로 되돌린다. 되묻는 쪽은 안전하지만
  // 남겨 두면 남의 지역으로 판정이 나간다. (예전 자동 채움 예정일은 실제 입력과
  // 구분할 방법이 없어 남긴다 — 이 버전 이전 사용자는 사실상 없다.)
  if (!out._v || out._v < 3) {
    if (out.sido === '서울특별시' && out.sigungu === '강남구' && out.residencyMonths === 12) {
      out.sido = null; out.sigungu = null; out.residencyMonths = null;
    }
    out._v = 3;
  }
  // v4 마이그레이션 — 특수 조건 다섯을 미입력으로 되돌린다.
  //
  // 이 false 들이 전부 '안 물어본 값'이라고 단정할 수는 없다. 넷은 켜기만 되는
  // 스위치라 꺼짐이 곧 기본값이었지만, isDisabledMother 는 항목 안 예/아니오
  // 질문이 있었으므로 명시적으로 '아니오'를 답한 사람도 있을 수 있다. 옛 구조에는
  // 둘을 구분할 표식이 없어, 지금 와서 가려낼 방법이 없다.
  //
  // 그래서 어느 쪽으로 틀릴지를 고른다. false 를 남기면 답한 적 없는 사람이
  // 조용히 배제되고, 그 대가는 한부모·청소년 산모·장애 산모의 제도가 통째로
  // 사라지는 것이다(41차 실측: 남양주 5건). null 로 되돌리면 이미 답했던 사람이
  // 한 번 더 답한다 — 항목을 열었을 때 질문 하나. 두 대가는 크기가 다르다.
  if (!out._v || out._v < 4) {
    ['isDisabledParent', 'isDisabledMother', 'isTeenMother', 'isSingleParent', 'isHighRiskPregnancy']
      .forEach((k) => { if (out[k] === false) out[k] = null; });
    out._v = 4;
  }
  // v5 마이그레이션 — '청소년 산모' 하나로 서로 다른 연령 조건을 표현하던 것을
  // 걷어낸다. 남은 값을 새 필드로 옮기지 않는다: true 라고 해서 19세인지 22세인지
  // 알 수 없고, false 라고 해서 20세인지 30세인지 알 수 없다. 없는 사실을
  // 지어내는 대신 비워 두고, 그 값이 필요한 항목이 그 자리에서 다시 묻는다.
  if (!out._v || out._v < 5) {
    delete out.isTeenMother;
    out._v = 5;
  }
  // v6 마이그레이션 — isRhNegative 는 묻는 화면이 한 번도 없었다. 저장된 false 는 전부 하드코딩 기본값이라
  // 미입력으로 되돌린다(2026-09-23 감사 H-2 — 그 false 가 Rh 음성 면역글로불린 일정을 모두에게 숨겼다).
  if (!out._v || out._v < 6) {
    if (out.isRhNegative === false) out.isRhNegative = null;
    out._v = 6;
  }
  const changed = before !== JSON.stringify(out);
  return { profile: out, changed: changed };
}

/** 이 프로필로 앞으로 보낼 알림 목록 — buildAlerts 의 순수판. */
/* 알림 계약(2026-09-10, 외부감사 F03 재현 뒤 정리):
   · 법정 기한 알림은 **자격이 확인되고 지금 내 몫인** 항목에만 만든다 — state 가 unknown(조건
     미입력)·na(해당 없음)·past(지남)이거나, 이미 완료했거나, 상대 몫(who 가 상대 역할)이면
     만들지 않는다. 미확인을 확정 기한처럼 보내면 알림이 거짓이 된다(실측: 고용 조건을 안
     적은 산모에게 '배우자 출산휴가 쓰기 — 기한 7일 전'이 예약됐다).
   · 주차 알림은 다가오는 8주(예정일 역산). 앱이 열릴 때·완료를 바꿀 때·날짜가 바뀔 때
     다시 계산해 올리므로 그 사이의 공백을 8주가 덮는다.
   · 날짜순으로 정렬한 뒤 40개까지만 — 서버는 '오늘 날짜인 것'만 보내므로 가까운 것부터 남는다.
   role·doneIds 는 선택 인자다(없으면 필터하지 않는다 — 옛 호출과 호환). */
/** 이번 주 '받는 검사·진료'로 세는 일정인가 — 준비 항목(예: 보험 가입 권장 시기)은 검사가 아니고, 조건부 일정
 *  (예: Rh 음성 산모 면역글로불린)은 조건이 참으로 확인될 때만 센다. 준비 탭 라벨·주차 알림·주간 카드가 같은 셈을 쓴다
 *  (2026-09-23 감사 E-2·H-2 — 세 곳이 제각각 일정 전체를 셌다). conds: 프로필처럼 조건 필드를 가진 객체(없으면 조건부는 세지 않는다). */
function countsAsWeekTest(t, conds) {
  if (!t || t.category === '준비') return false;
  if (t.conditionField) return !!(conds && conds[t.conditionField] === true);
  return true;
}

/* ── 아이가 태어나면 더해지는 금액 (2026-09-29 검토 보고서 6절, 운영자 "보완 진행해") ─────────────
   임신 20주 노원구 엄마의 첫 화면 합계는 170만원이었고, 첫만남이용권·부모급여 같은 출산 후 제도는
   '나중에' 칩에 금액 없이 있었다. 같은 앱이 출산 후에는 1,600만원대를 보여 준다 — 임신 중에 가장
   알고 싶은 숫자가 빠져 있었다. 예정일을 출생일로 보고 예정일 당일을 기준일로 엔진을 한 번 더 돌린다
   (시행일·기한·연령 판정이 태어난 날에 맞춰진다. 오늘 기준으로 돌려도 9/29 첫째 20주 227곳 합계는
   같았지만 — 월령이 0으로 눌린다 — 예정일 전에 시행되거나 끝나는 제도가 있으면 갈린다).
   지금 합계에 이미 든 제도는 빼고 센다. 2027 개편안 해당 여부는 lawchanges.bornAfterReform
   (예정일 3주 전~2주 후 경계)을 그대로 쓴다 — 같은 판정을 두 번 만들지 않는다. */

/** 날짜 문자열(YYYY-MM-DD)을 그날 로컬 자정의 Date 로 — 형식이 아니면 null. */
function dateOf(ymd) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(typeof ymd === 'string' ? ymd : '');
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

/** 임신 중 프로필을 "예정일에 태어났다"로 바꾼 프로필. 나머지 조건(지역·순위·태아 수 등)은 그대로 둔다. */
function afterBirthProfile(profile) {
  return { ...profile, stage: 'postpartum', birthDate: profile.dueDate, dueDate: '' };
}

/** 아이가 태어나면 새로 받는 확인 금액 — evAfter(예정일 기준 평가)의 확정 제도 중 evNow(지금)의 확정 제도에
 *  없는 것만, 금액을 아는 것만 더한다. 분할 지급분과 가장 긴 분할 기간은 splitShare 와 같은 규칙(payout.spanText). */
function afterBirthExtra(evNow, evAfter) {
  const have = new Set(((evNow && evNow.confirmed) || []).map((r) => r.program.id));
  const rows = [];
  let splitWon = 0, spanMonths = 0;
  for (const r of (evAfter && evAfter.confirmed) || []) {
    const v = r.amount && r.amount.value;
    if (have.has(r.program.id) || !(v > 0)) continue;
    rows.push({ name: r.program.name, won: v });
    const po = r.amount.payout;
    if (po && po.spanText) {
      splitWon += v;
      if (po.spanMonths > spanMonths) spanMonths = po.spanMonths;
    }
  }
  if (!rows.length) return null;
  rows.sort((a, b) => b.won - a.won);
  return { won: rows.reduce((s, x) => s + x.won, 0), count: rows.length, top: rows.slice(0, 2).map((x) => x.name), splitWon, spanMonths, rows };
}

/* ── 재방문 구간 (2026-09-23 감사 I-2, 운영자 9/29 "보완 진행해") ─────────────────────────
   다시 오는지를 재지 못하면 무엇을 고쳐도 효과를 모른다. 9/23 배포 뒤 6일 동안 arrive 는 1건이었는데,
   그것이 새 사람인지 다시 온 사람인지 가를 수 없었다. 기기에는 처음 연 주의 월요일 하나만 두고
   (yebu.firstweek), 서버에는 그로부터 몇 주째인지의 거친 구간만 보낸다 — 날짜·방문 횟수·기기 식별자는
   보내지 않는다. 'pre' = 이 측정이 생기기 전부터 쓰던 기기(저장된 프로필은 있는데 첫 주 기록이 없다). */

/** 그 날이 든 주의 월요일(YYYY-MM-DD). */
function weekMonday(d) {
  return fmtDate(new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)));
}

/** 처음 연 주와 이번 주로 재방문 구간 — new | pre | w0 | w1 | w2-3 | w4-7 | w8+. 모르면 null(보내지 않는다). */
function retBucket(firstWeek, thisWeek, hadProfile) {
  if (firstWeek == null || firstWeek === '') return hadProfile ? 'pre' : 'new';
  const a = dateOf(firstWeek), b = dateOf(thisWeek);
  if (!a || !b) return null;
  // 달력 날짜의 차이 — UTC 자정끼리 나누면 서머타임이 끼어도 하루가 어긋나지 않는다(곱셈 산술 금지 가드).
  const days = Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000);
  const w = Math.floor(days / 7);
  if (w < 0) return null;   // 기기 시계를 되돌렸다 — 모르는 값은 보내지 않는다
  if (w === 0) return 'w0';
  if (w === 1) return 'w1';
  if (w <= 3) return 'w2-3';
  if (w <= 7) return 'w4-7';
  return 'w8+';
}

function alertsFor(a) {
  var CHK = a.checkpoints, TIMELINE = a.timeline, CHG = a.changes;
  var role = a.role || null, doneIds = a.doneIds || null;
  var profile = { stage: a.stage, dueDate: a.dueDate };
  var D = a.weeks != null ? { weeks: a.weeks } : null;
  var TODAY = a.today;
  var out = [];
  var seen = {};
  var todayStr = fmtDate(TODAY);
  function addA(on, title, body, tag) {
    if (!on || on <= todayStr || seen[tag]) return;
    seen[tag] = 1;
    out.push({ on: on, title: title, body: body, tag: tag });
  }
  /* ① 법정 기한 — 확정 날짜가 있는 것만 */
  (CHK || []).forEach(function (c) {
    if (!c.item || !c.item.isLegalDeadline || c.estimated || !c.date || c.daysLeft == null || c.daysLeft < 0) return;
    // 자격 미확인·해당 없음·지난 것에는 기한 알림을 만들지 않는다(위 계약).
    if (c.state === 'unknown' || c.state === 'na' || c.state === 'past') return;
    if (doneIds && doneIds[c.item.id]) return;
    var who = c.item.who;
    if (role && who && who !== 'both' && who !== role) return;
    var md = fmtKDate(c.date);
    addA(fmtDate(addDays(c.date, -7)),
      c.item.name + ' — 기한 7일 전', '기한이 ' + md + '까지입니다.', 'dl7-' + c.item.id);
    addA(fmtDate(addDays(c.date, -1)),
      c.item.name + ' — 기한 하루 전', '내일(' + md + ')이 기한입니다.', 'dl1-' + c.item.id);
  });
  /* ② 주차 전환 — 다가오는 8번의 주 경계(예정일 역산). 4주였을 때는 한 달만 안 열어도
        주차 알림이 끊겼다(2026-09-10). */
  if (profile.stage === 'pregnant' && profile.dueDate && D && D.weeks != null) {
    var due = new Date(profile.dueDate + 'T00:00:00');
    for (var w = D.weeks + 1; w <= Math.min(D.weeks + 8, 42); w++) {
      var start = fmtDate(addDays(due, -(280 - w * 7)));
      var tests = (TIMELINE || []).filter(function (t) {
        return t.weekFrom != null && t.weekFrom <= w && w <= (t.weekTo != null ? t.weekTo : t.weekFrom) && countsAsWeekTest(t, a.conditions);
      }).length;
      addA(start, w + '주차가 시작됐어요',
        tests ? '이번 주에 해당하는 검사·진료가 ' + tests + '건 있습니다. 오늘 탭에서 확인해 보세요.'
              : '이번 주의 몸의 변화와 생활수칙을 오늘 탭에서 확인해 보세요.', 'wk-' + w);
    }
  }
  /* ③ 개정 시행 — 나에게 해당하는 것의 시행 당일 아침 */
  (CHG || []).forEach(function (c) {
    if (!c.change || !c.change.effectiveFrom || c.relevant !== true) return;
    addA(c.change.effectiveFrom, '오늘부터: ' + c.change.title, c.change.summary || '', 'law-' + c.change.id);
  });
  /* ④ 월령 시기 — 출산 뒤, 출생일이 있을 때만. 시작일 = 출생일 + monthFrom 개월(달력 기준,
        그 달에 같은 날짜가 없으면 다음 달 1일 — 엔진 derive 의 childAgeMonths 가 개월을 올리는 날과 같다).
        오늘 이후 ~ 90일 안 시작일을 날짜별 알림 하나로 묶는다. 접종 시기는 아이마다 범위가 있으므로
        "시기가 시작됐습니다"까지만 말하고 날짜·횟수를 단정하지 않는다. 완료 표시는 화면과 같은 항목 id 키. */
  var birth = a.birthDate ? toDate(a.birthDate) : null;
  if (a.stage === 'postpartum' && birth && Array.isArray(a.months)) {
    var limit = fmtDate(addDays(TODAY, 90));
    var groups = {}, order = [];
    a.months.forEach(function (it) {
      if (!it || typeof it.monthFrom !== 'number' || !isFinite(it.monthFrom) || it.monthFrom < 0 || Math.floor(it.monthFrom) !== it.monthFrom) return;
      if (doneIds && doneIds[it.id]) return;
      var first = new Date(birth.getFullYear(), birth.getMonth() + it.monthFrom, 1);
      var lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
      var st = birth.getDate() > lastDay
        ? new Date(first.getFullYear(), first.getMonth() + 1, 1)
        : new Date(first.getFullYear(), first.getMonth(), birth.getDate());
      var on = fmtDate(st);
      if (on <= todayStr || on > limit) return;
      if (!groups[on]) { groups[on] = { n: it.monthFrom, names: [] }; order.push(on); }
      groups[on].names.push(it.name);
    });
    order.forEach(function (on) {
      var g = groups[on], shown = g.names.slice(0, 3).join(', ');
      if (g.names.length > 3) shown += ' 등 ' + g.names.length + '건';
      addA(on, '생후 ' + g.n + '개월 — 접종·검진 시기예요',
        shown + ' 시기가 시작됐습니다. 정확한 시기는 오늘 탭에서 확인해 보세요.', 'mo-' + on);
    });
  }
  // 날짜순 — 40개 상한에 걸리면 먼 것부터 떨어진다(정렬은 안정적이라 같은 날짜는 만든 순서).
  out.sort(function (x, y) { return x.on < y.on ? -1 : x.on > y.on ? 1 : 0; });
  return out.slice(0, 40);
}

/* ── 공유 카드 데이터 ──────────────────────────────────────────────
   카드는 사용자가 직접 밖으로 내보내는 이미지다. 화면에 이미 보이는 값과
   본인이 공유를 누른 사실만 담는다 — 소득·건강 플래그·배우자 완료율은
   절대 넣지 않는다(가드 테스트가 이 파일의 참조 필드를 고정한다).
   그리기는 화면(캔버스) 몫이고, 여기는 "무엇을 쓸지"만 정한다. */

/** 이번 주 카드 — 주차·출산까지 일수·이번 주 검사·나의 준비 현황. */
function weeklyCardData(a) {
  // a = { weeks, dueDate, today, timeline, checkpoints, doneIds, role, conditions }
  const due = toDate(a.dueDate);
  // 예정일까지 남은 날. 지나면 0 에서 멈춘다(D-day 표시가 음수로 내려가지 않게).
  const left = due ? Math.max(0, Math.round((due.getTime() - a.today.getTime()) / 86400000)) : null;
  // '며칠째'는 잘리지 않은 값으로 센다 — 아래 dayPart 주석 참조.
  const rawLeft = due ? Math.round((due.getTime() - a.today.getTime()) / 86400000) : null;
  const tests = (a.timeline || []).filter(
    (t) => t.weekFrom != null && t.weekFrom <= a.weeks && a.weeks <= (t.weekTo != null ? t.weekTo : t.weekFrom) && countsAsWeekTest(t, a.conditions)
  ).length;
  const mine = (a.checkpoints || []).filter(
    (c) => c.item && (c.item.who === a.role || c.item.who === 'both') && (c.state === 'now' || c.state === 'soon')
  );
  const doneN = mine.filter((c) => a.doneIds && a.doneIds[c.item.id]).length;
  /* 주차의 '몇 일째' — 예정일 역산(280일)이라 정확하다.
     left(0 에서 자른 값)를 쓰면 예정일 이후 280 % 7 === 0 이라 영구히 0 이 되어
     화면에서 '며칠째'가 사라졌다. 잘리지 않은 rawLeft 로 세면 예정일을 넘겨도
     7일 주기로 계속 순환한다. 음수 나머지를 피하려고 +7 후 다시 % 7 한다. */
  const dayPart = rawLeft != null ? (((280 - rawLeft) % 7) + 7) % 7 : null;
  const rows = [
    { k: '이번 주 검사·진료', v: tests + '건' },
    { k: '지금 챙길 일', v: doneN + ' / ' + mine.length + '건 완료' },
  ];
  return {
    kind: 'week',
    weeks: a.weeks,
    dayPart,
    left,
    big: String(a.weeks),
    unit: '주차',
    title: '우리 가족의 이번 주',
    rows,
    footer: '챙길 건 정확하게, 기다림은 함께 · yebuapp.github.io',
  };
}

/**
 * 혜택 합계가 지금 무엇을 뜻하는지 한 곳에서 판정한다.
 *
 * 화면은 여섯 상태를 가르는데 요약 공유는 두 갈래, 카드는 갈래가 아예 없어
 * 늘 숫자를 찍었다. 그래서 같은 사실이 표면마다 다르게 나갔다 — 정보가 부족한
 * 사람의 카드에는 '0만원'이, 정말 0원인 사람의 공유문에는 '아직 계산 전'이.
 * 사실은 하나이므로 판정도 하나여야 한다. 각 표면은 표현만 다르게 한다.
 */
function moneyState(a) {
  // a = { totalWon, confirmedCount, needCount, questionCount, noAmountCount, futureCount, hasRegion }
  const total = a.totalWon || 0;
  if (total > 0) {
    return {
      code: 'HAS_AMOUNT', totalWon: total, confirmedCount: a.confirmedCount || 0,
      // 지역이 없으면 전국 공통분만 더한 것이라 '우리 동네 금액'이 아니다.
      partial: !a.hasRegion,
      questionCount: a.questionCount || 0, needCount: a.needCount || 0,
    };
  }
  // 전국 공통 제도 중 금액이 사용자의 입력(칸 이름)만 없어 비어 있는 것이 있으면 그 칸을 함께 돌려준다(plan 090-B).
  if (!a.hasRegion) return { code: 'NO_REGION', askField: a.nationalAskField || null };
  // 물어볼 것이 남아 있어야 '더 알려주시면'이라고 말할 수 있다. 부족한 값이
  // 없는 보류는 우리 데이터가 빈 것이라 사용자가 답해도 풀리지 않는다.
  if ((a.needCount || 0) > 0 && (a.questionCount || 0) > 0) {
    return { code: 'NEEDS_INPUT', questionCount: a.questionCount, needCount: a.needCount };
  }
  if ((a.noAmountCount || 0) > 0) return { code: 'NO_CASH_VALUE', noAmountCount: a.noAmountCount };
  if ((a.futureCount || 0) > 0) return { code: 'NOT_YET', futureCount: a.futureCount };
  // 빠진 정보 없이 계산했는데 해당하는 금액 제도가 없다 — 이때만 0원이 사실이다.
  return { code: 'TRUE_ZERO' };
}

/** 혜택 카드 — 화면과 같은 판정에서 나온다. 0원은 진짜 0일 때만 찍는다. */
function benefitCardData(a) {
  // a = { region(표시명 또는 null), state(moneyState 결과) }
  const st = a.state || { code: 'TRUE_ZERO' };
  const head = (a.region ? a.region + ' ' : '');
  const base = { kind: 'money', footer: 'yebuapp.github.io · 공식 출처로 확인한 금액입니다' };
  // 금액을 찍지 않는 카드에 '확인한 금액입니다'라고 적으면 없는 금액을 있다고 말한다.
  const sayBase = { kind: 'money', footer: 'yebuapp.github.io · 공식 출처로 확인한 제도만 셉니다' };
  if (st.code === 'HAS_AMOUNT') {
    const rows = [{ k: '확인된 제도', v: st.confirmedCount + '건' }];
    if (st.partial) rows.push({ k: '지역을 넣으면', v: '우리 동네 제도까지' });
    else if (st.questionCount > 0) rows.push({ k: st.questionCount + '가지를 더 넣으면', v: '+' + st.needCount + '건 판단 가능' });
    // 만원 아래를 반올림하지 않는다 — 105,000원이 '11만원'으로 나가면 받는 사람에게 그대로 사실이 된다(ENG.won 과 같은 표기).
    const w = st.totalWon;
    const rest = w % 10000;
    const big = w >= 10000 ? Math.floor(w / 10000).toLocaleString('ko-KR') : w.toLocaleString('ko-KR');
    const unit = w < 10000 ? '원' : (rest === 0 ? '만원' : '만 ' + rest.toLocaleString('ko-KR') + '원');
    return { ...base, big, unit,
      title: head + (st.partial ? '전국 공통 출산 혜택' : '확인된 출산 혜택'), rows };
  }
  if (st.code === 'TRUE_ZERO') {
    return { ...base, big: '0', unit: '만원', title: head + '확인된 출산 혜택',
      rows: [{ k: '빠진 정보', v: '없음' }] };
  }
  // 아직 모르는 금액은 숫자로 찍지 않는다 — 카드는 받는 사람에게 그대로 사실이 된다.
  const say = {
    NO_REGION: ['아직 계산 전입니다', [{ k: '필요한 것', v: '우리 동네' }]],
    NEEDS_INPUT: [st.questionCount + '가지만 더 답하면\n계산할 수 있습니다',
      [{ k: '판단을 미뤄 둔 제도', v: st.needCount + '건' }]],
    NO_CASH_VALUE: ['금액으로 환산할 수 없는\n혜택만 있습니다',
      [{ k: '해당 혜택', v: st.noAmountCount + '가지' }]],
    NOT_YET: ['지금 단계에 해당하는\n금액 제도가 없습니다',
      [{ k: '출산 후 해당', v: st.futureCount + '건' }]],
  }[st.code];
  return { ...sayBase, say: say[0], title: head + '출산 혜택 확인', rows: say[1] };
}

/* ── 로컬 백업 ─────────────────────────────────────────────────────
   로컬 우선의 최대 약점은 기기 변경·브라우저 데이터 삭제다. 서버에 더
   올리는 대신, 사용자가 자기 파일(yebu-backup.json)로 들고 나가게 한다.
   데이터의 주인은 사용자다 — 예부 서버가 아니라. */

/** 백업에 담지 않는 프로필 필드 — 관계 상태는 내 기록이 아니다(34차).
    백업은 내 기록을 다른 기기로 옮기는 수단이지, 이미 끝난 관계를 되살리는
    수단이 아니다. 지금 배우자가 있는지는 서버(로그인) 또는 이 기기의 연결
    상태가 말한다. 백업 파일이 말하게 두면, 해제한 사용자가 옛 백업을 되돌린
    순간 있지도 않은 배우자가 둥지에 다시 그려진다(재현 확인). */
const BACKUP_OMIT = ['linkedAt'];

function stripRelationship(profile) {
  const out = { ...(profile || {}) };
  BACKUP_OMIT.forEach((k) => { delete out[k]; });
  return out;
}

function exportBackup(profile, done, theme) {
  return { app: 'yebu', v: 1, profile: stripRelationship(profile), done, theme: theme || 'system' };
}

/** 백업 파일을 검증해 적용 가능한 형태로 돌려준다. 형식이 어긋나면 이유를 말한다. */
function importBackup(o) {
  if (!o || typeof o !== 'object' || o.app !== 'yebu' || o.v !== 1) {
    return { error: '예부 백업 파일이 아닌 것 같습니다.' };
  }
  if (!o.profile || typeof o.profile !== 'object' || Array.isArray(o.profile)) {
    return { error: '백업 안의 프로필을 읽지 못했습니다.' };
  }
  const done = {};
  if (o.done && typeof o.done === 'object' && !Array.isArray(o.done)) {
    for (const k of Object.keys(o.done)) {
      const v = o.done[k];
      // 예전 형식(true)과 현재 형식({by, at}) 둘 다 받는다 — 미래의 우리가 과거 백업을 버리지 않게.
      if (v === true) done[k] = { by: null, at: null };
      else if (v && typeof v === 'object') {
        done[k] = { by: v.by ?? null, at: v.at ?? null };
        // 받은 금액 기록(plan 072) — 백업에는 담기고, 되돌릴 때도 모양을 다시 확인해 걸러 담는다.
        const rc = normReceived(v.received);
        if (rc) done[k].received = rc;
      }
    }
  }
  // 프로필은 마이그레이션을 통과시켜 낡은 백업도 현재 규칙(확인 안 된 기본값 되돌림)을 따르게 한다.
  // 관계 상태는 파일이 아니라 현재 맥락에서 온다 — 이미 배포된 옛 백업에는
  // linkedAt 이 들어 있으므로 여기서 걷어낸다(스키마 v 는 그대로 1).
  const mig = migrateProfile(sanitizeProfileFields(stripRelationship(o.profile)));
  const theme = o.theme === 'light' || o.theme === 'dark' ? o.theme : 'system';
  return { profile: mig.profile, done, theme };
}

/* ── 받은 금액 기록 (plan 072) ─────────────────────────────────────────
   '신청 완료'로 표시한 제도 행에 사용자가 직접 적는다. 저장은 새 키를 만들지 않고 기존 완료 표시
   (yebu.done) 객체에 `received: {won, date}` 로 붙는다. 기기 안에만 있다 —
   부부 동기화(syncMarkIds)는 항목 id 만 올리고, 백업 파일(exportBackup)에는 담긴다. */

const RECEIVED_MAX_WON = 1000000000;

/** 받은 금액 한 건의 모양을 확인해 깨끗한 {won, date} 로 돌려준다. 어긋나면 null.
 *  won: 1 이상 10억 이하의 정수(숫자 또는 숫자 문자열). date: YYYY-MM-DD 이거나 빈 칸(모름). */
function normReceived(r) {
  if (!r || typeof r !== 'object' || Array.isArray(r)) return null;
  const won = typeof r.won === 'string' && /^\d{1,10}$/.test(r.won.trim()) ? Number(r.won.trim()) : r.won;
  if (typeof won !== 'number' || !Number.isInteger(won) || won < 1 || won > RECEIVED_MAX_WON) return null;
  const date = r.date == null || r.date === '' ? '' : (isYmd(r.date) ? r.date : null);
  if (date === null) return null;
  return { won, date };
}

/** 지금까지 받은 금액 — 기록이 있는 완료 표시만 센다. */
function receivedSummary(done) {
  let won = 0, count = 0;
  for (const k of Object.keys(done && typeof done === 'object' ? done : {})) {
    const rc = normReceived(done[k] && done[k].received);
    if (rc) { won += rc.won; count += 1; }
  }
  return { won, count };
}

/** 서버(replace_my_marks)로 올리는 완료 표시 목록 — 항목 id 뿐이다. 받은 금액(received)과 누가·언제(by·at)는
 *  기기 밖으로 나가지 않는다. */
function syncMarkIds(done) {
  return Object.keys(done && typeof done === 'object' ? done : {});
}

/* ── 가족 읽기 전용 링크 (plan 072) ────────────────────────────────────
   주소 맨 끝 `#view=<base64url(JSON)>` — # 뒤는 서버로 전송되지 않는다. 담기는 값은 아래 일곱 칸(v 포함 여덟 키)뿐이다:
   단계·예정일(임신 중) 또는 출생일(출산 후)·시·도·시·군·구·이번 출산 전 자녀 수·태아(아기) 수.
   역할·소득·거주 기간·건강 칸·이름·완료 표시는 어떤 경로로도 들어가지 않는다 — 만드는 쪽(encodeView)이 이 칸만 읽고,
   받는 쪽(decodeView)도 이 칸만 읽고 값의 모양까지 확인한다(링크는 누구나 손으로 고쳐 쓸 수 있다). */

const VIEW_KEYS = ['v', 'stage', 'due', 'birth', 'sido', 'sigungu', 'childrenBefore', 'babies'];
const VIEW_MAX_CODE = 1000;

function isYmd(s) {
  const d = dateOf(s);
  return !!d && fmtDate(d) === s && d.getFullYear() >= 2000 && d.getFullYear() <= 2100;
}
function isPlaceName(s) { return typeof s === 'string' && /^[가-힣0-9·\s]{1,20}$/.test(s) && s.trim() === s; }
function isIntIn(n, lo, hi) { return typeof n === 'number' && Number.isInteger(n) && n >= lo && n <= hi; }

/** 프로필에서 링크에 담을 값만 뽑는다(JSON 으로 만들기 전 단계 — 테스트가 키 목록을 직접 본다). */
function viewPayload(profile) {
  const p = profile || {};
  const o = { v: 1 };
  if (VALID_STAGES.includes(p.stage)) {
    o.stage = p.stage;
    if (p.stage === 'pregnant' && isYmd(p.dueDate)) o.due = p.dueDate;
    if (p.stage === 'postpartum' && isYmd(p.birthDate)) o.birth = p.birthDate;
  }
  if (isPlaceName(p.sido)) {
    o.sido = p.sido;
    if (isPlaceName(p.sigungu)) o.sigungu = p.sigungu;
  }
  if (isIntIn(p.childrenBefore, 0, 10)) o.childrenBefore = p.childrenBefore;
  if (isIntIn(p.fetusCount, 1, 5)) o.babies = p.fetusCount;
  return o;
}

function encodeView(profile) {
  const json = JSON.stringify(viewPayload(profile));
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  bytes.forEach(function (b) { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

/** location.hash 에서 링크 부호만 꺼낸다. `#view=` 로 시작하지 않으면 null — 카카오 로그인 콜백(#access_token=…)과 섞이지 않는다. */
function parseViewHash(hash) {
  const m = /^#view=([A-Za-z0-9_-]{1,1000})$/.exec(typeof hash === 'string' ? hash : '');
  return m ? m[1] : null;
}

/** 카카오 로그인 콜백 해시(#access_token=…&refresh_token=… 또는 #error=…)를 읽는다(plan 100).
 *  판별 키는 벤더 supabase-js 2.112.4 의 _isImplicitGrantCallback 과 같다: access_token·error·error_description·error_code.
 *  그 키가 하나도 없으면 null — `#view=`(가족 읽기 전용 링크)나 빈 해시는 건드리지 않는다.
 *  error 는 error_description → error → error_code 순으로 처음 있는 값(없으면 null). */
function parseAuthHash(hash) {
  const h = typeof hash === 'string' ? hash : '';
  if (h.charAt(0) !== '#' || h.length < 2) return null;
  let p;
  try { p = new URLSearchParams(h.slice(1)); } catch (e) { return null; }
  const at = p.get('access_token'), er = p.get('error'), ed = p.get('error_description'), ec = p.get('error_code');
  if (!at && !er && !ed && !ec) return null;
  return {
    access_token: at || null,
    refresh_token: p.get('refresh_token') || null,
    error: ed || er || ec || null
  };
}

/* 로그인 시작 표식 (plan 108-B, 보안 감사 run-1 8번 로그인 바꿔치기).
   svLogin 이 sessionStorage 에 {n: 16바이트 난수 hex, at: 시작 시각(ms)} 를 JSON 으로 남기고, 돌아온 #access_token 은
   이 표식이 있고 10분 안일 때만 세션으로 쓴다. implicit 흐름은 state 를 돌려주지 않으므로 n 은 서버와 맞춰 보는 값이 아니라
   '이 탭이 로그인을 시작했다'는 표식의 모양 검사용이다. 시계가 조금 뒤로 간 경우(1분)까지는 받아 준다. */
const LOGIN_MARK_TTL_MS = 10 * 60 * 1000;
function loginMarkOk(mark, now) {
  if (typeof mark !== 'string' || !mark) return false;
  let o;
  try { o = JSON.parse(mark); } catch (e) { return false; }
  if (!o || typeof o !== 'object' || typeof o.n !== 'string' || !/^[0-9a-f]{32}$/.test(o.n)) return false;
  if (typeof o.at !== 'number' || !Number.isFinite(o.at) || typeof now !== 'number' || !Number.isFinite(now)) return false;
  const age = now - o.at;
  return age >= -60 * 1000 && age <= LOGIN_MARK_TTL_MS;
}

/** 링크 부호를 화면이 쓸 프로필 조각으로 되돌린다. 허용 칸만, 모양이 맞는 값만 — 나머지는 버린다.
 *  단계가 없거나 읽지 못하면 error(일정을 만들 수 없다). */
function decodeView(code) {
  const t = typeof code === 'string' ? code.trim() : '';
  if (!t || t.length > VIEW_MAX_CODE) return { error: '링크를 읽지 못했습니다.' };
  try {
    let b64 = t.replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || typeof o !== 'object' || Array.isArray(o) || o.v !== 1) return { error: '이 앱에서 만든 링크가 아닌 것 같습니다.' };
    if (!VALID_STAGES.includes(o.stage)) return { error: '링크에 단계가 없습니다.' };
    const profile = { stage: o.stage, dueDate: '', birthDate: '', sido: null, sigungu: null, childrenBefore: null, fetusCount: null };
    if (o.stage === 'pregnant' && isYmd(o.due)) profile.dueDate = o.due;
    if (o.stage === 'postpartum' && isYmd(o.birth)) profile.birthDate = o.birth;
    if (isPlaceName(o.sido)) {
      profile.sido = o.sido;
      if (isPlaceName(o.sigungu)) profile.sigungu = o.sigungu;
    }
    if (isIntIn(o.childrenBefore, 0, 10)) profile.childrenBefore = o.childrenBefore;
    if (isIntIn(o.babies, 1, 5)) profile.fetusCount = o.babies;
    return { profile };
  } catch (e) {
    return { error: '링크를 읽지 못했습니다.' };
  }
}

/* ── 소득 구간 어림 (plan 093) ──────────────────────────────────────────────
   가구원 수와 세전 월소득(원)으로 기준중위소득의 몇 %인지 어림한다. 판정이 아니라 어림이다 —
   제도마다 소득을 재는 방법(건강보험료·소득인정액 등)이 달라 실제 판정과 다를 수 있다.
   table = data/median-income.json 전체({ monthlyByHousehold, extraPerPersonWon }).
   경계는 '이하'를 포함한다: 정확히 80% 면 under80 (화면 선택지 "80% 이하" 와 같은 뜻).
   가구원 수가 표에 없으면 고시의 규칙(7인 값 + 1인 증가마다 extraPerPersonWon)으로, 규칙도 없으면 null.
   0·음수·숫자 아님·가구원 수가 1 미만이거나 정수가 아님 → null. */
function incomeBracketEstimate(householdSize, monthlyIncomeWon, table) {
  const n = Number(householdSize);
  const inc = Number(monthlyIncomeWon);
  if (!Number.isInteger(n) || n < 1 || n > 30) return null;
  if (!isFinite(inc) || inc <= 0) return null;
  const by = table && table.monthlyByHousehold;
  if (!by || typeof by !== 'object') return null;
  let median = by[String(n)];
  if (typeof median !== 'number') {
    const keys = Object.keys(by).map(Number).filter((k) => Number.isInteger(k) && by[String(k)] > 0);
    const top = keys.length ? Math.max(...keys) : 0;
    const step = table.extraPerPersonWon;
    if (!top || n < top || typeof step !== 'number' || !(step > 0)) return null;
    median = by[String(top)] + (n - top) * step;
  }
  if (!(median > 0)) return null;
  const percent = Math.round((inc / median) * 1000) / 10;
  const E = 1e-6;   // 부동소수 오차로 정확히 경계인 값이 한 칸 위로 넘어가지 않게
  const bracket = inc * 100 <= 80 * median + E ? 'under80'
    : inc * 100 <= 100 * median + E ? 'under100'
    : inc * 100 <= 150 * median + E ? 'under150' : 'over150';
  // 표시용 percent 는 소수 첫째 자리 반올림이라 80.04% 가 '80.0%'로 보이는데 구간은 위(100% 이하)다.
  // 구간이 경계 위인데 반올림값이 경계와 같거나 낮으면 경계+0.1 로 올려 보여준다(올림 쪽을 골라 '이하' 표기와 어긋나지 않게).
  const lower = bracket === 'under100' ? 80 : bracket === 'under150' ? 100 : bracket === 'over150' ? 150 : 0;
  const shown = lower && percent <= lower ? Math.round((lower + 0.1) * 10) / 10 : percent;
  return { percent: shown, bracket };
}

/* ── 예부 둥지 — 파생 전용 상태 (v3: 달성 누적형, 31차) ────────────────
   이미 있는 기록에서만 계산한다. 둥지를 위한 저장(서버·localStorage 새 키)은
   금지다. 점수·비교·재촉 금지(커플 3원칙).

   v3 원칙 — "해낸 것만 보여준다":
   · 조각은 사용자가 실제로 한 일의 흔적일 때만 나타난다. 미완료 표시가
     없으므로 '해당 없음'과 '못함'이 혼동될 길이 없다(N/A ≠ INCOMPLETE).
   · 누적이다 — 단계가 바뀌어도 지나온 조각은 사라지지 않는다(done 영구).
   · couple 은 성취(조각)가 아니라 둥지의 구성원이다 — 콩이 하나여도
     완전한 둥지다. 한부모·연결 미사용 사용자에게 '부족'을 만들지 않는다.
   · 이전 소스였던 '혜택 확인'(confirmedCount>0)은 제거 — 임신 준비
     단계에선 정보를 전부 채워도 구조적으로 0이라(확인 등급 제도가 전부
     금액 미확정형) 사용자가 통제할 수 없는 시스템 상태였다(31차 실측). */
function nestState(a) {
  // a = { coupled, doneIds } — doneIds 는 화면 쪽에서 '우리 가족의 완료'
  // (내 것 + 로그인 커플이면 배우자 것)를 합쳐 넘긴다.
  const doneIds = a.doneIds || {};
  const keys = Object.keys(doneIds);
  return {
    couple: !!a.coupled,
    // 첫 걸음: 하위 준비물(본체id/하위id)이 아닌 완료 1건 이상 — 신청도 포함한다.
    // '첫 준비'라 부르지 않으며(출생신고만 한 사용자에게 '준비'는 과대 — 32차),
    // 정의는 카피 그대로 '여정의 첫 걸음'이다: 신청만 한 사용자도 첫 걸음을
    // 뗀 것이 사실이므로 제외하지 않는다(33차 — 코드와 문구의 일치).
    firstStep: keys.some((k) => k.indexOf('/') < 0),
    apply: keys.some((k) => k.indexOf('apply_') === 0),
    bag: !!doneIds['birth_bag_prepare'],
    // 여정 후반(출산 후~첫돌)의 추억 — v3.1(32차). 전 가정 보편(GOOD) 항목만:
    // 아기 맞이 서류(출생신고·행복출산 원스톱), 첫 검진·접종(선천성 검사·
    // B형간염/BCG·영유아 1차 검진). id 실존은 가드가 데이터와 대조한다.
    docs: !!(doneIds['birth_registration'] || doneIds['happy_birth_onestop']),
    care: !!(doneIds['newborn_screening'] || doneIds['newborn_vaccination'] || doneIds['infant_health_checkup']),
  };
}

/* 화면에 보이는 날짜를 '2026년 1월 1일' 하나로 맞춘다(첫 방문자 점검 C③).
   데이터 문장에는 '2026-01-01'(ISO)과 '2026. 1. 1.'(점) 두 모양이 섞여 있어, 한 화면에서 같은 날이 다르게 읽혔다.
   ① 앞뒤가 숫자·영문·밑줄·하이픈 등으로 이어진 것은 날짜가 아니라 식별자·주소의 일부이므로 바꾸지 않는다
     (gov24_374000000136, https://a.b/2026-01-01, 2026-01-01T09:00 …).
   ② 월 1~12·일 1~31 밖의 숫자 모양(예: 2026.13.45)은 날짜로 보지 않고 그대로 둔다.
   ③ 점 사이에 공백이 있는 표기('2025. 7. 10.')의 끝 점은 언제나 날짜의 일부로 보고 함께 걷는다.
      공백 없는 표기('2026.1.1.')도 공문서는 날짜 끝 점이 흔해(실데이터 근거) 함께 걷되,
      끝 점 뒤가 문자열 끝(또는 공백만 남은 끝)이면 문장 부호이므로 남긴다.
   ④ 달력에 없는 날(2026.2.31 등)은 날짜로 보지 않고 그대로 둔다.
   원문 칸(amountText 등)과 근거 인용(evidence.quote)에는 쓰지 않는다 — 글자를 바꾸지 않는 것이 그 칸들의 약속이다. */
const ISO_DATE_IN_TEXT = /(^|[^0-9A-Za-z_\-./:=?&%#])(\d{4})-(\d{2})-(\d{2})(?![0-9A-Za-z_\-])/g;
const DOT_SPACED_DATE_IN_TEXT = /(^|[^0-9A-Za-z_\-./:=?&%#])(\d{4})\.\s+(\d{1,2})\.\s+(\d{1,2})(?![0-9])(\.)?/g;
const DOT_DATE_IN_TEXT =/(^|[^0-9A-Za-z_\-./:=?&%#])(\d{4})\.\s?(\d{1,2})\.\s?(\d{1,2})(?![0-9])(\.(?!\s*$))?/g;
function fmtDatesInText(s) {
  if (typeof s !== 'string' || !s) return s;
  const kdate = (all, pre, y, m, d) => {
    const mm = Number(m), dd = Number(d);
    if (mm < 1 || mm > 12 || dd < 1 || dd > 31) return all;
    // 달력에 없는 날(2.31·4.31 등)은 만들어 내지 않고 원문 그대로 둔다.
    const t = new Date(Date.UTC(Number(y), mm - 1, dd));
    if (t.getUTCFullYear() !== Number(y) || t.getUTCMonth() !== mm - 1 || t.getUTCDate() !== dd) return all;
    return pre + y + '년 ' + mm + '월 ' + dd + '일';
  };
  return s.replace(ISO_DATE_IN_TEXT, kdate).replace(DOT_SPACED_DATE_IN_TEXT, kdate).replace(DOT_DATE_IN_TEXT, kdate);
}

/* 공문서 원문 칸(지원 대상·금액·신청 방법·서류·선정 기준·지급 시기)을 줄 단위로 나눈다(2026-09-30).
   원문은 "○ …\r\n - …\r\n※ …"처럼 줄머리 기호로 나열돼 있는데, 화면이 한 문단으로 이어 붙이면
   "○ … ○ … ※ …"가 한 줄에 늘어서 읽을 수 없다(90차 실측: 지역 제도 253건 751칸).
   글자는 하나도 바꾸지 않는다 — 줄머리의 나열 기호(○·ㅇ·●·- 등)만 떼어 목록 모양으로 돌려주고,
   ※·*(참고)는 기호째 남긴다. 번호("1.")는 순서라서 남긴다.
   kind: 'plain'(나열이 아닌 한 줄) | 'item' | 'sub'(앞 항목의 하위 "- …") | 'note'(※·*) */
const SRC_ITEM = /^[○ㅇ●◦□■▶▷◆◇•∙]\s*/;
const SRC_SUB = /^[-–]\s*/;
function srcLines(text) {
  if (text == null) return [];
  const lines = String(text).replace(/\r/g, '').split('\n').map((s) => s.trim()).filter(Boolean);
  if (!lines.length) return [];
  if (lines.length === 1 && !SRC_ITEM.test(lines[0]) && !SRC_SUB.test(lines[0])) return [{ kind: 'plain', text: lines[0] }];
  const out = [];
  // 하이픈 줄이 하위가 되려면 그 앞에 하이픈이 아닌 항목(○ 줄이나 기호 없는 줄)이 있어야 한다 —
  // 처음부터 하이픈으로 나열한 원문("- 신청대상 …\n- 신청자격 …")은 모두 같은 층이다.
  let parent = false;
  for (const s of lines) {
    if (/^[※*]/.test(s)) { out.push({ kind: 'note', text: s }); continue; }
    if (SRC_SUB.test(s)) {
      out.push({ kind: parent ? 'sub' : 'item', text: s.replace(SRC_SUB, '') || s });
      continue;
    }
    parent = true;
    out.push({ kind: 'item', text: s.replace(SRC_ITEM, '') || s });
  }
  return out;
}

/* ── 출생 순위별 금액표의 범위 (plan 086-3) ─────────────────────────────────
   자녀 수를 모르면 엔진은 금액을 정하지 못한다(합계에도 넣지 않는다). 화면은 표의 최솟값~최댓값만 말해 준다.
   0원(= 그 순위는 지급 없음)과 숫자가 아닌 값은 뺀다. 지급되는 칸이 없으면 null. */
function orderAmountRange(table) {
  if (!table || typeof table !== 'object') return null;
  const vals = Object.keys(table).map((k) => table[k]).filter((v) => typeof v === 'number' && isFinite(v) && v > 0);
  if (!vals.length) return null;
  return { min: Math.min(...vals), max: Math.max(...vals) };
}

/* ── 조사 고르기 (plan 086-13) ──────────────────────────────────────────────
   word 의 마지막 글자 받침 유무로 withFinal / noFinal 을 고른다. '으로' 는 ㄹ 받침도 '로'.
   한글이 아닌 끝 글자(숫자·영문·기호)는 받침이 없는 것으로 본다. 빈 값은 noFinal 만 돌려준다. */
function josa(word, withFinal, noFinal) {
  const s = String(word == null ? '' : word).trim();
  const code = s ? s.charCodeAt(s.length - 1) : 0;
  if (code < 0xAC00 || code > 0xD7A3) return noFinal;
  const jong = (code - 0xAC00) % 28;
  if (jong === 0) return noFinal;
  if (withFinal === '으로' && jong === 8) return noFinal;   // ㄹ 받침: 서울로, 으로가 아니다
  return withFinal;
}

/* ── 지역 없이 보이는 행 (plan 095) ─────────────────────────────────────────
   지역(시·도)을 안 골랐으면 전국 제도만 보인다. row 는 평가 결과 {program:{layer}} 또는 신청 행 {layer} 둘 다 받는다. */
function shownWithoutRegion(row, hasSido) {
  if (hasSido) return true;
  const layer = row && row.program ? row.program.layer : row && row.layer;
  return layer === 'national';
}

/* ── 지역 없을 때 전국 제도가 기다리는 칸 고르기 (plan 097) ───────────────────
   rows: [{ status, layer, value, needsField }] — 엔진 결과의 최소 모양.
   '해당은 맞는데 금액만 비어 있고 칸 이름(needsField)이 있는' 전국 제도를 칸별로 센다.
   건수가 많은 칸 먼저, 같으면 태아 수(fetusCount) 먼저. 후보가 없으면 null. */
const NATIONAL_ASK_ORDER = ['fetusCount', 'childrenBefore'];
function nationalAskFieldPick(rows) {
  const count = {};
  (rows || []).forEach((r) => {
    if (r && r.status === 'eligible' && r.layer === 'national' && r.value == null
      && NATIONAL_ASK_ORDER.indexOf(r.needsField) >= 0) {
      count[r.needsField] = (count[r.needsField] || 0) + 1;
    }
  });
  let best = null;
  NATIONAL_ASK_ORDER.forEach((f) => {
    if (count[f] && (best == null || count[f] > count[best])) best = f;
  });
  return best;
}

/* ── 전국 합계만 나온 상태(partial)에서 같은 칸을 안내하는 문장 (plan 101) ──────
   합계가 이미 있어도 '답하면 금액이 생기는 제도'가 남아 있으면 그 칸을 알린다.
   금액은 답 전에는 모르므로 쓰지 않고, 제도 이름은 평가 결과의 이름 그대로다. */
function nationalAskNames(rows, field) {
  return (rows || []).filter((r) => r && r.status === 'eligible' && r.layer === 'national'
    && r.value == null && r.needsField === field && r.name).map((r) => r.name);
}
function nationalAskSentence(label, names) {
  if (!label || !names || !names.length) return '';
  const what = names.length === 1 ? names[0] + '의' : names[0] + ' 등 ' + names.length + '건의';
  return label + josa(label, '을', '를') + ' 알려주시면 ' + what + ' 금액을 계산할 수 있습니다.';
}

/* 칸 이름 → 화면 라벨. 태아 수는 임신 중에만 '태아 수', 출산 후에는 '아기 수'. */
function nationalAskLabel(field, stage) {
  if (field === 'fetusCount') return stage === 'postpartum' ? '아기 수' : '태아 수';
  if (field === 'childrenBefore') return '이번 출산 전 자녀 수';
  return null;

const HAN_FIRST = 0xAC00;

  if (last0.t === 16) {
