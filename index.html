<style>
/* ===========================================================================
   예부 — 디자인 토큰 (2026-09-17 리디자인, Claude Design 시안 design/2026-09-14-claude-design.css)
   바탕은 웜 크림, 글자는 보랏빛 무채색, 채도 있는 색은 강조(인디고)와 경고(빨강) 둘.
   상태 파스텔은 뜻이 고정된 둘뿐이다 — 피치=주의·곧 / 로즈=병원·기한 경고. 버터는 피치의
   옅은 변형(안내 강조 전용). 초록은 쓰지 않는다 — 정부 디자인 기준(KRDS)이 적록 조합을
   피하라고 명시한다. 완료는 색이 아니라 상태로 보인다.

   라이트를 :root 에 완전히 정의하고, 다크는 토큰만 다시 쓴다.
   테마는 세 상태다: 명시 라이트 / 명시 다크 / 미지정(=OS 설정).
   글자색/바탕색 쌍은 라이트·다크 모두 4.5:1 이상 — 가드(template.guard)가 계산으로 못박는다.
   =========================================================================== */
:root {
  --bg:             #F7F3EC;
  --surface:        #FFFFFF;
  --sunken:         #F2EDE4;
  --ink:            #221F2B;
  --sub:            #55505F;
  --mut:            #6E687B;
  --line:           #E7E1D6;
  --hair:           #EFEAE1;
  --line-2:         #CFC8BA;
  --accent:         #4A45C9;
  --accent-tint:    #EEEDFB;  /* 부드러운 면 채움 — 잉크 금지, 선택 상태·장식 전용 */
  --blush:          #F0A8B8;  /* 일러스트 전용(볼터치·하트) — UI·텍스트 사용 금지 */
  --on-accent:      #FFFFFF;
  --fill:           #221F2B;
  --on-fill:        #F7F3EC;
  --fill-sub:       #CFC8BA;
  --accent-on-fill: #A9A4FF;
  --alert:          #B3261E;
  --alert-bg:       #FCECEA;
  --on-alert:       #FFFFFF;
  --peach:          #FDF3E0;
  --on-peach:       #6E4700;
  --rose:           #FCECEA;
  --on-rose:        #8A2018;
  --butter:         #FBF4DF;
  --on-butter:      #6E4700;
  --chip:           #F2EDE4;
  --scrim:          rgba(20, 16, 26, .45);
  --radius:         20px;
  --radius-sm:      14px;
  --radius-xs:      12px;
  --shadow:         0 2px 10px rgba(34, 31, 43, .06);
  --shadow-bar:     0 6px 24px rgba(34, 28, 20, .16);
  /* 글꼴 — 한글은 굵기가 실제로 있는 Noto Sans KR 하나, 숫자는 IBM Plex Sans, 출처·날짜는 IBM Plex Mono */
  --f-kr:   'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --f-num:  'IBM Plex Sans', 'Noto Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', 'Noto Sans KR', ui-monospace, monospace;
  /* 글자 크기 6단 — 이 밖의 값을 새로 만들지 않는다 */
  --fs-display: 40px;
  --fs-title:   22px;
  --fs-heading: 17px;
  --fs-body:    16px;
  --fs-body-s:  15px;
  --fs-label:   13px;
}
@media (prefers-color-scheme: dark) {

    --sunken:         #272432;

    --fill:           #F1EEF6;
    --on-fill:        #14131A;
    --fill-sub:       #55505F;
    --accent-on-fill: #4A45C9;
    --alert:          #FFB3AB;
    --alert-bg:       #2E1E1D;
    --on-alert:       #14131A;
    --peach:          #2E2718;
    --on-peach:       #E8C07A;
    --rose:           #2E1E1D;

    --shadow-bar:     0 6px 24px rgba(0, 0, 0, .5);
  }
}

  --bg:             #14131A;
  --surface:        #1E1C26;

  --chip:           #272432;
  --scrim:          rgba(0, 0, 0, .6);
  --shadow:         0 2px 10px rgba(0, 0, 0, .4);
  --shadow-bar:     0 6px 24px rgba(0, 0, 0, .5);

/* ===========================================================================
   타이포 — 본문 Noto Sans KR 16/1.65, 굵기는 400 본문 · 500 라벨 · 600 제목 · 700 큰 제목·숫자.
   한글은 어절 단위로만 줄을 바꾼다(keep-all) — 2026-09-14 실측: 한 화면에 낱말이 중간에서
   끊긴 곳이 8~110곳이었다. 자간은 주지 않는다. 숫자는 tabular-nums 로 줄을 맞춘다.
   =========================================================================== */
*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-kr);
  font-weight: 400;
  font-size: var(--fs-body);
  line-height: 1.65;
  word-break: keep-all;
  overflow-wrap: break-word;
  text-wrap: pretty;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
b, strong { font-weight: 600; }

/* 숫자 — 자릿수가 흔들리지 않게. 큰 숫자·기한·금액은 숫자 전용 글꼴. */
.num { font-variant-numeric: tabular-nums; }
/* 화면에는 안 보이고 화면 읽기 프로그램에는 읽히는 제목 — 탭마다 h1 하나. */
.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap;
}
.big, .kv-value, .dbox-value, .row-when, .row-money, .sec-head .count, .chip .num, .badge, .steps-count, .onb-n, .nest-chip b {
  font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
}
/* 큰 제목 — 같은 글꼴, 실제 700 굵기. (옛 Jua 는 굵기가 하나라 600·700 을 주면 번져 보였다) */
.display, .brand-name, .sec-head h3, .slab h2, .sheet-head h2, .dad-title, .sos-title, .nest h3,
.onb-title, .optcard b, .me-h, .me-title, .hero-say { font-weight: 700; letter-spacing: -0.02em; }

/* 스크립트가 올 때까지 보이는 안내(plan 111 B4) — 테마 토큰 색만 쓴다. 첫 render 가 #app 을 통째로 덮는다. */
.boot { margin: auto; padding: 24px; text-align: center; }
.boot-name { font-size: var(--fs-heading); font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
.boot-sub { margin-top: 4px; font-size: var(--fs-body-s); color: var(--sub); }

/* --- 셸 ------------------------------------------------------------------ */
.app {
  max-width: 480px;
  margin: 0 auto;
  /* min-height 가 아니라 height 다. min-height 로 두면 내용이 길 때 셸이 화면보다
     커지고, 그러면 아래 .scroll 이 내부 스크롤을 만들지 않아 **문서 전체가** 스크롤된다.
     그 결과 탭바가 문서 맨 아래로 밀려나 신청 탭에서는 7,000px 넘게 내려야 다른 탭으로
     갈 수 있었다(2026-09-07 실측: 오늘 4,261 · 할 일 5,060 · 신청 7,172px).
     같은 이유로 재렌더 때 위치를 지키는 코드(.scroll.scrollTop 을 읽고 쓰는 일곱 곳)가
     전부 무효였다 — .scroll 이 스크롤되지 않으니 언제나 0 이었다.
     dvh 를 모르는 브라우저를 위해 vh 를 먼저 적는다(뒤엣것이 이긴다). */
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 24px;
  /* 셸이 화면 높이에 고정되면 문서에는 스크롤이 없다 — 그래도 iOS 는 경계에서
     화면 전체를 끌어당긴다. 스크롤을 이 상자 안에 가둔다. */
  overscroll-behavior-y: contain;
}

/* --- 상단 --------------------------------------------------------------- */
.top {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: max(12px, env(safe-area-inset-top)) 12px 6px 16px;
}
.brand { flex-shrink: 1; min-width: 0; display: flex; align-items: center; gap: 10px; color: var(--accent); }
.brand svg { width: 36px; height: 36px; flex-shrink: 0; padding: 4px; border-radius: 999px; background: var(--accent-tint); }
.brandcol { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; }
.brand-name { font-size: 19px; }
/* 지역·역할 한 줄 — 본문 글꼴·본문 굵기. */
.place {
  display: flex; align-items: baseline; gap: 4px; min-width: 0; flex-shrink: 1; overflow: hidden;
  font-family: var(--f-kr); font-weight: 400; margin-top: 1px;
}
.place em { font-style: normal; color: var(--mut); font-size: var(--fs-label); white-space: nowrap; overflow: hidden; flex-shrink: 998; }
/* 지역명은 줄바꿈하지 않는다 — 30차 실측에서 '노원구'가 세로로 꺾였다 */
.place b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* 상단바 폭 배분 — 지역명이 마지막까지 살아남는다(38차 실기기 제보).
   ① 시·도는 지역명보다 먼저·훨씬 많이 줄어들고 ② 폰 폭에서는 시·도를 아예 접는다
   (잘린 '서울…'은 정보가 아니라 노이즈다. 전체 지역은 내 정보 화면에 있다). */
.place b { flex-shrink: 1; }
.place span { flex-shrink: 999; }
/* 폰 폭에서는 여백부터 내주고 시·도를 접는다 — 글자를 자르기 전에 줄일 것이 먼저다.
   기준은 가장 긴 시·군·구 이름 네 글자('남양주시')가 온전히 서는 것이다. */
@media (max-width: 480px) {
  .place span { display: none; }
  .top { padding-left: 12px; padding-right: 8px; gap: 6px; }
}
/* 가장 좁은 기기에서는 여백을 한 번 더 내준다(41차 실측: 305px 폭에서 '남양주시'가 4px 모자랐다). */
@media (max-width: 360px) {
  .top { padding-left: 8px; padding-right: 4px; gap: 4px; }
}
/* 지역 자리에 네 글자보다 긴 안내 문구('지역 미설정'·'시군구 미선택')가 설 때만 글자를 한 단계 줄인다.
   지역 이름 자체는 절대 줄이지 않는다. */
.top.wideplace .place b { font-size: 12px; }
/* 자리에 못 들어갈 시·도 이름은 아예 접는다(38차). */
.top.hidesido .place span { display: none; }
.place b { font-weight: 500; font-size: var(--fs-label); color: var(--sub); }
.place span {
  font-size: var(--fs-label); font-weight: 400; color: var(--mut);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbtns { margin-left: auto; display: flex; gap: 0; flex-shrink: 0; align-items: center; }
.iconbtn {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink); border-radius: var(--radius-xs);
}
.iconbtn:active { background: var(--sunken); }
.iconbtn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* --- 히어로 (주차·D-day) — 첫 카드 ------------------------------------------ */
.hero {
  margin: 4px 16px 0; padding: 18px 20px 16px;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
}
.hero-row { display: flex; align-items: flex-end; gap: 16px; }
/* 히어로 오른쪽 작은 둥지 — 캐릭터는 레이어다. 정보(주차·D-day)가 먼저 선다. */
.hero-nest { margin-left: auto; flex-shrink: 0; }
.hero-nest svg { display: block; width: 100px; height: auto; }
/* 또래 중앙값 해설 카드 — 표기 의무 문장을 접지 않되 작게. */
.fetal-note { margin-top: 10px; }
.fetal-note .lead { font-size: var(--fs-body-s); }
.fetal-note .dl dd { font-size: var(--fs-label); color: var(--sub); }
.fetal-note .warn { font-size: var(--fs-label); }
/* 오늘 탭 '내 돈 한 줄' 카드 */
.money-card .kv-label { margin-bottom: 2px; }
.money-card .big { font-size: 32px; }
.money-card .hero-say { font-size: var(--fs-heading); }
.big {
  font-weight: 700;
  font-size: var(--fs-display);
  line-height: 1.05;
  letter-spacing: -0.03em;
}
.big-unit { font-size: var(--fs-heading); font-weight: 500; color: var(--sub); padding-bottom: 3px; margin-left: 3px; }
.hero-side { display: flex; flex-direction: column; gap: 6px; padding-bottom: 2px; min-width: 0; }
.kv-label { font-size: var(--fs-label); font-weight: 500; color: var(--mut); line-height: 1.4; }
.kv-value { font-size: var(--fs-title); font-weight: 700; line-height: 1.2; }
.kv-btn {
  display: flex; flex-direction: column; gap: 6px;
  background: none; border: 0; padding: 0; text-align: left;
  font-family: inherit; color: inherit; min-height: 44px;
  justify-content: center; margin: -8px 0;
}
.qmark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 999px;
  background: var(--accent-tint); color: var(--accent);
  font-size: 12px; font-weight: 600; vertical-align: middle;
}
.kv-note { font-size: var(--fs-label); line-height: 1.55; color: var(--sub); max-width: 220px; }
.kv-value small { font-size: var(--fs-label); font-weight: 500; color: var(--sub); margin-left: 2px; font-family: var(--f-kr); }
.hero-note { font-size: var(--fs-body-s); font-weight: 400; line-height: 1.6; color: var(--sub); }
/* 합계 숫자에 바로 붙는 사실 한 줄 — 경고가 아니라 그 숫자의 뜻이라 경고색을 쓰지 않는다. */
.hero-split { font-size: var(--fs-label); font-weight: 500; line-height: 1.5; color: var(--sub); margin-top: 2px; }
.hero-split b { font-weight: 700; color: var(--ink); }
/* 임신 중 '아이가 태어나면 더해지는 금액' — 지금 합계에 같은 무게로 붙으면 두 숫자를 하나로 읽는다.
   선으로 나누고 숫자는 kv-value 로 한 단 작게 둔다(새 글자 크기를 만들지 않는다). */
.hero-after { margin-top: 8px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
/* 금액을 아직 모를 때 그 자리에 서는 문장 — 숫자만큼의 무게를 갖되 숫자인 척은 하지 않는다. */
.hero-say { font-size: 20px; line-height: 1.4; }
/* 박스형 D-day — 면 채움은 선택·장식 전용 accent-tint */
.dbox { margin-left: auto; flex-shrink: 0; background: var(--accent-tint); border-radius: var(--radius-sm); padding: 10px 14px 11px; text-align: right; }
.dbox-label { font-size: var(--fs-label); font-weight: 500; color: var(--accent); }
.dbox-value { margin-top: 2px; font-size: var(--fs-title); font-weight: 700; color: var(--accent); line-height: 1.2; }
.hero-kv { display: flex; gap: 20px; margin-top: 14px; align-items: flex-end; }

/* --- 색면 블록 (지금은 쓰지 않는 자리 — 토큰 짝은 가드가 대비를 잰다) ---------- */
.slab {
  margin: 0 16px 20px;
  background: var(--fill);
  color: var(--on-fill);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 20px 18px;
}
.slab-eyebrow {
  display: flex; align-items: center; gap: 7px;
  font-size: var(--fs-label); font-weight: 600;
  color: var(--accent-on-fill); margin-bottom: 12px;
}
.slab-eyebrow .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent-on-fill); }
.slab h2 {
  margin: 0 0 8px; font-size: var(--fs-title);
  line-height: 1.3; text-wrap: balance;
}
.slab p { margin: 0; font-size: var(--fs-body-s); line-height: 1.65; color: var(--fill-sub); }
.slab-foot { display: flex; align-items: center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 18px;
  background: var(--accent); color: var(--on-accent);
  border-radius: 999px; font-size: var(--fs-body-s); font-weight: 600;
}
.pill svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.pill.ghost { background: transparent; color: var(--fill-sub); border: 1.5px solid var(--fill-sub); }
.slab-when {
  font-size: var(--fs-label); font-weight: 500; color: var(--fill-sub);
  flex-basis: 100%; padding-top: 2px; line-height: 1.6;
}

/* --- 섹션 --------------------------------------------------------------- */
.sec { padding: 0 16px; }
.sec-head {
  display: flex; align-items: center; gap: 8px;
  padding: 26px 2px 8px;
  width: 100%; text-align: left; min-height: 44px;
}
.sec-head:disabled { opacity: 1; }
.chev { display: flex; color: var(--mut); margin-left: 2px; }
.chev svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.chev.up svg { transform: rotate(180deg); }
.sec-head h3 {
  margin: 0; font-size: 20px; font-weight: 700;
  line-height: 1.3; color: var(--ink);
  text-wrap: balance;
}
.sec-head .count {
  font-size: var(--fs-label); font-weight: 500;
  color: var(--mut); margin-left: auto; white-space: nowrap;
}

/* --- 목록 — 카드 하나에 행이 줄지어 선다 ------------------------------------
   행(.item)이 이어지면 한 카드로 묶고 사이에는 얇은 선만 둔다. 펼친 상세(.detail)·
   준비물(.steps)·질문(.askwrap)이 행 뒤에 오면 같은 카드의 아랫부분으로 붙는다.
   (2026-09-14 실측: 행마다 따로 떠 있는 카드 + 카드 밖으로 빠져나온 상세가 '중구난방'의 실체였다) */
.item {
  background: var(--surface); border: 0;
  border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 0 16px; margin: 0 0 12px;
}
.item + .item { border-top-left-radius: 0; border-top-right-radius: 0; border-top: 1px solid var(--line); }
.item + .detail, .steps + .detail, .askwrap + .detail {
  background: var(--surface); box-shadow: var(--shadow);
  border-radius: 0 0 var(--radius) var(--radius);
  padding: 0 16px 16px; margin: 0 0 12px; border-bottom: 0;
}
.item + .steps, .item + .askwrap, .askwrap + .steps {
  border-top-left-radius: 0; border-top-right-radius: 0; margin-top: 0; margin-bottom: 12px;
  box-shadow: var(--shadow); border-top: 1px solid var(--line);
}
/* 뒤에 같은 카드의 조각이 이어지면 아래 모서리를 펴고 간격을 없앤다 — 위 인접 규칙보다 뒤에 있어야 이긴다 */
.item:has(+ .item), .item:has(+ .detail), .item:has(+ .steps), .item:has(+ .askwrap),
.steps:has(+ .detail), .askwrap:has(+ .steps), .askwrap:has(+ .detail) {
  border-bottom-left-radius: 0; border-bottom-right-radius: 0; margin-bottom: 0;
}
.item > .golinks { padding: 0 0 14px 0; margin-top: -2px; }
.item > .detail { padding-bottom: 14px; border-bottom: 0; }
.row {
  display: flex; gap: 12px;
  padding: 14px 0;
  position: relative;
  width: 100%;
  text-align: left;
  align-items: flex-start;
}
.item > .row { padding-bottom: 13px; }
.item > .row:only-child { padding-bottom: 14px; }
/* --- 넓은 화면(768px 이상) ---------------------------------------------------
   앱 본체를 760px 로 넓히고, 이어진 카드 행(.item 이 둘 이상 붙은 묶음)은 두 줄로 놓는다.
   히어로·합계 카드·탭바·시트는 한 열 그대로 폭만 넓어진다. .scroll 안에서만 건드리므로 셸의
   높이 고정(위 .app 주석)과 내부 스크롤 구조는 그대로다 — 문서 전체 스크롤이 생기지 않는다.
   행이 이어 붙던 한 장 카드는 두 줄에서는 카드마다 따로 서고(간격은 .item 의 12px 그대로),
   펼친 상세(.detail)·준비물(.steps)·질문(.askwrap)이 뒤따르는 행, 또는 상세를 안에 품은 행은 전체 폭을 쓴다. */
@media (min-width: 768px) {
  .app { max-width: 760px; }
  .scroll .sec:has(> .item + .item) { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .scroll .sec:has(> .item + .item) > * { grid-column: 1 / -1; }
  .scroll .sec:has(> .item + .item) > .item {
    grid-column: auto; margin: 0 0 12px; border-top: 0; border-radius: var(--radius);
  }
  .scroll .sec:has(> .item + .item) > .item:has(> .detail) { grid-column: 1 / -1; }
  .scroll .sec:has(> .item + .item) > .item:has(+ .detail),
  .scroll .sec:has(> .item + .item) > .item:has(+ .steps),
  .scroll .sec:has(> .item + .item) > .item:has(+ .askwrap) {
    grid-column: 1 / -1; margin-bottom: 0; border-radius: var(--radius) var(--radius) 0 0;
  }
}
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row-title { font-size: var(--fs-body); font-weight: 600; line-height: 1.45; letter-spacing: -0.01em; color: var(--ink);
  /* 마지막 줄에 한 글자만 남는 줄바꿈을 막는다(2026-09-07 실측: 제목 73개 중 5개). */
  text-wrap: balance; }
.row-sub { font-size: var(--fs-body-s); font-weight: 400; line-height: 1.6; color: var(--sub); }
.row-sub.loss { color: var(--alert); }
.row-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 5px; }
/* 오른쪽 메타 — 폭을 42% 넘게 가져가지 못한다. 긴 기한 문구가 여기 서면 제목이 한 글자씩
   세로로 꺾였다(2026-09-14 실측: '아/동/수/당'). 긴 문구는 코드가 제목 아래 줄로 내린다. */
.row-side { flex-shrink: 0; max-width: 42%; text-align: right; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; padding-top: 1px; }
.row-when {
  /* 제목(.row-title)이 600 이다. 메타가 제목보다 굵으면 위계가 뒤집힌다. */
  font-size: 14px; font-weight: 600;
  line-height: 1.3; color: var(--sub); white-space: nowrap;
}
.row-when.alert { color: var(--alert); }
.row-when.now { color: var(--accent); }
.row-when-unit { font-size: 12.5px; font-weight: 500; color: var(--mut); line-height: 1.4; }
/* 혜택 탭 맨 위 — 내가 알려준 내용 알약과 '고치기' */
.pills { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 12px 16px 0; }
/* 합계 '어떻게 더했나요?' 표 — 이름은 왼쪽, 금액은 오른쪽, 마지막 줄이 합계 */
.sumtbl { width: 100%; border-collapse: collapse; font-size: var(--fs-body-s); }
.sumtbl th { font-weight: 500; text-align: left; color: var(--sub); padding: 7px 12px 7px 0; border-top: 1px solid var(--hair); line-height: 1.5; }
.sumtbl td { text-align: right; white-space: nowrap; vertical-align: top; padding: 7px 0; border-top: 1px solid var(--hair); font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--ink); }
.sumtbl tr:first-child th, .sumtbl tr:first-child td { border-top: 0; }
.sumtbl .sumtotal th, .sumtbl .sumtotal td { font-weight: 700; color: var(--ink); border-top: 1.5px solid var(--line-2); }
.row-money { font-size: var(--fs-body); font-weight: 700; }
/* 나눠 받는 돈임을 금액 바로 밑에서 말한다 — 큰 숫자를 목돈으로 읽는 것을 막는 자리다. */
.row-split { font-size: 12.5px; font-weight: 500; color: var(--mut); white-space: nowrap; margin-top: -1px; }
/* 언제 얼마씩 받는지 — 총액 옆 작은 글씨가 아니라 본문에 둔다. */
.row-plan { display: flex; align-items: center; gap: 5px; margin-top: 2px;
  font-size: var(--fs-label); font-weight: 600; color: var(--accent); line-height: 1.4; }
.row-plan svg { width: 13px; height: 13px; flex-shrink: 0; fill: none;
  stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
/* '이번 주 세 가지' — 체크 원이 없는 정보 행(검사·접종)의 제목을 체크 행의 제목과 같은 자리에 세운다.
   체크 원은 왼쪽으로 11px 물러난 44px 상자라 본문이 45px 에서 시작한다(2026-09-17 실화면: 가운데 행만 왼쪽에 붙어 있었다). */
.week3 .row:not(:has(.chk)) { padding-left: 45px; }
.row.done .row-title { text-decoration: line-through; color: var(--mut); font-weight: 400; }
.row.done .row-sub, .row.done .row-side { opacity: 0.45; }

/* 태그 — 작은 네모 딱지 하나로 통일. 뜻이 정해진 색만 쓴다. */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12.5px; font-weight: 600; line-height: 1.3;
  min-height: 24px; padding: 2px 8px; border-radius: 7px;
  background: var(--chip); color: var(--sub);
}
.tag.legal { background: var(--alert-bg); color: var(--alert); }
.tag.lime { background: var(--accent); color: var(--on-accent); }
.tag.line { background: transparent; border: 1px solid var(--line-2); color: var(--mut); font-weight: 500; }
.tag.tint { background: var(--accent-tint); color: var(--accent); }
.tag.peach { background: var(--peach); color: var(--on-peach); }
.tag.rose { background: var(--rose); color: var(--on-rose); }
.tag.butter { background: var(--butter); color: var(--on-butter); }

/* 인라인 질문 — 판단에 막힌 프로필 값을 항목 상세 안에서 바로 받는다 */
.askwrap, .money-note { margin: 12px 0 4px; padding: 12px 14px; background: var(--sunken); border-radius: var(--radius-xs); }
.ask-head { font-size: var(--fs-label); font-weight: 600; margin-bottom: 4px; color: var(--sub); }
.ask { margin: 10px 0 2px; }
.ask-q { font-size: var(--fs-body-s); color: var(--ink); margin-bottom: 8px; line-height: 1.55; }
.ask-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.askbtn { min-height: 44px; padding: 8px 16px; font-size: var(--fs-body-s); font-weight: 500; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px; cursor: pointer; }
.askbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.ask-num { min-height: 44px; width: 150px; padding: 8px 12px; font-size: var(--fs-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-xs); }

/* 시기 바뀜 알림 · iOS 설치 안내 */
.fresh { display: flex; align-items: center; gap: 10px; margin: 12px 0 0; padding: 11px 12px 11px 14px; background: var(--sunken); border-radius: var(--radius-xs); }
.fresh-t { flex: 1; font-size: var(--fs-body-s); line-height: 1.5; color: var(--ink); }
.fresh-x { flex: none; display: inline-flex; align-items: center; gap: 5px; min-height: 36px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; font: inherit; font-size: var(--fs-label); font-weight: 500; color: var(--sub); cursor: pointer; }
.fresh-x svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.iosbar { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; background: var(--sunken); border-bottom: 1px solid var(--hair); font-size: var(--fs-label); line-height: 1.5; color: var(--sub); }
.iosbar-t { flex: 1; }
.iosbar-t b { color: var(--ink); font-weight: 600; }
.iosbar-x { flex: none; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--mut); cursor: pointer; }
.iosbar-x svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* 아빠 주간 카드 — 배우자 화면: 아내 몸의 변화 하나 + 오늘 행동 하나 */
.dad { background: var(--surface); border: 0; border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; margin: 0 0 4px; }
.dad-eyebrow { font-size: var(--fs-label); font-weight: 600; color: var(--accent); margin-bottom: 4px; }
.dad-title { font-size: var(--fs-heading); }
.dad-what { font-size: var(--fs-body-s); color: var(--sub); margin-top: 4px; line-height: 1.6; }
.dad-src { font-size: var(--fs-label); color: var(--mut); margin-top: 4px; }
.dad-act { font-size: var(--fs-body-s); font-weight: 500; }
.tag.who { background: transparent; border: 1px solid var(--line-2); color: var(--mut); font-weight: 500; }
.tag.who.mine { border-color: var(--accent); color: var(--accent); }
.tag.done-by { background: var(--sunken); color: var(--sub); }
.tag.ref { background: transparent; border: 1px dashed var(--line-2); color: var(--mut); align-self: flex-start; font-weight: 500; }

/* 세부 체크리스트 — 항목 안에서 하나씩 지운다 */
.steps {
  margin: 2px 0 12px 0; padding: 12px 16px 12px;
  background: var(--sunken); border-radius: var(--radius);
}
.steps-head {
  /* 글꼴을 키우면 '복사' 버튼이 화면 밖으로 밀려 사라졌다 — 줄을 넘기게 둔다(38차 감사). */
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap;
  font-size: var(--fs-label); font-weight: 600; color: var(--sub);
}
.steps-count { color: var(--sub); font-size: var(--fs-label); font-weight: 500; }
.steps-copy {
  margin-left: auto; min-height: 40px; padding: 0 14px;
  border-radius: 999px; background: var(--surface); color: var(--sub);
  border: 1px solid var(--line-2); font-family: inherit;
  font-size: var(--fs-label); font-weight: 600; white-space: nowrap;
}
.steps-group {
  font-size: var(--fs-label); font-weight: 600; color: var(--mut);
  padding: 10px 0 3px;
}
.steps-group:first-of-type { padding-top: 0; }
.step-row { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
.step-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.step-text { font-size: var(--fs-body-s); font-weight: 400; line-height: 1.55; }
.step-sub { font-size: var(--fs-label); line-height: 1.55; color: var(--sub); }
.step-row.done .step-text { text-decoration: line-through; color: var(--sub); }
.step-row.done .step-sub { opacity: .5; }
.chk.sm { width: 44px; height: 44px; margin: -10px -8px -10px -12px; }
.chk.sm i { width: 22px; height: 22px; }
.chk.sm svg { width: 12px; height: 12px; }
.steps-note {
  font-size: var(--fs-label); line-height: 1.6; color: var(--sub);
  padding-top: 10px; margin-top: 8px; border-top: 1px solid var(--line);
}

/* 상대 몫은 잠긴 상태로 보여 준다 — 보이되 누를 수 없다 */
.chk.locked i { border-style: dashed; opacity: .8; }
.chk.locked.on i { border-style: solid; opacity: .55; }
.chk.locked svg { width: 13px; height: 13px; stroke-width: 2; }
.chk.locked:not(.on) i { color: var(--mut); }

/* 배우자 몫 묶음 — 내 목록과 시각적으로 구분한다 */
.sec.theirs .row-title { font-weight: 400; }
.sec.theirs .row { opacity: .82; }

/* 체크박스 — 눈에 보이는 원은 22px 이지만 손가락이 닿는 영역은 44px 이다.
   완료를 알리는 색은 강조 인디고 하나다. 초록을 쓰지 않는다. */
.chk {
  width: 44px; height: 44px; flex-shrink: 0;
  margin: -9px -9px -9px -11px;
  display: flex; align-items: center; justify-content: center;
}
.chk i {
  width: 22px; height: 22px;
  border: 2px solid var(--line-2); border-radius: 999px;
  display: flex; align-items: center; justify-content: center;
  color: transparent;
}
.chk.on i { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chk svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

/* --- 상세 (펼침) — 라벨은 물러나고 본문이 앞선다 --------------------------- */
.detail {
  padding: 2px 0 16px 0;
  border-bottom: 1px solid var(--hair);
  display: flex; flex-direction: column; gap: 14px;
}
.lead {
  font-size: var(--fs-body); line-height: 1.7; font-weight: 400;
  color: var(--ink); padding-bottom: 0;
}
.dl { display: flex; flex-direction: column; gap: 3px; }
.dl dt { font-size: var(--fs-label); font-weight: 500; color: var(--mut); line-height: 1.5; }
.dl dd { margin: 0; font-size: var(--fs-body-s); font-weight: 400; line-height: 1.65; color: var(--ink); }
/* 공문서 원문 칸의 줄 — srcHtml(2026-09-30). 나열 기호는 뗐으니 점은 여기서 그린다. */
.dl dd ul.src { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 3px; }
.dl dd ul.src li { position: relative; padding-left: 12px; }
.dl dd ul.src li.src-item::before { content: '·'; position: absolute; left: 2px; color: var(--mut); }
.dl dd ul.src li.src-sub { padding-left: 24px; }
.dl dd ul.src li.src-sub::before { content: '–'; position: absolute; left: 11px; color: var(--mut); }
.dl dd ul.src li.src-note { padding-left: 0; color: var(--sub); font-size: var(--fs-label); }
.dl dd ul.src li.src-plain { padding-left: 0; }
/* 아직 확인하지 못한 것 — 숨기지 않되 본문보다 한 단계 물러난다 */
.dl.unv dd { font-size: 14px; color: var(--sub); }
/* 공식 원문 인용 — 문장을 고치지 않는다. 배경 없이 왼쪽 선 하나. */
.quote {
  border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; margin: 2px 0;
  font-size: var(--fs-body-s); line-height: 1.7; color: var(--sub);
}
.quote cite {
  display: block; margin-top: 6px; font-style: normal;
  font-size: var(--fs-label); font-weight: 500; color: var(--mut); line-height: 1.5;
}
/* 인용이 셋을 넘으면 나머지는 접어 둔다 — 한 항목에 인용 상자 7~10개가 줄지어 서 있었다(2026-09-14 실측) */
.more { border-top: 1px solid var(--hair); padding-top: 4px; }
.more > summary { list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 6px;
  font-size: var(--fs-label); font-weight: 600; color: var(--accent); }
.more > summary::-webkit-details-marker { display: none; }
.more > summary::before { content: ''; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); margin: -3px 4px 0 2px; transition: transform .15s; }
.more[open] > summary::before { transform: rotate(-135deg); margin-top: 3px; }
.more > div { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
/* 주의 — 겁주는 빨강이 아니라 눈에 띄는 노란 바탕. 병원·기한 경고만 .tag.legal·.row-when.alert 가 빨강을 쓴다. */
.warn {
  background: var(--peach); color: var(--on-peach);
  border-radius: var(--radius-xs); padding: 12px 14px;
  font-size: var(--fs-body-s); font-weight: 400; line-height: 1.6;
}
.warn .srcline { margin-top: 6px; color: inherit; opacity: .8; }
/* 우리가 확정하지 못한 것을 어디에 물어야 하는지 — 경고가 아니라 다음 걸음 */
.askwhere {
  background: var(--sunken); border-radius: var(--radius-xs); padding: 12px 14px;
  font-size: var(--fs-body-s); font-weight: 400; line-height: 1.6; color: var(--sub);
}
.askwhere b { color: var(--ink); font-weight: 600; }
/* 원문이 적어 둔 창구·연락처. 우리가 만든 값이 아니라 옮긴 값이다. */
.askwhere-c { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line);
  font-size: var(--fs-label); font-weight: 600; color: var(--ink); }
/* 우리 합계 밖에 있는 지원 — 좋은 소식이므로 경고처럼 보이지 않게 */
.extras { background: var(--sunken); border-radius: var(--radius-xs); padding: 12px 14px; }
.extras-h { font-size: var(--fs-label); font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.extras-i { font-size: var(--fs-body-s); line-height: 1.6; color: var(--sub); margin-top: 3px; }
.extras-i b { color: var(--ink); font-weight: 600; }
.extras-n { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line);
  font-size: var(--fs-label); line-height: 1.55; color: var(--mut); }
.extras-n b { color: var(--sub); font-weight: 600; }
/* 도움을 청할 수 있는 곳 — 눈에 띄되 겁주지 않게. */
.channels { background: var(--sunken); border-radius: var(--radius-xs); padding: 12px 14px; margin-top: 2px; }
.channels-h { font-size: var(--fs-label); font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.channels-i { padding: 7px 0; border-top: 1px solid var(--line); }
.channels-i:first-of-type { border-top: 0; padding-top: 0; }
.channels-i b { font-size: var(--fs-body-s); font-weight: 600; color: var(--ink); }
.channels-c { font-family: var(--f-num); font-size: var(--fs-body-s); font-weight: 600; color: var(--accent); margin-top: 2px; }
.channels-w { font-size: var(--fs-label); color: var(--mut); line-height: 1.5; margin-top: 2px; }
/* 출처 줄 — 기관명·확인일. */
.srcline { font-size: var(--fs-label); font-weight: 500; color: var(--mut); line-height: 1.55; }
.srcline a { color: var(--mut); }
/* 확인한 지 90일 넘은 정보 — .warn 과 같은 짝 토큰(plan 105) */
.stale { display: block; margin-top: 4px; padding: 6px 10px; border-radius: var(--radius-xs);
  background: var(--peach); color: var(--on-peach); font-weight: 500; }

/* --- 탭바 --------------------------------------------------------------- */
/* 떠 있는 알약 탭바 — 셸의 마지막 칸이라 flex-shrink:0 은 그대로다(2026-09-07 사고). */
.tabbar {
  display: flex;
  margin: 0 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--surface);
  border-radius: 22px;
  box-shadow: var(--shadow-bar);
  padding: 4px;
  flex-shrink: 0;
}
.tab {
  flex: 1; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  color: var(--mut); font-size: 12.5px; font-weight: 600;
  border-radius: 16px; position: relative;
}
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: var(--accent); background: var(--accent-tint); }
.tab.on svg { stroke-width: 2.2; }
.tab .badge {
  position: absolute; margin: -18px 0 0 18px;
  /* 높이를 못박지 않는다 — 글꼴을 키운 기기에서 숫자가 원 밖으로 삐져나왔다(38차 감사). */
  min-width: 18px; min-height: 16px; padding: 1px 5px;
  background: var(--alert); color: var(--on-alert);
  border-radius: 999px; font-size: 11.5px; font-weight: 700; line-height: 1.3;
  display: flex; align-items: center; justify-content: center;
}

/* --- 시트 --------------------------------------------------------------- */
.sheet-bg {
  position: fixed; inset: 0; background: var(--scrim);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 50;
}
.sheet {
  width: 100%; max-width: 480px;
  background: var(--bg); color: var(--ink);
  border-radius: 24px 24px 0 0;
  max-height: 88vh; max-height: 88dvh;
  display: flex; flex-direction: column;
}
.sheet-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px 10px 20px; flex-shrink: 0;
}
.sheet-head h2 { margin: 0; font-size: var(--fs-title); }
.sheet-body { overflow-y: auto; padding: 0 16px calc(20px + env(safe-area-inset-bottom)); }
.grab { width: 44px; height: 4px; border-radius: 999px; background: var(--line-2); margin: 8px auto 0; }

/* 폼 — iOS 확대 방지를 위해 입력 글자는 16px 이상 */
.field { display: flex; flex-direction: column; gap: 7px; padding: 12px 0; }
.field > label { font-size: var(--fs-label); font-weight: 600; color: var(--sub); }
.fieldnote { font-size: var(--fs-label); line-height: 1.6; color: var(--mut); }
.fieldnote b { color: var(--sub); font-weight: 600; }
.codebox {
  background: var(--surface); border: 1.5px solid var(--line);
  border-radius: var(--radius-sm); padding: 12px 14px;
}
.codebox code {
  font-family: var(--f-mono);
  font-size: var(--fs-label); line-height: 1.7; word-break: break-all;
  color: var(--ink); user-select: all;
}
.field input, .field select {
  width: 100%; min-height: 48px; padding: 0 14px;
  font-size: var(--fs-body); font-weight: 500;
  background: var(--surface); color: var(--ink);
  border: 1.5px solid var(--line-2); border-radius: var(--radius-sm);
  appearance: none;
}
.field select {
  background-image: linear-gradient(45deg, transparent 50%, var(--mut) 50%), linear-gradient(135deg, var(--mut) 50%, transparent 50%);
  background-position: calc(100% - 19px) 21px, calc(100% - 14px) 21px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-right: 38px;
}
/* 제도 정보 오류 알리기 시트(plan 106) — 종류 고르기와 글 칸. 글자는 16px 이상(iOS 확대 방지). */
.rp-kinds { border: 0; margin: 0; padding: 12px 0; display: flex; flex-direction: column; gap: 6px; }
.rp-kinds legend { padding: 0; margin-bottom: 7px; font-size: var(--fs-label); font-weight: 600; color: var(--sub); }
.rp-kind {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px;
  border: 1.5px solid var(--line-2); border-radius: var(--radius-sm); background: var(--surface);
  font-size: var(--fs-body-s); color: var(--ink); cursor: pointer;
}
.rp-kind input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.field textarea {
  width: 100%; min-height: 132px; padding: 12px 14px;
  font: inherit; font-size: var(--fs-body); color: var(--ink);
  background: var(--surface); border: 1.5px solid var(--line-2); border-radius: var(--radius-sm); resize: vertical;
}
.linkbtn { color: inherit; text-decoration: underline; }
/* 세그먼트 — 나/아빠, 역할·단계 고르기 */
.seg { display: flex; gap: 6px; background: var(--sunken); padding: 4px; border-radius: var(--radius-sm); }
.seg button {
  flex: 1; min-height: 44px; border-radius: 11px;
  border: 0; background: transparent;
  font-size: var(--fs-body-s); font-weight: 600; color: var(--sub);
}
.seg button.on { background: var(--accent); color: var(--on-accent); }
/* 칩 한 줄 — 혜택·준비 탭의 보기 전환. 가로로 넘기고 세로로는 한 줄만 차지한다.
   오른쪽 끝은 옅어진다 — 더 있다는 표시다(잘려 보이던 마지막 칩, 2026-09-14 실측). */
.chips {
  display: flex; gap: 8px; padding: 12px 16px 6px; overflow-x: auto;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
  min-height: 44px; padding: 0 15px; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  font-family: inherit; font-size: 14.5px; font-weight: 500; white-space: nowrap;
}
.chip .num { font-weight: 500; font-size: 14.5px; color: var(--mut); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.chip.on .num { color: var(--on-accent); }
/* 준비 탭 — 히어로 안의 나/배우자 세그먼트, 일정의 작은 소제목, 지난 시기 행 */
.hero .seg { margin-top: 12px; }
.sec-sub { font-size: var(--fs-label); font-weight: 600; color: var(--mut); padding: 12px 4px 4px; }
.dimrows .item { opacity: .72; }
/* 접힌 행의 긴 요약은 두 줄까지 — 펼치면 전문 */
.row-sub.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* 첫 실행 짧은 시트 — 무엇을 해 주는 앱인지 한 번은 말하고 묻는다. */
.quicklead {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--sunken); border-radius: var(--radius-xs);
  padding: 14px 16px; margin-bottom: 14px; font-size: var(--fs-body-s); line-height: 1.6;
}
.quicklead svg { width: 36px; height: 36px; flex-shrink: 0; }
.quicklead.compact { align-items: center; gap: 10px; padding: 10px 14px; margin-bottom: 10px; }
.quicklead.compact svg { width: 28px; height: 28px; }
.quicklead.compact .quicksub { margin-top: 2px; }
.quicklead .quicksub { display: inline-block; margin-top: 6px; color: var(--sub); font-size: var(--fs-label); }
.quickdone {
  display: block; width: 100%; margin-top: 6px; padding: 15px;
  border: 0; border-radius: 16px; background: var(--accent); color: var(--on-accent);
  font-size: var(--fs-heading); font-weight: 600;
}
/* 아직 고를 것이 남았을 때 — 눌러도 되는 것처럼 보이지 않게 한다. */
.quickdone[disabled] { background: var(--sunken); color: var(--mut); }
/* 시트의 고정 발판 — 본문이 스크롤돼도 시작 버튼은 늘 보인다. */
.sheet-foot {
  flex-shrink: 0; padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line); background: var(--bg);
}
.sheet-foot .quickdone { margin-top: 0; }
.quickmore {
  display: block; width: 100%; margin-top: 8px; padding: 13px;
  border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: var(--surface);
  font-family: inherit; font-size: var(--fs-body-s); font-weight: 500; color: var(--sub);
}
/* 첫 실행 질문 카드 — 진행 막대·큰 선택지·이전/다음 발판 */
.quickmore.onb-skip { display: inline-block; width: auto; margin: 0 0 8px; padding: 9px 18px; border-radius: 999px; }
.onb-top { display: flex; align-items: center; gap: 12px; padding: 4px 0 14px; }
.onb-n { font-size: var(--fs-label); font-weight: 500; color: var(--mut); flex-shrink: 0; font-family: var(--f-num); }
.onb-steps { display: flex; gap: 5px; flex: 1; }
.onb-steps .step { height: 6px; border-radius: 999px; background: var(--sunken); flex: 1; }
.onb-steps .step.on { background: var(--accent); }
.onb-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 18px 16px; }
.onb-title { font-size: 26px; line-height: 1.35; text-wrap: balance; }
.onb-sub { margin: 6px 0 14px; font-size: var(--fs-body-s); line-height: 1.6; color: var(--sub); }
.onb-card .field { padding-top: 4px; }
.optcards { display: flex; flex-direction: column; gap: 10px; }
.optcard {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px; width: 100%;
  padding: 16px 18px; text-align: left; border: 0; border-radius: 18px;
  background: var(--surface); box-shadow: 0 0 0 1px var(--line-2) inset; font-family: inherit; cursor: pointer;
}
.optcard b { font-size: 19px; color: var(--ink); }
.optcard span { font-size: var(--fs-body-s); color: var(--sub); line-height: 1.5; }
.optcard.on { box-shadow: 0 0 0 2px var(--accent) inset; background: var(--accent-tint); }
/* 작은 폰에서 접힘선 아래로 밀리지 않게(plan 111 B3) — 엄마·아빠는 가로 2칸, 단계 카드는 제목과 설명을 한 줄에 둔다(글자 크기는 그대로). */
.optcards.two { flex-direction: row; }
.field label .opt { font-weight: 400; color: var(--sub); }
.optcards.two .optcard { flex: 1 1 0; min-width: 0; padding: 14px 14px; }
.optcards.tight { gap: 6px; }
.optcards.tight .optcard { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 0 10px; padding: 8px 16px; }
.onb-foot { display: flex; gap: 8px; }
.onb-foot .quickdone { flex: 1; margin-top: 0; }
.onb-foot .onb-prev { width: auto; flex: 0 0 auto; margin-top: 0; padding: 13px 18px; border-radius: 16px; }
/* 내 정보 — 카드 넷 */
.me-h { font-size: var(--fs-heading); margin: 18px 2px 8px; }
.me-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-top: 10px; }
.me-row { display: flex; align-items: center; gap: 10px; }
.me-main { flex: 1; min-width: 0; }
.me-title { font-size: 19px; line-height: 1.3; }
.me-sub { margin-top: 3px; font-size: var(--fs-label); line-height: 1.5; color: var(--sub); }
.askwrap.bare { margin: 10px 0 0; }
.fieldnote.gain { margin: 4px 0 8px; color: var(--accent); }
.fieldnote.gain b { color: var(--accent); }

/* 받은 금액 기록 (plan 072) — 신청 완료 행 아래. 적기 단추·한 줄·입력 칸 */
.recv { padding: 0 0 12px 0; }
.recv-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: var(--fs-body-s); color: var(--sub); }
.recv-line b { color: var(--ink); font-weight: 700; font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.recv-line .tag { min-height: 44px; border: 0; cursor: pointer; font-family: inherit; }
.recv .field { padding: 4px 0 0; }
.recv-btns { display: flex; flex-wrap: wrap; gap: 8px; }

/* 가족 읽기 전용 보기 (plan 072) — 맨 위 띠. 고치거나 남기는 단추는 숨기고(아래), 클릭 처리기에서도 한 번 더 막는다. */
.robar { display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top)) 8px 8px 16px; background: var(--accent-tint); border-bottom: 1px solid var(--hair); font-size: var(--fs-label); line-height: 1.5; color: var(--ink); }
.robar-t { flex: 1; }
.robar-t b { color: var(--accent); font-weight: 700; }
.robar .askbtn { flex: none; padding: 6px 14px; }
.ro .chk, .ro #meBtn, .ro [data-sheet="me"], .ro [data-editme], .ro [data-share], .ro [data-sharecard], .ro .recv { display: none !important; }

/* 바로가기 — 신청처·원문으로 한 번에 넘어간다.
   상세를 펼쳐야만 링크가 보이면 아무도 원문을 확인하지 않는다. */
.golinks { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.golink {
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 44px; padding: 0 16px;
  border-radius: var(--radius-xs); background: var(--accent-tint); color: var(--accent);
  font-size: var(--fs-body-s); font-weight: 600; text-decoration: none;
}
.golink.strong { background: var(--accent); color: var(--on-accent); }
.golink svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.secnote {
  font-size: var(--fs-body-s); line-height: 1.6; color: var(--sub);
  background: var(--sunken); border-radius: var(--radius-xs);
  padding: 12px 14px; margin: 6px 0 8px;
}
/* 준비물 서랍 — 광고 표시문구는 본문과 다른 색·배경으로 첫 줄에(공정위 지침: 배경과 구분, 더보기 없이).
   상품 사진·가격 없음. 아이콘은 예부콩 계열 선 그림(장식·aria-hidden). */
.goods-ad { font-size: var(--fs-label); font-weight: 600; color: var(--on-peach); background: var(--peach); border-radius: 10px; padding: 10px 12px; margin: 8px 0; line-height: 1.5; }
.goods-ad.top { margin: 0 0 8px; }
.goods-group { font-size: var(--fs-label); font-weight: 600; color: var(--mut); margin: 14px 4px 6px; }
.goods-ic { width: 40px; height: 40px; flex-shrink: 0; color: var(--accent); display: flex; align-items: center; justify-content: center; }
.goods-ic svg { width: 36px; height: 36px; }
.goods-test { border-left: 3px solid var(--line-2); padding-left: 12px; margin: 4px 0; display: flex; flex-direction: column; gap: 8px; }
.goods-test-h { font-size: var(--fs-label); font-weight: 500; color: var(--mut); }

  p.householdIncomeMax = p.householdIncomeAnnual ?? null;
  // 당사자별 고용 형태(44차). 제도의 requires 가 'employment'(신청인 본인)만 쓰면
  // 아빠 사용자에게 출산전후휴가급여가 '내 고용 형태'로 판정된다 — 산모의 제도인데.
  // 출산전후휴가·유산사산휴가는 산모의 고용 형태를, 배우자 출산휴가는 아빠의 고용
  // 형태를 본다. 역할을 모르면 둘 다 모른다(null).
  p.motherEmployment = p.role === 'mother' ? p.employment : p.role === 'partner' ? p.spouseEmployment : null;
  p.partnerEmployment = p.role === 'partner' ? p.employment : p.role === 'mother' ? p.spouseEmployment : null;
  // 주택도시기금: "부부합산 연소득 1.3억원 이하(맞벌이 2억원 이하)"
  // 외벌이/맞벌이로 한도가 달라 단일 상한으로는 판정할 수 없다.
  p.newbornLoanIncomeOk =
    p.householdIncomeAnnual == null || p.dualIncome == null
      ? null
      : p.householdIncomeAnnual <= (p.dualIncome === true ? 200000000 : 130000000);
  // 출산 순위는 이번 출산의 첫째 아이 기준
  p.birthOrder = p.childrenBefore == null ? null : p.childrenBefore + 1;
  // 장애인가정 출산지원금은 지자체 조례에서 "신생아의 부 또는 모가 등록장애인"으로
  // 정의된다(여수·해남·서구 조례 실측). 산모 본인 장애만 보는 isDisabledMother 로는
  // 아버지만 장애인인 가정을 표현할 수 없어 제도가 통째로 승격 불가였다.
  // 산모가 등록장애인이면 가정 조건은 자동으로 충족된다.
  if (p.isDisabledMother === true || p.isDisabledParent === true) p.isDisabledParent = true;
  else if (p.isDisabledMother === false && p.isDisabledParent === false) p.isDisabledParent = false;
  else p.isDisabledParent = null; // 모르면 '판단 불가' — 조용히 제외하지 않는다
  return p;
}

// ---------------------------------------------------------------------------
// 금액 계산 규칙
// 각 규칙은 { value, note, isCap } 또는 { value: null, reason } 를 반환한다.
// isCap: true 면 상한액이라 확정 수령액이 아니므로 합산 대상에서 제외한다.
// ---------------------------------------------------------------------------

/**
 * 월 단위 지급 제도의 '앞으로 12개월' 수령액을 계산한다.
 * 아이가 이미 지급 연령을 지났으면 0개월이 나오고, 호출부는 null 을 반환해야 한다.
 * @param {number} ageMonths 현재 개월수
 * @param {Array<{untilMonth:number, amount:number}>} schedule 오름차순 구간표
 */
function monthlyOverHorizon(ageMonths, schedule, horizon = 12) {
  let total = 0;
  let counted = 0;
  // 얼마씩 받는지도 함께 돌려준다 — 총액만으로는 "1,150만원"이 목돈으로 읽힌다.
  // 부모급여처럼 도중에 금액이 바뀌는 제도가 있어 구간으로 담는다.
  const segments = [];
  for (let m = ageMonths; counted < horizon; m++) {
    const seg = schedule.find((s) => m < s.untilMonth);
    if (!seg) break;
    total += seg.amount;
    counted++;
    const last = segments[segments.length - 1];
    if (last && last.amount === seg.amount) last.months += 1;
    else segments.push({ amount: seg.amount, months: 1 });
  }
  return { total, counted, segments };
}

/** "매월 100만원" · "매월 100만원 → 50만원" — 도중에 금액이 바뀌면 그 사실도 말한다. */
function monthlyDetail(segments) {
  if (!segments || !segments.length) return null;
  // 만원 아래를 반올림하지 않도록 모듈의 won() 하나만 쓴다(비수도권 105,000원이 '11만원'으로 보였다).
  if (segments.length === 1) return `매월 ${won(segments[0].amount)}`;
  return `매월 ${segments.map((s) => won(s.amount)).join(' → ')}`;
}

/**
 * 매달 나눠 받는 제도의 지급 기간을 사람이 읽는 말로.
 * 화면은 이 말을 금액 바로 아래에 놓는다 — 큰 숫자만 보고 목돈으로 읽는 것을 막는 자리다.
 */
/**
 * 기간을 사람이 읽는 말로. 배지가 앉는 칸이 좁아 짧을수록 좋다.
 * 딱 떨어지는 해는 "3년", 두 해가 안 되면 개월 그대로("23개월" — "1년 11개월"보다
 * 짧고, 아이 나이를 개월로 세는 말투에도 가깝다), 그 밖에는 "3년 4개월".
 */
function spanWords(months) {
  if (!months || months < 2) return null;
  const y = Math.floor(months / 12);
  const m = months % 12;
  if (m === 0) return `${y}년`;
  if (months < 24) return `${months}개월`;
  return `${y}년 ${m}개월`;
}

function monthlyPayout(months, segments) {
  const span = spanWords(months);
  if (!span) return null;
  return {
    spanText: `${span} 나눠`,
    spanMonths: months,
    detail: monthlyDetail(segments),
    first: null, each: null, every: 'month', count: months,
  };
}

/**
 * 아이마다 지급하는 국가 급여의 아이 수 — 아동수당·부모급여는 법률이 "아동에게" 지급한다고
 * 적는다(아동수당법 제4조 ①·⑤, legalize 원문 2026-09-29). 쌍둥이 가정에 1명분만 세고 있었다
 * (임신 중 '아이가 태어나면' 금액을 만들다 발견 — 출산 후 화면도 같은 값이었다).
 * 태아 수를 모르면 한 명으로 센다: 지금까지의 계산과 같고, 태아 수는 첫 질문 여섯 가운데 하나다.
 */
function childCount(p) {
  return p.fetusCount != null && p.fetusCount > 1 ? p.fetusCount : 1;
}
function kidsNote(kids) {
  return kids > 1 ? ` · 아이 ${kids}명분` : '';
}

/** 다태아 적용 규칙을 공식 출처에서 확인하지 못한 제도에 쓰는 공통 가드. */
function multipleBirthGuard(p, program) {
  if (p.fetusCount != null && p.fetusCount > 1) {
    // '아무 말도 없어서 모른다'와 '방식은 적혀 있는데 금액을 안 밝혔다'는
    // 사용자가 할 수 있는 일이 다르다 — 뒤쪽은 그 문장을 들고 물으면 된다.
    return { value: null, reason: (program && program.multipleBirthNote)
      || '다태아 적용 방식을 공식 출처에서 확인하지 못함' };
  }
  return null;
}

/**
 * 출생 순위별 표에서 내 순위에 해당하는 칸을 찾는다. "N+" 는 N 이상 전부.
 * 금액표와 지급 방식표가 같은 규칙으로 갈려야 둘이 어긋나지 않는다.
 */
function lookupByOrder(table, order) {
  if (!table || order == null) return undefined;
  if (table[String(order)] !== undefined) return table[String(order)];
  const plus = Object.keys(table)
    .filter((k) => k.endsWith('+'))
    .map((k) => parseInt(k, 10))
    .filter((n) => !Number.isNaN(n) && order >= n)
    .sort((a, b) => b - a)[0];
  return plus !== undefined ? table[`${plus}+`] : undefined;
}

/**
 * 데이터 구동형 출산순위별 정액 규칙 — 지자체 출산지원금의 지배적 패턴.
 * program.amountByOrder = { "1": 500000, "2": 1000000, "5+": 10000000 } 형식.
 * - 키는 출산 순위(이번 출산의 첫째 아이 기준). "N+" 는 N 이상 전부.
 * - 값 0 은 '해당 순위 지급 없음'을 뜻하며 계산하지 않는다.
 * - 다태아는 program.multipleBirthRule 이 'perChild'(원문으로 확인된 경우)일 때만
 *   태아당 순위를 올려가며 합산하고, 그 외에는 공통 가드로 계산을 차단한다
 *   (같은 엔진 안 이중 잣대 금지 — 첫만남이용권과 같은 기준).
 * - 'perFamily' 는 태아 수와 무관하게 가정당 정액인 경우다. 다태아 전용 제도
 *   (고흥군 쌍둥이 출산가정 축하금 50만원)는 fetusCount>=2 를 요구하면서 동시에
 *   다태아 가드에 막혀 영원히 금액이 안 나오는 죽은 제도가 된다.
 */
function amountByOrder(program, p) {
  const table = program.amountByOrder;
  if (!table) return { value: null, reason: '순위별 금액표 없음' };
  if (p.birthOrder == null) return { value: null, reason: '이번 출산 전 자녀 수 입력 필요', needsField: 'childrenBefore' };
  const lookup = (order) => lookupByOrder(table, order);
  if (p.fetusCount != null && p.fetusCount > 1 && program.multipleBirthRule !== 'perFamily') {
    if (program.multipleBirthRule !== 'perChild') return multipleBirthGuard(p, program);
    let sum = 0;
    for (let i = 0; i < p.fetusCount; i++) {
      const v = lookup(p.birthOrder + i);
      if (v == null) return { value: null, reason: `${p.birthOrder + i}순위 금액이 표에 없음` };
      sum += v;
    }
    return { value: sum, note: `다태아 ${p.fetusCount}명 순위별 합산(원문 확인)` };
  }
  const v = lookup(p.birthOrder);
  if (v === undefined) return { value: null, reason: `${p.birthOrder}순위 금액이 표에 없음` };
  if (v === 0 || v === null) return { value: null, reason: '해당 순위는 지급 대상이 아님' };
  return {
    value: v,
    ...(program.paymentScheduleText ? { note: `지급 방식: ${program.paymentScheduleText}` } : {}),
    ...payoutFor(program, p.birthOrder),
  };
}

/**
 * 데이터 구동형 **태아 수별** 정액 규칙.
 * program.amountByFetus = { "1": 300000, "2": 600000, "3+": 900000 } 형식.
 *
 * 왜 순위표로는 안 되는가: amountByOrder 는 '이번 출산이 몇째인가'로 갈리는데
 * 이 제도들은 '몇 명을 낳는가'로 갈린다. 축이 다르다. 서대문구 임신축하금은 원문이
 * "단태아 30만원, 쌍둥이 60만원, 세쌍둥이 이상 90만원"이라고 최종 금액을 직접
 * 밝히는데도 담을 칸이 없어 화면이 금액을 아예 말하지 못했다(2026-09-07 확인, 5건).
 *
 * - 키 관례는 amountByOrder 와 같다 — "N" 은 정확히 N 명, "N+" 는 N 명 이상 전부.
 *   같은 규칙을 두 벌 두지 않으려고 lookupByOrder 를 그대로 쓴다.
 * - **표에 없는 태아 수는 값을 지어내지 않는다.** "N+" 는 원문에 '이상'이 있을 때만
 *   쓴다. 충주시 원문은 "쌍둥이 200만원, 세쌍둥이 300만원"까지만 말하므로 네쌍둥이
 *   금액은 원문에 없고 우리도 모른다 — null 로 떨어뜨리는 것이 정직한 답이다.
 * - 다태아 가드(multipleBirthGuard)를 타지 않는다. 그 가드는 "다태아에 어떻게
 *   적용되는지 원문에서 확인하지 못했다"를 막는 장치인데, 이 표는 **원문이 태아
 *   수별로 밝힌 금액 그 자체**다. 확인된 것을 가드로 막으면 죽은 필드가 된다.
 */
function amountByFetus(program, p) {
  const table = program.amountByFetus;
  if (!table) return { value: null, reason: '태아 수별 금액표 없음' };
  if (p.fetusCount == null) return { value: null, reason: '태아 수 입력 필요', needsField: 'fetusCount' };
  const v = lookupByOrder(table, p.fetusCount);
  if (v === undefined) {
    return { value: null, reason: `태아 ${p.fetusCount}명일 때의 금액이 원문에 없음` };
  }
  if (v === 0 || v === null) return { value: null, reason: '해당 태아 수는 지급 대상이 아님' };
  return {
    value: v,
    ...(program.paymentScheduleText ? { note: `지급 방식: ${program.paymentScheduleText}` } : {}),
  };
}

/**
 * 이 금액을 한 번에 받는가, 나눠 받는가 — 내 출생 순위 기준으로.
 *
 * 진도군 셋째 2,000만원은 13년에 걸쳐 받고, 남해군 셋째 1,000만원은 처음 200만원에
 * 매월 20만원씩 40회다. 총액은 원문 그대로 맞지만, 화면이 큰 숫자 하나로만 보여
 * 주면 읽히는 뜻이 틀린다.
 *
 * 순위마다 방식이 다른 제도가 57건 중 32건이다 — 동두천시는 첫째~셋째가 일시금이고
 * 넷째만 2년 분할이다. 그래서 금액표와 똑같은 순위 규칙으로 갈라 둔다.
 *
 * program.payout.byOrder 는 원문을 읽고 사람이 판정해 심은 값이다(추론하지 않는다).
 * kind 가 'split' 이 아니면 아무 말도 하지 않는다 — 'lump' 는 한 번에 받는 것이고,
 * 'unknown' 은 원문이 그 순위의 지급 방식을 말하지 않은 것이다.
 */
function payoutFor(program, birthOrder) {
  const po = program.payout;
  if (!po || !po.byOrder) return {};
  const row = lookupByOrder(po.byOrder, birthOrder);
  if (!row || row.kind !== 'split' || !row.spanText) return {};
  return {
    payout: {
      spanText: row.spanText,
      spanMonths: row.spanMonths != null ? row.spanMonths : null,
      // 원문이 말한 그대로의 지급 일정 — "처음 200만원+매월 20만원씩 40회".
      detail: row.detail || null,
      first: row.first != null ? row.first : null,
      each: row.each != null ? row.each : null,
      every: row.every || null,
      count: row.count != null ? row.count : null,
    },
  };
}

const AMOUNT_RULES = {
  // 보건복지부: "단태아 임신 1회당 100만원. 다태아는 태아당 100만원이 되도록 추가 지급"
  pregnancyVoucher(p) {
    if (p.fetusCount == null) return { value: null, reason: '태아 수 입력 필요', needsField: 'fetusCount' };
    const base = p.fetusCount * 1000000;
    if (p.isRemoteBirthArea === true) {
      return { value: base + 200000, note: '분만취약지 거주 +20만원 포함' };
    }
    return {
      value: base,
      note: p.isRemoteBirthArea == null ? '분만취약지 여부 미확인 — +20만원 미포함' : undefined,
    };
  },

  // 보건복지부: "첫째아 200만원, 둘째아 이상 300만원"
  // 다태아 적용 방식(쌍둥이를 첫째+둘째로 보는지)은 리서치에서 확인하지 못했다.
  firstMeeting(p) {
    if (p.birthOrder == null) return { value: null, reason: '출산 순위 입력 필요', needsField: 'childrenBefore' };
    if (p.fetusCount != null && p.fetusCount > 1) {
      return { value: null, reason: '다태아 적용 방식을 공식 출처에서 확인하지 못함' };
    }
    return { value: p.birthOrder === 1 ? 2000000 : 3000000 };
  },

  // 복지로: "0세 월 100만원 / 1세 월 50만원"
  // 이미 지난 개월분은 받을 수 없으므로 '앞으로 12개월'만 계산한다.
  // 아동수당법 제4조⑤ "2세 미만의 아동에게는 … 추가로 지급한다" — 아이마다 받는다(childCount).
  parentAllowance(p) {
    if (p.childAgeMonths == null) return { value: null, reason: '출생일 입력 필요' };
    const kids = childCount(p);
    const { total, counted, segments } = monthlyOverHorizon(p.childAgeMonths, [
      { untilMonth: 12, amount: 1000000 * kids },
      { untilMonth: 24, amount: 500000 * kids },
    ]);
    if (counted === 0) return { value: null, reason: '만 2세를 지나 지원 대상이 아님' };
    return { value: total, note: `앞으로 ${counted}개월분` + kidsNote(kids), payout: monthlyPayout(counted, segments) };
  },

  // 보건복지부: 수도권 10만 / 비수도권 10.5만 / 인구감소지역 11만 / 특별 12만
  // 지역사랑상품권 선택 시 +1만원은 인구감소지역에만 적용되는 것으로 확인됐다.
  childAllowance(p) {
    const base = {
      capital: 100000,
      noncapital: 105000,
      depopulation: 110000,
      depopulation_special: 120000,
    }[p.regionType];
    if (base == null) return { value: null, reason: '거주 지역 구분 입력 필요' };
    if (p.childAgeMonths == null) return { value: null, reason: '출생일 입력 필요' };
    const isDepop = p.regionType === 'depopulation' || p.regionType === 'depopulation_special';
    const monthly = base + (isDepop && p.localCurrencyOption === true ? 10000 : 0);
    // 아동수당법 제4조① "아동수당은 … 아동에게 … 지급한다" — 아이마다 받는다(childCount).
    const kids = childCount(p);
    // 2026년 기준 만 9세 미만 = 108개월 미만
    const { total, counted, segments } = monthlyOverHorizon(p.childAgeMonths, [
      { untilMonth: 108, amount: monthly * kids },
    ]);
    if (counted === 0) return { value: null, reason: '만 9세를 지나 지원 대상이 아님' };
    return { value: total, note: `앞으로 ${counted}개월분` + kidsNote(kids), payout: monthlyPayout(counted, segments) };
  },

  // 정부24: "기저귀 월 9만원 / 조제분유 월 11만원" — 만 2세 미만
  // 조제분유는 산모 사망·질병 등 추가 요건이 있어 기본 계산에서는 기저귀만 반영한다.
  diaperFormula(p) {

  // 법제처: "임신 1회당 120만원"

  disabledWomenBirth(p) {

  // 고용24: "총 150만원(월 50만원 × 3개월)"

  // 고용24: "30일 기준 최대 220만원" — 기업 규모·통상임금에 따라 실수령액이 달라진다.
  maternityLeave() {

  // 서울시 보도자료(2026-08-25 확인): "첫째 70만 원, 둘째 80만 원, 셋째 이상 100만 원"
  // 몽땅정보통 상세 페이지에는 "70~100만원" 범위로만 적혀 있다 — 한 페이지에 없다고 근거가 없는 게 아니다.

};
