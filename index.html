      '<div class="lead">' + GROWTH.efwG + 'g 은 같은 주차 태아들의 ' + (FETAL.percentile || 50) + '번째 백분위, 곧 한가운데 값입니다. ' +
      '손에 쥐면 생수 ' + GROWTH.efwG + 'mL 만큼입니다.</div>' +
      '<div class="srcline">물 1mL를 1g으로 보고 환산한 값입니다. 무게를 가늠하기 쉽게 덧붙인 숫자일 뿐, 아기 크기를 재는 기준은 아닙니다.</div>' +
      '<div class="warn">이 숫자는 정상 범위가 아닙니다. 우리 아기가 이보다 크거나 작다고 해서 문제가 있다는 뜻이 아닙니다. ' +
      '실제 판단은 초음파를 본 담당 의사만 할 수 있습니다.</div>' +
      (FETAL.mustShow || []).map(function (t) { return '<div class="dl"><dd>· ' + esc(t) + '</dd></div>'; }).join('') +
      (FETAL.source ? '<div class="srcline">' + esc(FETAL.source.name) + '</div>' +
        goLinks([{ url: FETAL.source.url, label: '원 논문 보기' }]) : '') +
      '</div></div></div>';
  }

  /* 지난번에 왔을 때와 시기가 달라졌으면 그 사실만 알린다.
     알림(푸시)은 구독이 필요해 로그인이 전제라, 로그인하지 않은 사람은
     주차가 바뀐 것을 알 길이 없다. 이 한 줄이 그 자리를 대신한다.
     재촉하지 않는다 — "아직 안 보셨다"가 아니라 "달라졌다"만 말한다.
     처음 온 사람에게는 띄우지 않는다(무엇이 달라졌는지 말할 수 없으므로). */
  var mark = periodMark();
  if (mark) {
    var last = store('yebu.lastPeriod');
    if (last && last !== mark) {
      h += '<div class="sec"><div class="fresh"><div class="fresh-t">' + esc(periodMessage(last, mark)) + '</div>' +
        '<button class="fresh-x" data-freshseen aria-label="확인">' + ICON.check + '확인</button></div></div>';
    } else if (!last) {
      store('yebu.lastPeriod', mark);   // 처음 온 것은 변화가 아니다 — 조용히 기준만 잡는다
    }
  }

  /* 상대가 고친 공유 정보 — 오늘 탭에서 먼저 알린다. 반영은 내 정보에서 고른다(2026-09-10 F04). */
  if (sync.sharedPending) {
    h += '<div class="sec"><div class="item"><button class="row" data-sheet="me" style="background:none;border:0;width:100%;text-align:left">' +
      '<div class="row-main"><div class="row-title">' + esc(sync.partnerName || '배우자') + ' 님이 공유 정보를 고쳤습니다</div>' +
      '<div class="row-sub">' + esc(Object.keys(sync.sharedPending.changes).map(function (k) { return SHEET_FIELD_LABEL[k] || FIELD_LABEL[k] || k; }).join(' · ')) + ' · 내 정보에서 확인한 뒤 반영</div></div>' +
      '<div class="row-side"><span class="tag tint">확인</span></div></button></div></div>';
  }

  /* 이번 주 세 가지 — 옛 색면 블록(가장 급한 하나)의 자리. 체크포인트(내 몫·지금/곧·미완료)
     최대 둘과 이번 주 검사 하나. 전체는 준비 탭에 있고 여기서는 수만 말한다.
     준비물(세부 체크리스트)은 할 일 탭 한 곳에만 둔다(43차 감사) — 카드는 진행률만 말한다. */
  var weekChk = CHK.filter(function (c) {
    return !isDone(c.item.id) && isMine(c.item.who) && (c.state === 'now' || c.state === 'soon');
  });
  // 법정 기한이 이미 지난 내 몫(출생신고 등)은 사라지지 않고 맨 앞에 선다 — 최대 1건, 가장 최근에 지난 것(plan 086-21).
  var pastLegal = CHK.filter(function (c) {
    return !isDone(c.item.id) && isMine(c.item.who) && groupOf(c) === 'pastDeadline' && c.daysLeft != null;
  }).sort(function (a, b) { return b.daysLeft - a.daysLeft; });
  if (pastLegal[0]) weekChk.unshift(pastLegal[0]);
  var tlNow = (profile.stage === 'pregnant' && D.weeks != null)
    ? TL.filter(function (t) { return t.applicable === 'now'; }) : [];
  // 하나만 고를 때는 검사·접종을 준비 항목보다 먼저 — 준비 항목(추정 포함)이 '이번 주' 대표로 서지 않게(감사 E-2).
  tlNow = tlNow.filter(function (t) { return APPLOGIC.countsAsWeekTest(t.item, profile); }).concat(tlNow.filter(function (t) { return !APPLOGIC.countsAsWeekTest(t.item, profile); }));
  // 출산 후의 짝 — 이번 달 접종·검진 하나. 전체 일정은 준비 탭 '접종·검진 일정'에 있다.
  var moNow = (profile.stage === 'postpartum' && D.childAgeMonths != null)
    ? MO.filter(function (x) { return x.applicable === 'now'; }) : [];
  var picks = [];
  if (weekChk[0]) picks.push(todayChkCard(weekChk[0]));
  if (tlNow[0]) picks.push(tlRow(tlNow[0]));
  else if (moNow[0]) picks.push(moRow(moNow[0]));
  if (weekChk[1]) picks.push(todayChkCard(weekChk[1]));
  var openN = myOpenCount().left;
  h += '<div class="sec week3"><div class="sec-head" style="cursor:default"><h3>이번 주 세 가지</h3>' +
    '<button class="count" data-tab="todo" style="min-height:44px">준비 탭에 ' + openN + '건</button></div>' +
    (picks.length ? picks.join('')
      : '<div class="secnote">이번 주에 급한 일은 없습니다. 전체 목록은 준비 탭에 있습니다.</div>') +
    '</div>';

  /* 아빠 주간 카드 — "이번 주 아내 몸에 일어나는 일 → 오늘 할 행동 하나".
     배우자 화면에서만, 이번 주에 해당하는 몸의 변화 중 가장 최근 시작된 것 한 장.
     행동 문구는 데이터의 '아빠오늘하나'(시안 승인분) — 의료 조언이 아니라 생활 제안이다. */
  if (profile.role === 'partner' && profile.stage === 'pregnant' && D.weeks != null) {
    var dadPick = (GUIDE['몸의변화'] || [])
      .filter(function (x) { return x['아빠오늘하나'] && inWeekNow(x, D.weeks); })
      .sort(function (a, b) {
        return (b['해당주차'] ? b['해당주차'].from : 0) - (a['해당주차'] ? a['해당주차'].from : 0);
      })[0];
    if (dadPick) {
      var dwk = dadPick['해당주차'];
      h += '<div class="sec"><div class="dad">' +
        '<div class="dad-eyebrow">이번 주, 아내에게' + (dwk ? ' · ' + dwk.from + '주부터' : '') + '</div>' +
        '<div class="dad-title">' + esc(dadPick['제목']) + '</div>' +
        '<div class="dad-what">' + esc(dadPick['내용']) + '</div>' +
        (dadPick['출처'] && dadPick['출처'].name ? '<div class="dad-src">' + esc(dadPick['출처'].name) + '</div>' : '') +
        '<div class="askwrap" style="margin-bottom:0"><div class="ask-head">오늘 하나</div>' +
        '<div class="dad-act">' + esc(dadPick['아빠오늘하나']) + '</div></div>' +
        '</div></div>';
    }
  }

  /* 내 돈 한 줄 — 합계와 열쇠 질문 하나. 판정은 혜택 탭과 같은 currentMoneyState() 다. */
  h += todayMoneyCard();

  /* 제도 변화 — 곧 시행분만 펼치고 나머지는 접는다 */
  var chgSoon = CHG.filter(function (c) { return c.state === 'soon'; });
  var chgRest = CHG.filter(function (c) { return c.state !== 'soon'; });
  if (chgSoon.length) {
    h += '<div class="sec"><div class="sec-head" style="cursor:default"><h3>곧 바뀝니다</h3>' +
      '<span class="count">' + chgSoon.length + '</span></div>' + chgSoon.map(chgRow).join('') + '</div>';
  }

  h += '<div class="sec">' + nestCardHtml() + '</div>';

  if (profile.stage === 'pregnant' && D.weeks != null) {
    // 이번 주를 그림 한 장으로 — 만들기·공유 전부 기기 안에서 끝난다.
    h += '<div class="sec" style="padding-top:10px;border-bottom:0">' +
      '<button class="askbtn" data-sharecard="week">이번 주 카드 만들기</button></div>';
  }

  /* 검사·접종 전체 일정은 준비 탭(examStripHtml)에 있다 — 여기서는 이번 주 것 하나만(위 세 가지). */

  /* 몸의 변화·조심할 것은 알아보기 탭 '이번 주' 묶음에 있다(2026-09-10) — 오늘 탭은 지금 할 행동만 말한다. */

  if (chgRest.length) {
    h += '<div class="sec"><button class="sec-head" data-fold="chg" aria-expanded="' + (fold.chg ? 'true' : 'false') + '">' +
      '<h3>그 밖의 제도 변화</h3><span class="count">' + chgRest.length + '</span>' +
      '<span class="chev' + (fold.chg ? ' up' : '') + '">' + ICON.chev + '</span></button>';
    if (fold.chg) {
      h += '<div class="secnote">모두 소관 부처의 보도자료·법령 원문에서 직접 확인했습니다. ' +
        '확인하지 못한 세부는 지우지 않고 항목 안에 그대로 적어 두었습니다.</div>';
      h += chgRest.map(chgRow).join('');
    }
    h += '</div>';
  }

  // 원문 확인 문구는 할 일·신청 탭이 이미 말한다 — 오늘 탭은 한 줄이면 된다.
  h += '<div class="foot">오늘 기준으로 계산한 값이라 날이 지나면 달라집니다. 전체 목록은 준비·알아보기 탭에 있습니다.</div>';
  return h;
}

/* ── 오늘 탭 부품 (2026-09 리디자인) ─────────────────────────────────────── */

/* 히어로 오른쪽의 작은 둥지 — 둥지 카드와 같은 상태 계산(currentNest)·같은 토큰 색. */
function heroNestSvg() {
  return '<div class="hero-nest" aria-hidden="true">' + nestSceneSvg(currentNest(), nestTokenColors(), 104) + '</div>';
}

/* 이번 주 카드 한 장 — 체크포인트를 접힌 행으로. 준비물은 펼치지 않고 진행률만 말하고
   준비 탭으로 보낸다(할 일 탭 한 곳에만 — 43차 감사). 완료 체크는 여기서도 된다. */
function todayChkCard(c) {
  var it = c.item, w = chkWhen(c), rowDone = !!done[it.id];
  var chip;
  if (c.state === 'past' && c.date) {
    chip = '<span class="tag rose">' + esc('기한 지남 ' + fmtDates(ENG.fmtDate(c.date))) + '</span>';
  } else if (c.state === 'now' && c.daysLeft != null && w.txt) {
    chip = '<span class="tag ' + (w.cls === 'alert' ? 'rose' : 'peach') + '">' + esc(w.txt + (w.far && w.unit ? ' ' + w.unit : '')) + '</span>';
  } else if (c.state === 'now') {
    chip = '<span class="tag lime">지금</span>';
  } else {
    chip = '<span class="tag peach">' + (w.txt ? esc(w.txt + (w.unit ? ' ' + w.unit : '')) : '곧') + '</span>';
  }
  var sub = it.where || it.whatToDo || '';
  if (it.steps && it.steps.length) {
    var sdN = it.steps.filter(function (st) { return isDone(it.id + '/' + st.id); }).length;
    sub = '준비물 ' + sdN + ' / ' + it.steps.length + ' 확인' + (it.where ? ' · ' + it.where : '');
  }
  return '<div class="item"><div class="row' + (rowDone ? ' done' : '') + '" style="align-items:center">' +
    '<button class="chk' + (rowDone ? ' on' : '') + '" data-done="' + esc(it.id) + '" aria-pressed="' + (rowDone ? 'true' : 'false') +
      '" aria-label="' + esc(it.name) + ' 완료 표시"><i>' + ICON.check + '</i></button>' +
    '<button class="row-main" data-tab="todo" style="background:none;border:0;text-align:left" aria-label="' + esc(it.name) + ', 준비 탭에서 보기">' +
      '<div class="row-title">' + esc(it.name) + '</div>' +
      '<div class="row-sub">' + esc(sub) + '</div>' +
    '</button>' +
    '<div class="row-side">' + chip + '</div></div></div>';
}

/* 내 돈 한 줄 — 합계 판정은 currentMoneyState() 한 곳, 열쇠 질문은 혜택 탭과 같은
   unlockNoteHtml(). 문구도 혜택 탭 히어로와 같은 말을 쓴다(같은 개념은 같은 이름). */
/* 내 시·도 제도 파일이 아직일 때 합계 자리에 놓는 말 (plan 112) — 숫자를 쓰지 않는다.
   전국 제도만으로 낸 합계는 '내 합계'가 아니다. 불러오는 중이면 기다리라고, 못 불러왔으면 그렇다고 말하고 다시 시도를 준다. */
function regionWaitHtml(compact) {
  var failed = REGION_WAIT === 'failed';
  var head = failed ? '우리 동네 제도를 불러오지 못했습니다' : '우리 동네 제도를 불러오는 중입니다';
  var say = failed
    ? '인터넷 연결을 확인한 뒤 다시 시도해 주세요. 우리 동네 제도까지 넣어야 합계를 보여 드릴 수 있습니다.'
    : '조금만 기다려 주세요. 다 불러오면 합계를 보여 드립니다.';
  var btn = failed ? '<div style="margin-top:8px"><button class="askbtn" data-rdretry="1">다시 시도</button></div>' : '';
  if (compact) {
    return '<div class="sec"><div class="item money-card" role="status"><div class="row"><div class="row-main">' +
      '<div class="kv-label">' + head + '</div><div class="row-sub">' + say + '</div>' + btn + '</div></div></div></div>';
  }
  return '<div class="hero" style="padding-bottom:10px" role="status"><div class="hero-row"><div class="hero-side" style="gap:6px">' +
    '<div class="kv-label">' + head + '</div><div class="hero-note" style="margin-top:2px">' + say + '</div>' + btn +
    '</div></div></div>';
}
function todayMoneyCard() {
  if (REGION_WAIT) return regionWaitHtml(true);
  var st = currentMoneyState();
  var head, body, note = '';
  if (st.code === 'HAS_AMOUNT') {
    head = '확인된 제도만 더한 금액';
    body = '<div class="big">' + ENG.won(st.totalWon) + '</div>';   // 만원 아래를 반올림하지 않는다(105,000원이 11만원으로 보였다)
    note = st.partial
      ? partialNoteHtml()
      : unlockNoteHtml(st);
  } else if (st.code === 'NO_REGION') {
    head = '아직 계산하지 않았습니다';
    body = noRegionBody(st);
    note = noRegionAskBtns(st);
  } else if (st.code === 'NEEDS_INPUT') {
    head = '아직 계산하지 않았습니다';
    body = '<div class="hero-say"><b>' + st.questionCount + '가지</b>만 더 알려주시면<br>' + st.needCount + '건을 판단할 수 있습니다</div>';
    note = '모른다고 해서 해당 없음으로 두지 않습니다. 혜택 탭에서 항목을 열면 그 자리에서 답할 수 있습니다.';
  } else if (st.code === 'NO_CASH_VALUE') {
    head = '금액으로 환산할 수 없는 제도만 있습니다';
    body = '<div class="hero-say">' + st.noAmountCount + '가지</div>';
  } else if (st.code === 'NOT_YET') {
    head = '지금 단계에 해당하는 금액 제도가 없습니다';
    body = '<div class="hero-say">출산 후 ' + st.futureCount + '건이 기다립니다</div>';
  } else {
    head = '확인된 제도만 더한 금액';
    body = '<div class="big">0<span class="big-unit">만원</span></div>';
    note = '빠진 정보 없이 계산했습니다. 지금 조건에 맞는 금액 제도가 없습니다.';
  }
  if (READONLY) {   // 읽기 전용 보기 — 묻는 말 대신 사실 한 줄(plan 073)
    var rot = roMoneyText(st);
    if (rot) { if (rot.body) body = rot.body; note = rot.note; }
  }
  var leftN = journeyCounts().leftN;
  return '<div class="sec"><div class="item money-card">' +
    '<div class="row" style="align-items:center"><div class="row-main">' +
      '<div class="kv-label">' + head + '</div>' + body + afterBirthHtml(st, true) +
      (leftN ? '<div class="row-sub">지금 신청 가능 ' + leftN + '건</div>' : '') +
    '</div>' +
    '<div class="row-side"><button class="tag tint" data-tab="money" style="min-height:44px">혜택 보기 →</button></div></div>' +
    (note ? '<div class="money-note" style="margin:0 0 12px"><div class="hero-note" style="margin:0">' + note + '</div></div>' : '') +
    '</div></div>';
}

/* 내 몫의 할 일 수 — 할 일 탭 히어로와 오늘 탭 "준비 탭에 N건"이 같은 수를 말한다.
   'na' = 대상 조건이 맞지 않는 항목(고위험 아님·근로자 아님). 목록에도 수에도 넣지 않는다. */
function myOpenCount() {
  var mine = CHK.filter(function (c) { return isMine(c.item.who) && c.state !== 'past' && c.state !== 'na'; });
  var mineDone = mine.filter(function (c) { return isDone(c.item.id); }).length;
  return { mine: mine, done: mineDone, left: mine.length - mineDone };
}

function viewTodo() {
  var mc = myOpenCount();
  /* 배우자 몫 — 세그먼트로 갈라 본다. 섞으면 내가 할 일이 흐려진다(2026-09-10 리디자인:
     옛 '{배우자}가 할 일' 접힘 묶음의 자리). */
  var theirs = CHK.filter(function (c) {
    return !isMine(c.item.who) && c.state !== 'past' && c.state !== 'unknown' && c.state !== 'na';
  });
  if (!theirs.length) whoView = 'mine';
  var mineView = whoView !== 'theirs';
  // 상대 몫의 완료는 서버에서 온 표시(partnerMarks)도 완료로 센다 — 이 기기 기록과 별개다.
  var doneF = function (c) { return isDone(c.item.id) || (!mineView && !!sync.partnerMarks[c.item.id]); };
  var theirsDone = theirs.filter(doneF).length;
  var leftN = mineView ? mc.left : theirs.length - theirsDone;
  var doneN = mineView ? mc.done : theirsDone;
  var h = '<div class="hero" style="padding-bottom:14px"><div class="hero-row">' +
    '<div class="hero-side" style="gap:6px"><div class="kv-label">' + (mineView ? (READONLY ? '챙길 일' : '내 몫의 할 일') : otherRoleLabel() + '가 할 일') + '</div>' +
    '<div class="big">' + leftN + '<span class="big-unit">건 남음</span></div>' +
    (doneN ? '<div class="hero-note">' + doneN + '건을 마쳤습니다</div>' : '') +
    '</div></div>' +
    (theirs.length ? '<div class="seg" role="group" aria-label="누구의 할 일">' +
      '<button class="' + (mineView ? 'on' : '') + '" data-who="mine" aria-pressed="' + (mineView ? 'true' : 'false') + '">나</button>' +
      '<button class="' + (mineView ? '' : 'on') + '" data-who="theirs" aria-pressed="' + (mineView ? 'false' : 'true') + '">' + otherRoleLabel() + '</button></div>' : '') +
    '</div>';

  // 검사·접종 일정은 '지금' 칩에서만 펼친다 — 다른 칩의 "곧 할 일이 없습니다" 아래에 붙으면 모순이다(plan 086-17).
  h += examStripHtml(prepChip !== 'now');

  /* 시기 칩 — 상태 묶음(STATE_GROUPS)을 한 줄에서 고른다. 옛 할 일 탭은 일곱 묶음을 위아래로
     쌓고 먼 것을 접었는데, 이제는 칩이 범위를 고르므로 시기 묶음은 접지 않는다.
     '정보가 더 필요합니다'만 접는다 — 열쇠 질문은 접기 밖에 남긴다(아래). */
  var rows = mineView ? CHK.filter(function (c) { return isMine(c.item.who); }) : theirs;
  var byGroup = function (key) { return rows.filter(function (c) { return groupOf(c) === key; }); };
  var openN = function (list) { return list.filter(function (c) { return !doneF(c); }).length; };
  var CHIPS = [
    ['now', '지금', openN(byGroup('now')) + openN(byGroup('pastDeadline'))],
    ['soon', '곧', openN(byGroup('soon'))],
    ['anytime', '기한 없이', openN(byGroup('anytime'))],
    ['later', '나중에', openN(byGroup('later'))],
    // 수를 달지 않는다 — '지난 25'는 출산 18일째 사람에게 스물다섯 번 늦었다는 말로 읽혔다.
    ['past', '지난', null]
  ];
  if (!mineView) CHIPS = CHIPS.filter(function (c) { return c[0] !== 'past'; });
  if (!CHIPS.some(function (c) { return c[0] === prepChip; })) prepChip = 'now';
  h += '<div class="chips" role="group" aria-label="시기 고르기">' + CHIPS.map(function (c) {
    var on = prepChip === c[0];
    return '<button class="chip' + (on ? ' on' : '') + '" data-chip="' + c[0] + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      c[1] + (c[2] ? ' <b class="num">' + c[2] + '</b>' : '') + '</button>';
  }).join('') + '</div>';
  if (!mineView) {
    h += '<div class="sec"><div class="secnote">여기 있는 일은 ' + otherRoleLabel() +
      ' 본인만 완료로 표시할 수 있습니다. 무엇이 남았는지 함께 보되, 대신 눌러 주지는 않습니다.</div></div>';
  }

  /* '지금' 칩은 기한이 지난 항목을 먼저 보여준다 — 지각은 숨길 일이 아니라 지금 손쓸 일이다
     (출생신고 과태료). 정보 부족 묶음도 여기에 둔다 — 답하면 대개 '지금'으로 온다. */
  var groupKeys = prepChip === 'now' ? ['pastDeadline', 'now', 'unknown'] : [prepChip];
  if (!mineView) groupKeys = groupKeys.filter(function (k) { return k !== 'unknown'; });
  var drawn = 0;
  groupKeys.forEach(function (key) {
    var g = STATE_GROUPS.filter(function (x) { return x.key === key; })[0];
    var rowsG = byGroup(key);
    if (!g || !rowsG.length) return;
    drawn++;
    /* '정보가 더 필요합니다'만 접는다. 다만 **묶음 질문은 접기 밖에 남긴다** —
       2026-09-07 실측으로 이 묶음 1,906px 중 질문 상자가 388px, 아래 아홉 건이
       1,304px(68%)였다. 아홉 건을 푸는 열쇠는 질문 하나이고, 그 아래 목록은 답하기
       전에는 손쓸 수 없는 미리보기다. 그래서 열쇠는 보이게 두고 목록만 접는다. */
    var foldable = g.key === 'unknown';
    var isOpen = !foldable || fold[g.key];
    // 카운트는 혜택 탭 신청 묶음과 같은 관용구 — 완료가 생기면 '남음 / 전체'로.
    var doneHere = rowsG.filter(doneF).length;
    h += '<div class="sec"><button class="sec-head"' + (foldable ? ' data-fold="' + g.key + '" aria-expanded="' + (isOpen ? 'true' : 'false') + '"' : ' disabled style="cursor:default"') + '>' +
      '<h3>' + g.title + '</h3><span class="count">' + (doneHere ? (rowsG.length - doneHere) + ' / ' + rowsG.length : rowsG.length) + '</span>' +
      (foldable ? '<span class="chev' + (isOpen ? ' up' : '') + '">' + ICON.chev + '</span>' : '') +
      '</button>';
    if (g.key === 'pastDeadline') {
      h += '<div class="secnote">법정 기한이 지났습니다. 늦게라도 할 수 있는지, 과태료가 있는지는 항목 안의 원문 링크에서 확인하세요.</div>';
    }
    // 묶음 질문 — 이 묶음의 행들이 기다리는 입력은 대개 한두 가지다(고용 형태 하나에 여덟 행).
    // 한 번만 묻고, 행에는 되풀이하지 않는다. 답하면 여덟 행이 한꺼번에 제자리를 찾는다.
    ASK_ABOVE = false;
    // isOpen 을 보지 않는다 — 목록을 접어도 질문은 남아야 한다(위 주석 참조).
    if (g.key === 'unknown') {
      var fieldsU = [];
      rowsG.forEach(function (c) {
        (c.missingFields || []).forEach(function (fld) { if (fieldsU.indexOf(fld) < 0) fieldsU.push(fld); });
      });
      if (fieldsU.length) {
        h += (READONLY
          ? '<div class="secnote">' + RO_PENDING_NOTE + '</div>'   // 읽기 전용 — 묻지 않고 사실만(plan 073)
          : '<div class="secnote">아래 ' + rowsG.length + '건은 ' + (fieldsU.length === 1 ? '한 가지' : fieldsU.length + '가지') +
            '만 알면 정리됩니다.</div>' + askBlock({ missingFields: fieldsU }));
        ASK_ABOVE = true;
      }
    }
    if (isOpen) h += rowsG.map(chkRow).join('');
    ASK_ABOVE = false;
    h += '</div>';
  });
  var EMPTY_BY_CHIP = { now: '지금 할 일이 없습니다.', soon: '곧 할 일이 없습니다.', anytime: '기한 없이 챙길 것이 없습니다.',
    later: '나중에 할 일이 없습니다.', past: '지난 단계의 일이 없습니다.' };
  if (!drawn) h += '<div class="empty">' + EMPTY_BY_CHIP[prepChip] + '</div>';

  h += '<div class="foot"><b>&lsquo;참고&rsquo; 표시가 없는 항목은 정부·법령 원문에서 직접 확인한 것입니다.</b><br>' +
    '기한과 금액은 제도가 바뀌면 달라집니다. 신청 전에 각 항목의 원문 링크로 한 번 더 확인하세요. ' +
    '확인하지 못한 세부는 숨기지 않고 항목 안에 그대로 적어 두었습니다. ' +
    '<a href="terms.html" target="_blank" rel="noopener">이용 안내</a></div>';
  return h;
}

/* 검사·접종 일정 — 임신 중은 주차 검사(TL), 출산 후는 월령 접종·검진(MO).
   이번 주(이번 달) 것은 접혀 있어도 늘 보이고, 머리를 열면 전체 일정이 순서대로 나온다.
   옛 오늘 탭의 '주에 받는 검사'·'곧 받게 됩니다'·'개월의 접종·검진'·'다음에 올 것'이
   여기로 왔다(2026-09-10 리디자인) — 오늘 탭은 이번 주 것 하나만 '세 가지'에 넣는다. */
function examStripHtml(compact) {
  var preg = profile.stage === 'pregnant' && D.weeks != null;
  var post = profile.stage === 'postpartum' && D.childAgeMonths != null;
  if (!preg && !post) return '';
  var all = preg ? TL : MO;
  if (compact) return '<div class="secnote">검사·접종 일정 ' + all.length + ' — 지금 칩에 있습니다</div>';
  var rowFn = preg ? tlRow : moRow;
  var fromOf = preg ? function (x) { return x.item.weekFrom; } : function (x) { return x.item.monthFrom; };
  var byFrom = function (a, b) { return fromOf(a) - fromOf(b); };
  var now = all.filter(function (x) { return x.applicable === 'now'; });
  var next = all.filter(function (x) { return x.applicable === 'upcoming'; }).sort(byFrom);
  var past = all.filter(function (x) { return x.applicable === 'past'; }).sort(byFrom);
  var isOpen = !!fold.prep_exam;
  // 준비 항목(예: 보험 가입 권장 시기)을 '받는 검사'로 세지 않는다 — 20주 화면에서 "검사 5" 안에 보험이 들어 있었다(감사 E-2).
  // 해당 여부를 모르는 조건부 일정(예: Rh 음성 면역글로불린)도 따로 센다(H-2). 셈은 알림·주간 카드와 같은 APPLOGIC.countsAsWeekTest.
  var nowTest = preg ? now.filter(function (x) { return APPLOGIC.countsAsWeekTest(x.item, profile); }).length : 0;
  var nowPrep = preg ? now.filter(function (x) { return x.item.category === '준비'; }).length : 0;
  var nowCond = preg ? now.length - nowTest - nowPrep : 0;
  var nowLabel = preg ? D.weeks + '주에 받는 검사 ' + nowTest + (nowPrep ? ' · 준비 ' + nowPrep : '') + (nowCond ? ' · 해당 시 ' + nowCond : '')
    : '생후 ' + D.childAgeMonths + '개월의 접종·검진 ' + now.length;
  var h = '<div class="sec"><button class="sec-head" data-fold="prep_exam" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
    '<h3>' + (preg ? (profile.role === 'partner' ? '아내의 검사 일정' : '검사 일정') : '접종·검진 일정') + '</h3><span class="count">' + all.length + '</span>' +
    '<span class="chev' + (isOpen ? ' up' : '') + '">' + ICON.chev + '</span></button>';
  // 이번 주 것은 접혀 있어도 보인다 — 접는 것은 앞뒤 일정이지 지금 받을 검사가 아니다.
  if (now.length) h += '<div class="secnote">' + nowLabel + '</div>' + now.map(function (x) { return rowFn(x, !isOpen); }).join('');
  else if (next[0]) {
    h += '<div class="secnote">' + (preg ? '이번 주에 받는 검사는 없습니다' : '이번 달에 맞는 접종·검진은 없습니다') +
      ' · 다음은 <b>' + esc(next[0].item.name) + '</b>(' + (preg ? next[0].item.weekFrom + '주' : '생후 ' + next[0].item.monthFrom + '개월') + ')</div>';
  }
  if (isOpen) {
    // map 의 두 번째 인자(색인)가 compact 로 새지 않게 감싼다.
    if (next.length) h += '<div class="sec-sub">앞으로</div>' + next.map(function (x) { return rowFn(x); }).join('');
    if (past.length) h += '<div class="sec-sub">지난 시기</div><div class="dimrows">' + past.map(function (x) { return rowFn(x); }).join('') + '</div>';
    if (post) {
      h += '<div class="secnote">일정은 질병관리청 예방접종도우미·공식 안내 기준입니다. ' +
        '아기 상태에 따른 실제 접종 판단은 소아청소년과에서 합니다.</div>';
    }
  }
  return h + '</div>';
}

/* ── 화면: 생활 ────────────────────────────────────────────────────────── */
/**
 * 찾아보는 안내서. '오늘' 탭이 이번 주 해당분만 보여준다면
 * 여기는 전체를 서랍으로 두고 필요할 때 꺼내 보는 곳이다.
 * 서랍은 전부 접힘이 기본 — 목차가 먼저 보여야 서랍이다.
 */
function lifeRow(x) {
  var id = 'f_' + x.id;
  var h = '<div class="item"><button class="row" data-open="' + esc(id) + '" aria-expanded="' + (open[id] ? 'true' : 'false') + '" style="background:none;border:0">' +
    '<div class="row-main">' +
      '<div class="row-title">' + esc(x.title) + '</div>' +
      (x.summary ? '<div class="row-sub">' + esc(fmtDates(x.summary)) + '</div>' : '') +
      (x.grade === '참고' ? '<div class="row-meta"><span class="tag line">' + esc(x.gradeLabel || '참고') + '</span></div>' : '') +
    '</div></button>';
  if (open[id]) {
    h += '<div class="detail">' + lifeDetailHtml(x) + '</div>';
  }
  return h + '</div>';
}

/* 생활 항목의 상세 본문 — 생활 탭(lifeRow)과 검색 상세(searchDetail)가 같은 것을
   그린다. 검색으로 찾으면 빈 카드가 나오던 사고(2026-09-09) 뒤에 뽑아냈다. */
function lifeDetailHtml(x) {
  var h = '';
  if (x.lead) h += '<div class="lead">' + esc(x.lead) + '</div>';
  (x.facts || []).forEach(function (f) {
    h += '<div class="dl"><dd>' + esc(f.factKo) +
      (f.grade === '참고' ? ' <span class="tag line">참고</span>' : '') + '</dd></div>';
    if (f.quote) {
      h += '<div class="quote">&ldquo;' + esc(f.quote) + '&rdquo;</div>';
    }
    if (f.source) {
      h += checkedLine(f.source.name, f.source.checkedAt) +
        goLinks([{ url: f.source.url, label: '원문 보기' }]);
    }
  });
  /* 도움을 청할 수 있는 곳 — 산후 우울처럼 "혼자 판단하지 말라"고 적어 놓고
     어디에 물어야 하는지 말하지 않으면 거기서 끝난다. 정부가 운영하는 창구만 싣고
     번호는 원문에 있는 것을 그대로 옮긴다. */
  if ((x.channels || []).length) {
    h += '<div class="channels"><div class="channels-h">도움을 청할 수 있는 곳</div>' +
      x.channels.map(function (c) {
        return '<div class="channels-i"><b>' + esc(c.name) + '</b>' +
          (c.contact ? '<div class="channels-c">' + esc(c.contact) + '</div>' : '') +
          (c.who ? '<div class="channels-w">' + esc(c.who) + '</div>' : '') + '</div>';
      }).join('') + '</div>';
  }
  var cavs = (x.caveats || []).concat((x.facts || []).flatMap(function (f) { return f.caveats || []; }));
  h += unverifiedBlock(cavs);
  return h;
}

/* ── 준비물 서랍 ─────────────────────────────────────────────────────────
   공식 준비물 목록(아이사랑) + 소비자원 시험·안전주의보 + (있으면) 쿠팡 파트너스 링크.
   정부 지원금 카드와 섞지 않는다 — 별도 서랍, 별도 색(peach). 링크가 있는 카드는 첫 줄에
   광고 표시문구(공정위 「추천·보증 등에 관한 표시·광고 심사지침」·쿠팡 파트너스 권장 문구).
   가격·상품 사진은 싣지 않는다(쿠팡 API 약관: 제공 데이터 복제·저장 금지). 후기도 없다 —
   '객관'은 공식 준비물·공적 시험 둘로 채운다. 리콜은 판매 사업자·쿠팡의 법적 의무라 우리가 따로 대조하지 않는다(2026-09-14). */
var GOODS_GROUPS = [['hospital', '입원 가방'], ['newborn', '신생아 옷·용품'], ['feeding', '수유'], ['outing', '외출'], ['home', '집안']];
var GOODS_AD = '이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.';

  h += '<div class="foot"><b>이 탭의 &lsquo;확인&rsquo; 항목은 전부 공식 원문에서 직접 확인한 것입니다.</b><br>' +
    '&lsquo;참고&rsquo;는 공식 안내에서 찾지 못했거나 실무·민속에 속하는 내용에 붙입니다. 틀려도 헛걸음 정도로 끝나는 항목에만 씁니다. ' +
    '의료 판단·법정 기한·금액에는 참고 등급을 쓰지 않습니다.<br>' +
    // 가이드북 체험판(1·2장, build-book.mjs --sample → pages/guide.html)으로 가는 앱 안 입구(2026-10-07).
    // 판매 문구(가격·출시·사전 신청)는 싣지 않는다 — 없는 기능을 약속하지 않는다(89차 문구 가드).
    '<a href="pages/guide.html" target="_blank" rel="noopener">예부 가이드북 1·2장 읽기</a>: ' +
    '임신 확인부터 출산 후 첫 달까지를 같은 원칙(공식 원문 근거)으로 한 권에 정리했습니다.</div>';
  return h;
}

/* ── 화면: 신청(구 여정) ───────────────────────────────────────────────── */
var BUCKETS = [
  { key: 'overdue',  title: '기한이 지났습니다', bar: 'alert' },
  { key: 'softlost', title: '지금 신청해도 일부는 못 받습니다', bar: 'alert' },
  { key: 'urgent',   title: '30일 안에 신청', bar: 'alert' },
  { key: 'soon',     title: '90일 안에 신청', bar: 'soon' },
  // 예산이 끝나면 마감이다 — 날짜는 없지만 서두를 이유는 있다.
  { key: 'budget',   title: '예산이 끝나면 마감입니다', bar: 'soon' },
  // 지금 신청할 수 있고 기한이 90일 넘게 남은 것 — '그 뒤에 신청'이라 부르면 "나중에 하라"로 읽혔다(외부감사 F07).
  { key: 'later',    title: '지금 신청 가능 (기한 90일 넘게 남음)', bar: '' },
  // '기한 없음'이 아니라 '상시 신청'이다. 공식 문서가 그렇게 밝힌 것만 여기 온다.
  { key: 'anytime',  title: '상시 신청', bar: '' },
  // 공고·기관마다 접수기간이 다르다 — 전국 공통 날짜가 없다는 것이 확인된 사실이다.
  { key: 'perNotice', title: '모집공고·기관 안내를 확인하세요', bar: '' },
  // 기한도 확인됐고 기준일도 받는 종류인데 아직 비어 있다(휴가가 끝나는 날) — 그 자리에서 묻는다.
  { key: 'askDate', title: '끝나는 날을 적으면 기한이 계산됩니다', bar: 'soon' },
  // 기한은 있는데 기준일(유산일·취득일 등)을 우리가 받지 않는다 — 원문을 보여준다.
  { key: 'anchorUnknown', title: '기한이 있습니다 (내 날짜 기준으로 세어 보세요)', bar: 'soon' },
  // 확인하지 못한 것을 상시라고 말하지 않는다. 여기 있는 항목은 기한을 모르는 것이다.
  { key: 'unknownDeadline', title: '신청 시점 확인이 필요합니다', bar: 'off' },
  { key: 'notyet',   title: '아직 신청할 수 없습니다', bar: 'off' },
  // 따로 신청하지 않는다 — 자동 적용되거나 다른 청구 때 함께 처리된다.
  { key: 'auto',     title: '따로 신청하지 않아도 됩니다', bar: 'off' }
];
/* 신청 묶음의 머릿수 — 신청 탭 히어로와 오늘 탭 '내 돈 한 줄'이 같은 수를 말한다.
   머리의 숫자는 '지금 신청할 수 있는 것'만 센다. 아직 단계가 오지 않은 제도까지 더하면
   숫자가 거짓말을 한다 — 임신 중인 사람에게 '신청할 수 있는 제도'라고 적어 둔 수의
   절반 가까이가 출산 후에나 되는 것이었다. 따로 신청하지 않는 것(auto)도 뺀다. */
function journeyCounts() {
  var canApply = JOURNEY.filter(function (j) { return j.bucket !== 'notyet' && j.bucket !== 'auto'; });
  /* 둘을 합쳐 세고 "아직 신청할 수 없다"고 한 줄로 말하면 거짓이 된다 —
     따로 신청하지 않아도 되는 것(auto)은 못 하는 것이 아니라 할 필요가 없는 것이다.
     아래에서 묶음도 따로 그리므로 숫자도 따로 센다(2026-09-07). */
  var notYetN = JOURNEY.filter(function (j) { return j.bucket === 'notyet' && shownWithoutRegion(j); }).length;
  var autoN = JOURNEY.filter(function (j) { return j.bucket === 'auto'; }).length;
  // 머리 숫자는 '신청할 수 있다'가 확인된 것만 센다 — 날짜가 있거나 상시로 확인된 것.
  // 공고별·예산 소진·기준일 미입력·시점 미확인까지 더하면 32건이 되는데, 그 절반은
  // 신청 시점을 따로 확인해야 하는 것이었다(43차 감사). 그것들은 수를 따로 말한다.
  var CERTAIN = { overdue: 1, softlost: 1, urgent: 1, soon: 1, later: 1, anytime: 1 };
  var certain = canApply.filter(function (j) { return CERTAIN[j.bucket]; });
  var checkN = canApply.length - certain.length;
  var appliedN = certain.filter(function (j) { return isDone('apply_' + j.id); }).length;
  return { canApply: canApply, notYetN: notYetN, autoN: autoN, certain: certain,
    checkN: checkN, appliedN: appliedN, leftN: certain.length - appliedN };
}

/* '지금 신청' 칩의 머리말 — 옛 신청 탭 히어로가 하던 말. 수는 journeyCounts() 하나에서 온다. */
function applyNoteHtml(jc) {
  var appliedN = jc.appliedN, checkN = jc.checkN, autoN = jc.autoN, leftN = jc.leftN, notYetN = jc.notYetN;
  return '<div class="sec"><div class="secnote"><b>' + leftN + '건</b>' +
    (appliedN ? ' 아직 신청하지 않았습니다 · ' + appliedN + '건은 신청을 마쳤습니다' : '을 지금 신청할 수 있습니다. 기한이 가까운 순서로 정리했습니다') +
    (checkN ? '<br>' + checkN + '건은 신청 시점을 따로 확인해야 해 아래에 나눠 두었습니다' : '') +
    (notYetN ? '<br>' + notYetN + '건은 아직 신청할 수 없어 <b>나중에</b> 칩에 두었습니다' : '') +
    (autoN ? '<br>' + autoN + '건은 따로 신청하지 않아도 됩니다' : '') +
    '</div></div>';
}

/* ── 받은 금액 기록 (plan 072) ─────────────────────────────────────────────
   '신청 완료'로 표시한 제도 행 아래에서 받은 금액(원)과 받은 날짜를 적는다. 새 저장 키를 만들지 않고 기존 완료 표시
   done[id].received = {won, date} 로 붙는다(yebu.done). 기기 밖으로 나가지 않는다 — 부부 공유는 항목 id 만 올리고
   (APPLOGIC.syncMarkIds) 백업 파일(yebu-backup.json)에는 담긴다. 합계는 혜택 탭 합계 카드 아래 한 줄(receivedLineHtml). */
var recvOpenId = null;   /* 입력 칸이 열린 신청 표시 id (예: apply_xxx) */
var recvErr = null;
var recvDraft = null;    /* 저장이 거절됐을 때 방금 적은 값 — 다시 그려도 지워지지 않게 */
function recvDateText(d) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || '');
  return m ? Number(m[2]) + '월 ' + Number(m[3]) + '일' : '';
}
function receivedRowHtml(jkey) {
  if (READONLY || !isDone(jkey)) return '';
  // 받은 금액이 적힌 완료를 풀려고 한 번 눌렀을 때 — 화면 안 확인 줄(plan 083)
  var ask = undoAskId === jkey ? '<div class="fieldnote" role="alert" style="color:var(--alert);font-weight:700">받은 금액 기록도 함께 지워집니다 · 한 번 더 누르면 풉니다</div>' : '';
  var rc = APPLOGIC.normReceived(done[jkey].received);

      '<label for="recv_won">받은 금액 (원)</label>' +

      '<label for="recv_date">받은 날짜</label>' +
      '<input type="date" id="recv_date" value="' + esc(dv.date) + '">' +
      (recvErr ? '<div class="fieldnote" role="alert" style="color:var(--alert);font-weight:700">' + esc(recvErr) + '</div>' : '') +
      '<div class="recv-btns"><button class="askbtn" data-recv="save" data-recv-id="' + rid + '">저장</button>' +
      '<button class="askbtn" data-recv="cancel">취소</button>' +
      (rc ? '<button class="askbtn" data-recv="clear" data-recv-id="' + rid + '">기록 지우기</button>' : '') + '</div>' +
      '<div class="fieldnote">이 기기에만 저장됩니다. 서버로 보내지 않고 부부 공유에도 담기지 않습니다.</div>' +
      '</div></div>';
  }
  if (rc) {
    return ask + '<div class="recv"><div class="recv-line">받은 금액 <b>' + esc(ENG.won(rc.won)) + '</b>' + (rc.date ? ' · ' + esc(recvDateText(rc.date)) : '') +
      '<button class="tag tint" data-recv="open" data-recv-id="' + rid + '">고치기</button></div></div>';
  }

}
/* 혜택 탭 합계 카드 아래 — 기록이 하나라도 있을 때만 */
function receivedLineHtml() {
  if (READONLY) return '';
  var s = APPLOGIC.receivedSummary(done);
  if (!s.count) return '';
  return '<div class="sec"><div class="secnote" id="recvTotal" style="margin:6px 0 0">지금까지 받은 금액 <b>' + esc(ENG.won(s.won)) + '</b> (' + s.count + '건)</div></div>';

/* 받은 금액 저장·지우기 — 입력 칸의 값을 모양 확인(applogic.normReceived)한 뒤 완료 표시 객체에 붙인다. */
function recvSave(id) {
  if (READONLY || !isDone(id)) return;
  var wEl = document.getElementById('recv_won'), dEl = document.getElementById('recv_date');
  var rc = APPLOGIC.normReceived({ won: wEl ? wEl.value : '', date: dEl ? dEl.value : '' });
  if (!rc) {
    recvErr = '금액은 1원 이상 10억 이하의 숫자로, 날짜는 달력에서 골라 적어 주세요.';
    recvDraft = { won: wEl ? wEl.value : '', date: dEl ? dEl.value : '' };
    return;
  }
  done[id].received = rc;
  store('yebu.done', JSON.stringify(done));
  recvOpenId = null; recvErr = null; recvDraft = null;

function recvClear(id) {
  if (READONLY || !isDone(id)) return;
  delete done[id].received;
  store('yebu.done', JSON.stringify(done));
  recvOpenId = null; recvErr = null; recvDraft = null;
}

/* 신청 묶음 목록 — 기한 축(BUCKETS)으로 묶어 그린다. 행은 제도 상세를 열 수 있다(제도 카드와
   같은 programDetailHtml) — 진입 경로가 달라도 같은 정보를 본다.
   forceOpen: 칩이 이미 범위를 골랐을 때(나중에 칩) 그 안에서는 접지 않는다. */
function journeyBucketsHtml(buckets, byId, forceOpen) {
  var h = '';
  buckets.forEach(function (b) {
    var rows = JOURNEY.filter(function (j) { return j.bucket === b.key && (b.key !== 'notyet' || shownWithoutRegion(j)); });
    if (!rows.length) return;
    // 신청을 마친 것은 아래로 내린다. 지우지는 않는다 — 다시 확인하고 싶을 수 있다.
    rows = rows.slice().sort(function (x, y) {
      return (isDone('apply_' + x.id) ? 1 : 0) - (isDone('apply_' + y.id) ? 1 : 0);
    });
    var restN = rows.filter(function (j) { return !isDone('apply_' + j.id); }).length;
    /* 지금 손쓸 수 없는 묶음은 접어 둔다 — 할 일 탭이 먼 일과 지난 일에 쓰는 원칙과 같다.
       이 탭만 접힘이 하나도 없어서, '아직 신청할 수 없습니다' 37건이 탭 높이의 72%를
       차지했다(2026-09-07 실측: 8,450px 중 6,069px). 지금 신청할 수 있는 것을 보려는
       사람이 매번 그 위를 지나가야 했다.
       기한이 걸린 묶음은 절대 접지 않는다 — 지각은 숨길 일이 아니라 지금 손쓸 일이다. */
    var foldable = b.key === 'notyet' || b.key === 'auto';
    if (forceOpen) foldable = false;
    // 열림 상태를 다른 탭과 섞지 않는다 — 'later' 는 할 일 탭에도 있는 키다.
    var fkey = 'jn_' + b.key;
    var isOpen = !foldable || !!fold[fkey];
    var headIn = '<h3>' + b.title + '</h3><span class="count">' +
      (restN === rows.length ? rows.length : restN + ' / ' + rows.length) + '</span>';
    h += '<div class="sec">' + (foldable
      ? '<button class="sec-head" data-fold="' + fkey + '" aria-expanded="' + (isOpen ? 'true' : 'false') + '">' +
        headIn + '<span class="chev' + (isOpen ? ' up' : '') + '">' + ICON.chev + '</span></button>'
      : '<div class="sec-head" style="cursor:default">' + headIn + '</div>');
    if (isOpen) h += rows.map(function (j) {
      var prog = programById(j.id);
      j.applyUrl = prog ? (prog.applyUrl || prog.onlineApplyUrl) : null;
      var when = '', unit = '', cls = b.bar === 'alert' ? 'alert' : '';
      // 예정일에서 역산한 기한은 D-day 로 못박지 않는다 — 아기가 언제 태어날지 모른다.
      // 예정일에서 역산한 기한 — '출산 후'라고만 쓰면 "출산 후에 신청하라"로 읽힌다(KTX 임산부 할인은
      // 임신 중 쓰는 것인데 기한이 출산 후 1년이다). 기준이 예정일이라는 사실과 원문 기한을 함께 보여준다.
      // 아직 열리지 않은 제도에는 기한 대신 시작만 — 'N일 뒤부터'. 기한(D-day)과 한 자리에 둘이 설 수 없다.
      var wsb = startBadgeText(byId ? byId(j.id) : null);
      if (wsb) { unit = wsb; }
      else if (j.estimated) { when = '예정일 기준'; unit = fmtDates(j.deadlineText) || (j.deadline && j.deadline.date ? '≈ ' + fmtMD(new Date(j.deadline.date + 'T00:00:00')) : ''); }
      else if (j.deadline && j.deadline.daysLeft != null) { var wl = whenLabel(j.deadline.daysLeft, j.deadline.date); when = wl.txt; unit = wl.unit; }
      else if (b.key === 'anytime') { when = '상시'; }
      // 예산 소진형에 D-day 를 붙이면 없는 정확도를 지어내는 것이 된다.
      else if (b.key === 'budget') { when = '소진 시'; }
      else if (b.key === 'perNotice') { when = '공고별'; }
      // 기준일을 우리가 받지 않는 기한 — 날짜 대신 원문 문구를 그대로 보여준다.
      else if (b.key === 'askDate') { when = '날짜 입력'; unit = fmtDates(j.deadlineText) || ''; }
      else if (b.key === 'anchorUnknown') { when = '원문'; unit = fmtDates(j.deadlineText) || ''; }
      else if (b.key === 'auto') { when = '자동'; }
      // 모르는 것은 모른다고 적는다 — 빈칸으로 두면 '기한 없음'처럼 읽힌다.
      else if (b.key === 'unknownDeadline') { when = '확인 필요'; }
      // 오른쪽 메타는 짧은 것만 — 긴 원문 기한 문구는 제목 아래 줄로 내린다(2026-09-14 실측: '아/동/수/당').
      var longUnit = unit.length > 14;
      var jkey = 'apply_' + j.id;
      var jdone = isDone(jkey);
      var r = byId ? byId(j.id) : null;
      var pid = 'p_' + j.id;
      // 아직 신청이 성립하지 않는 항목(notyet)에는 '신청 완료' 체크를 주지
      // 않는다 — 신청 없이 완료 표시가 가능하면 기록이 거짓이 된다(30차).
      return '<div class="item"><div class="row' + (jdone ? ' done' : '') + '">' +
        (b.key === 'notyet' ? '' :
        '<button class="chk" data-done="' + esc(jkey) + '" aria-pressed="' + (jdone ? 'true' : 'false') +
        '" aria-label="' + esc(j.name) + ' 신청 완료 표시"><i>' + ICON.check + '</i></button>') +
        (r ? '<button class="row-main" data-open="' + esc(pid) + '" aria-expanded="' + (open[pid] ? 'true' : 'false') + '" style="background:none;border:0;text-align:left">'
           : '<div class="row-main">') +
        '<div class="row-title">' + esc(j.name) + '</div>' +
        (longUnit ? '<div class="row-sub">' + esc((when ? when + ' · ' : '') + unit) + '</div>' : '') +
        (j.applyVia ? '<div class="row-sub">' + esc(srcInline(j.applyVia)) + '</div>' : '') +
        /* 무엇을 못 받는지 말한다 — 묶음 제목만으로는 "일부"가 무엇인지 알 수 없다.
           데이터에 설명이 있는 제도에만 붙는다(여섯 중 셋만 이 묶음에 도달한다). */
        (b.key === 'softlost' && j.deadline && j.deadline.softLoss
          ? '<div class="row-sub loss">' + esc(j.deadline.softLoss) + '</div>' : '') +
        (jdone && doneBy(jkey) ? '<div class="row-meta"><span class="tag done-by">' + ROLE_LABEL[doneBy(jkey)] + '가 신청</span></div>' : '') +
        (r ? '</button>' : '</div>') + '<div class="row-side">' +
        (when ? '<div class="row-when ' + cls + '">' + esc(when) + '</div>' : '') +
        (unit && !longUnit ? '<div class="row-when-unit">' + esc(unit) + '</div>' : '') +
        (j.confirmedAmount != null ? '<div class="row-money">' + esc(ENG.won(j.confirmedAmount)) + '</div>' : '') +
        '</div></div>' +
        // '아직 신청할 수 없습니다' 항목에 '신청하러 가기'는 자기모순 — 안내로 부른다.
        goLinks([{ url: j.applyUrl, label: b.key === 'notyet' ? '안내 미리 보기' : applyLabel(j), ev: 'apply-open', id: j.id, layer: j.layer }]) +
        // 신청을 마친 행에서만 — 받은 금액과 날짜를 이 기기에 적어 둔다(plan 072).
        receivedRowHtml(jkey) +
        // 기준일을 묻는 행 — 제도 카드·할 일 탭과 같은 질문 상자를 그 자리에 붙인다.
        (b.key === 'askDate' && j.missingFields && j.missingFields.length ? askBlock(j) : '') +
        (r && open[pid] ? programDetailHtml(r) : '') + '</div>';
    }).join('');
    h += '</div>';
  });
  return h;
}

/* ── 화면: 혜택 ────────────────────────────────────────────────────────── */
/**
 * 합계에 넣지 않은 이유를 항목마다 밝힌다.
 * 이유를 적지 않으면 '금액 미정'이라는 뭉뚱그린 제목이 대신 읽히는데,
 * 첫만남이용권처럼 금액이 분명한 제도가 그 아래 들어가면 그 제목이 거짓말이 된다.
 */
/**
 * 바로가기 묶음. 신청처가 있으면 그것을 앞에, 근거 원문을 뒤에 둔다.
 * 링크를 상세 안에만 두면 아무도 원문을 확인하지 않는다 —
 * 이 앱은 '출처가 있다'가 아니라 '출처로 갈 수 있다'가 값이다.
 */
/* 신청 절차가 없는 제도(자동 적용·별도 신청 없음)에는 '신청하러 가기'를 달지 않는다 — 안내 보기로 부른다(plan 086-9). 버튼 동작은 그대로. */
var NO_APPLY_RE = /별도 (정부 )?신청 절차 없|자동 (적용|반영|연계)|신청하지 않아도/;
/* 신청 창구가 실제로 있는 제도(예: 청소년 산모 의료비 — 온라인 신청이 있고 연계 시 따로 안 해도 된다는 설명이 함께 있음)는
   '신청하러 가기'로 둔다. 신청 절차가 아예 없다는 문장만 있을 때 '안내 보기'. */
var HAS_APPLY_RE = /온라인 ?신청|방문 ?신청|신청서|우편 접수|접수|청구/;
function applyLabel(o) { return o && o.applyVia && NO_APPLY_RE.test(o.applyVia) && !HAS_APPLY_RE.test(o.applyVia) ? '안내 보기' : '신청하러 가기'; }
function goLinks(opts) {
  var out = '';
  (opts || []).forEach(function (o) {
    if (!o || !o.url) return;
    out += '<a class="golink' + (o.strong ? ' strong' : '') + '" href="' + esc(o.url) + '"' +
      (o.ev ? ' data-ev="' + esc(o.ev) + '"' + (o.id ? ' data-ev-id="' + esc(o.id) + '"' : '') + (o.layer ? ' data-ev-layer="' + esc(o.layer) + '"' : '') : '') +
      ' target="_blank" rel="noopener noreferrer">' + esc(o.label) + ICON.ext + '</a>';
  });
  return out ? '<div class="golinks">' + out + '</div>' : '';
}

function whyNotCounted(r) {
  if (r.countsToward) return '';
  var t = '';
  if (r.notYetEffective) t += '<span class="tag">시행 전</span>';
  else if (r.status === 'future') t += '<span class="tag">출산 후에 해당</span>';
  if (r.program.confidence !== '확인') t += '<span class="tag">' + esc(r.program.confidence) + ' 단계</span>';
  if (r.amount && r.amount.isCap) t += '<span class="tag">상한액</span>';
  if (r.amount && r.amount.value == null) t += '<span class="tag">금액 미정</span>';
  if (r.status === 'unknown') t += '<span class="tag">정보 부족</span>';
  if (r.status === 'expired') t += '<span class="tag legal">기한 지남</span>';
  if (r.status === 'past') t += '<span class="tag">시기 지남</span>';
  if (r.superseded) t += '<span class="tag line">지역 제도로 대체</span>';
  else if (r.status === 'ineligible') t += '<span class="tag line">조건 불일치</span>';
  return t;
}

  }
  if (!h) return '';
  // bare: 내 정보 '남은 질문'처럼 머리말이 이미 있는 자리 — 질문마다 같은 말을 되풀이하지 않는다.
  if (bare) return '<div class="askwrap bare">' + h + '</div>';
  return '<div class="askwrap"><div class="ask-head">' + (r.missingAny ? '아래 중 하나라도 해당하면 알려 주세요' : '이것만 알려주시면 판단합니다') + '</div>' + h + '</div>';
}

/* ── 누가 신청하는 제도인가 ────────────────────────────────────────────
   휴가·급여처럼 '사람'에게 붙는 제도는 가구가 아니라 개인이 신청한다.
   그런데 엄마와 아빠가 보는 지원금 목록이 한 글자도 다르지 않았다(엔진을 두 번
   돌려 실측했다) — 아빠 화면에도 출산전후휴가가 그대로 떠서 자기가 쓸 수 있는
   휴가로 읽혔다. 반대로 배우자 유산·사산휴가는 아빠가 쓰는 휴가인데 판정이
   엄마의 고용형태를 보고 있었다(데이터에서 고쳤다).
   claimant 가 적힌 제도에만 말한다. 나머지 500여 제도는 대개 가구 단위라 누가
   신청해도 되고, 근거 없이 '엄마 것'이라 적으면 그게 또 거짓이 된다. */
var CLAIMANT_LABEL = {
  mother: '엄마 몫', partner: '아빠 몫',
  each: '부모 각자 몫', both: '부모가 함께 써야 성립'
};
function claimantTag(r) {
  var c = r.program.claimant;
  if (!c || !CLAIMANT_LABEL[c]) return '';
  // '각자'와 '함께'는 두 사람 모두의 몫이라 늘 내 것이다.
  var mine = c === 'each' || c === 'both' || c === profile.role;
  return '<span class="tag who' + (mine ? ' mine' : '') + '">' + CLAIMANT_LABEL[c] + '</span>';
}

/** 이 금액을 나눠 받는다면 그 기간을 금액 바로 밑에 적는다. 한 번에 받는 것은 적지 않는다. */
function payoutTag(r) {
  var po = r.amount && r.amount.payout;
  if (!po || !po.spanText) return '';
  return '<div class="row-split">' + esc(po.spanText) + '</div>';
}

/**
 * 우리가 확정하지 못한 것이 있으면 어디에 물어야 하는지까지 말한다.
 *
 * 금액을 모르는 제도가 538건 중 367건이다. 대부분은 이유가 뚜렷하지만(현물이거나,
 * 상한액이거나, 조건마다 갈리거나), 68건은 공식 원문에도 금액이 없다. 어느 쪽이든
 * "모릅니다"에서 끝나면 사용자는 거기서 막힌다 — 물어볼 곳을 알려 주는 것이
 * 우리가 할 수 있는 마지막 한 걸음이다.
 *
 * 연락처는 지어내지 않는다. 우리가 가진 것은 지역 이름과 원문이 적어 둔 신청 창구뿐이고,
 * 그 둘만 말한다.
 */
function askWhereHtml(r) {
  var g = r.program;
  var amountUnknown = r.amount && r.amount.value == null;
  var deadlineUnknown = g.deadline && g.deadline.kind === 'sourceUnknown';
  if (!amountUnknown && !deadlineUnknown) return '';
  // 해당되지 않는 제도까지 "문의하세요"라고 하면 소음이 된다.
  if (r.status === 'ineligible' || r.status === 'past') return '';

  /* 무료 진료나 현물 지원은 물어볼 금액이 아예 없다. 거기에 "금액을 확인하세요"라고
     하면 없는 돈을 찾아 헤매게 만든다 — 영유아 건강검진에 그렇게 붙어 있었다. */
  var reason = (r.amount && r.amount.reason) || '';
  if (/현물|무료|서비스\s*제공|환산할\s*수\s*없|바우처로\s*제공|자동\s*적용/.test(reason)) amountUnknown = false;
  // 이유 문장이 이미 어디에 물어야 하는지 말하면(2026-09-17 문구 정리 뒤 대부분 그렇다) 같은 말을 상자로 되풀이하지 않는다.
  if (/(확인|문의)(해 주세요|하세요|해 보세요)/.test(reason)) amountUnknown = false;
  if (!amountUnknown && !deadlineUnknown) return '';

  var what = amountUnknown && deadlineUnknown ? '정확한 금액과 신청 기한은'
    : amountUnknown ? '정확한 금액은' : '정확한 신청 기한은';
  var where = g.region && g.region.sigungu ? g.region.sigungu
    : g.region && g.region.sido ? g.region.sido
    : null;
  /* 창구는 원문(applyVia)이 이미 적어 두었다 — 심지어 담당 부서와 전화번호까지
     들어 있는 경우가 많다. 지어낼 것이 없다. 다만 원문이 신청 방법·서류·문의를
     한 칸에 몰아 적은 탓에 그대로 실으면 문단이 되므로, "문의:" 뒤만 떼어 쓴다. */
  var via = null;
  if (g.applyVia) {
    var m = g.applyVia.match(/문의\s*[:：]\s*([^/]{2,60})/);
    if (m) via = m[1].trim().replace(/[.\s]+$/, '');
    else if (g.applyVia.length <= 40 && !/^방문신청$|^온라인$/.test(g.applyVia.trim())) via = g.applyVia.trim();
  }

  var s = what + ' ';
  if (where) s += '<b>' + esc(where) + '</b> 담당 부서에 ';
  else s += '담당 기관에 ';
  s += '확인해 주세요.';
  if (via) s += '<div class="askwhere-c">' + esc(via) + '</div>';
  return '<div class="askwhere">' + s + '</div>';
}

/**
 * 이 제도에는 우리가 센 금액 말고도 더 있다.
 *
 * 하동군은 우리가 "200만원"이라 싣는데 원문에 양육수당(월 60만원 × 72개월)이 더 있고,
 * 양양군은 "100만원"인데 넷째는 월 50만원 × 3년이 더 있다. 원문이 총액을 말하지 않아
 * 합계에 넣지 않은 것은 옳지만, 그 사실을 말하지 않은 것은 다른 문제다.
 * 156건 가운데 23건이 이렇다(현금성 15항목).
 *
 * 합계에 더하지 않는다 — 우리가 계산해 내면 지어내는 것이다. 있다는 사실만 말한다.
 */
function extraBenefitsHtml(g) {
  var list = g.extraBenefits;
  if (!list || !list.length) return '';
  return '<div class="extras"><div class="extras-h">이 제도에는 이런 지원이 더 있습니다</div>' +
    list.map(function (e) {
      return '<div class="extras-i"><b>' + esc(e.what) + '</b> ' + esc(e.detail) +
        (e.isCash ? '' : ' <span class="tag line">현물·서비스</span>') + '</div>';
    }).join('') +
    '<div class="extras-n">원문에는 함께 적혀 있지만, 받을 총액을 확정할 수 없어 <b>위 합계에는 넣지 않았습니다</b>. ' +
    '자세한 조건은 아래 제도 안내 원문에서 확인하세요.</div></div>';
}

/** 언제 얼마씩 받는지 — 원문이 밝힌 일정을 카드 본문에 한 줄로. */
function payoutDetail(r) {
  var po = r.amount && r.amount.payout;
  if (!po || !po.detail) return '';
  return '<div class="row-plan">' + ICON.cal + esc(po.detail) + '</div>';
}

function moneyRow(r, showAmount) {
  var pid = 'p_' + r.program.id;
  var amt = showAmount && r.amount && r.amount.value != null ? ENG.won(r.amount.value) : null;
  // 자녀 수를 몰라 금액이 비었을 때(순위별 금액표가 있는 제도) 표의 범위만 말한다 — 합계에는 넣지 않는다(plan 086-3).
  var amtRange = null;
  if (showAmount && !amt && r.amount && r.amount.value == null && profile.childrenBefore == null && r.program.amountByOrder) {
    var rng = APPLOGIC.orderAmountRange(r.program.amountByOrder);
    if (rng) amtRange = rng.min === rng.max ? ENG.won(rng.min) : ENG.won(rng.min) + '~' + ENG.won(rng.max);
  }
  // 시작 배지는 해당 여부가 정해진 제도(해당·단계 전)에만 — 판단 보류·해당 없음 행에 "N일 뒤부터"를 달면 받을 수 있는 것처럼 읽힌다.
  var startBadge = r.status === 'eligible' || r.status === 'future' ? startBadgeText(r) : null;
  var h = '<div class="item"><div class="row">' +
    '<button class="row-main" data-open="' + esc(pid) + '" aria-expanded="' + (open[pid] ? 'true' : 'false') + '" style="background:none;border:0;text-align:left">' +
      '<div class="row-title">' + esc(r.program.name) + '</div>' +
      // 총액만으로는 부족하다 — "1,000만원"과 "처음 200만원 + 매월 20만원씩 40회"는
      // 같은 돈이지만 사람이 세우는 계획이 다르다. 원문이 밝힌 일정을 그대로 옮긴다.
      payoutDetail(r) +
      (r.program.applyVia && !open[pid] ? '<div class="row-sub">' + esc(srcInline(r.program.applyVia)) + '</div>' : '') +
      '<div class="row-meta">' +
        '<span class="tag line">' + esc(LAYER[r.program.layer] || r.program.layer || '') + '</span>' +
        claimantTag(r) +
        // 카드를 펴 보지 않으면 "이 금액이 전부"로 읽힌다. 접힌 채로도 알려 준다.
        (r.program.extraBenefits && r.program.extraBenefits.length && !open[pid]
          ? '<span class="tag lime">지원 더 있음</span>' : '') +
        whyNotCounted(r) +
      '</div>' +
    '</button>' +
    '<div class="row-side">' + (amt ? '<div class="row-money">' + esc(amt) + '</div>' : '') +
      (amtRange ? '<div class="row-money">' + esc(amtRange) + '</div><div class="row-when-unit">출생 순위에 따라</div>' : '') +
      // 큰 숫자 하나만 놓으면 목돈으로 읽힌다. 진도군 셋째 2,000만원은 13년에 걸쳐
      // 받는 돈이고, 울진군 셋째 1,200만원은 목돈 없이 월 20만원씩 5년이다.
      // 총액은 원문 그대로 맞지만, 언제 받는지를 빼면 읽히는 뜻이 틀린다.
      (amt ? payoutTag(r) : '') +
      // 아직 열리지 않은 제도는 시작만('N일 뒤부터'), 열린 제도는 기한만 — 한 자리에 둘이 설 수 없다.
      (startBadge
        ? '<div class="row-when-unit">' + esc(startBadge) + '</div>'
        : r.deadline && r.deadline.daysLeft != null && r.deadline.daysLeft >= 0
        ? '<div class="row-when-unit">' + (r.deadline.estimated ? '출산 후' : whenLine(r.deadline.daysLeft, r.deadline.date)) + '</div>' : '') +
    '</div></div>' +
    goLinks([
      { url: r.program.applyUrl || r.program.onlineApplyUrl, label: applyLabel(r.program), ev: 'apply-open', id: r.program.id, layer: r.program.layer },
      { url: r.program.source && r.program.source.url, label: '제도 안내 원문' }
    ]) + '</div>';
  if (open[pid]) h += programDetailHtml(r);
  return h;
}

/* 제도 상세 본문 — 혜택 카드(moneyRow)와 '지금 신청' 행이 같은 것을 연다.
   진입 경로가 달라도 같은 정보를 본다(2026-09-10 리디자인). */
function programDetailHtml(r) {
  var g = r.program;
  var h = '<div class="detail">';
  if (g.summary) h += '<div class="lead">' + esc(fmtDates(g.summary)) + '</div>';

  var dl = function (label, value) {
    return value ? '<div class="dl"><dt>' + label + '</dt><dd>' + esc(value) + '</dd></div>' : '';
  };
  // 왜 해당되지 않는지 — 엔진이 짚은 조건만 말한다. UI 가 이유를 지어내지 않는다.
  if (r.status === 'ineligible' && !r.superseded) {
    if (r.regionFail && g.region) {
      var rgTxt = g.region.sigungu ? g.region.sido + ' ' + g.region.sigungu + ' 제도입니다'
        : (g.region.sigungus && g.region.sigungus.length) ? g.region.sido + ' 일부 시·군·구 한정 제도입니다'
        : g.region.sido + ' 제도입니다';
      h += dl('해당되지 않는 이유', '거주 지역이 다릅니다. ' + rgTxt);
    } else if (r.failedFields && r.failedFields.length) {
      var flabels = [];
      r.failedFields.forEach(function (f) {
        var lb = FIELD_LABEL[f];
        if (lb && flabels.indexOf(lb) < 0) flabels.push(lb);
      });
      if (flabels.length) {
        h += dl('해당되지 않는 이유', '맞지 않는 조건: ' + flabels.join(' · ') +
          '. 상황이 바뀌었다면 내 정보를 고쳐 주세요');
      }
    }
  }
  h += dlSrc('지원 대상', g.eligibilityText);
  h += dlSrc('지원 금액', g.amountText);
  if (r.amount && r.amount.note) h += dl('내 조건으로 계산하면', r.amount.note);
  if (r.amount && r.amount.value == null && r.amount.reason) h += dl('금액을 정할 수 없는 이유', fmtDates(r.amount.reason));
  h += extraBenefitsHtml(g);
  // 모른다고만 하고 끝내면 사용자는 거기서 막힌다. 어디에 물어야 하는지까지 말한다.
  h += askWhereHtml(r);
  h += dlSrc('선정 기준', g.selectionText);
  h += dl('신청 기한', deadlineLine(r, g));
  h += deadlineNoteHtml(r, g);
  // 바우처를 언제까지 쓸 수 있는지는 신청 기한과 다른 사실이다. 한 줄에 두면
  // "신청 마감이 2년 남았다"로 읽힌다.
  if (g.usageBy && g.usageBy.text) h += dl('사용 기한', g.usageBy.text);
  // 급여를 청구하는 기한은 제도를 쓰는 기한과 다른 사실이다(45차).
  h += dl('급여 신청 기한', payDeadlineLine(r, g));
  // 개편 예고 — 데이터에 있던 것을 이제야 보여준다(32차: 죽은 필드였다).
  if (g.pendingChange && g.pendingChange.text) h += '<div class="warn">' + esc(g.pendingChange.text) + '</div>';
  h += dlSrc('필요 서류', g.docsText);
  h += dlSrc('신청 방법', g.applyVia);
  // 배지에 다 담지 못한 사정 — 순위마다 분할 기간이 다른 제도가 흔하다.
  if (g.payout && g.payout.detailText) h += dl('나눠 받는 기간', g.payout.detailText);
  h += dlSrc('지급 시기', g.paymentScheduleText);
  h += dl('유의 사항', fmtDates(g.notes));
  h += dl('법적 근거', g.legalBasis);
  if (g.evidence && g.evidence.quote) h += '<div class="quote">&ldquo;' + esc(g.evidence.quote) + '&rdquo;</div>';
  if (g.source) {
    h += checkedLine(g.source.name, g.source.checkedAt);
  }
  // 데이터 오류 제보 — 이 DB 의 생명은 정확성이다. 다르면 바로 알릴 길을 연다(plan 106: 메일 대신 앱 안 시트).
  h += '<div class="golinks"><button class="golink" data-report="' + esc(g.id) + '">공식 정보와 다른가요? 알려주세요</button></div>';
  if (r.status === 'unknown') h += askBlock(r) + unknownWhy(r);
  return h + '</div>';
}
/* 신청 기한 한 줄 — 종류에 맞는 말을 한다.
   기한을 확인하지 못한 제도에 아무 말도 하지 않으면 '기한 없음'으로 읽힌다.
   확인된 상시와 확인 못 한 것은 사용자에게 전혀 다른 사실이다. */
function deadlineLine(r, g) {
  var main = deadlineMain(r, g);
  // 기한 문장이 없으면 확인 기록이 곧 안내다 — 그때만 그대로 보여준다.
  return fmtDates(main || g.deadlineNote || '');
}
function deadlineMain(r, g) {
  var dl = (r && r.deadline) || g.deadline;
  var kind = dl && dl.kind;
  if (kind === 'sourceUnknown' || (!dl && !g.deadlineNote)) {
    return '공식 안내에서 신청 시점을 확인하지 못했습니다. 신청처에 확인해 주세요.';
  }
  if (kind === 'budgetLimited') return dl.text || '예산이 소진되면 마감됩니다';
  return (dl && dl.text) || '';
}
/* 기한을 어떻게 확인했는지 적은 기록 — 원문의 어느 항목을 어떻게 읽었는지. 기한 문장과 한 줄에
   이어 붙이면 조사 기록이 안내처럼 읽힌다(2026-09-14 감사: 지자체 413건 중 270건이 조사자 서술체).
   접어 두되 지우지는 않는다. */
function deadlineNoteHtml(r, g) {
  if (!g.deadlineNote || !deadlineMain(r, g)) return '';
  return '<details class="more"><summary>기한을 어떻게 확인했나</summary><div><div class="dl unv"><dd>' +
    esc(fmtDates(g.deadlineNote)) + '</dd></div></div></details>';
}
/**
 * 급여 신청 기한 한 줄. 제도를 쓰는 기한과 다른 행위라 다른 줄에 둔다 —
 * 배우자 출산휴가는 출생 후 120일 안에 '쓰고', 그 급여는 휴가가 끝난 뒤 12개월 안에 '신청'한다.
 * 휴가 종료일을 아직 받지 않았으면 날짜를 지어내지 않고 원문만 보여준다.
 */
function payDeadlineLine(r, g) {
  var pd = (r && r.payDeadline) || null;
  var src = (g && g.payDeadline) || null;
  if (!pd && !src) return '';
  if (pd && pd.date && pd.daysLeft != null) {
    return fmtDates(esc(pd.date) + '까지 (' + dday(pd.daysLeft) + ') · ' + (pd.text || src.text || ''));
  }
  return fmtDates((pd && pd.text) || (src && src.text) || '');
}
/* 물어볼 것이 없는 보류는 왜 보류인지 항목이 스스로 말한다.
   무엇을 모르는지가 제도마다 다른데 한 문장으로 뭉뚱그리면, 연령 기준 시점이
   없는 제도에까지 '이 지역 시행 여부를 확인 못 했습니다'라고 말하게 된다. */

    // 아직 모르는 금액은 숫자로 찍지 않는다 — 카드는 받는 사람에게 그대로 사실이 된다.
    // 숫자 자리에 같은 무게의 문장을 세우되, 숫자인 척하지는 않는다.
    g.fillStyle = ink; g.font = F(700, 84);

  } else {
    // 단위가 '만 5,000원'처럼 길어지면 카드 폭(984px)에 맞게 글자를 줄인다 — 잘리는 것보다 작은 것이 낫다.
    var bigPx = 250, unitPx = 64, bw, uw;

      g.font = F(700, bigPx); bw = g.measureText(d.big).width;
      g.font = F(600, unitPx); uw = g.measureText(d.unit).width;
      if (88 + bw + 20 + uw <= 984 || bigPx <= 120) break;
      bigPx -= 10; unitPx = Math.round(bigPx * 64 / 250);
    }
    g.fillStyle = accent; g.font = F(700, bigPx); g.fillText(d.big, 88, 596);
    g.fillStyle = ink; g.font = F(600, unitPx); g.fillText(d.unit, 96 + bw + 20, 590);
  }
  var y2 = 792;
  (d.rows || []).forEach(function (r) {
    g.strokeStyle = line; g.lineWidth = 2;
    g.beginPath(); g.moveTo(96, y2 - 62); g.lineTo(984, y2 - 62); g.stroke();
    g.fillStyle = muted; g.font = F(400, 42); g.fillText(r.k, 96, y2);
    g.fillStyle = ink; g.font = F(600, 42); g.textAlign = 'right'; g.fillText(r.v, 984, y2); g.textAlign = 'left';
    y2 += 122;
  });
  var scene2 = nestSceneSvg(d.nest || { couple: false, firstStep: false, apply: false, bag: false, docs: false, care: false }, CARD_C, 380);
  return svgToImage(scene2).then(function (img) {
    if (img) g.drawImage(img, 350, 946, 380, 232);
    g.strokeStyle = line; g.beginPath(); g.moveTo(96, 1218); g.lineTo(984, 1218); g.stroke();
    g.fillStyle = muted; g.font = F(400, 32); g.fillText(d.footer, 96, 1284);
    return cv;
  });
}

function openCard(kind) {
  var d = null;
  if (kind === 'week') {
    if (!(profile.stage === 'pregnant' && D && D.weeks != null)) return;
    d = APPLOGIC.weeklyCardData({
      weeks: D.weeks, dueDate: profile.dueDate, today: TODAY,
      timeline: TIMELINE, checkpoints: CHK, doneIds: done, role: profile.role, conditions: profile
    });
    d.nest = currentNest();  // 카드에도 같은 둥지가 실린다 — 같은 파생, 같은 그림.
  } else {
    d = APPLOGIC.benefitCardData({
      region: profile.sigungu || profile.sido || null,
      state: currentMoneyState()
    });
    d.nest = currentNest();  // 혜택 카드에도 같은 둥지 — 두 카드가 같은 얼굴을 갖는다.
  }
  d.dateStr = ENG.fmtDate(TODAY);
  // 폰트가 로드되기 전에 그리면 시스템 폰트로 박제된다 — 준비를 기다린다.
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
    .then(function () { return drawCard(d); })
    .then(function (cv) {
      cv.toBlob(function (b) {
        if (!b) return;
        if (cardState.url) URL.revokeObjectURL(cardState.url);
        cardState = { open: true, blob: b, url: URL.createObjectURL(b), kind: kind };
        render();
      }, 'image/png');
    });
}

function closeCard() {
  if (cardState.url) URL.revokeObjectURL(cardState.url);
  cardState = { open: false, url: null, blob: null, kind: null };
  render();
}

function shareCard() {
  if (!cardState.blob) return;
  var f = new File([cardState.blob], 'yebu-card.png', { type: 'image/png' });
  if (navigator.share && navigator.canShare && navigator.canShare({ files: [f] })) {
    navigator.share({ files: [f] }).catch(function () { /* 취소 — 정상 */ });
  } else {
    saveCard(); // 파일 공유 미지원 브라우저 — 다운로드로 대신한다.
  }
}

function saveCard() {
  if (!cardState.url) return;
  var a = document.createElement('a');
  a.href = cardState.url; a.download = 'yebu-card-' + ENG.fmtDate(TODAY) + '.png';
  document.body.appendChild(a); a.click(); a.remove();
}

function nestTokenColors() {

function currentNest() {
  // '우리 가족의 완료' — 내 것 + (로그인 커플이면) 배우자 것. 개인별 완료율을
  // 세거나 비교하지 않는다 — 합쳐서 둥지가 채워졌는지만 본다(커플 3원칙).
  var family = {};
  var k;
  for (k in done) family[k] = done[k];
  for (k in sync.partnerMarks) family[k] = sync.partnerMarks[k];
  return APPLOGIC.nestState({
    // 두 번째 콩은 "지금 이 둥지에 배우자가 있다"는 말이다 — 확인된 것만 말한다(36차).
    // 확인 가능한 유일한 신호는 서버 커플에 상대의 행이 실제로 있는 것이다.
    // couple_id 만으로는 부족하다: create_invite 는 상대가 오기 전에 이미 내
    // couple_id 를 채운다(코드만 만든 사람에게 콩 2개가 그려졌다).
    // 로컬 초대(linkedAt)도 근거가 못 된다 — 프로필을 한 번 건네받은 과거 기록일
    // 뿐이고(앱 문구도 "한 번 넘겨줍니다"), 코드를 만든 쪽에는 아예 남지 않아
    // 같은 부부가 서로 다른 둥지를 본다. 과거 사실은 현재 상태가 아니다(34차).
    coupled: !!sync.partnerLinked,
    doneIds: family
  });
}

function nestCardHtml() {
  var ns = currentNest();
  // v3 달성 누적형(31차) — 해낸 조각만 나열한다. 미완료 칩·진행 바·N/N 없음:
  // '해당 없음'이 '못함'처럼 보이는 길을 구조로 막는다. 커플은 조각이 아니라
  // 구성원(그림의 콩 수)이라 칩에 세지 않는다 — 콩 하나여도 완전한 둥지다.
  // 칩은 '완료'라는 말 없이 사실만 — '첫 검진·접종 완료'는 접종 하나만 한
  // 사용자에게 검진까지 마친 듯 읽혔다(33차). 범주 이름 + ✓ 로 과장을 없앤다.
  var got = [['firstStep', '첫 걸음'], ['apply', '첫 신청'], ['bag', '출산가방'],
    ['docs', '아기 맞이 서류'], ['care', '아기 건강 돌봄']]
    .filter(function (c) { return ns[c[0]]; });
  var chips = got.map(function (c) {
    return '<div class="nest-chip on">' + c[1] + '<b>✓</b></div>';
  }).join('');
  return '<div class="nest">' +
    '<h3>우리 가족의 둥지</h3>' +
    '<div class="nest-sub">하나씩 준비하며, 아기와 가까워지고 있습니다</div>' +
    nestSceneSvg(ns, nestTokenColors()) +
    (got.length
      ? '<div class="nest-chips">' + chips + '</div>'
      : '<div class="nest-empty">준비를 하나씩 마치면 둥지가 채워집니다</div>') +
    '<div class="nest-note">이미 있는 기록으로만 계산하며, 따로 저장하지 않습니다</div>' +
    '</div>';
}

/* ── 내 기록 백업 — 사용자 소유 파일(yebu-backup.json) ────────────────
   로컬 우선의 약점(기기 변경·브라우저 데이터 삭제)을 서버 저장이 아니라
   사용자 파일로 메운다. 이 블록은 SUPA 를 부르지 않는다(가드로 고정). */
var backupPending = null;
var backupMsg = null;
/* 이 기기의 기록 지우기 (2026-09-23 감사 B-3) — 로그아웃·계정 삭제 뒤에도 예정일·지역·건강 조건이 기기에 남았고,
   같은 기기를 쓰는 다른 사람에게 보였다. 두 번 눌러야 지우고, 앱이 쓰는 키(yebu.*)와 로그인 세션 키(sb-*)만 지운다. */
var wipeAsk = false;
function wipeDevice() {
  /* 먼저 이 기기의 알림 구독을 끊고(로그인 세션이 남아 있으면 서버 행도 지운다) 저장해 둔 화면 사본(Cache Storage)을 비운다.
     단계마다 실패해도 지우기는 계속하고, 기다림은 PUSH_DETACH_MS 로 막는다. */
  var cachesGone = Promise.resolve();
  try {
    if (window.caches && caches.keys) {
      cachesGone = Promise.race([
        caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }),
        new Promise(function (res) { setTimeout(res, PUSH_DETACH_MS); })
      ]).then(function () {}, function () {});
    }
  } catch (e) {}
  var detached = Promise.resolve();
  try { detached = pushDetach().then(function () {}, function () {}); } catch (e) {}
  Promise.all([detached, cachesGone]).then(wipeStorageAndReload, wipeStorageAndReload);
}
function wipeStorageAndReload() {
  try {
    var keys = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && (k.indexOf('yebu.') === 0 || k.indexOf('sb-') === 0)) keys.push(k);
    }
    keys.forEach(function (k) { localStorage.removeItem(k); });
  } catch (e) {}
  mem = {};
  location.reload();
}

function backupExport() {
  var o = APPLOGIC.exportBackup(profile, done, theme);
  o.exportedAt = ENG.fmtDate(TODAY);
  var blob = new Blob([JSON.stringify(o, null, 1)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'yebu-backup-' + o.exportedAt + '.json';
  document.body.appendChild(a); a.click(); a.remove();

function backupApply() {
  if (!backupPending) return;
  profile = backupPending.profile;
  invalidateCompute();
  done = backupPending.done;
  theme = backupPending.theme;
  applyTheme(theme);
  store('yebu.done', JSON.stringify(done));
  saveProfile();  // 커플 연결 중이면 공유분·알림 일정도 새 값으로 밀린다 — 의도된 동작.
  // 완료 표시도 서버에 다시 민다 — 안 밀면 배우자 화면만 예전 상태로 남는다(32차).
  if (SUPA && sync.coupleId) pushAllMarks();
  backupPending = null; backupMsg = '백업을 적용했습니다.';
  /* 복원한 프로필에 역할·단계가 없으면 온보딩이 끝난 것이 아니다 — 로드 시점의
     FIRST_RUN 과 같은 기준이다(844~853행). 백업 복원은 그 잠금을 거치지 않는
     유일한 진입점이었고, 그대로 두면 isMine() 이 전부 거짓이 되어 내 몫이
     통째로 '배우자 몫'으로 넘어간다. 값을 지어내지 않고 다시 묻는다. */
  if (profile.role == null || profile.stage == null) {
    FIRST_RUN = true; sheetOpen = 'me'; sheetExpanded = false; onbStep = 0;
  }
  render();
}

/* 지금 물어볼 수 있는 서로 다른 입력의 개수.
   '판단 보류 69건'은 제도 수이지 질문 수가 아니다 — 그 69건이 실제로는 열 개
   남짓의 같은 입력을 기다린다. 제도 수를 질문 수인 양 내보내면 답할 수 있는
   양을 열 배로 부풀려 말하게 된다(41차 실측: 입력 0에서 69건 ↔ 입력 10개). */
function openQuestions() {
  var s = {};
  needAskable().filter(shownWithoutRegion).forEach(function (r) {   // 지역을 안 골랐으면 지역 제도가 부르는 질문은 세지 않는다(plan 090-A)
    (r.missingFields || []).forEach(function (f) {
      if (FIELD_ASK[f] || SHEET_FIELD_LABEL[f]) s[f] = 1;

        }).join('') + '</div>';

      note += ' <button class="askbtn" data-sheet="me">내 정보에서 알려주기</button>';
    }
  } else if (st.questionCount > 0) {
    note = '<b>' + st.questionCount + '가지</b>를 더 알려주시면 판단을 미뤄 둔 ' + st.needCount + '건까지 계산합니다.';
  }
  return note;
}

function moneyHeroHtml() {
  var st = currentMoneyState();
  track('first-result', { code: st.code }, true);   // 합계 판정 이름만 — 금액은 싣지 않는다
  var head, body, note = '';
  if (st.code === 'HAS_AMOUNT') {
    head = '확인된 제도만 더한 금액';
    body = '<div class="big">' + ENG.won(st.totalWon) + '</div>';
    // 이 합계의 대부분이 여러 해에 걸쳐 들어오는 돈일 수 있다. 남해군에서 셋째를
    // 낳은 사람의 2,682만원 가운데 2,282만원이 그랬다 — 부모급여 12개월, 아동수당
    // 12개월, 남해군 출산장려금은 3년 4개월이다. 숫자만 크게 놓고 그 사실을 빼면
    // 곧 손에 들어올 목돈으로 읽힌다.
    var sp = splitShare();
    if (sp) {
      body += '<div class="hero-split">이 중 <b>' + ENG.won(sp.won) + '</b>은 ' +
        (sp.span ? '최장 <b>' + esc(sp.span) + '</b>에 걸쳐 ' : '') + '나눠 받습니다</div>';
    }
    body += afterBirthHtml(st);   // 임신 중이면 아이가 태어난 뒤의 금액을 따로 — 합치지 않는다
    // 지역이 없으면 남은 보류 건수를 말하지 않는다 — 전국 모든 지자체 제도가
    // 섞여 들어가 '284건'처럼 답할 수 없는 수가 된다.
    if (st.partial) note = partialNoteHtml();
    else note = unlockNoteHtml(st);   // 오늘 탭 '내 돈 한 줄'과 같은 질문 — 한 곳에서만 만든다
  } else if (st.code === 'NO_REGION') {
    head = '아직 계산하지 않았습니다';
    body = noRegionBody(st);
    note = '전국 공통 제도는 지역과 상관없이 아래에 이미 있습니다.' + (st.askField ? '<div style="margin-top:6px">' + noRegionAskBtns(st) + '</div>' : '');
  } else if (st.code === 'NEEDS_INPUT') {
    head = '아직 계산하지 않았습니다';
    body = '<div class="hero-say"><b>' + st.questionCount + '가지</b>만 더 알려주시면<br>' + st.needCount + '건을 판단할 수 있습니다</div>';
    note = '모른다고 해서 해당 없음으로 두지 않습니다. 아래 항목을 열면 그 자리에서 답할 수 있습니다.';
  } else if (st.code === 'NO_CASH_VALUE') {
    head = '금액으로 환산할 수 없는 제도만 있습니다';
    body = '<div class="hero-say">' + st.noAmountCount + '가지</div>';
    note = '무료 진료·현물처럼 금액을 매길 수 없는 것입니다. 합계에 넣지 않습니다.';
  } else if (st.code === 'NOT_YET') {
    head = '지금 단계에 해당하는 금액 제도가 없습니다';
    body = '<div class="hero-say">출산 후 ' + st.futureCount + '건이 기다립니다</div>' + afterBirthHtml(st);
    note = '단계가 되면 위쪽으로 올라옵니다.';
  } else {
    head = '확인된 제도만 더한 금액';
    body = '<div class="big">0<span class="big-unit">만원</span></div>';
    note = '빠진 정보 없이 계산했습니다. 지금 조건에 맞는 금액 제도가 없습니다.';
  }
  // 읽기 전용 보기 — 보낸 사람이 링크에 담지 않은 값(지역·거주 기간·소득)은 물을 길이 없다. 묻는 문장 대신 사실만 말한다.
  if (READONLY) {
    var rot = roMoneyText(st);
    if (rot) { if (rot.body) body = rot.body; note = rot.note; }
  }
  return '<div class="hero" style="padding-bottom:10px"><div class="hero-row">' +
    '<div class="hero-side" style="gap:6px"><div class="kv-label">' + head + '</div>' + body +
    (note ? '<div class="hero-note" style="margin-top:2px">' + note + '</div>' : '') +
    (READONLY ? '' : '<div style="margin-top:6px;display:flex;gap:8px"><button class="askbtn" id="shareBtn" data-share="money">요약 공유</button>' +
    '<button class="askbtn" data-sharecard="money">카드로 공유</button></div>') +
    '</div></div></div>';
}

/* 내가 알려준 내용 한 줄 — 혜택 탭 맨 위. 이 화면의 금액이 어떤 답에서 나왔는지 눈으로 확인하고,
   틀렸으면 그 자리에서 고치러 간다('고치기' → 내 정보 시트, 기본 항목 펼침). 값이 없는 칸은 그리지 않는다. */
function profilePillsHtml() {
  var pills = [];
  var has = function (v) { return v != null && v !== '' && !isNaN(Number(v)); };
  if (profile.sido) pills.push(profile.sido + (profile.sigungu ? ' ' + profile.sigungu : ''));
  if (profile.role && ROLE_LABEL[profile.role]) pills.push(ROLE_LABEL[profile.role]);
  if (profile.stage && ME_STAGE_LABEL[profile.stage]) pills.push(ME_STAGE_LABEL[profile.stage]);
  var dt = profile.stage === 'pregnant' ? profile.dueDate : profile.stage === 'postpartum' ? profile.birthDate : null;
  var md = dt ? /^(\d{4})-(\d{2})-(\d{2})$/.exec(dt) : null;
  // 올해가 아니면 연도를 붙인다 — whenLabel 과 같은 규칙(plan 086-20).
  if (md) pills.push((profile.stage === 'pregnant' ? '예정일 ' : '출생일 ') + (Number(md[1]) !== TODAY.getFullYear() ? Number(md[1]) + '년 ' : '') + Number(md[2]) + '월 ' + Number(md[3]) + '일');
  if (has(profile.childrenBefore)) pills.push('이번 출산 전 자녀 ' + Number(profile.childrenBefore) + '명');
  if (has(profile.fetusCount)) pills.push((profile.stage === 'pregnant' ? '태아 ' : '아기 ') + Number(profile.fetusCount) + '명');
  if (!pills.length) return '';
  return '<div class="pills" role="group" aria-label="내가 알려준 내용">' +
    pills.map(function (p) { return '<span class="tag line">' + esc(p) + '</span>'; }).join('') +
    (READONLY ? '' : '<button class="tag tint" data-editme="1" style="min-height:44px">고치기</button>') + '</div>';
}

/* 합계 "어떻게 더했나요?" — 합계 카드 바로 아래 접힘. 합계에 들어간 제도(EV.confirmed)의 이름과 금액을 그대로 늘어놓고
   마지막 줄이 합계다. 합계 카드와 같은 EV.total·ENG.won 을 쓰므로 두 숫자가 갈라질 수 없다.
   열림 상태는 fold.sumhow 에 둔다 — 칩을 눌러 다시 그려도 접히지 않게(toggle 리스너가 기록). */
function totalBreakdownHtml(condN) {
  var st = currentMoneyState();   // 합계 카드와 같은 판정 — 합계가 있을 때만 그 내역을 보여준다
  var rows = EV.confirmed.filter(function (r) { return r.amount && r.amount.value != null; });
  if (st.code !== 'HAS_AMOUNT' || !rows.length) return '';
  return '<div class="sec"><details class="more" id="sumHow"' + (fold.sumhow ? ' open' : '') + '><summary>어떻게 더했나요?</summary><div>' +
    '<table class="sumtbl"><caption class="sr-only">합계에 넣은 제도와 금액</caption><tbody>' +
    rows.map(function (r) {
      return '<tr><th scope="row">' + esc(r.program.name) + '</th><td>' + esc(ENG.won(r.amount.value)) + '</td></tr>';
    }).join('') +
    '<tr class="sumtotal"><th scope="row">합계</th><td>' + esc(ENG.won(st.totalWon)) + '</td></tr>' +
    '</tbody></table>' +
    (condN ? '<div class="secnote" style="margin:0">합계에 안 넣은 제도 ' + condN + '건은 &lsquo;합계에 안 넣음&rsquo; 칩에 있습니다.</div>' : '') +
    '</div></details></div>';
}

function viewMoney() {
  /* 내 시·도 제도가 아직이면(plan 112) 합계도, 칩·목록도 그리지 않는다 — 지역 행이 비고 전국 '요약 항목'이
     잠깐 보이는 화면(엔진은 내 시·군·구 확인 제도가 있어야 그것을 물린다)을 내보내지 않는다. */
  if (REGION_WAIT) return profilePillsHtml() + regionWaitHtml(false);
  var h = profilePillsHtml() + moneyHeroHtml();
  h += receivedLineHtml();   // 합계 카드 바로 아래 '지금까지 받은 금액' 한 줄(기록이 있을 때만, plan 072)
  var jc = journeyCounts();
  /* 우리 동네가 주는 것 — 227곳을 채운 값이 가장 잘 드러나는 자리.
     지금까지 지역 제도는 상태별 그룹에 흩어져 있어서, "우리 군이 뭘 주지"라는
     물음에 답하는 자리가 없었다. 한 사람이 보는 지역 제도는 중앙값 3건이라
     탭을 따로 낼 일은 아니고(227곳 중 163곳이 3건 이하), 칩 하나면 족하다.
     다른 칩에서 빼지는 않는다 — 빼면 "확정"이 거짓이 된다. */
  var myRegionRows = regionRowsMine();
  // 조건부를 한 묶음에 뭉쳐 두면 '지금 못 받는 이유'가 서로 다른 것들이 섞인다.
  // 임신 중 46건 중 36건이 '아직 단계가 오지 않아서'였고, 나머지가 상한액이거나
  // 금액으로 환산할 수 없는 것이었다. 사용자가 할 수 있는 일이 서로 다르므로 나눈다.
  var condNow = EV.conditional.filter(function (r) { return r.status !== 'future'; });
  var condLater = EV.conditional.filter(function (r) { return r.status === 'future'; });
  /* '나중에' = 신청 묶음의 '아직 신청할 수 없습니다'(단계가 오지 않았거나 접수가 열리지
     않은 것). 조건부 가운데 단계가 오지 않은 것은 시행 전 제도만 빼고 전부 그 묶음에
     있으므로(엔진 journeyFor 는 시행 전만 거른다), 남는 것만 따로 붙여 하나도 잃지 않는다. */
  var notyetIds = {};
  JOURNEY.forEach(function (j) { if (j.bucket === 'notyet') notyetIds[j.id] = 1; });
  var laterExtra = condLater.filter(function (r) { return !notyetIds[r.program.id] && !HELPLINE_IDS[r.program.id] && shownWithoutRegion(r); });
  // 같은 '판단 보류'라도 공이 누구에게 있는지가 다르다. 열어도 물어볼 것이 없는
  // 항목을 '답이 필요해요'에 두면, 사용자는 무엇을 더 주라는 건지 알 수 없다.
  // 그 넷은 지역이 특정되지 않은 제도라, 모자란 것은 사용자 입력이 아니라 우리 데이터다.
  var needAsk = needAskable().filter(shownWithoutRegion);
  var needOurs = EV.needsInput.filter(function (r) { return (r.missingFields || []).length === 0 && shownWithoutRegion(r); });
  var needOursAll = needOurs;   // 칩 개수는 나누기 전 값 — 창구 확인도 사용자가 할 일이 남은 것이다(plan 061)
  var needOffice = needOurs.filter(function (r) { return r.unknownReason === 'officeCheck' || r.unknownReason === 'yearBoundary'; });
  needOurs = needOurs.filter(function (r) { return r.unknownReason !== 'officeCheck' && r.unknownReason !== 'yearBoundary'; });
  /* 해당 없는 이유 — 침묵하지 않는다. 내 지역·전국 제도만 추려 이유와 함께 보여준다 */
  var inMyRegion = function (r) { var rg = r.program.region; return !rg || rg.sido === profile.sido; };
  var skipped = EV.expired.concat(EV.excluded.filter(inMyRegion));

  h += totalBreakdownHtml(condNow.length);

  /* 칩 한 줄 — 옛 '신청' 탭(기한 축)과 '혜택' 탭(확정도 축)이 같은 제도를 두 번 늘어놓던
     것을 한 화면의 칩으로 접는다(2026-09-10 리디자인). 기한이 걸린 묶음은 전부 '지금 신청'
     안에 있고 그 안에서는 접지 않는다 — 지각은 숨길 일이 아니라 지금 손쓸 일이다. */
  var CHIPS = [
    ['apply', '지금 신청', jc.leftN],
    ['confirmed', '확정', EV.counts.confirmed],
    ['region', '우리 동네', myRegionRows.length],
    ['need', '답이 필요합니다', needChipCount()],
    ['cond', '합계에 안 넣음', condNow.length],
    ['later', '나중에', jc.notYetN + laterExtra.length],
    ['skip', '해당 없음', skipped.length]
  ];
  /* 칩 이름만으로는 뜻을 알 수 없다 — 마우스를 올리거나 길게 누르면 한 줄 뜻이 뜬다(title).
     고른 뒤에는 목록 머리말이 같은 말을 한다. */
  var CHIP_HELP = {
    apply: '지금 신청할 수 있는 제도',
    confirmed: '원문으로 금액까지 확인한 제도',
    region: '우리 시·군·구가 따로 주는 제도',
    need: '한 가지만 더 알려주면 판단되는 제도',
    cond: '지금 해당하지만 금액을 합계에 넣지 않은 제도',
    later: '아직 신청 시기가 아닌 제도',
    skip: '내 지역이 아니거나 조건이 달라 뺀 제도'
  };
  if (!CHIPS.some(function (c) { return c[0] === moneyChip; })) moneyChip = 'apply';
  h += '<div class="chips" role="group" aria-label="제도 보기">' + CHIPS.map(function (c) {
    var on = moneyChip === c[0];
    // '해당 없음'은 이름만 둔다 — 숫자를 칩에 달면 "내가 놓친 것 N개"처럼 읽힌다. 수는 고른 뒤 머리말이 말한다.
    return '<button class="chip' + (on ? ' on' : '') + '" data-chip="' + c[0] + '" title="' + esc(CHIP_HELP[c[0]]) + '" aria-pressed="' + (on ? 'true' : 'false') + '">' +
      c[1] + (c[2] && c[0] !== 'skip' ? ' <b class="num">' + c[2] + '</b>' : '') + '</button>';
  }).join('') + '</div>';

  // 지역을 안 골랐으면 두 칩에서 뺀 지역 제도가 몇 건인지 알리고 지역 칸으로 안내한다(plan 086-16).
  if (!profile.sido && !READONLY && (moneyChip === 'need' || moneyChip === 'later')) {
    /* 분할 빌드(plan 112)에서는 지역 제도를 아직 받지 않아 셀 수 없다 — 숫자 없는 문장으로 같은 안내를 한다. */
    var hiddenN = REGION_SPLIT ? -1 : moneyChip === 'need'
      ? EV.needsInput.filter(function (r) { return !shownWithoutRegion(r); }).length
      : JOURNEY.filter(function (j) { return j.bucket === 'notyet' && !shownWithoutRegion(j); }).length +
        condLater.filter(function (r) { return !notyetIds[r.program.id] && !HELPLINE_IDS[r.program.id] && !shownWithoutRegion(r); }).length;
    if (hiddenN) {
      h += '<div class="secnote">' + (hiddenN > 0 ? '지역을 고르면 우리 동네 제도 ' + hiddenN + '건을 더 판단합니다 ' : '지역을 고르면 우리 동네 제도까지 판단합니다 ') +
        '<button class="askbtn" data-sheet="me" data-focus="sido">내 정보 입력하기</button></div>';
    }
  }
  var byId = function (id) { return EV.results.find(function (r) { return r.program.id === id; }); };
  if (moneyChip === 'apply') {
    h += applyNoteHtml(jc);
    if (!JOURNEY.length) h += '<div class="empty">아직 해당하는 제도가 없습니다.<br>내 정보를 채우면 더 정확해집니다.</div>';
    // '아직 신청할 수 없습니다'(notyet)는 '나중에' 칩이 맡는다 — 같은 제도를 두 번 세지 않는다.
    h += journeyBucketsHtml(BUCKETS.filter(function (b) { return b.key !== 'notyet'; }), byId);
    h += onestopHtml();
  } else if (moneyChip === 'confirmed') {
    h += '<div class="sec"><div class="sec-head" style="cursor:default"><h3>지금 확정된 것</h3><span class="count">' + EV.counts.confirmed + '</span></div>' +
      // 금액이 있는 제도 171건 가운데 100건이 조건에 따라 달라진다(거주 기간만 56건).
      // 이 사실은 맨 아래 각주가 아니라 숫자 바로 옆에 있어야 한다 — 각주는 아무도 읽지 않는다.
      (EV.confirmed.length ? '<div class="secnote">원문으로 금액까지 확인한 제도입니다. 금액은 <b>출생 순위·거주 기간·소득</b>과 신청 시점의 예산에 따라 달라집니다. ' +
        '항목을 열면 무엇을 근거로 계산했는지 볼 수 있습니다.</div>' : '') +
      (EV.confirmed.length ? EV.confirmed.map(function (r) { return moneyRow(r, true); }).join('')
        : '<div class="empty" style="padding:20px 0">아직 확정된 제도가 없습니다.<br>내 정보를 채우면 더 정확해집니다.</div>') + '</div>';
  } else if (moneyChip === 'region') {
    var placeName = profile.sigungu ? profile.sido + ' ' + profile.sigungu : profile.sido;
    h += moneyList('우리 동네가 주는 것', myRegionRows, true,
      '<b>' + esc(placeName || '') + '</b>' + APPLOGIC.josa(placeName, '이', '가') + ' 따로 주는 것만 모았습니다. 같은 항목이 다른 칩에도 나옵니다.',
      profile.sido ? '우리 동네가 따로 주는 제도가 아직 없습니다.' : '지역을 알려주시면 우리 동네가 따로 주는 것을 모아 보여드립니다.');
  } else if (moneyChip === 'need') {
    h += moneyList(READONLY ? '링크에 담기지 않은 정보가 필요한 제도' : '한 가지만 더 알려주시면 판단합니다', needAsk, false,
      READONLY ? '조건 하나를 몰라 판단을 보류한 제도입니다. 모른다고 해서 해당 없음으로 두지 않았고, 합계에도 넣지 않았습니다.'
        : '조건 하나를 몰라 판단을 보류한 제도입니다. 모른다고 해서 해당 없음으로 두지 않습니다. 항목을 열면 부족한 값을 그 자리에서 입력할 수 있습니다.',
      (needOurs.length || needOffice.length) ? '' : '답을 기다리는 제도가 없습니다.');
    if (needOffice.length) {
      h += moneyList('신청 창구에서 확인해야 합니다', needOffice, false,

function moneyList(title, rows, showAmount, note, emptyText) {

    h += rows.map(function (r) { return moneyRow(r, showAmount); }).join('');
  } else {
    h += '<div class="empty" style="padding:20px 0">' + emptyText + '</div>';
  }
  return h + '</div>';
}

// 단계를 고르기 전에는 날짜를 묻지 않는다 — '출산 예정일'이라고 물으면 그 자체로

/* 날짜 칸이 받는 범위(plan 086-2). 예정일은 오늘~오늘+300일(임신 40주=280일에 여유), 출생일은 오늘−6년~오늘.
